# 01 Type system basics
- id: interface-declaration-merging
  front: "What happens when two `interface User` declarations share a scope, versus two `type User` aliases?"
  back: "The interfaces merge into one type. The two `type` aliases are a `Duplicate identifier` error. Merging is what makes module and global augmentation (`interface Window`) possible."
  question: typescript/type-system-basics/type-vs-interface
- id: extends-vs-intersection-conflict
  front: "How do `interface B extends A` and `type B = A & {...}` differ when a property conflicts?"
  back: "`extends` checks compatibility and reports the conflict at the declaration. `&` accepts anything: a conflicting property silently becomes `never`, and the failure shows up later at a use site."
  question: typescript/type-system-basics/type-vs-interface
- id: type-only-features
  front: "Which kinds of types can only a `type` alias name, not an `interface`?"
  back: "Unions, tuples, primitives, mapped types and conditional types. An interface can only describe an object-like type."
  question: typescript/type-system-basics/type-vs-interface
- id: implicit-index-signature-alias
  front: "Why is an object-literal `type` alias assignable to `Record<string, string>` but an interface is not?"
  back: "Type aliases get an implicit index signature. Interfaces do not, by design, because a later declaration could merge more members into them. Declare the index signature, or use a type alias."
  question: typescript/type-system-basics/type-vs-interface
- id: intersection-never-discriminant
  front: "When does an intersection like `A & B` collapse to `never` as a whole?"
  back: "When the conflicting property is a discriminant (a unit or literal type), as of TS 3.9. A conflict on a plain property such as `string & number` only makes that property `never`."
  question: typescript/type-system-basics/type-vs-interface
- id: type-vs-interface-default
  front: "What is the handbook's heuristic for choosing between `interface` and `type`?"
  back: "Use `interface` until you need features from `type`. Beyond that the choice is mostly preference, so staying consistent within a codebase matters more."
  question: typescript/type-system-basics/type-vs-interface
- id: structural-typing-definition
  front: "What decides whether `S` is assignable to `T` in a structurally typed system?"
  back: "Only members: if `S` has every property `T` requires, with compatible types, it is assignable. Names and declared relationships play no part, and extra members are fine."
  question: typescript/type-system-basics/structural-typing
- id: type-alias-no-new-type
  front: "Do `type Meters = number` and `type Feet = number` stop you mixing the two up?"
  back: "No. An alias is only a label, so both are the same type and are interchangeable. A branded type needs an actual extra member."
  question: typescript/type-system-basics/structural-typing
- id: nominal-behaviour-in-ts
  front: "Name constructs where TypeScript behaves nominally despite equal shape."
  back: "Classes with a `private`, `protected` or `#private` member (compatible only with types from the same declaration), enums from different declarations, and `unique symbol` types."
  question: typescript/type-system-basics/structural-typing
- id: branding-technique
  front: "How do you simulate nominal types such as `UserId` versus `OrderId`?"
  back: "Intersect the base type with a phantom property that exists only in the type system, and grant it in one validating function. It costs one `as` cast in the constructor."
  question: typescript/type-system-basics/structural-typing
- id: brand-erased-at-runtime
  front: "Does a branded type protect you at runtime?"
  back: "No. The brand is erased, so nothing at runtime can tell a `UserId` from an `OrderId`. The `as` cast is the only guarantee; without a runtime check before it, the brand is a lie."
  question: typescript/type-system-basics/structural-typing
- id: fewer-params-assignable
  front: "Is a function with fewer parameters assignable to a function type with more?"
  back: "Yes. Callers of the target type pass the extra arguments and the function ignores them, as with `forEach` callbacks. The reverse fails: `Target signature provides too few arguments`."
  question: typescript/type-system-basics/structural-typing
- id: empty-type-accepts
  front: "Which values do `{}`, `object` and an empty interface each accept?"
  back: "`{}` accepts everything except `null` and `undefined`. `object` also rejects primitives. An empty interface accepts almost any value, even `42`. The FAQ says to avoid memberless types."
  question: typescript/type-system-basics/structural-typing
- id: unknown-top-type
  front: "What makes `unknown` the top type, and what can you do with such a value?"
  back: "Anything is assignable to it. You cannot use it or assign it to anything but `unknown` and `any` until you narrow it with `typeof`, `instanceof`, a type guard or an assertion."
  question: typescript/type-system-basics/any-unknown-never
- id: any-opt-out
  front: "What does `any` do to type checking, and what is it not assignable to?"
  back: "It opts out: anything is assignable to it, it is assignable to everything except `never`, and every operation on it is allowed. It also spreads to values derived from it."
  question: typescript/type-system-basics/any-unknown-never
- id: never-bottom-type
  front: "What is `never`, and what is assignable to it?"
  back: "The empty set, the bottom type: no value exists. It is assignable to every type, but nothing except `never` is assignable to it, not even `any`."
  question: typescript/type-system-basics/any-unknown-never
- id: never-sources
  front: "Where does `never` typically appear?"
  back: "As the return type of functions that never return normally, when narrowing eliminates every union member, and from impossible intersections."
  question: typescript/type-system-basics/any-unknown-never
- id: unknown-any-never-combinations
  front: "What do `unknown | T`, `unknown & T`, `T | never` and `T & never` reduce to?"
  back: "`unknown`, `T`, `T` and `never`. `any` absorbs both ways: `any | T` and `any & T` are `any`."
  question: typescript/type-system-basics/any-unknown-never
- id: never-exhaustiveness-default
  front: "How does a `never` variable in a `switch` default branch help?"
  back: "Assigning the leftover value to a `never` variable proves the cases are exhaustive. Adding a union member then breaks the build at that line instead of causing a runtime bug."
  question: typescript/type-system-basics/any-unknown-never
- id: json-parse-returns-any
  front: "What type do `JSON.parse` and `Response.json()` return, and what is the safe habit?"
  back: "`any`. Assigning it to a typed variable is an unchecked cast. Accept it as `unknown` immediately, then narrow once at the boundary."
  question: typescript/type-system-basics/any-unknown-never
- id: catch-variable-unknown
  front: "Which option makes `catch (e)` give `unknown`, and is it part of `strict`?"
  back: "`useUnknownInCatchVariables`, which is part of `strict`. With it off, `e` is `any`."
  question: typescript/type-system-basics/any-unknown-never
- id: throwing-declaration-infers-void
  front: "Does a function that only throws always have return type `never`?"
  back: "No. A function expression or arrow with no return paths infers `never`, but a function declaration that throws is inferred `void`. Annotate `: never` when it matters."
  question: typescript/type-system-basics/any-unknown-never
- id: null-check-unknown-to-empty-object
  front: "Does a null check make an `unknown` value usable?"
  back: "No. `x !== null && x !== undefined` and `if (x)` narrow it only to `{}`, which still is not assignable to `number`. You need `typeof` or a type guard."
  question: typescript/type-system-basics/any-unknown-never
- id: literal-type-definition
  front: "What is a literal type, and where does it become useful?"
  back: "A type with exactly one value, such as `\"GET\"`, `42` or `true`. In a union (`\"GET\" | \"POST\"`) it models a closed set of options the compiler can check."
  question: typescript/type-system-basics/literal-types-as-const
- id: const-vs-let-widening
  front: "What is the inferred type of `const m = \"GET\"` versus `let m = \"GET\"`, and why?"
  back: "`const` gives `\"GET\"` because it can never change. `let` gives `string` because it can be reassigned, so the literal is widened."
  question: typescript/type-system-basics/literal-types-as-const
- id: object-literal-property-widening
  front: "What is the type of `method` in `{ url: \"/x\", method: \"GET\" }`, and what bug does it cause?"
  back: "`string`, since object properties are mutable. Passing `req.method` to a parameter typed `\"GET\" | \"POST\"` then fails."
  question: typescript/type-system-basics/literal-types-as-const
- id: as-const-effects
  front: "What does a `as const` assertion do to a literal expression's type?"
  back: "Literals are not widened, object properties become `readonly`, and array literals become `readonly` tuples. It was added in TS 3.4."
  question: typescript/type-system-basics/literal-types-as-const
- id: as-const-erased
  front: "Does `as const` make data immutable at runtime?"
  back: "No. It affects types only, emits no code, and `Object.isFrozen` on the result is `false`. Use `Object.freeze` for that, which is shallow."
  question: typescript/type-system-basics/literal-types-as-const
- id: as-const-union-from-array
  front: "How do you derive a union of values from a list of strings?"
  back: "Declare the list `as const`, then index its type with `number`: `(typeof dirs)[number]` gives `\"up\" | \"down\"`."
  question: typescript/type-system-basics/literal-types-as-const
- id: as-const-applies-to-literals-only
  front: "Which expressions can `as const` be applied to?"
  back: "Only enum members and string, number, boolean, array or object literals. On a computed expression such as a ternary it fails with `TS1355`."
  question: typescript/type-system-basics/literal-types-as-const
- id: readonly-tuple-to-mutable-param
  front: "Why does passing an `as const` array to a `string[]` parameter fail, and what is the fix?"
  back: "A `readonly` tuple cannot be assigned to a mutable array type (`TS4104`). Type the parameter `readonly string[]`."
  question: typescript/type-system-basics/literal-types-as-const
- id: as-const-vs-satisfies
  front: "How do `as const` and `satisfies` differ?"
  back: "`satisfies T` (TS 4.9) checks the value against `T` and keeps its inferred type, with no `readonly` or narrowing. `as const` changes the inferred type to the narrowest one. They combine as `as const satisfies T`."
  question: typescript/type-system-basics/literal-types-as-const
- id: const-type-parameter
  front: "What does a `<const T>` type parameter do?"
  back: "Added in TS 5.0, it infers literal types for arguments written inline at the call. With a mutable constraint like `string[]`, it will not infer a readonly tuple."
  question: typescript/type-system-basics/literal-types-as-const
- id: unique-symbol-type
  front: "What is a `unique symbol` type?"
  back: "Added in TS 2.7, it is the type of a `const` symbol: distinct from `symbol` and from every other unique symbol."
  question: typescript/type-system-basics/literal-types-as-const
- id: excess-property-check-fresh-only
  front: "When does the excess property check run?"
  back: "Only on a fresh object literal written at the assignment or argument. Storing it in a variable first, spreading it or asserting it removes freshness, leaving only structural assignability."
  question: typescript/type-system-basics/excess-property-checks
- id: excess-property-check-purpose
  front: "Why does TypeScript add excess property checking to a structural system?"
  back: "A value with extra properties is normally assignable, which would hide typos in options objects. Checking fresh literals catches them."
  question: typescript/type-system-basics/excess-property-checks
- id: weak-type-detection
  front: "What is the weak type rule?"
  back: "Since TS 2.4, a type whose properties are all optional rejects any value sharing no properties with it, even from a variable. `{ colour: \"red\" }` fails against `{ color?: string }`."
  question: typescript/type-system-basics/excess-property-checks
- id: excess-check-spread-and-union
  front: "Where does excess property checking not apply?"
  back: "Spread members are not checked. A union target without a discriminant accepts a literal matching any member. With a discriminant, TypeScript picks the matching member and checks against it."
  question: typescript/type-system-basics/excess-property-checks
- id: excess-check-fixes
  front: "How should you fix an excess property error on a legitimate extra property?"
  back: "Add the property to the type, or add an index signature such as `[key: string]: unknown`. Avoid `as T`, which bypasses the check and hides real mistakes."
  question: typescript/type-system-basics/excess-property-checks
- id: exact-optional-property-types
  front: "What does `exactOptionalPropertyTypes` change, and is it in `strict`?"
  back: "Added in TS 4.4, not in `strict`. It distinguishes an absent property from one explicitly set to `undefined`; without it, `theme?: \"dark\"` also accepts an explicit `undefined`."
  question: typescript/type-system-basics/excess-property-checks
- id: no-unchecked-indexed-access
  front: "What does `noUncheckedIndexedAccess` change for index signatures?"
  back: "Reading an undeclared key through an index signature gives `T | undefined` instead of `T`. It is not part of `strict`."
  question: typescript/type-system-basics/excess-property-checks
- id: readonly-compile-time-only
  front: "Does `readonly` freeze an object?"
  back: "No. It blocks assignment at compile time only, changes no runtime behaviour, and does not make nested contents immutable."
  question: typescript/type-system-basics/excess-property-checks
- id: function-type-param-name
  front: "What does the function type `(string) => void` actually describe?"
  back: "A function with a parameter named `string` of type `any`. The parameter name is required in a function type expression: write `(s: string) => void`."
  question: typescript/type-system-basics/function-types-overloads
- id: call-signature-vs-function-type
  front: "How do you type a function that also has properties?"
  back: "Use a call signature in an object type: `{ description: string; (n: number): boolean }`, with `:` before the return type. A leading `new` makes it a construct signature."
  question: typescript/type-system-basics/function-types-overloads
- id: overload-visibility-and-order
  front: "Which overload signatures can callers see, and which one does TypeScript pick?"
  back: "Callers see only the overload signatures, not the implementation signature. TypeScript picks the first matching overload, so put specific signatures before general ones."
  question: typescript/type-system-basics/function-types-overloads
- id: overload-vs-union-parameter
  front: "When should you use a union parameter instead of overloads?"
  back: "When the same return type works for all cases. Overloads cannot accept a union argument that no single overload covers, so `len(string | unknown[])` fails."
  question: typescript/type-system-basics/function-types-overloads
- id: this-parameter
  front: "What is a `this` parameter?"
  back: "A fake first parameter, as in `function f(this: User)`, that types `this` and is erased at compile time. It must be a `function`, not an arrow."
  question: typescript/type-system-basics/function-types-overloads
- id: void-return-two-rules
  front: "How does `void` behave for a function declaration versus a function type?"
  back: "A declaration with return type `void` cannot return a value. A function type returning `void` is satisfied by functions returning anything, and the result is ignored, so `forEach((n) => out.push(n))` compiles."
  question: typescript/type-system-basics/function-types-overloads
- id: method-parameter-bivariance
  front: "Under `strictFunctionTypes`, how are method-syntax members compared with function-typed properties?"
  back: "Method syntax is still compared bivariantly, a deliberate unsoundness, because many JavaScript and DOM hierarchies rely on it. Function-typed properties are checked contravariantly."
  question: typescript/type-system-basics/function-types-overloads
- id: generator-type-parameters
  front: "What do the three parameters of `Generator<T, TReturn, TNext>` type?"
  back: "`T` is what the generator yields, `TReturn` is what it returns, and `TNext` is what `next()` accepts."
  question: typescript/type-system-basics/function-types-overloads

# 02 Inference and narrowing
- id: inference-bottom-up-top-down
  front: "What are the two directions of type inference?"
  back: "Bottom-up: the type comes from the expression (`let n = 3` is `number`). Top-down, or contextual typing: the type comes from the position, such as a callback parameter typed by `map`'s declaration."
  question: typescript/inference-and-narrowing/how-inference-works
- id: array-literal-union-inference
  front: "What type does `[new Rhino(), new Elephant()]` infer, and how do you get `Animal[]`?"
  back: "The array of the union of the two. The checker does not invent a shared supertype. Annotate it explicitly as `Animal[]`."
  question: typescript/inference-and-narrowing/how-inference-works
- id: widening-mutable-location
  front: "Why does `{ kind: \"circle\" }` stored in a variable fail against a parameter expecting `\"circle\"`?"
  back: "A mutable location (`let`, an object property) could be reassigned, so the literal widens to `kind: string`. A `const` binding keeps the literal, and `as const` freezes a whole object literal."
  question: typescript/inference-and-narrowing/how-inference-works
- id: annotate-exported-return-types
  front: "Why annotate return types on exported functions and public APIs?"
  back: "So a body edit cannot silently change the contract for every caller. `isolatedDeclarations` (TS 5.5) requires it."
  question: typescript/inference-and-narrowing/how-inference-works
- id: no-contextual-type-implicit-any
  front: "What type does an unannotated parameter with no contextual type get, and what reports it?"
  back: "`any`. `noImplicitAny`, part of `strict`, reports it as TS7006."
  question: typescript/inference-and-narrowing/how-inference-works
- id: empty-collection-inference
  front: "What do `new Map()` with no type arguments and an empty `[]` give you?"
  back: "Nothing to infer from, so `any`-flavoured types: `new Map()` is `Map<any, any>` and everything read from it is unchecked. Pass type arguments or annotate."
  question: typescript/inference-and-narrowing/how-inference-works
- id: evolving-array
  front: "What is an evolving array?"
  back: "With `noImplicitAny`, `const ids = []` has no fixed element type yet and each `push` widens it. Reading it before any push, or from a nested function, reports TS7034 or TS7005."
  question: typescript/inference-and-narrowing/how-inference-works
- id: annotation-beats-contextual-type
  front: "Does a contextual type override an explicit parameter annotation?"
  back: "No. The explicit annotation wins over the contextual type."
  question: typescript/inference-and-narrowing/how-inference-works
- id: control-flow-analysis-definition
  front: "What is control flow analysis in TypeScript?"
  back: "The compiler walks the possible execution paths and, at each use of a variable, asks which checks and assignments must have happened on the way there. Narrowing is the result."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: builtin-narrowing-forms
  front: "Which built-in checks narrow a type?"
  back: "`typeof`, truthiness, equality (`===`, `!=`, `switch`), `in`, `instanceof`, and assignment to a union-typed variable. User-defined guards and discriminant checks also narrow."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: typeof-object-keeps-null
  front: "Why does `typeof x === \"object\"` on `T | null` not remove `null`?"
  back: "Because `typeof null` is `\"object\"`. Add `x !== null` or a truthiness check."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: truthiness-narrowing-primitives
  front: "What is the pitfall of truthiness narrowing on primitives?"
  back: "`if (s)` drops `\"\"` and `if (n)` drops `0`. After the `if`, the else branch of a `string | undefined` is still `string | undefined`. Compare with `!== undefined` when `0` or `\"\"` are valid."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: x-not-equal-null
  front: "What does `x != null` narrow away?"
  back: "Both `null` and `undefined`."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: narrowing-in-callbacks
  front: "When does narrowing survive into a closure?"
  back: "Property narrowing (`options.retries`) is dropped inside closures. For variables, it survives only if the closure is created after the last assignment (TS 5.4+); an assignment inside any nested function disables it."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: narrowing-survives-function-calls
  front: "Does calling a function invalidate a narrowed property such as `c.retries`?"
  back: "No. Tracking every possible write is infeasible, so `reset(c)` can clear it while the compiler still believes it is a number. Copy the value into a `const` first."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: narrowing-assignment-union-only
  front: "Why does assigning a string to `let u: unknown` not narrow it, while a `string | number` does?"
  back: "Assignment narrowing filters the declared type only when the declared type is a union. `unknown` is not a union."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: in-operator-narrowing-49
  front: "Since TS 4.9, what does `\"name\" in obj` do for `obj: object`?"
  back: "It narrows `object` to `object & Record<\"name\", unknown>`. You can read `obj.name`, but still have to narrow `name` itself."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: narrowing-erased
  front: "Does narrowing change the runtime?"
  back: "No. Types are erased and narrowing only changes what the checker accepts. A real runtime check must exist in the code for the narrowing to be true."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: aliased-condition-narrowing
  front: "What are aliased conditions in narrowing (TS 4.4)?"
  back: "Narrowing flows through a `const` that holds a guard, a `readonly` property, or an unmodified parameter, so `const isText = typeof v === \"string\"; if (isText)` narrows `v`."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: switch-true-narrowing
  front: "What does `switch (true)` allow for narrowing (TS 5.3)?"
  back: "Each `case` expression acts as a condition, so `case typeof x === \"string\":` narrows `x` to `string`."
  question: typescript/inference-and-narrowing/control-flow-narrowing
- id: type-predicate-syntax
  front: "What is a type predicate and what does it do at a call site?"
  back: "A return type of the form `paramName is Type`. When the call returns `true`, the argument narrows to `Type` in the true branch, and `Type` is removed from it in the false branch."
  question: typescript/inference-and-narrowing/custom-type-guards
- id: predicate-body-unchecked
  front: "Does TypeScript check that a type predicate's body matches its claim?"
  back: "No. Explicit predicates are \"no safer than a type assertion\", so a predicate returning `true` for wrong values silently corrupts every call site."
  question: typescript/inference-and-narrowing/custom-type-guards
- id: predicate-iff
  front: "Why is `s is string` implemented as `!!s` wrong?"
  back: "A predicate must be if-and-only-if: `false` means the value is not `T`. But `\"\"` is a string that returns `false`, so the else branch is mistyped."
  question: typescript/inference-and-narrowing/custom-type-guards
- id: assertion-function-forms
  front: "What are the two signatures of an assertion function (TS 3.7)?"
  back: "`asserts value is T`: after the call returns, `value` is `T`. `asserts condition`: after it returns, the argument expression is truthy. Both narrow by throwing instead of returning false."
  question: typescript/inference-and-narrowing/custom-type-guards
- id: assertion-function-explicit-annotation
  front: "Why does an arrow assigned to an unannotated `const` fail as an assertion function?"
  back: "The call target must be declared with an explicit type, otherwise each call reports TS2775. Use a function declaration, or annotate the const."
  question: typescript/inference-and-narrowing/custom-type-guards
- id: inferred-type-predicates
  front: "When does TS 5.5 infer a type predicate?"
  back: "For a function with no return annotation, one `return`, no parameter mutation, and a boolean expression tied to a refinement. `filter(n => n !== undefined)` then gives `number[]`."
  question: typescript/inference-and-narrowing/custom-type-guards
- id: filter-truthy-no-predicate
  front: "Why does `filter(x => !!x)` on `(number | undefined)[]` stay `(number | undefined)[]`?"
  back: "No predicate is inferred, because `0` returns `false` and is still a `number`. Use `x !== undefined`, which also keeps the zeros."
  question: typescript/inference-and-narrowing/custom-type-guards
- id: guard-vs-assertion-choice
  front: "When do you choose an assertion function over a type guard?"
  back: "When failing is the only sensible outcome, such as validating input at the top of a function or in tests. A guard fits branching code where both outcomes are handled."
  question: typescript/inference-and-narrowing/custom-type-guards
- id: predicate-type-assignable
  front: "What constraint applies to the type in a predicate like `n is string`?"
  back: "It must be assignable to the parameter type. `n: number` with `n is string` is error TS2677."
  question: typescript/inference-and-narrowing/custom-type-guards
- id: discriminated-union-definition
  front: "What is a discriminated union?"
  back: "A union whose members all share a property, the discriminant, with a distinct literal type in each. Checking it narrows the whole object to the matching member."
  question: typescript/inference-and-narrowing/discriminated-unions
- id: union-vs-optional-fields
  front: "Why is a discriminated union better than one object with optional fields?"
  back: "With `{ kind: \"circle\" | \"square\"; radius?: number }` the compiler cannot connect `kind` to which field exists, so you reach for `!`. A union encodes the relationship, so the check proves the field is there."
  question: typescript/inference-and-narrowing/discriminated-unions
- id: exhaustiveness-never-default
  front: "How do you check a `switch` over a discriminated union exhaustively?"
  back: "In `default`, pass the value to `assertNever(value: never)` or write `value satisfies never` (TS 4.9). An unhandled member is not assignable to `never`, so the error points at the missing case."
  question: typescript/inference-and-narrowing/discriminated-unions
- id: exhaustiveness-missing-return
  front: "How can exhaustiveness be checked without a `default` branch?"
  back: "Annotate the return type and omit `default`. If the switch is not exhaustive, TypeScript reports a missing ending return (TS2366). It only works for functions that return."
  question: typescript/inference-and-narrowing/discriminated-unions
- id: string-tag-does-not-discriminate
  front: "Why does `{ kind: string }` fail as a discriminant?"
  back: "The tag must be a literal or unit type in every member. With `string`, members do not narrow each other and `shape.radius` fails with TS2339."
  question: typescript/inference-and-narrowing/discriminated-unions
- id: never-branch-runtime-safety
  front: "Does compile-time exhaustiveness protect against bad runtime data?"
  back: "No. Data from `JSON.parse` or a server can carry a tag the type does not know. The `never` branch only throws if you wrote it to, as `assertNever` does."
  question: typescript/inference-and-narrowing/discriminated-unions
- id: destructured-discriminant
  front: "Does destructuring the tag, `const { kind } = shape`, still narrow `shape`?"
  back: "Yes, since TS 4.6, for `const` destructuring and parameters that are never assigned to. A `...rest` object does not narrow in the same way."
  question: typescript/inference-and-narrowing/discriminated-unions
- id: in-instead-of-tag
  front: "Can `in` replace a discriminant tag?"
  back: "Yes when a property exists on only one member: `\"radius\" in shape` narrows to the circle member. It breaks once two members share the key, and a tag is clearer."
  question: typescript/inference-and-narrowing/discriminated-unions
- id: annotation-widens-to-declared
  front: "What is the type of a variable declared `const x: T = expr`?"
  back: "`T`. The annotation checks `expr` against `T`, then specific information is lost: properties typed `string | RGB` stay `string | RGB`."
  question: typescript/inference-and-narrowing/satisfies-operator
- id: satisfies-semantics
  front: "What does `expr satisfies T` (TS 4.9) do?"
  back: "It checks `expr` against `T` like an annotation, including excess-property errors, but the expression keeps its own inferred type. It is erased at compile time."
  question: typescript/inference-and-narrowing/satisfies-operator
- id: satisfies-contextual-type
  front: "How does `satisfies T` use `T` beyond checking?"
  back: "As a contextual type: callback parameters get types, array literals can become tuples when `T` expects one, and literals are kept where `T` expects a literal type."
  question: typescript/inference-and-narrowing/satisfies-operator
- id: as-vs-satisfies-completeness
  front: "Why do `as` and `satisfies` differ on a config object with missing or misspelled keys?"
  back: "`as T` only requires sufficient overlap, so missing keys and extra keys like `bleu` pass. `satisfies` does an assignability check and rejects both."
  question: typescript/inference-and-narrowing/satisfies-operator
- id: satisfies-not-conversion
  front: "Does `satisfies` change a value's type?"
  back: "Never. `const xs = [] satisfies string[]` is `never[]`, not `string[]`. Annotate when you need the declared type."
  question: typescript/inference-and-narrowing/satisfies-operator
- id: satisfies-when-to-use
  front: "When is `satisfies` the right tool, and when not?"
  back: "Use it for config objects, route tables, theme tokens and lookup maps, where you want typos caught and per-property types kept. Do not use it for external data like `JSON.parse`, which needs runtime validation."
  question: typescript/inference-and-narrowing/satisfies-operator
- id: as-const-satisfies-combined
  front: "Can `satisfies` replace `as const`?"
  back: "No, they do different jobs: `as const` makes a value readonly with literal types, `satisfies` checks it. Combine them: `[1, 2] as const satisfies readonly number[]` is `readonly [1, 2]`."
  question: typescript/inference-and-narrowing/satisfies-operator
- id: assertions-erased
  front: "What do `as`, `!` and `!:` have in common at runtime?"
  back: "All are assertions removed from the emitted JavaScript. Nothing is checked at runtime, so a wrong assertion becomes a runtime error somewhere else."
  question: typescript/inference-and-narrowing/assertions-and-non-null
- id: as-overlap-rule
  front: "When does TypeScript allow `value as T`?"
  back: "When the types sufficiently overlap, meaning one is assignable to the other. `\"hello\" as number` is rejected with TS2352."
  question: typescript/inference-and-narrowing/assertions-and-non-null
- id: double-assertion
  front: "What is a double assertion and what does it cost?"
  back: "`x as unknown as T`, going through `unknown` or `any` to bypass the overlap rule. It deliberately gives up all checking."
  question: typescript/inference-and-narrowing/assertions-and-non-null
- id: as-completeness-not-checked
  front: "Why does `{ a: 1 } as { a: number; b: string }` compile?"
  back: "Because the target is a subtype of the source, so the types overlap. `as` does not check completeness."
  question: typescript/inference-and-narrowing/assertions-and-non-null
- id: non-null-assertion
  front: "What does the non-null assertion `value!` do?"
  back: "It removes `null` and `undefined` from the type only. `maybe!.length` still throws at runtime if `maybe` is `undefined`. It is the absence of a null check, not a null check."
  question: typescript/inference-and-narrowing/assertions-and-non-null
- id: definite-assignment-assertion
  front: "What does `let x!: T` or `prop!: T` suppress?"
  back: "Added in TS 2.7, it suppresses \"used before being assigned\" (TS2454) or, on a class field, `strictPropertyInitialization` (TS2564). Reasonable for fields a framework initializes after the constructor."
  question: typescript/inference-and-narrowing/assertions-and-non-null
- id: definite-assignment-emit
  front: "Does `prop!: string` change the emitted JavaScript of a class?"
  back: "The `!` is erased, but the field declaration is not. With `target: es2022`, TS 7.0.2 emitted `b;`, defining the field as `undefined`. `declare b: string` or `useDefineForClassFields: false` emitted no field."
  question: typescript/inference-and-narrowing/assertions-and-non-null
- id: assertion-alternatives
  front: "What should you prefer over `as` and `!` when an alternative exists?"
  back: "A type guard or assertion function (the claim gets checked), `?.`/`??` or an early `throw` instead of `!`, `satisfies` for object literals, and `unknown` plus narrowing for external data."
  question: typescript/inference-and-narrowing/assertions-and-non-null
