# 01 Documents and semantics
- id: doctype-purpose
  front: "What is the only job of `<!DOCTYPE html>`?"
  back: "It chooses the document's mode. It is not a version declaration and the browser never fetches a DTD; the standard calls it a required preamble kept for legacy reasons."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: doctype-three-modes
  front: "Which three document modes can the DOM give a page?"
  back: "No-quirks (standards), limited-quirks and quirks. The parser's initial insertion mode sets one when it sees the first token."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: doctype-quirks-triggers
  front: "What puts a document into quirks mode?"
  back: "No doctype, a doctype whose name isn't `html`, or one of 61 listed legacy identifiers (HTML 3.2, HTML 4.01 Transitional without a system identifier, and so on)."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: doctype-limited-quirks
  front: "What does limited-quirks mode change, and which doctype gives it?"
  back: "Only the line-height quirks, so an image alone in a table cell has no gap below it. Transitional doctypes such as XHTML 1.0 Transitional trigger it."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: doctype-must-come-first
  front: "What happens if text or an element comes before the doctype, versus a comment or whitespace?"
  back: "Text or an element is a parse error and sets quirks mode. Comments and whitespace before the doctype are fine."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: quirks-css-changes
  front: "Which CSS parsing and selector behaviours change in quirks mode?"
  back: "Unitless lengths (`width: 200`) and hashless hex colours (`color: ff0000`) are accepted, and class and ID selectors match case-insensitively."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: quirks-percentage-height
  front: "How do percentage heights and `body` behave in quirks mode?"
  back: "Percentage heights look past `auto`-height ancestors, and `body` stretches to fill the viewport. In standards mode the percentage resolves against an `auto` body."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: quirks-tables-and-scrolling
  front: "What do tables and `document.scrollingElement` do in quirks mode?"
  back: "Tables reset inherited font properties and text decoration doesn't propagate into them. `document.scrollingElement` is `body` rather than `html`."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: compat-mode-values
  front: "What do `document.compatMode` values `BackCompat` and `CSS1Compat` mean?"
  back: "`BackCompat` is quirks mode. `CSS1Compat` is both no-quirks and limited-quirks, so it is not proof of full standards mode."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: doctype-http401-system-identifier
  front: "How does the system identifier affect an HTML 4.01 Transitional doctype?"
  back: "Without the system identifier (the URL) it gives quirks mode. With it, the document is limited-quirks."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: doctype-srcdoc-mode
  front: "Does an `iframe srcdoc` document without a doctype get quirks mode?"
  back: "No. The parser never sets quirks mode for it: `srcdoc=\"<p>no doctype here\"` gave `CSS1Compat` in Chrome 155 and Firefox 158."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: doctype-parsing-effect
  front: "Does the doctype change how HTML is parsed into a tree?"
  back: "Barely. Tree construction is the same in all modes except that in quirks mode a `<table>` start tag does not close an open `<p>`. The real differences are in CSS and a few DOM APIs."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: limited-quirks-origin
  front: "Why does limited-quirks mode exist?"
  back: "Some browsers kept the old shrink-wrapping of images in table cells even in standards mode, and sites came to depend on it. Strict browsers added a third mode keeping only that behaviour."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: doctype-case-and-comments
  front: "Is `<!doctype HTML>` valid, and may a comment precede the doctype?"
  back: "Yes to both: the doctype is case-insensitive and gives no-quirks, and a leading comment still gives `CSS1Compat`."
  question: html-and-css/documents-and-semantics/doctype-and-rendering-modes
- id: content-model-definition
  front: "What is an HTML element's content model, and how is it expressed?"
  back: "The standard's description of what the element may contain, stated in content categories: flow, phrasing, metadata, sectioning, heading, embedded and interactive content."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: p-content-model
  front: "What content model does `<p>` have, and is `<div>` inside it conforming?"
  back: "`<p>` accepts phrasing content. `<div>` is flow content but not phrasing, so `<div>` inside `<p>` is non-conforming."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: transparent-content-model
  front: "What is a transparent content model, and which elements have one?"
  back: "The element takes its parent's content model. `<a>`, `<ins>` and `<del>` are transparent, so `<a href><div>` is valid where the parent allows flow content, but `<p><a><div>` is not."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: content-model-vs-parser
  front: "Does the parser enforce content models?"
  back: "No. Content models are conformance rules that validators report. The parser repairs only the cases its tree-construction algorithm names, and leaves most other violations as written."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: div-in-p-parse
  front: "What DOM does `<p>Intro<div>Block</div></p>` produce?"
  back: "Three siblings: `<p>Intro</p>`, `<div>Block</div>` and `<p></p>`. The `div` start tag closes the open `p`, and the stray `</p>` makes the parser insert an empty `p`."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: p-closing-start-tags
  front: "Which start tags close an open `p` in button scope?"
  back: "Block starts such as `div`, `ul`, `section`, `table`, `h1`-`h6` and another `p`. This is also why `<p>`'s end tag is optional."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: div-in-p-consequences
  front: "What two practical effects does the repaired `<p>`/`<div>` DOM have?"
  back: "Selectors like `p > div` never match, and the extra empty `<p>` adds its default margins."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: invalid-nesting-kept
  front: "Does the parser repair `<span><div>` or `<button><div>`?"
  back: "No. Both stay nested exactly as written, though they are still invalid. Parser repair is not validation."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: parser-other-rewrites
  front: "Name three other rewrites the HTML parser performs on invalid nesting."
  back: "A second `<a>` closes the first, a nested `<form>` start tag is ignored, and non-table content inside `<table>` is foster-parented to just before the table."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: foster-parenting-result
  front: "What does `<table><div>x</div><tr><td>c</td></tr></table>` parse to?"
  back: "`<div>x</div><table><tbody><tr><td>c</td></tr></tbody></table>`. The `div` is foster-parented before the table and a `tbody` is inserted."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: p-div-dom-api-reparse
  front: "What happens if you build `p > div` with DOM `append`, then re-parse its `outerHTML` via `innerHTML`?"
  back: "The DOM API allows it, but re-parsing gives three siblings: `<p></p><div></div><p></p>`. Chrome 155 and Firefox 158 printed the same."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: p-div-ssr-hydration
  front: "Why does `<p><div>` break server-side rendering?"
  back: "The server sends it as text and the browser's parser turns it into sibling elements, so the DOM no longer matches the framework's rendered tree and hydration finds a mismatch."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: button-scope-stops-p-close
  front: "Does `<div>` inside a `<button>` inside a `<p>` close the `p`?"
  back: "No. The has-a-`p`-in-button-scope check stops at `button`, so `<p>a<button><div>b</div></button></p>` is unchanged. It is still invalid, since `button` accepts only phrasing content."
  question: html-and-css/documents-and-semantics/content-model-and-parser-repair
- id: semantics-three-benefits
  front: "What three things do semantic elements buy you?"
  back: "Accessibility-tree roles, built-in behaviour (focus, keyboard activation, form submission), and other consumers such as reader modes and search engines reading the same structure."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: implicit-aria-roles
  front: "What implicit ARIA roles do `nav`, `main`, `button` and `ul` map to?"
  back: "`navigation`, `main`, `button` and `list`. Screen readers announce the role and let users navigate by landmark, heading or list."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: div-span-generic
  front: "What role do `div` and `span` map to, and how is it announced?"
  back: "`generic`, which is announced as nothing."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: button-vs-div-btn
  front: "What does a `<button>` give you that a `<div class=\"btn\">` lacks?"
  back: "It is focusable, activates on click and the keyboard, can be `disabled`, and submits its form. The div has none of that until you write it."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: div-element-of-last-resort
  front: "When is a `div` the right element?"
  back: "When there is no meaning to express: the standard calls it an element of last resort. Examples are a flex or grid wrapper, a class hook, a group sharing `lang`, or a `dt`/`dd` group in `<dl>`."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: role-button-on-div
  front: "What does `role=\"button\"` on a `div` actually change?"
  back: "Only what assistive technology is told. It adds no focus, keyboard handling or form behaviour."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: role-button-div-keyboard-chrome
  front: "In Chrome 155, did Enter and Space activate a `div role=\"button\" tabindex=\"0\"`?"
  back: "No. It was focusable, but Enter and Space did not fire its `click` handler; only the mouse did."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: button-default-type-submit
  front: "What is the default `type` of a `<button>` inside a form, and what goes wrong?"
  back: "`submit`. A toggle button without `type=\"button\"` submits the form."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: section-without-name-generic
  front: "What role does a `<section>` have without an accessible name?"
  back: "`generic`, the same as a `div`. With `aria-label` or `aria-labelledby` it is a `region` landmark."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: b-i-strong-em-roles
  front: "Are `<b>` and `<i>` meaningless, and which inline elements have their own roles?"
  back: "They have defined meanings (`b` draws attention without importance, `i` marks an alternate voice) but map to `generic`. `<strong>` (importance) and `<em>` (stress) have their own roles."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: semantics-styling-effect
  front: "How do semantic elements affect styling?"
  back: "Only through the user-agent stylesheet, such as bold headings and list markers. That is a default you override, never a reason to pick an element."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: a-without-href-generic
  front: "What role is `<a>` without `href`, and is it focusable?"
  back: "`generic`, and not focusable. With `href` it is a `link`."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: header-footer-role-scope
  front: "How does context change the role of `header` and `footer`?"
  back: "As a child of `body` they are the `banner` and `contentinfo` landmarks. Inside `article`, `aside`, `main`, `nav` or `section` they are not."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: scoped-header-spec-disagreement
  front: "What role does a `header` scoped inside `article` get per ARIA in HTML versus Chrome 155?"
  back: "ARIA in HTML lists `generic`. The HTML-AAM editor's draft maps it to `sectionheader`, which Chrome 155 exposed. The two specs disagree."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: explicit-role-overrides
  front: "Can an explicit role override an element's implicit role?"
  back: "Yes where ARIA in HTML allows it: `<ul role=\"tablist\">` replaces the list semantics. Redundant roles such as `<nav role=\"navigation\">` are warned against."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: aria-on-div-when
  front: "When is ARIA on a `div` the right choice?"
  back: "Only for a widget HTML has no element for, such as a tree or grid, and then you own focus and keyboard behaviour."
  question: html-and-css/documents-and-semantics/semantic-elements
- id: landmark-vs-heading-structures
  front: "What are the two navigable structures of a page?"
  back: "Landmarks, which are regions users jump between, and headings, which form the outline. Screen reader users use both."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: landmark-role-mapping
  front: "Which landmark roles do `nav`, `aside` and `search` map to?"
  back: "`nav` is `navigation`, `aside` is `complementary` and `search` is `search`. `main` is `main`."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: section-form-landmark-name
  front: "When does a `section` or `form` become a landmark?"
  back: "Only with an accessible name: a `section` becomes a `region` and a `form` becomes a `form` landmark."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: duplicate-landmarks-label
  front: "What should you do when a page has two landmarks of the same type?"
  back: "Give each an `aria-label`, such as primary and pagination `nav`, so the list of landmarks can tell them apart."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: outline-algorithm-removed
  front: "What happened to HTML's outline algorithm?"
  back: "Browsers never implemented it for assistive technology, and in July 2022 WHATWG replaced it (PR #7829). The outline is now all headings in tree order, each at its own level."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: h1-in-section-level
  front: "What level does an `h1` nested in a `section` have now?"
  back: "Level 1. Nesting sectioning elements never demotes a heading. Chrome 155 exposed all of them as level 1, and both browsers rendered a `section h1` at the same 32px as a top-level one."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: heading-level-rules
  front: "What are the conformance rules for heading levels?"
  back: "At least one heading should be level 1, and each heading may go at most one level deeper than the one before it. `h2` straight to `h4` is non-conforming."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: hgroup-outline
  front: "What does `hgroup` do to the outline?"
  back: "It wraps a heading with subtitle paragraphs, and only the heading enters the outline."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: headingoffset-support
  front: "Can you rely on `headingoffset` and `:heading` today?"
  back: "No. `CSS.supports(\"selector(:heading)\")` was `false` in Chrome 155 and Firefox 158, and Chrome still exposed an `h1` inside `headingoffset=\"1\"` as level 1."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: sectioning-effect-on-headings
  front: "What do sectioning elements do, if not change heading levels?"
  back: "They group content and can give landmarks. Choose heading levels for the structure and size them with CSS."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: single-main-rule
  front: "How many `<main>` elements may a document have, and where may one sit?"
  back: "No more than one without the `hidden` attribute. Its ancestors may only be `html`, `body`, `div`, an unnamed `form` and autonomous custom elements, never `article`, `aside` or `nav`."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: redundant-banner-role
  front: "Is `role=\"banner\"` needed on a `<header>`?"
  back: "No. ARIA in HTML calls redundant roles not recommended, and a `header` scoped to `body` is already `banner`."
  question: html-and-css/documents-and-semantics/landmarks-and-headings
- id: head-content-model
  front: "What may `<head>` contain?"
  back: "Metadata content: exactly one `<title>`, at most one `<base>`, and any number of `meta`, `link`, `style`, `script`, `noscript` and `template`."
  question: html-and-css/documents-and-semantics/head-metadata
- id: meta-charset-1024
  front: "Where must `<meta charset>` sit, and what value must it have?"
  back: "Fully inside the first 1024 bytes, because browsers prescan those bytes before parsing. The value must be UTF-8."
  question: html-and-css/documents-and-semantics/head-metadata
- id: charset-precedence
  front: "What beats a `<meta charset>` declaration?"
  back: "A charset in the HTTP `Content-Type` header, or a byte-order mark."
  question: html-and-css/documents-and-semantics/head-metadata
- id: no-charset-fallback
  front: "What did Chrome 155 and Firefox 158 do with a UTF-8 `café` served over HTTP without a declared encoding, on an en-US profile?"
  back: "Both decoded it as windows-1252, giving `cafÃ©`."
  question: html-and-css/documents-and-semantics/head-metadata
- id: charset-file-protocol
  front: "Which encoding did Chrome and Firefox guess for an undeclared ASCII-only page on `file:`?"
  back: "Chrome chose windows-1252 and Firefox chose UTF-8."
  question: html-and-css/documents-and-semantics/head-metadata
- id: charset-late-honoured
  front: "Is a `charset` placed after the first 1024 bytes ignored?"
  back: "It is non-conforming, but both browsers still honoured one after 1,100 bytes, because the parser can swap decoders on the fly or reload the page. Keep it first to avoid that."
  question: html-and-css/documents-and-semantics/head-metadata
- id: viewport-meta-spec
  front: "Which spec defines the viewport meta tag, and what does it do?"
  back: "CSS Viewport, not HTML. With `width=device-width, initial-scale=1` the layout viewport matches the device width and media queries see the real size, instead of a wide fallback."
  question: html-and-css/documents-and-semantics/head-metadata
- id: viewport-fallback-980
  front: "What did Chrome 155 mobile emulation at 390px report without a viewport tag?"
  back: "`innerWidth` was `980` and `(max-width: 600px)` didn't match. With the tag it was `390` and it matched. The fallback width is browser-defined, not specified."
  question: html-and-css/documents-and-semantics/head-metadata
- id: viewport-no-zoom
  front: "Why avoid `maximum-scale=1` or `user-scalable=no` in the viewport tag?"
  back: "Where a browser honours it, users who need to zoom can't."
  question: html-and-css/documents-and-semantics/head-metadata
- id: title-uses
  front: "What does `<title>` name, and which one does `document.title` read?"
  back: "The document in tabs, history, bookmarks and search results; Chrome's accessibility tree uses it as the page name. `document.title` reads the first `<title>` in the document."
  question: html-and-css/documents-and-semantics/head-metadata
- id: base-href-effect
  front: "What does `<base href>` change?"
  back: "The document base URL, which every relative URL resolves against: links, images, `fetch`, and even `href=\"#id\"`. Only the first `base` with `href` counts."
  question: html-and-css/documents-and-semantics/head-metadata
- id: base-hash-link-gotcha
  front: "What happens to `href=\"#top\"` when `<base href=\"https://shop.example/app/\">` is present?"
  back: "It resolves to `https://shop.example/app/#top`, another page, so clicking navigates away instead of scrolling."
  question: html-and-css/documents-and-semantics/head-metadata
- id: base-target
  front: "What does the `target` attribute on `<base>` set?"
  back: "The default browsing context for links and forms."
  question: html-and-css/documents-and-semantics/head-metadata
- id: standard-meta-names
  front: "Which `<meta name>` values does the standard define, and what about `robots`?"
  back: "Standard ones include `description`, `referrer`, `theme-color`, `color-scheme`, `application-name` and `generator`. Others such as `robots` are extensions defined outside the standard."
  question: html-and-css/documents-and-semantics/head-metadata
- id: head-closed-by-non-metadata
  front: "What happens to a `meta` tag that comes after a `<div>` in `<head>`?"
  back: "The first non-metadata element or text closes `head`, so everything after it, including later `meta` tags, goes into `body`."
  question: html-and-css/documents-and-semantics/head-metadata
- id: head-duplicate-title-base-result
  front: "With two `<title>`s and two `<base href>`s after a `<div>` in `<head>`, which win?"
  back: "The first `title` and the first `base` with `href`. The `div` closes `head`, but `document.title` takes the first `<title>` in the document and the first `base` still sets the base URL wherever it is."
  question: html-and-css/documents-and-semantics/head-metadata
- id: rel-link-type-kinds
  front: "How does the standard sort `rel` link types?"
  back: "External resources the browser fetches (`stylesheet`, `icon`, `manifest`), hyperlinks that describe another document (`canonical`, `alternate`, `next`, `license`), and annotations on `a`, `area` or `form` links (`nofollow`, `noopener`, `noreferrer`, `opener`)."
  question: html-and-css/documents-and-semantics/link-types
- id: canonical-link
  front: "What does `rel=\"canonical\"` do, and where is it allowed?"
  back: "It names the preferred URL so search engines can merge duplicates such as `?utm_source=` variants (RFC 6596). Allowed only on `<link>`, not `<a>`; the standard gives browsers nothing to do with it."
  question: html-and-css/documents-and-semantics/link-types
- id: rel-alternate-uses
  front: "What does `rel=\"alternate\"` mean with `type=\"application/atom+xml\"`, with `hreflang`, and with `stylesheet`?"
  back: "A feed for autodiscovery, a translation, and an alternative stylesheet respectively."
  question: html-and-css/documents-and-semantics/link-types
- id: rel-icon-selection
  front: "How does the browser choose among several `rel=\"icon\"` links, and with none?"
  back: "It picks by `type`, `media` and `sizes`. With none, it may request `/favicon.ico`."
  question: html-and-css/documents-and-semantics/link-types
- id: rel-nofollow
  front: "What does `rel=\"nofollow\"` do?"
  back: "It says the author doesn't endorse the link, or that it exists because of a commercial relationship. It changes nothing in the browser; search engines read it. It is not an access control."
  question: html-and-css/documents-and-semantics/link-types
- id: rel-noopener
  front: "What does `rel=\"noopener\"` do?"
  back: "A new top-level tab opened by the link gets no `window.opener`, so it can't navigate or script the page that opened it."
  question: html-and-css/documents-and-semantics/link-types
- id: rel-noreferrer
  front: "What does `rel=\"noreferrer\"` do beyond `noopener`?"
  back: "It sends no `Referer` header and leaves `document.referrer` empty, and it also implies `noopener`."
  question: html-and-css/documents-and-semantics/link-types
- id: rel-opener
  front: "What does `rel=\"opener\"` do?"
  back: "It is the opt-out that restores `window.opener`."
  question: html-and-css/documents-and-semantics/link-types
- id: target-blank-implies-noopener
  front: "Is `rel=\"noopener\"` still needed on `target=\"_blank\"` links?"
  back: "No. The noopener step returns true when `rel` has `noopener` or `noreferrer`, or `target` is `_blank` and `rel` lacks `opener`. Adding it only covers browsers older than Chrome 88, Firefox 79 and Safari 12.1."
  question: html-and-css/documents-and-semantics/link-types
- id: reverse-tabnabbing
  front: "What is reverse tabnabbing?"
  back: "The opened page redirecting its opener, via `window.opener`, to a phishing page."
  question: html-and-css/documents-and-semantics/link-types
- id: noreferrer-opener-combined
  front: "What does the new tab see for `rel=\"noreferrer opener\"` on a `_blank` link?"
  back: "`opener` is `null` and the referrer is empty. `noreferrer` implies `noopener`, and the step checks it before `opener`, so `opener` can't undo it."
  question: html-and-css/documents-and-semantics/link-types
- id: noreferrer-when-only-noopener
  front: "Why not use `noreferrer` when you only want `noopener`?"
  back: "It also sends no `Referer`, so the destination can't see where the visit came from."
  question: html-and-css/documents-and-semantics/link-types
- id: referrer-cross-origin
  front: "What `Referer` did Chrome 155 and Firefox 158 send on a cross-origin `_blank` link without `noreferrer`?"
  back: "Only the origin, for example `http://localhost:8765/`. Same-origin it was the full URL."
  question: html-and-css/documents-and-semantics/link-types
- id: rellist-supports
  front: "How can script check which `rel` values a browser supports?"
  back: "`element.relList.supports(token)`. For `<a>`, both browsers reported `noopener` supported and `nofollow` not."
  question: html-and-css/documents-and-semantics/link-types
- id: rellist-canonical-disagreement
  front: "What did `link.relList.supports(\"canonical\")` return in Chrome 155 and Firefox 158?"
  back: "`true` in Chrome 155 and `false` in Firefox 158."
  question: html-and-css/documents-and-semantics/link-types
- id: window-open-opener
  front: "Does `window.open` get the `_blank` noopener protection?"
  back: "No. In Chrome 155 and Firefox 158 it returned a `Window` and the new page saw its opener. With `\"noopener\"` in the features string it returned `null` and `opener` was `null`."
  question: html-and-css/documents-and-semantics/link-types
- id: global-attributes-list
  front: "What are global attributes?"
  back: "Attributes allowed on every HTML element, such as `hidden`, `inert`, `lang`, `popover`, `style`, `tabindex`, `title`, `id`, `class`, `slot`, event handler attributes and any `data-*` attribute."
  question: html-and-css/documents-and-semantics/global-attributes
- id: boolean-attribute-presence
  front: "How does a boolean attribute like `disabled` get its value?"
  back: "True when present, false when absent, whatever the value: `disabled=\"false\"` still disables. A valid value is the empty string or the attribute's own name."
  question: html-and-css/documents-and-semantics/global-attributes
- id: boolean-attribute-turn-off
  front: "How do you turn a boolean attribute off?"
  back: "Remove it with `removeAttribute`, or set the IDL property to `false`. `setAttribute(\"hidden\", false)` still leaves it on."
  question: html-and-css/documents-and-semantics/global-attributes
- id: enumerated-vs-boolean
  front: "How do enumerated attributes like `contenteditable`, `spellcheck` and `draggable` differ from boolean ones?"
  back: "`\"false\"` is a real keyword for them, whereas for a boolean attribute any value means true."
  question: html-and-css/documents-and-semantics/global-attributes
- id: hidden-enumerated
  front: "What values does the `hidden` attribute take?"
  back: "It is enumerated: `hidden`, `\"\"` or any invalid value means Hidden, and `until-found` means Hidden Until Found."
  question: html-and-css/documents-and-semantics/global-attributes
- id: hidden-ua-display-none
  front: "Why does `.row { display: flex }` make a `hidden` element visible?"
  back: "`hidden` is implemented by a UA stylesheet rule, `[hidden]:not([hidden=until-found i]) { display: none }`, and any author `display` rule beats a UA rule."
  question: html-and-css/documents-and-semantics/global-attributes
- id: hidden-fix-display
  front: "How do you stop author `display` rules from overriding `hidden`?"
  back: "Add `[hidden] { display: none !important; }` to your base styles, or never set `display` on elements you toggle with `hidden`."
  question: html-and-css/documents-and-semantics/global-attributes
- id: hidden-until-found
  front: "How does `hidden=\"until-found\"` differ from plain `hidden`?"
  back: "It hides with `content-visibility: hidden`, so find-in-page and fragment navigation can reach the content. The browser fires `beforematch` and removes the attribute before scrolling to it."
  question: html-and-css/documents-and-semantics/global-attributes
- id: hidden-vs-display-none
  front: "When choose `hidden` over a `display: none` class?"
  back: "`hidden` says the content isn't relevant right now and works without your CSS loaded; a class is purely presentational. In Chrome 155 both, and `until-found` content too, were absent from the accessibility tree."
  question: html-and-css/documents-and-semantics/global-attributes
- id: data-attribute-naming
  front: "What are the naming rules for `data-*` attributes, and what happens to `data-userId`?"
  back: "Something must follow `data-`. The parser lowercases attribute names, so `data-userId` is stored as `data-userid` and the key is `dataset.userid`, not `dataset.userId`."
  question: html-and-css/documents-and-semantics/global-attributes
- id: dataset-camel-case
  front: "How does `dataset` map attribute names to keys?"
  back: "`data-product-id` becomes `dataset.productId`. Writing `dataset.orderCount = 3` creates `data-order-count=\"3\"`, and `delete` removes the attribute."
  question: html-and-css/documents-and-semantics/global-attributes
- id: dataset-strings
  front: "What type are `dataset` values?"
  back: "Always strings. `dataset.productId` was `\"7\"`, so parse it if you need a number or boolean."
  question: html-and-css/documents-and-semantics/global-attributes
- id: data-attributes-purpose
  front: "What are `data-*` attributes for, and not for?"
  back: "Private data for the page's own scripts. Not for metadata meant for other software; that is what microdata or a standard attribute is for."
  question: html-and-css/documents-and-semantics/global-attributes
- id: data-state-selectors
  front: "Is styling with `[data-state=\"open\"]` fine?"
  back: "Yes for state your script owns, since the selector and `dataset` value stay in one place. Prefer a native attribute or pseudo-class (`[open]`, `:checked`, `:disabled`) when one exists."
  question: html-and-css/documents-and-semantics/global-attributes

# 02 Forms, dialog and popover
- id: submit-algorithm-order
  front: "In what order does the browser run a form submission?"
  back: "Trigger and submitter, validation, the cancelable `submit` event, building the entry list (then `formdata`), encoding, then navigation to `action`."
  question: html-and-css/forms-dialog-popover/form-submission
- id: submit-submitter-none
  front: "What is the submitter of a form submission, and what if no button caused it?"
  back: "The button that triggered it, available as `event.submitter`. With no button, the submitter is the form itself."
  question: html-and-css/forms-dialog-popover/form-submission
- id: submit-skip-validation
  front: "How do you skip constraint validation on submit?"
  back: "Put `novalidate` on the form, or `formnovalidate` on the submitting button."
  question: html-and-css/forms-dialog-popover/form-submission
- id: submit-event-traits
  front: "What are the traits of the `submit` event?"
  back: "It bubbles, is cancelable and carries `event.submitter`. `preventDefault()` there is how script takes over the submission."
  question: html-and-css/forms-dialog-popover/form-submission
- id: entry-list-exclusions
  front: "Which controls are left out of the form's entry list?"
  back: "Disabled controls, controls with no `name` or an empty one, unchecked checkboxes and radios, and buttons other than the submitter."
  question: html-and-css/forms-dialog-popover/form-submission
- id: checkbox-no-value-on
  front: "What does a checked checkbox with no `value` attribute submit?"
  back: "`on`. A `select` sends each selected option."
  question: html-and-css/forms-dialog-popover/form-submission
- id: formdata-event
  front: "What is the `formdata` event for?"
  back: "It fires after the entry list is built, so script can add entries."
  question: html-and-css/forms-dialog-popover/form-submission
- id: get-replaces-query
  front: "What happens to a query string in a GET form's `action`, like `/search?lang=en`?"
  back: "The form's entries replace the whole query, so `lang` is not sent."
  question: html-and-css/forms-dialog-popover/form-submission
- id: post-enctypes
  front: "Which three `enctype` values can a POST form use, and which is the default?"
  back: "`application/x-www-form-urlencoded` (default), `multipart/form-data` and `text/plain`."
  question: html-and-css/forms-dialog-popover/form-submission
- id: file-upload-enctype
  front: "What is sent for a file input without `enctype=\"multipart/form-data\"`?"
  back: "Only the file's name. Only multipart sends file contents."
  question: html-and-css/forms-dialog-popover/form-submission
- id: method-dialog-submit
  front: "What does a form with `method=\"dialog\"` do on submit?"
  back: "It sends nothing and closes the enclosing `<dialog>`."
  question: html-and-css/forms-dialog-popover/form-submission
- id: submit-vs-requestsubmit
  front: "How do `form.submit()` and `form.requestSubmit()` differ?"
  back: "`submit()` skips validation and the `submit` event, so listeners don't run. `requestSubmit(submitter)` runs everything exactly like a click, and throws a `TypeError` if the argument isn't a submit button."
  question: html-and-css/forms-dialog-popover/form-submission
- id: formdata-submitter-arg
  front: "How do you keep the clicked button's `name` and `value` when building `FormData` in a `submit` handler?"
  back: "Pass the submitter: `new FormData(form, event.submitter)`. It shipped in Chrome 112, Firefox 111 and Safari 16.4."
  question: html-and-css/forms-dialog-popover/form-submission
- id: disabled-vs-readonly-submit
  front: "How do you show a value the user can't edit but still submit it?"
  back: "Use `readonly` on inputs and textareas. It doesn't apply to `select` or checkboxes, so pair those with a hidden input. Disabled controls are skipped by definition."
  question: html-and-css/forms-dialog-popover/form-submission
- id: enter-implicit-submission
  front: "When does pressing Enter in a text field submit a form?"
  back: "Enter clicks the form's default button, its first submit button in tree order; if that is disabled, nothing happens. With no submit button, the form submits only if it has at most one blocking field."
  question: html-and-css/forms-dialog-popover/form-submission
- id: implicit-submit-no-button-submitter
  front: "What is `event.submitter` when Enter submits a form that has one text field and no button?"
  back: "`null`. With two or more fields that block implicit submission, nothing happens. Chrome 155 and Firefox 158 matched this."
  question: html-and-css/forms-dialog-popover/form-submission
- id: text-plain-enctype
  front: "Why is `text/plain` encoding rarely useful?"
  back: "It writes `name=value` lines with no escaping, so a name containing `=` or a value containing a line break can't be parsed back reliably. The standard says it's meant for humans to read."
  question: html-and-css/forms-dialog-popover/form-submission
- id: submit-reentry-flags
  front: "How does the submit algorithm stop a `submit` listener calling `requestSubmit()` from starting a second submission?"
  back: "A *firing submission events* flag guards against re-entry; a *constructing entry list* flag does the same for `formdata` listeners."
  question: html-and-css/forms-dialog-popover/form-submission
- id: submit-marks-user-validity
  front: "Why does `:user-invalid` start matching after a failed submit?"
  back: "Before validating, the submit algorithm marks every control's user validity true."
  question: html-and-css/forms-dialog-popover/form-submission
- id: submit-planned-navigation
  front: "What happens if you call `requestSubmit()` twice in the same task?"
  back: "One request, carrying the second call's data. Navigation is queued as a task, and a second submission of the same form before it runs removes the first. Both browsers did this."
  question: html-and-css/forms-dialog-popover/form-submission
- id: image-button-coordinates
  front: "What does an image submit button send?"
  back: "Its click coordinates as `name.x` and `name.y`."
  question: html-and-css/forms-dialog-popover/form-submission
- id: empty-file-multipart
  front: "What does an empty file input send in a multipart form?"
  back: "Still a part, with `filename=\"\"` and type `application/octet-stream`."
  question: html-and-css/forms-dialog-popover/form-submission
- id: charset-hidden-input
  front: "What does `<input type=\"hidden\" name=\"_charset_\">` submit?"
  back: "The name of the encoding used as its value. `accept-charset` picks the encoding; without it the document's encoding is used."
  question: html-and-css/forms-dialog-popover/form-submission
- id: form-linebreaks-crlf
  front: "How are line breaks in form names and values encoded?"
  back: "Normalised to CRLF before encoding."
  question: html-and-css/forms-dialog-popover/form-submission
- id: fetch-formdata-body-encoding
  front: "What content type does `fetch` send with a `FormData` body versus `new URLSearchParams(data)`?"
  back: "`FormData` sends `multipart/form-data`, unlike a plain POST form. Wrapping it in `URLSearchParams` sent `application/x-www-form-urlencoded;charset=UTF-8` in both browsers."
  question: html-and-css/forms-dialog-popover/form-submission
- id: get-vs-post-tradeoff
  front: "What are the trade-offs of GET versus POST form submission?"
  back: "GET is shareable, bookmarkable and cacheable but visible in history, server logs and the next page's `Referer`; use it for searches and filters. POST keeps data out of the URL and suits anything that changes state."
  question: html-and-css/forms-dialog-popover/form-submission
- id: type-sanitisation
  front: "What does the input `type` define beyond the widget?"
  back: "Its value sanitisation algorithm and its own validity checks. An unknown type falls back to `text`."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: number-sanitisation
  front: "What does `type=\"number\"` do with a value that isn't a valid floating-point number?"
  back: "`value` becomes `\"\"`. For example `\"12abc\"` and `\"1,5\"` are emptied, since the decimal separator is always `.`; `\"1e3\"` is kept and `valueAsNumber` is `1000`."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: email-trim
  front: "What does `type=\"email\"` do to surrounding whitespace?"
  back: "It strips it from `value`. `email` and `url` flag malformed values as a type mismatch."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: tel-search-like-text
  front: "Does `type=\"tel\"` validate phone numbers?"
  back: "No. `tel` and `search` behave like `text`; there is no format check because phone formats vary."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: number-only-quantities
  front: "When should you use `type=\"number\"`?"
  back: "Only for quantities. The standard's test is whether up and down arrows would make sense; for card numbers or postal codes they don't, so use `text`."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: number-for-card-pitfall
  front: "What goes wrong with `type=\"number\"` for card numbers or postal codes?"
  back: "It accepts `1e3`, offers a spinner, and `valueAsNumber` turns `\"02134\"` into `2134`."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: inputmode-purpose
  front: "What does `inputmode` do, and what doesn't it do?"
  back: "It picks the virtual keyboard only. It doesn't validate or sanitise; `pattern` or script has to restrict input. Values: `none`, `text`, `decimal`, `numeric`, `tel`, `email`, `url`, `search`."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: enterkeyhint
  front: "What does `enterkeyhint` do?"
  back: "It labels the Enter key on virtual keyboards: `enter`, `done`, `go`, `next`, `previous`, `search` or `send`."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: card-number-recipe
  front: "How do you mark up a card number field?"
  back: "`type=\"text\"` with `inputmode=\"numeric\"` and `autocomplete=\"cc-number\"`, not `type=\"number\"`. Add `pattern=\"[0-9]*\"` for validation."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: autocomplete-token-order
  front: "What is the structure of an `autocomplete` token list?"
  back: "An optional `section-*` group, an optional `shipping` or `billing`, then a field name such as `email`, `street-address`, `postal-code`, `cc-number` or `one-time-code`. A trailing `webauthn` offers saved passkeys."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: autocomplete-off-form-default
  front: "What does `autocomplete=\"off\"` mean, and what does a control without the attribute use?"
  back: "`off` marks a value as sensitive or never reused. A control without the attribute takes its form's `on` or `off` state."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: autocomplete-invalid-token
  front: "What does the IDL `autocomplete` return for an invented token like `autocomplete=\"nope\"`?"
  back: "`\"\"` in both Chrome 155 and Firefox 158, so the browser treats it as no valid value. Use `off` or a real field name."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: autocomplete-idl-lowercase
  front: "What does the `autocomplete` IDL property return for `autocomplete=\"Shipping Postal-Code\"`?"
  back: "`shipping postal-code`: the valid tokens, lower-cased."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: number-badinput-browsers
  front: "How do Chrome 155 and Firefox 158 differ for letters typed into a number field?"
  back: "Firefox kept the typed letters and set `validity.badInput`; Chrome dropped the letters as they were typed. When the text isn't a number, `value` is `\"\"`."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: email-a-at-b
  front: "Why does `type=\"email\"` accept `a@b`?"
  back: "The standard's valid-email grammar requires an `@` with text on both sides, but the domain needs no dot, so intranet addresses pass. `ab` is a type mismatch. Real checks belong on the server."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: new-vs-current-password
  front: "What is the difference between `current-password` and `new-password`?"
  back: "`current-password` is the password for the account in the username field, as when logging in; `new-password` is one being created or changed. A password manager fills a saved password into one and not the other."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: form-autocomplete-idl
  front: "What does `autocomplete` on `<form>` set, and what does an input's IDL property report?"
  back: "It sets the default for controls without their own `autocomplete`. The control's IDL property reflects only its own attribute: an input in `<form autocomplete=\"off\">` reported `\"\"`."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: pattern-vs-inputmode-space
  front: "Did `inputmode` change the value or validity of `4242 4242` typed in a `cc-number` field with `pattern=\"[0-9]*\"`?"
  back: "No. `inputmode` left `value` untouched; only `pattern` caught the space, giving `patternMismatch` true."
  question: html-and-css/forms-dialog-popover/input-types-and-autofill
- id: button-type-keywords
  front: "What are a button's `type` keywords, and what is a missing or invalid value?"
  back: "`submit`, `reset` and `button`. A missing or invalid value is the Auto state, which is a submit button unless it has `command` or `commandfor`."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: button-default-submit-reason
  front: "Why does `<button>Save</button>` in a form submit it?"
  back: "Submitting is the historical default, kept for compatibility. Always write `type`; `type=\"button\"` does nothing by default and `type=\"reset\"` restores every control to its default value."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: form-owner-definition
  front: "What is a control's form owner?"
  back: "Its nearest ancestor `<form>`, unless it has a `form` attribute naming a form by `id` anywhere in the same document. `element.form` returns it."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: form-attribute-elements
  front: "Does `form.elements` include controls attached with the `form` attribute?"
  back: "Yes. That lets a button or input sit outside the form's markup, for example in a sticky footer."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: forms-cannot-nest
  front: "What does the parser do with a `<form>` start tag inside another form?"
  back: "It ignores it. Forms can't nest."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: form-override-attributes
  front: "Which attributes let a submit button override the form for its own submissions?"
  back: "`formaction`, `formmethod`, `formenctype`, `formtarget` and `formnovalidate`. They apply to `<button>` and `<input type=\"submit\">` or `\"image\"` submit buttons."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: form-override-non-submit
  front: "What happens with `formaction` on a `type=\"button\"` or `type=\"reset\"` button?"
  back: "Nothing changes. These attributes apply only to submit buttons."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: button-name-value-clicked-only
  front: "Which button's `name` and `value` are sent on submit?"
  back: "Only the button that was clicked, so one form can offer Save draft and Publish with different endpoints and rules."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: popovertarget-in-form
  front: "What happens to a type-less button with `popovertarget` inside a form?"
  back: "It is a submit button, so it submits and the popover doesn't open. Add `type=\"button\"`."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: commandfor-in-form
  front: "What happens to a type-less button with `commandfor` inside a form?"
  back: "Nothing at all: the standard returns early for Auto buttons that have a form owner. Chrome 155 logs a console warning."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: button-type-idl
  front: "What does `button.type` return for a button without the attribute?"
  back: "`\"submit\"` if it is a submit button, otherwise `\"button\"`. A type-less button with `commandfor` reported `\"button\"` even in a form; one with only `popovertarget` reported `\"submit\"`."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: button-vs-input-submit
  front: "How do `<button>` and `<input type=\"submit\">` differ?"
  back: "Submission behaviour is the same. `<input>`'s `value` is both its label and the value sent; `<button>` can contain markup such as an icon and keeps its label separate from its `value`."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: destructive-first-button
  front: "Why avoid ordering a destructive submit button first in a form?"
  back: "Pressing Enter in a field clicks the form's first submit button in tree order."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: invoker-commands-support
  front: "In which browser versions did `command` and `commandfor` ship?"
  back: "Chrome 135, Firefox 144 and Safari 26.2."
  question: html-and-css/forms-dialog-popover/button-types-and-form-owner
- id: candidate-for-validation
  front: "Which controls are candidates for constraint validation?"
  back: "Submittable controls that aren't barred: disabled, `readonly`, hidden inputs and non-submit buttons are barred. `willValidate` tells you which."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: validitystate-flags
  front: "Which `ValidityState` flags do `required`, `type`, `pattern`, `maxlength` and `min`/`max`/`step` set?"
  back: "`valueMissing` (`required`), `typeMismatch` (`email`, `url`), `patternMismatch`, `tooLong` and `tooShort`, `rangeUnderflow`, `rangeOverflow` and `stepMismatch`."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: badinput-flag
  front: "What does the `badInput` validity flag mean?"
  back: "The user entered text the browser can't convert, such as letters in a number field."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: checkvalidity-vs-reportvalidity
  front: "How do `checkValidity()` and `reportValidity()` differ?"
  back: "Both fire a cancelable, non-bubbling `invalid` event at each failing control. `reportValidity()` also shows the browser's message for a control whose event wasn't cancelled; both browsers focused the first such control."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: invalid-event-bubbles
  front: "Why must a form-level `invalid` listener use `capture: true`?"
  back: "The `invalid` event doesn't bubble."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: invalid-blocks-submit
  front: "What happens when you submit a form with an invalid control?"
  back: "The interactive validation runs: no `submit` event fires and nothing is sent."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: setcustomvalidity-persists
  front: "How long does `setCustomValidity(message)` last?"
  back: "Until you call `setCustomValidity(\"\")`, the only way to clear it. Set once and never cleared, the field stays invalid and the form can't be submitted."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: custom-error-ui
  front: "How do you replace the browser's validation bubble with your own error UI?"
  back: "Listen for `invalid` in the capture phase, call `preventDefault()` to suppress the bubble, and render `validationMessage` yourself."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: user-invalid-vs-invalid
  front: "Why style `:user-invalid` instead of `:invalid`?"
  back: "`:invalid` matches from page load, so empty required fields look wrong before anyone touches them. `:user-invalid` matches only after the user has changed and left the field, or tried to submit."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: user-invalid-script-value
  front: "Does a script-set value turn on `:user-invalid`?"
  back: "No. User validity becomes true on a committed user change, on blur after a user change, on a `<select>` selection change, and for every control when submission is attempted. Resetting the form clears it."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: validation-server-too
  front: "Is native constraint validation enough on its own?"
  back: "No. It is a usability layer only; the server must still validate."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: pattern-anchored-v-flag
  front: "How is the `pattern` attribute compiled?"
  back: "With the `v` flag and anchored as `^(?:pattern)$`, so `[0-9]{3}` fails for `1234`. A pattern like `[\\w-]+` is a syntax error in `v` mode (the `-` needs escaping) and the control then has no pattern constraint at all."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: maxlength-script-value
  front: "Does setting `value` from script longer than `maxlength` make the field invalid?"
  back: "No. `tooLong` and `tooShort` apply only when the value was last changed by a user edit. After `max.value = \"abcdef\"` on a `maxlength=\"3\"` input, `tooLong` was `false` in both browsers."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: disabled-field-validation
  front: "Do disabled fields block form submission?"
  back: "No. They are barred from constraint validation (`willValidate` is `false`) and left out of submitted data. Some flags are still computed, but `required` never flags one because it needs a mutable field."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: validation-message-browsers
  front: "What is `validationMessage`, and do browsers word it the same?"
  back: "Your custom message if set, otherwise the browser's localised string. For an empty required field Chrome 155 returned \"Please fill in this field.\" and Firefox 158 \"Please fill out this field.\""
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: static-vs-interactive-validation
  front: "What is the difference between statically and interactively validating a form?"
  back: "Static validation collects failing controls and fires `invalid` at each; `checkValidity()` stops there. Interactive also reports the problem for at least one unhandled control and may focus it; `reportValidity()` and submission use it."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: all-invalid-cancelled-focus
  front: "What happens when every `invalid` event is cancelled on submit?"
  back: "Submission is still blocked, but the browser has nothing to report, so it doesn't move focus. In both browsers focus stayed on the clicked button; your handler must focus the first invalid field."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: required-radio-group
  front: "How does `required` work on radio buttons?"
  back: "It applies to the whole group: one checked radio in the group satisfies every member."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: custom-elements-validity
  front: "How do custom elements take part in constraint validation?"
  back: "Through `ElementInternals.setValidity()`, which sets the same flags."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: novalidate-tradeoff
  front: "What does `novalidate` keep and remove?"
  back: "It turns off the automatic check on submit while keeping the whole API, which suits forms that call `reportValidity()` or run their own checks before sending with `fetch`."
  question: html-and-css/forms-dialog-popover/constraint-validation
- id: dialog-hidden-until-open
  front: "When is a `<dialog>` visible?"
  back: "Only while it has the `open` attribute. Don't remove `open` by hand: no `close` event fires and a modal dialog leaves the page blocked."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: show-vs-showmodal
  front: "How do `show()` and `showModal()` differ?"
  back: "`show()` opens non-modally: the page stays interactive and Escape doesn't close it by default. `showModal()` puts it in the top layer with a `::backdrop`, makes the rest of the document inert, lets Escape close it, and matches `:modal`."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: dialog-focus-handling
  front: "Where does focus go when a dialog opens and closes?"
  back: "Into the dialog (its `autofocus` descendant, otherwise its first focusable element). Closing returns focus to whatever had it before."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: close-vs-requestclose
  front: "How do `close(value)` and `requestClose(value)` differ?"
  back: "`close()` closes immediately. `requestClose()` first fires a cancelable `cancel` event, exactly as Escape does, so one `cancel` handler covers every route. It shipped in Chrome 134, Firefox 139 and Safari 18.4."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: method-dialog-returnvalue
  front: "What does a `<form method=\"dialog\">` inside a dialog do?"
  back: "On submit it closes the dialog instead of sending a request, and the submit button's `value` becomes `returnValue`. Validation still runs first."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: returnvalue-persistence
  front: "When is `returnValue` updated, and is it reset on reopening?"
  back: "Only when a value is given, and it isn't reset when the dialog reopens, so reset it yourself before `showModal()`."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: dialog-close-event-timing
  front: "When does the dialog's `close` event fire?"
  back: "As a separate queued task after closing, so `open` is already `false` and code after `close()` sees that before any `close` listener runs."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: closedby-values
  front: "What do the `closedby` values mean?"
  back: "`any`: Escape or a click outside. `closerequest`: Escape only, the modal default. `none`: the non-modal default. `requestClose()` ignores it. Chrome 134 and Firefox 141 support it; Safari doesn't yet."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: dialog-invoker-commands
  front: "Which `command` values drive a dialog without script?"
  back: "With `commandfor=\"id\"`: `show-modal`, `close` and `request-close`. Chrome 135, Firefox 144 and Safari 26.2."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: returnvalue-no-value-button
  front: "What happens to `returnValue` when a `method=\"dialog\"` button has no `value`?"
  back: "The standard leaves it unchanged. Chrome 155 kept the previous value; Firefox 158 set it to `\"\"`. Give every closing button a `value`."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: escape-returnvalue-browsers
  front: "What does `returnValue` read after Escape closes a dialog that earlier returned `\"delete\"`?"
  back: "Firefox 158 still reads `\"delete\"`, as the standard says. Chrome 155 sets it to `\"\"` on Escape, but keeps it for `requestClose()` and light dismiss."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: close-no-argument-returnvalue
  front: "What do `close()` and `requestClose()` with no argument do to `returnValue`?"
  back: "Keep the previous value in both browsers."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: dialog-cancel-button-formnovalidate
  front: "Why might Cancel fail to close a `method=\"dialog\"` form containing a `required` field?"
  back: "Submission validates first. Add `formnovalidate` to the Cancel button."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: showmodal-scroll
  front: "Does `showModal()` stop the page scrolling behind it?"
  back: "No. Inert stops interaction, not scrolling; both browsers scrolled the page on a wheel event. Use `html:has(dialog:modal) { overflow: hidden; }`, which kept `scrollY` at 0."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: cancel-preventdefault-trap
  front: "Can `cancel.preventDefault()` trap the user in a dialog?"
  back: "Not for long. The standard allows preventing an Escape close only while the page has history-action user activation, so a second Escape with no click in between closes it anyway. Firefox 158 did this."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: showmodal-invalidstate
  front: "When does `showModal()` throw an `InvalidStateError`?"
  back: "If the dialog was opened with `show()`, isn't connected, or is an open popover. On a dialog that's already modal it does nothing. `show()` on a modal dialog also throws."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: modal-dialog-steps
  front: "What does `showModal()` do in order?"
  back: "Fires a cancelable `beforetoggle`, adds `open`, makes everything outside inert, adds the dialog to the top layer, remembers the focused element, hides unrelated open popovers, and runs the dialog focusing steps."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: close-watcher
  front: "Which inputs go through a close watcher for a dialog?"
  back: "Escape, the Android back gesture and `requestClose()`. It fires `cancel`; if not cancelled, the dialog closes. `closedby=\"any\"` adds light dismiss through the same path."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: show-nonmodal-top-layer
  front: "Does a non-modal dialog opened with `show()` use the top layer?"
  back: "No. It stacks and clips like any element."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: dialog-vs-handbuilt-modal
  front: "What does a modal `<dialog>` give you over a hand-built modal, and what do you still own?"
  back: "Top layer instead of `z-index` battles, native inertness instead of a focus trap, Escape handling and focus return. You still own scroll locking, enter and exit animations, and initial focus via `autofocus`."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: dialog-method-dialog-image-coords
  front: "What `returnValue` does an image button supply in a `method=\"dialog\"` form?"
  back: "Its click coordinates as `\"x,y\"`."
  question: html-and-css/forms-dialog-popover/dialog-element
- id: popover-global-attribute
  front: "What does the `popover` attribute do to any element?"
  back: "The element is hidden until shown, then rendered in the top layer, above all `z-index` stacking and outside any `overflow` clipping."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-show-ways
  front: "How can a popover be shown and hidden?"
  back: "From a button with `popovertarget` (`popovertargetaction` is `show`, `hide` or the default `toggle`), or with `showPopover()`, `hidePopover()` and `togglePopover()`."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-state-hooks
  front: "How do you detect and observe an open popover?"
  back: "`:popover-open` matches while it's shown. `beforetoggle` and `toggle` events report `oldState` and `newState`."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-auto
  front: "How does `popover=\"auto\"` behave?"
  back: "Light dismiss: a click outside or Escape closes it. Opening one closes every other open `auto` popover that isn't its ancestor, so menus and submenus work. A bare `popover` is `auto`."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-manual
  front: "How does `popover=\"manual\"` behave, and what does an invalid value mean?"
  back: "No light dismiss, no Escape, and it closes nothing else; use it for toasts. Any invalid value means `manual`, so `popover=\"atuo\"` silently loses light dismiss."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-hint
  front: "How does `popover=\"hint\"` differ from `auto`?"
  back: "Light dismiss like `auto`, but opening it closes only other hints, not `auto` popovers. It's meant for tooltips. Chrome 151 and Firefox 153 support it; Safari doesn't yet."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-vs-dialog-modality
  front: "How does a popover differ from a modal `<dialog>` for the page and focus?"
  back: "A popover is never modal: the page stays clickable and focus stays put, with its contents following the opener in tab order. `showModal()` makes the page inert and moves focus inside."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-no-role
  front: "Does a popover have its own role or return value?"
  back: "No. It has no role, no `returnValue` and no `method=\"dialog\"`; it's behaviour added to an element that keeps its own semantics."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-when-to-use
  front: "When use `showModal()` versus `popover`?"
  back: "`showModal()` for anything that must block the page until answered. `popover` for menus, pickers, tooltips and toasts."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: dialog-popover-open-state
  front: "What does `<dialog popover>` give, and how do you check it's open?"
  back: "A non-modal dialog with light dismiss. Its `open` stays `false`, so check `:popover-open`."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-outside-click
  front: "Does a click outside a popover reach its target?"
  back: "Yes. It reaches its target and light-dismisses the popover; both browsers fired the outside button's `click` handler while closing it."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: showpopover-errors
  front: "What does `showPopover()` do on an element without the attribute, and on an open popover?"
  back: "It throws `NotSupportedError` without the attribute and does nothing on an already-open popover."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-positioning
  front: "How is a popover positioned by default, and how do you anchor it to its button?"
  back: "It is `position: fixed`, centred by `inset: 0; margin: auto`. Anchoring is a CSS job, done with anchor positioning or script."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-beforetoggle-cancel
  front: "Can `beforetoggle` stop a popover from opening or closing?"
  back: "It is cancelable when opening. When closing `cancelable` was `false` in both browsers, so a light dismiss can't be refused."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-invoker-commands
  front: "Which `command` values toggle popovers?"
  back: "With `commandfor=\"id\"`: `toggle-popover`, `show-popover` and `hide-popover`. The same pair also drives dialogs and custom `--commands`. Chrome 135, Firefox 144, Safari 26.2."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-nested-escape
  front: "Which popover does Escape close when a popover was opened from inside another?"
  back: "Only the topmost one. The outer popover stays open because it is an ancestor of the inner one."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: popover-auto-closes-hints
  front: "After showing an `auto` popover a, a hint b, then an unrelated `auto` popover c, which are open?"
  back: "Only c. Showing the hint leaves a open, but an unrelated `auto` popover closes every other open `auto` popover and every open hint."
  question: html-and-css/forms-dialog-popover/popover-attribute
- id: details-structure
  front: "How is `<details>` structured?"
  back: "A disclosure widget that works without script. Its first `<summary>` child is the label and toggle; everything else is content, shown only while the boolean `open` attribute is present."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-no-summary
  front: "What label does a `<details>` without a `<summary>` get?"
  back: "The browser supplies its own; the standard's example is \"Details\"."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: summary-toggle-input
  front: "How can a user or script toggle `<details>`?"
  back: "Click, Enter or Space on the focusable summary toggles `open`. Script can set `details.open = true`."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-toggle-event
  front: "What are the traits of the `toggle` event on `<details>`?"
  back: "It carries `oldState` and `newState`, fires on the `<details>`, and doesn't bubble, so delegate with a capture listener. Changes made in one task are coalesced into one event."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-marker-css
  front: "How is the `<details>` marker drawn and removed?"
  back: "The summary is `display: list-item` with `list-style-type: disclosure-closed` or `disclosure-open`. `summary { list-style: none }` removes it and `::marker` styles it."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-content-slot
  front: "How is closed `<details>` content hidden, and what styles it?"
  back: "It sits in a slot hidden with `content-visibility: hidden`, which the `::details-content` pseudo-element can style."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-fragment-find
  front: "What opens a closed `<details>` without a click?"
  back: "Navigating to a fragment inside it, and find-in-page in supporting browsers (Chrome 97, Firefox 148; Safari partly)."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-name-group
  front: "How do you make an exclusive accordion with `<details>`?"
  back: "Give several `<details>` the same `name` so they form a details name group; opening one closes the others. Members need the same `name` in the same tree, not to be siblings."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-group-enforcement
  front: "Where is details name group exclusivity enforced?"
  back: "On user toggles, on `open = true` from script, and while parsing, where a second `open` member is closed. Closing the open one is allowed, so the group can be fully collapsed."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-use-cases
  front: "What is `<details>` for, and not for?"
  back: "Show-more content, FAQs and filters. The standard rules it out for tabs and menus, which are different widgets."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-second-summary
  front: "What happens to a second `<summary>` in a `<details>`?"
  back: "Only the first `summary` child is the toggle; any other is part of the content and hidden while closed."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-parse-toggle
  front: "What `toggle` event fires when a group member is opened then closed during parsing?"
  back: "One with `oldState` and `newState` both `\"closed\"`, because the two changes were coalesced."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-exclusive-warning
  front: "What does the standard warn about exclusive details groups?"
  back: "Don't use them for content people compare, since they force opening items one at a time."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-animate
  front: "How do you animate opening and closing `<details>`?"
  back: "Target the content with `::details-content` (Chrome 131, Firefox 143, Safari 18.4) and transition it there. Without it the content slot can't be selected."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-closed-content-in-dom
  front: "Is closed `<details>` content in the DOM and readable by script?"
  back: "Yes. It's only skipped for rendering: `checkVisibility()` returned `false` for a paragraph in it in both browsers, but `textContent` and `querySelector` still see it."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-vs-popover
  front: "`<details>` or `popover` for a dropdown?"
  back: "`<details>` pushes content down in the flow and stays open until toggled. A popover floats in the top layer and light-dismisses, which suits menus and pickers."
  question: html-and-css/forms-dialog-popover/details-and-summary
- id: details-open-sync-exclusive
  front: "With `a` (open) and `b` in group `g` and `c` open in group `h`, what are `open` states after `b.open = true`?"
  back: "`a` false, `b` true, `c` true. Opening `b` closes `a` synchronously; `c` is in a different group."
  question: html-and-css/forms-dialog-popover/details-and-summary

# 03 The cascade
- id: cascade-per-property
  front: "At what granularity does the cascade run, and what does it produce?"
  back: "Per property, per element. It collects every applying declaration, sorts them, and the first becomes the cascaded value. Invalid declarations are dropped before the cascade sees them."
  question: html-and-css/the-cascade/cascade-sort-order
- id: cascade-criteria-order
  front: "In what order does the cascade apply its sort criteria?"
  back: "Origin and importance, shadow-tree context, element-attached `style`, layers, specificity, scope proximity, then order of appearance."
  question: html-and-css/the-cascade/cascade-sort-order
- id: cascade-lexicographic
  front: "When does a later cascade criterion matter?"
  back: "Only when every earlier one ties, like sorting strings. Specificity is compared only between declarations with the same origin, context, attachment and layer."
  question: html-and-css/the-cascade/cascade-sort-order
- id: cascade-origin-order
  front: "What is the origin and importance order, strongest first?"
  back: "Transitions, important UA, important user, important author, animations, normal author, normal user, normal UA."
  question: html-and-css/the-cascade/cascade-sort-order
- id: cascade-context-shadow
  front: "How does the context step resolve shadow tree conflicts?"
  back: "For normal declarations the outer context wins; for `!important` the inner (shadow) one wins. A component's normal styles are overridable defaults; its important ones are requirements."
  question: html-and-css/the-cascade/cascade-sort-order
- id: style-attribute-beats-selectors
  front: "Where does the `style` attribute sit in the cascade?"
  back: "It beats any selector-based declaration of the same importance, whatever its specificity. The step comes before layers, so inline styles are not in any layer."
  question: html-and-css/the-cascade/cascade-sort-order
- id: unlayered-beats-layers
  front: "How do unlayered styles rank against layered ones for normal declarations?"
  back: "Unlayered styles form an implicit last layer, so they beat every named layer. An ID selector in `@layer base` loses to a bare unlayered `h1`."
  question: html-and-css/the-cascade/cascade-sort-order
- id: cascade-longhands
  front: "Does the cascade work on shorthands or longhands?"
  back: "Longhands. `margin: 0` becomes `margin-top` and so on, each cascading on its own with its rule's specificity. A later shorthand doesn't reset a more specific earlier longhand."
  question: html-and-css/the-cascade/cascade-sort-order
- id: no-cascaded-value
  front: "What happens when no declaration applies to a property?"
  back: "There is no cascaded value. Defaulting then fills in an inherited or initial value."
  question: html-and-css/the-cascade/cascade-sort-order
- id: invalid-declaration-no-fallthrough
  front: "Does an invalid value like `color: bluish` fall through to a previous value in the same rule?"
  back: "No. It is dropped at parse time and the next-best declaration from any rule wins."
  question: html-and-css/the-cascade/cascade-sort-order
- id: important-not-specificity
  front: "Does `!important` add specificity?"
  back: "No. It moves the declaration to a different origin band, where layer order is reversed."
  question: html-and-css/the-cascade/cascade-sort-order
- id: presentational-hints-origin
  front: "Where do presentational attributes like `<font color>` or `bgcolor` fit in the cascade?"
  back: "In an author presentational hint origin between user and author. Any author rule beats them, even `*`: `* { color: blue }` overrode `<font color=\"red\">` in Chrome 155 and Firefox 158."
  question: html-and-css/the-cascade/cascade-sort-order
- id: scope-proximity-after-specificity
  front: "Does scope proximity beat specificity?"
  back: "No. It comes after specificity in the Level 6 draft, so a more specific rule from a farther `@scope` root still wins; proximity only breaks ties. @scope shipped in Chrome 118, Safari 17.4, Firefox 146."
  question: html-and-css/the-cascade/cascade-sort-order
- id: scope-proximity-definition
  front: "What does scope proximity compare?"
  back: "The number of generational or sibling hops between each `@scope` root and the element; rules without a scope root count as infinitely far. With equal selectors the nearer root won in both browsers, regardless of source order."
  question: html-and-css/the-cascade/cascade-sort-order
- id: stylesheet-order-appearance
  front: "How is order of appearance computed across style sheets?"
  back: "Linked sheets are concatenated in link order, `@import`ed sheets count as pasted in place of their rule, and `style` attributes come after every style sheet, in element document order."
  question: html-and-css/the-cascade/cascade-sort-order
- id: inline-important-beats-layered
  front: "Does inline `!important` beat an unlayered `!important` ID rule?"
  back: "Yes. Element attachment is compared before layers, so `style=\"color: green !important\"` beat an unlayered `#d { color: red !important }` in both browsers."
  question: html-and-css/the-cascade/cascade-sort-order
- id: transition-animation-position
  front: "Where do animations and transitions sit in the origin order?"
  back: "Animations are above all normal declarations but below every `!important` one. A running transition beats everything."
  question: html-and-css/the-cascade/cascade-sort-order
- id: cascade-debug-walk
  front: "How should you debug why a rule doesn't apply?"
  back: "Walk the criteria in order: transition or animation, `!important`, inline, layers, and only then specificity and source order."
  question: html-and-css/the-cascade/cascade-sort-order
- id: cascade-filtering
  front: "What does filtering do before the cascade sorts?"
  back: "It keeps declarations whose style sheet applies, whose conditional rules (`@media`, `@supports`) are true, whose selector matches and whose syntax is valid. These are the declared values."
  question: html-and-css/the-cascade/cascade-sort-order
- id: cascade-coarse-vs-fine-controls
  front: "What is the modern guidance for resolving cascade conflicts?"
  back: "Resolve conflicts with layers and keep selectors flat, using `!important` only for values that must never be overridden. Specificity couples conflict resolution to selector shape, so refactors can change winners."
  question: html-and-css/the-cascade/cascade-sort-order
- id: specificity-triple
  front: "What do the A, B and C of specificity count?"
  back: "A counts ID selectors. B counts class selectors, attribute selectors and pseudo-classes. C counts type selectors and pseudo-elements."
  question: html-and-css/the-cascade/specificity
- id: specificity-comparison
  front: "How are specificity triples compared?"
  back: "A first, then B, then C, one component at a time with no carrying. `#a` (1,0,0) beats eleven classes (0,11,0)."
  question: html-and-css/the-cascade/specificity
- id: specificity-zero-contributors
  front: "What do `*` and combinators add to specificity?"
  back: "Nothing. `* > p` and `p` are both (0,0,1), and the later rule wins a tie."
  question: html-and-css/the-cascade/specificity
- id: specificity-repeated-selector
  front: "Does repeating a selector add specificity?"
  back: "Yes. `.btn.btn` is (0,2,0). It is a legal way to add weight but hides intent; a layer says it more clearly."
  question: html-and-css/the-cascade/specificity
- id: is-not-has-specificity
  front: "What specificity do `:is()`, `:not()` and `:has()` have?"
  back: "That of the most specific selector in their argument, whichever one matched. `:is(#nav, .menu) a` is (1,0,1) even on an element matching only `.menu`."
  question: html-and-css/the-cascade/specificity
- id: where-zero-specificity
  front: "What specificity does `:where()` have?"
  back: "Always (0,0,0), whatever it contains. That makes it the tool for overridable defaults."
  question: html-and-css/the-cascade/specificity
- id: nth-child-of-specificity
  front: "What specificity does `:nth-child(An+B of S)` have?"
  back: "One pseudo-class plus the most specific selector in `S`. For example `:nth-child(even of li, .item)` is (0,2,0)."
  question: html-and-css/the-cascade/specificity
- id: selector-list-specificity
  front: "How does a selector list on a rule differ from `:is()` for specificity?"
  back: "In a list like `#x, p`, each element gets the specificity of the most specific selector that matched it, so a `<p>` gets (0,0,1). Rewritten as `:is(#x, p)`, it is (1,0,0)."
  question: html-and-css/the-cascade/specificity
- id: style-attr-not-specificity
  front: "Is the `style` attribute compared by specificity?"
  back: "No. The 2013 CSS Style Attributes spec phrased it as higher than any selector; Cascade Level 5 makes it a separate step, element-attached styles, decided before layers and specificity."
  question: html-and-css/the-cascade/specificity
- id: specificity-only-ties
  front: "When does specificity actually decide a conflict?"
  back: "Only as a tie-breaker. A later layer, an `!important` declaration or a different origin wins without specificity being looked at."
  question: html-and-css/the-cascade/specificity
- id: not-counts-specificity
  front: "What is the specificity of `p:not(.a)`?"
  back: "(0,1,1), not (0,0,1). `:not()` counts its argument; only `:where()` is free."
  question: html-and-css/the-cascade/specificity
- id: has-specificity-example
  front: "What is the specificity of `:has(.k, #nope)` when only `.k` matches?"
  back: "(1,0,0), from `#nope`. In both browsers it beat a later (0,2,1) rule on the same element."
  question: html-and-css/the-cascade/specificity
- id: has-relative-selector-count
  front: "What specificity does `li:has(> a.active)` have?"
  back: "(0,1,2). `:has()` counts its relative selectors, following the same rule as `:is()` and `:not()`."
  question: html-and-css/the-cascade/specificity
- id: pseudo-element-specificity
  front: "How do pseudo-elements count in specificity?"
  back: "Like type selectors, in C: `a::before` is (0,0,2). Legacy single-colon forms such as `:before` count the same way."
  question: html-and-css/the-cascade/specificity
- id: specificity-clamp-chrome
  front: "How does Chrome 155 handle huge specificity counts?"
  back: "It clamps each component at 255: 256 classes and 255 classes were treated as equal, so the later rule won."
  question: html-and-css/the-cascade/specificity
- id: specificity-clamp-firefox
  front: "How does Firefox 158 handle huge specificity counts?"
  back: "It clamps each component at 1023: 1023 classes beat 1022, but 1024 and 1023 were equal."
  question: html-and-css/the-cascade/specificity
- id: specificity-clamp-component
  front: "Can many classes overflow into the ID component?"
  back: "No. The clamp stays within its component: in both browsers one ID beat 1024 classes. The spec requires clamping, not overflow."
  question: html-and-css/the-cascade/specificity
- id: specificity-equal-looking
  front: "How do `.x.x` and `.x.y` compare in specificity?"
  back: "Both are (0,2,0), so the later rule won in both browsers."
  question: html-and-css/the-cascade/specificity
- id: specificity-not-example
  front: "What is the specificity of `#nav li:not(.active, #x) > a::before`?"
  back: "(2,0,3). A is `#nav` plus `#x`, since `:not()` takes its most specific argument and isn't counted as a pseudo-class; C is `li`, `a` and `::before`."
  question: html-and-css/the-cascade/specificity
- id: where-design-system-defaults
  front: "Why wrap component defaults in `:where()`?"
  back: "Every app selector, even a bare `button`, outranks it, so consumers override without `!important` or doubled classes."
  question: html-and-css/the-cascade/specificity
- id: is-heaviest-argument-trap
  front: "What goes wrong with `:is(h1, h2, #content h3)` in a reset?"
  back: "It gives every heading (1,0,1), because `:is()` takes its heaviest argument, so later utility classes stop working."
  question: html-and-css/the-cascade/specificity
- id: layer-definition
  front: "What is a cascade layer and where does it sit in the cascade?"
  back: "A named bucket of rules inside one origin. It is compared after origin, shadow context and inline styles but before specificity, so a later layer wins even against an ID selector in an earlier one."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-creation-ways
  front: "What are the ways to create cascade layers?"
  back: "`@layer name { … }` puts rules in a layer, `@layer a, b, c;` declares layers and their order, and `@import url(lib.css) layer(vendor);` layers a file. `layer` without a name makes an anonymous one."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-order-first-appearance
  front: "What determines layer order?"
  back: "The order of first appearance. Fix it up front with `@layer reset, vendor, components;`; later blocks only add rules. After `@layer b {} @layer a {}`, `a` wins even if more `b` rules come later."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-statement-cannot-reorder
  front: "Can a later `@layer base, theme;` statement reorder a layer already opened as `theme`?"
  back: "No. `theme` first appears earlier, so the statement only adds `base` after it. The order is `theme`, `base`, so `base`'s `p` beats `theme`'s `#intro` despite the ID."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-unlayered-gotcha
  front: "What risk comes from layering only the third-party CSS?"
  back: "Unlayered rules win over all layers, which is usually the intent, but a stray unlayered reset will beat your component layer."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-nesting
  front: "How do nested layers sort?"
  back: "`@layer framework { @layer base { … } }` or `framework.base`. Nested layers sort inside their parent, and the parent's own rules (outside any child) come after its children."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-important-reversal
  front: "How does layer order work for `!important` declarations?"
  back: "It reverses: an important declaration in the first layer wins. That keeps `!important` meaningful for a reset or vendor layer."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-style-attribute
  front: "Does the `style` attribute lose to layers?"
  back: "No. It is decided before layers, so `style=\"color: green\"` beat `@layer a { #t { color: red } }` in both browsers."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-support
  front: "In which browser versions did `@layer` ship?"
  back: "Chrome 99, Firefox 97 and Safari 15.4."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-names-dotted
  front: "Are `framework.base` and a top-level `base` the same layer?"
  back: "No. Names are dotted paths, so they are different layers, and a nested layer can't refer to layers outside its parent."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-anonymous
  front: "What is an anonymous layer?"
  back: "Each `@layer { }` without a name is a separate layer that nothing else can add to; libraries use it to hide internal ordering. `@import url(lib.css) layer;` also creates one."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-import-before-statement
  front: "What happens to `@import` rules that follow an `@layer` statement?"
  back: "Any `@layer` statement after an `@import` makes the following `@import`s invalid. Both browsers dropped them from `cssRules`."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-link-element
  front: "Can you put `<link>`ed CSS into a layer with an attribute?"
  back: "No; the spec has an open issue for one. Use `@import url(x.css) layer(name);` or wrap the file's contents in `@layer name { … }`."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-in-false-media
  front: "What happens to an `@layer` declared inside a false `@media` or `@supports`?"
  back: "It doesn't take its place in the order. In both browsers `@media (max-width: 1px) { @layer b, a; }` didn't affect how a later `@layer a` and `@layer b` ordered."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-cssom
  front: "How do you read layers from script?"
  back: "`CSSLayerBlockRule.name`, `CSSLayerStatementRule.nameList` and `CSSImportRule.layerName`, which gave `\"vendor\"`, `\"\"` for an anonymous layer and `null` for an unlayered import."
  question: html-and-css/the-cascade/cascade-layers
- id: revert-layer-in-layers
  front: "What does `revert-layer` do?"
  back: "Rolls the property back to what earlier layers would give, as if this layer had no rule for it. With no lower layer in the origin, it acts like `revert`."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-keyframes-collision
  front: "How do layers affect `@keyframes` name collisions?"
  back: "Layers decide them: with `@layer fw, over;`, keyframes named `k` in `over` replaced those in `fw` in both browsers."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-keyword-names
  front: "Are CSS-wide keywords valid layer names?"
  back: "The spec reserves them and makes `@layer initial { }` invalid, but Chrome 155 and Firefox 158 accepted `initial`, `revert` and `unset.foo` and ordered them like any other."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-important-unlayered
  front: "Does an unlayered normal rule beat a layered `!important`?"
  back: "No. `@layer a { p { color: green !important } }` beat an unlayered `#t { color: red }`, because importance is decided at the origin step, before layers."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-limits
  front: "What do layers not help with, and what is a pitfall of layer names?"
  back: "Conflicts inside one layer, where specificity and source order still apply. A misspelled layer name silently creates a new layer wherever it first appears."
  question: html-and-css/the-cascade/cascade-layers
- id: layer-vendor-override
  front: "How do layers let you override a UI kit without a specificity fight?"
  back: "Declare `@layer kit, app;` and import the kit into `kit`; every `app` rule then beats every `kit` rule. If the kit uses `!important`, drop yours: its important declarations still win."
  question: html-and-css/the-cascade/cascade-layers
- id: important-definition
  front: "When is a declaration important, and at which step is that decided?"
  back: "When its value ends with `!` and `important` (whitespace, comments and case don't matter). Importance is decided at the first step with origin, so it beats every normal declaration before selectors are compared."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-reverse-reason
  front: "Why does `!important` reverse the origin order?"
  back: "Balance of power. A user needing large text or high contrast can mark styles important and override the page, and the browser can enforce things like `input[type=hidden i] { display: none !important; }`."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-origin-order
  front: "In what order do important declarations rank by origin?"
  back: "Important UA beats important user beats important author. Normal ones go author > user > UA."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-hidden-input
  front: "Can an author style show `<input type=\"hidden\">` with `display: block !important`?"
  back: "No. The UA's important `display: none` beats the author's, in both browsers."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-layer-reverse
  front: "How does `!important` interact with layer order?"
  back: "The first layer wins for important declarations, so a later layer can't override a reset layer's `!important` with its own. Fighting it with a more specific `!important` only works within one layer."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-unlayered-weakest
  front: "Where does an unlayered `!important` rank among author important declarations?"
  back: "Weakest. For normal rules unlayered wins; for important ones it is the weakest author layer."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-shadow-context
  front: "How does `!important` affect shadow DOM conflicts?"
  back: "Normal page styles beat a component's, but important styles from inside the component beat the page's. A `:host` rule won with both sides important; with both normal the page's `x-el` rule won."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-inline-vs-sheet
  front: "Is the inline `!important` order reversed?"
  back: "No. Inline `!important` beats any style sheet `!important`, and specificity and source order still decide within one layer."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-vs-animations
  front: "How do `!important` and animations interact?"
  back: "A running animation overrides normal rules but loses to `!important`. `#a { color: blue }` animated to red; `#b { color: green !important }` stayed green."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-in-keyframes
  front: "What happens to `!important` inside `@keyframes`?"
  back: "The declaration is ignored: `color: red !important` in a keyframe had no effect in both browsers, while the keyframe's other properties still animated."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-vs-transitions
  front: "Does `!important` stop a transition?"
  back: "No. Transitions sit above everything, since they only animate between values the cascade already chose. A transition between two important values still ran, reading `rgb(100, 0, 0)` at halfway."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-js-setproperty
  front: "How do you set an important inline style from JavaScript?"
  back: "`el.style.setProperty(\"color\", \"red\", \"important\")`. `el.style.color = \"red !important\"` is invalid and ignored. `getPropertyPriority(\"color\")` returns `\"important\"`."
  question: html-and-css/the-cascade/important-reverses-order
- id: important-shorthand
  front: "Does `!important` on a shorthand apply to its longhands?"
  back: "Yes, the shorthand expands to longhands that are each important. `#sh { margin: 5px !important }` beat a later `#sh { margin-top: 1px }`."
  question: html-and-css/the-cascade/important-reverses-order
- id: inherited-property-defaulting
  front: "What does defaulting give an inherited property with no declaration?"
  back: "The parent's computed value. Inherited properties are mostly about text: `color`, `font-*`, `line-height`, `letter-spacing`, `text-align`, `white-space`, `visibility`, `cursor`, `list-style`. Custom properties inherit too."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: non-inherited-initial
  front: "What do non-inherited properties like `margin`, `display` and `width` get with no declaration?"
  back: "Their initial value from the property's definition table. The root element has no parent, so it gets initial values."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: inheritance-flattened-tree
  front: "Which element does a slotted element inherit from?"
  back: "Its `<slot>`, not its light-DOM parent: inheritance follows the flattened tree."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: inherit-keyword
  front: "What does `inherit` do?"
  back: "Uses the parent's computed value, even for a property that doesn't normally inherit, such as `border: inherit`. It copies the computed value, not the declared one."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: initial-keyword
  front: "What does `initial` do, and what does `display: initial` give on a `<div>`?"
  back: "It sets the property's initial value from the spec, not the browser's default for the element. `display: initial` on a `<div>` gives `inline`."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: unset-keyword
  front: "What does `unset` do?"
  back: "`inherit` for inherited properties and `initial` for the rest: what the property would do with no declaration."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: revert-keyword
  front: "What does `revert` do?"
  back: "Rolls back to the previous origin. In author CSS it falls back to user styles and then the UA style sheet, so `display: revert` on a `<div>` gives `block`."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: revert-layer-keyword-unlayered
  front: "What does `revert-layer` do in unlayered CSS?"
  back: "Unlayered styles are the implicit last layer, so it rolls back to the named layers. An unlayered `a.x { color: revert-layer }` gave green from `@layer base { a { color: green } }`."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: revert-vs-revert-layer-example
  front: "In `@layer components`, what colours do `color: revert-layer` and `color: revert` give a link over `@layer base { a { color: green } }`?"
  back: "`revert-layer` gives green from `base`. `revert` ignores every author layer and falls back to the UA link colour, `rgb(0, 0, 238)`."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: revert-rule
  front: "What is `revert-rule`?"
  back: "A keyword in the css-cascade-5 editor's draft that rolls back to what would apply if this rule didn't exist, typically with `if()`. It shipped in Chrome 148, Firefox 150 and Safari 27."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: all-shorthand
  front: "What does `all` reset, and what does it skip?"
  back: "Every property except `direction` and `unicode-bidi`, and it doesn't touch custom properties. `all: revert` gives back the browser's styling; `all: unset` strips it."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: inherit-computed-line-height
  front: "Why do `line-height: 1.5` and `line-height: 150%` inherit differently?"
  back: "Inheritance passes the computed value. The number is inherited as a number, the percentage as the parent's resolved length: a `10px` parent with `150%` gave a `20px` child `15px`, with `1.5` the child got `30px`."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: form-controls-font-inherit
  front: "Do form controls inherit fonts, and how do you fix it?"
  back: "No. The UA style sheet sets their `font`, so a `<button>` stayed `13.3333px` inside a `20px` body until `font: inherit`."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: all-unset-button
  front: "What does `all: unset` do to a `<button>`?"
  back: "It loses more than intended: `display` became `inline`, the border `none`, and `font-size` inherited `20px` from the body."
  question: html-and-css/the-cascade/inheritance-and-global-keywords
- id: value-stages-pipeline
  front: "What are the stages a property's value goes through?"
  back: "Declared, cascaded, specified (after defaulting), computed, used and actual."
  question: html-and-css/the-cascade/value-stages
- id: declared-vs-cascaded
  front: "How do declared values and the cascaded value differ?"
  back: "Declared values are every valid declaration that applies, possibly none or many. The cascaded value is the one that wins the cascade, and there may be none."
  question: html-and-css/the-cascade/value-stages
- id: specified-value
  front: "What is the specified value?"
  back: "The cascaded value after defaulting. With no cascaded value it is inherited or initial; CSS-wide keywords are resolved here. Every element has exactly one."
  question: html-and-css/the-cascade/value-stages
- id: computed-value
  front: "What is the computed value, and why does it matter?"
  back: "The specified value resolved as far as possible without layout: `em`, `vw` and keywords like `bolder` become absolute, while some percentages stay. This is the value children inherit."
  question: html-and-css/the-cascade/value-stages
- id: used-value
  front: "What is the used value?"
  back: "The computed value plus layout: `width: auto` or `50%` becomes pixels. A property that doesn't apply has no used value."
  question: html-and-css/the-cascade/value-stages
- id: actual-value
  front: "What is the actual value?"
  back: "The used value adjusted for the device, such as rounding to whole pixels or an available font."
  question: html-and-css/the-cascade/value-stages
- id: resolved-value
  front: "What does `getComputedStyle()` return?"
  back: "The CSSOM resolved value, not strictly the computed value: used for colours, `line-height` (unless `normal`), and `width`, `height`, margins and paddings when they apply and `display` isn't `none` or `contents`; computed for most other properties."
  question: html-and-css/the-cascade/value-stages
- id: resolved-positioned-offsets
  front: "What does `getComputedStyle` return for `top`, `left`, `right`, `bottom`?"
  back: "The used value on a positioned element (unless over-constrained), otherwise the computed value. `position: relative; bottom: 10px` read `top` as `-10px`; on a static element `top: 10px` read `10px`."
  question: html-and-css/the-cascade/value-stages
- id: calc-display-none
  front: "Why does `width: calc(50% + 1em)` read as `220px` laid out but `calc(50% + 20px)` under `display: none`?"
  back: "The `em` is made absolute at computed time, but the percentage needs layout. Under `display: none` there's no used value, so the computed value is returned."
  question: html-and-css/the-cascade/value-stages
- id: inline-width-not-applies
  front: "What does `getComputedStyle().width` return for a non-replaced inline element?"
  back: "The computed value, such as `auto` or `50%`, because `width` doesn't apply. `parseFloat` gives `NaN`; use `getBoundingClientRect()` to measure."
  question: html-and-css/the-cascade/value-stages
- id: detached-element-computed
  front: "What does `getComputedStyle` return for a detached element?"
  back: "Empty strings in Chrome 155 and Firefox 158. It is live: the same object read `10px` once the element was appended."
  question: html-and-css/the-cascade/value-stages
- id: style-property-vs-computed
  front: "Why doesn't `el.style.width` tell you an element's width?"
  back: "`style` holds only the `style` attribute's declarations; it returned `\"\"` for a width set in a style sheet."
  question: html-and-css/the-cascade/value-stages
- id: percentage-inheritance
  front: "Is a percentage resolved before inheritance?"
  back: "No. A computed `50%` stays `50%`, so `width: inherit` in a child of a `200px`-wide `50%` box gave `100px`, not `200px`."
  question: html-and-css/the-cascade/value-stages
- id: line-height-inherit-which
  front: "Which value does a child inherit for `line-height`, `1.5` or `30px`?"
  back: "The computed value. `1.5` computes to the number, so each child multiplies by its own font size; `150%` computes to a length that children inherit. `getComputedStyle` reports `30px` for both on a `20px` element."
  question: html-and-css/the-cascade/value-stages
- id: why-resolved-value-exists
  front: "Why does `getComputedStyle` return used values for some properties?"
  back: "History. It was defined to return the computed value, but CSS later changed what computed value means while browsers had to keep results stable for scripts. CSSOM named that result the resolved value."
  question: html-and-css/the-cascade/value-stages
- id: getcomputedstyle-width-border-box
  front: "What does `getComputedStyle().width` give with `box-sizing: border-box`?"
  back: "The border-box width, the used value of `width`: `200px` with `padding: 20px` in both browsers. `getBoundingClientRect()` reports the laid-out box even for inline elements."
  question: html-and-css/the-cascade/value-stages
- id: computed-exists-when-not-applying
  front: "Does a computed value exist when the property doesn't apply to the element?"
  back: "Yes, which lets `text-transform` set on a `<p>` reach the text inside it."
  question: html-and-css/the-cascade/value-stages
- id: border-width-snapping
  front: "How are border widths snapped at computed time?"
  back: "Below one device pixel rounds up to 1, above it rounds down to a whole device pixel. At DPR 1 both browsers returned `1px` for `0.5px`, `2px` for `2.7px` and `4px` for `4.2px`."
  question: html-and-css/the-cascade/value-stages
- id: computed-colours-used
  front: "How do colours read back from `getComputedStyle`?"
  back: "As used values: `currentcolor` reads back as the colour it stands for, and `red`, `#f00` and `hsl(0 100% 50%)` all read `rgb(255, 0, 0)`."
  question: html-and-css/the-cascade/value-stages
- id: computed-serialisation
  front: "Why does `getComputedStyle` return `matrix(...)` for `transform: rotate(45deg)`?"
  back: "Computed values are abstract and `getComputedStyle` serialises them. Both browsers gave `matrix(0.707107, 0.707107, -0.707107, 0.707107, 0, 0)`, and a relative `url(img.png)` came back absolute."
  question: html-and-css/the-cascade/value-stages
- id: computed-color-compare-bug
  front: "Why does comparing `getComputedStyle(el).color` to `\"red\"` never match?"
  back: "Resolved colours serialise as `rgb(255, 0, 0)`. Compare serialised forms, or read a custom property you control."
  question: html-and-css/the-cascade/value-stages
- id: getcomputedstyle-layout-thrash
  front: "Why is interleaving style writes and `getComputedStyle` reads in a loop slow?"
  back: "Reading a used value like `width` requires up-to-date layout, so the browser lays out the page repeatedly. Batch reads before writes."
  question: html-and-css/the-cascade/value-stages
- id: computed-style-map
  front: "Which API returns typed computed values, and where is it supported?"
  back: "`computedStyleMap()` (CSS Typed OM), shipped in Chrome 66 and Safari 16.4 but not Firefox."
  question: html-and-css/the-cascade/value-stages
- id: computed-font-size-display-none
  front: "What do `font-size: 2em` and `line-height: 150%` compute to on a `display: none` child of a `10px` parent?"
  back: "`20px` and `30px`, resolved without layout. The `25%` width on that element stays `25%`."
  question: html-and-css/the-cascade/value-stages
# 04 Box model and formatting contexts
- id: box-four-areas
  front: "Which four nested areas make up a CSS box?"
  back: "Content, padding, border and margin, each bounded by an edge. Padding shows the background, the border is drawn around the padding, and the margin is transparent space outside the border."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-content-box-default
  front: "With the initial `box-sizing: content-box`, what does `width: 200px` size, and how wide is the box with `20px` padding and a `5px` border?"
  back: "`width` sizes only the content, so the box takes `250px`: the `200px` content plus padding and border on both sides."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-border-box-meaning
  front: "What does `box-sizing: border-box` change about `width: 200px` with `20px` padding and a `5px` border?"
  back: "`width` sizes the border box, so padding and border fit inside and the content gets what is left: `150px`."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-sizing-properties-affected
  front: "Which properties does `box-sizing` re-interpret, and which does it never touch?"
  back: "It changes the meaning of `width`, `height`, `min-*`, `max-*` and `flex-basis`. It never changes the margin, and it doesn't change an `auto` width: a block fills its container the same way under both values."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-border-box-why-global
  front: "Why do teams set `border-box` globally?"
  back: "It matches how designs are specified (a card is 300px wide), and `width: 100%` plus padding stops overflowing the parent. With `content-box`, `width: 50%` and `padding: 20px` can't be combined without `calc()`."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-border-box-floor-at-zero
  front: "Under `border-box`, what happens when padding and border exceed the specified `width`?"
  back: "The content box floors at `0` instead of going negative, and the box grows. A `20px` border-box with `50px` of padding and border measured `50px` wide in Chrome 155 and Firefox 158."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-computed-width-reports
  front: "Which box does `getComputedStyle(el).width` report?"
  back: "The box that `box-sizing` names, so under `border-box` it includes padding and border. A `content-box` block with `width: auto` reported its content width, not its container's width."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-offset-client-width
  front: "What do `offsetWidth` and `clientWidth` measure?"
  back: "`offsetWidth` is the border-box width, rounded to an integer. `clientWidth` is the padding box minus any scrollbar."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-bounding-rect-transforms
  front: "How does `getBoundingClientRect().width` differ from `offsetWidth`?"
  back: "It gives the fractional border-box size after transforms, so `scale(2)` doubles it but leaves `offsetWidth` unchanged."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-inline-span-width-height
  front: "Do `width` and `height` apply to a `<span>`, and what does vertical padding on one do?"
  back: "They don't apply to inline non-replaced boxes. Vertical padding paints and may overlap neighbouring lines but doesn't push lines apart or change the line box height."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-form-control-defaults
  front: "Which form controls default to which `box-sizing` in Chrome 155 and Firefox 158?"
  back: "Their UA styles give `<button>`, `<select>` and checkboxes `border-box`, but text `<input>` and `<textarea>` `content-box`. Form controls don't follow your page default."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-vertical-padding-percent
  front: "What do percentage `padding-top` and `margin-top` resolve against?"
  back: "The containing block's inline size (its width in horizontal writing), not its height. All four padding and margin percentages do. That is why `padding-top: 56.25%` made 16:9 boxes before `aspect-ratio`."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-reset-inherit
  front: "Why write the reset as `html { box-sizing: border-box }` plus `*, *::before, *::after { box-sizing: inherit }`?"
  back: "A component can opt its whole subtree back into `content-box` by setting it once on its root. With `border-box` set directly on `*`, every descendant would need its own override."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-aspect-ratio-box-sizing
  front: "Does `box-sizing` affect `aspect-ratio`?"
  back: "Yes, the ratio applies to the box `box-sizing` names. A `200px` wide `aspect-ratio: 2` box with `20px` padding was `200×100` under `border-box` and `240×140` under `content-box`."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-inline-axis-equation
  front: "What constraint does CSS 2.2 set on a block's inline-axis sizes, and what is solved from it?"
  back: "Margins, borders, padding and `width` must add up to the containing block's width. `width: auto` is solved from that equation, so an auto-width block fills its container whatever `box-sizing` says."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-overconstrained-margins
  front: "How is an over-constrained block width resolved, and why does `margin: 0 auto` centre a fixed-width block?"
  back: "The end-side margin is ignored (`margin-right` in left-to-right text). Two `auto` margins split the remaining space equally, which centres the block."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-height-auto-source
  front: "Why does `box-sizing` matter in the block axis only when you set a height?"
  back: "`height: auto` comes from the content, not from the container, so there is no equation for `box-sizing` to re-map until a height is specified."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-floated-columns-overflow
  front: "Why did floated `width: 30%` and `width: 70%` columns with `padding: 24px` wrap under `content-box`?"
  back: "They add up to `100% + 96px`, so the main column dropped below the sidebar. Under `border-box` the percentages just add up, with no `calc(30% - 48px)` that breaks when padding changes."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: box-content-box-still-useful
  front: "When is `content-box` still the right choice?"
  back: "When the content size is the contract, such as a `<textarea>` sized in `ch`, or a box whose padding is decorative and should grow it."
  question: html-and-css/box-model-and-formatting/box-model-and-box-sizing
- id: display-two-parts
  front: "What two independent things does `display` set?"
  back: "The outer type says how the box takes part in its parent's flow (`block` or `inline`). The inner type says which formatting context lays out its children (`flow`, `flow-root`, `flex`, `grid`, `table` or `ruby`)."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-outer-block-inline
  front: "How do `block` and `inline` outer display types behave in the parent's flow?"
  back: "`block` boxes stack in the block direction and, with `width: auto`, fill the container's inline size. `inline` boxes sit on lines with text."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-shorthand-pairs
  front: "Which two-keyword pairs do `block`, `inline`, `flex`, `inline-block` and `inline-grid` stand for?"
  back: "`block` is `block flow`, `inline` is `inline flow`, `flex` is `block flex`, `inline-block` is `inline flow-root`, and `inline-grid` is `inline grid`."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-flow-root-meaning
  front: "What does the inner type `flow-root` mean, and what does `display: flow-root` alone compute to?"
  back: "Normal flow layout that always establishes a new block formatting context. `display: flow-root` alone means `block flow-root`."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-multi-keyword-support
  front: "Is two-keyword `display` valid, and how does `getComputedStyle()` serialize it?"
  back: "It is valid CSS, shipped in Chrome 115, Firefox 70 and Safari 15. `getComputedStyle()` still serializes the short form: `inline flow-root` reads back as `inline-block`, and so does `el.style.display`."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-omitted-half-default
  front: "What do omitted halves of `display` default to, and what does `list-item` add?"
  back: "`display: inline` means `inline flow`. Adding `list-item` (`list-item`, `inline list-item`) also generates a `::marker` box."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-none-vs-contents
  front: "How do `display: none` and `display: contents` differ?"
  back: "Both generate no box. `none` drops the element and its whole subtree; `contents` drops only the element's own box and puts its children in its place. Neither changes the DOM, selector matching or inheritance."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-blockification
  front: "What is blockification, and which boxes get it?"
  back: "The parent context forces the outer type to `block` for flex and grid items, floats and absolutely positioned boxes. A `<span>` in a flex container computes to `display: block`, which is why `width` suddenly works."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-inline-block-blockified
  front: "What does `inline-block` compute to when blockified?"
  back: "Plain `block`, not `flow-root`. In Chrome 155 and Firefox 158, flex items and floats with `display: inline-block` printed `block`."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-semantics-unchanged
  front: "Does `display` change an element's semantics, or lay out a replaced element's insides?"
  back: "No to both. A `<ul>` with `display: flex` is still a list. A replaced element's inner display is outside CSS, so `display: flex` on an `<img>` lays out nothing inside it."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-contents-buttons
  front: "What happened to a `<button>` with `display: contents` in Chrome 155 and Firefox 158?"
  back: "It stayed in the accessibility tree but couldn't be focused by `focus()` or Tab. Avoid `display: contents` on interactive elements."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-contents-replaced
  front: "What does `display: contents` compute to on `<img>`, `<input>`, `<select>` or `<video>`?"
  back: "`none`. The spec computes it that way, so the element disappears instead of being unwrapped."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-inline-flex-item
  front: "Does `display: inline` on a flex item keep it on the line?"
  back: "No. Blockification overrides it; alignment comes from the flex container, not the item's outer type."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-inline-block-baseline-gap
  front: "Why did a `50px` empty inline-block make its parent taller than `50px` in Chrome 155 and Firefox 158?"
  back: "It is still on a line and sits on the baseline, with room for descenders below. The parent measured `54px` in Chrome 155 and `56px` in Firefox 158."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-block-vs-flow-root
  front: "What is the difference between `display: block` and `display: flow-root`?"
  back: "Both generate a block-level block container. `flow-root` always establishes a new BFC, so it contains floats and its margins don't collapse with its children's. `block` only does so when something else, like `overflow` or `float`, forces it."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-run-in
  front: "What is `display: run-in`, and is it supported?"
  back: "A Display 3 outer type for a heading that merges into the start of the next block. Chrome 155 and Firefox 158 don't support it: setting it is ignored and a `<div>` stays `block`."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: display-table-cell-in-grid
  front: "What does `display: table-cell` compute to on a grid item?"
  back: "`block`. Blockification turns layout-internal types into `flow`. The table display only takes effect when the parent isn't a flex or grid container."
  question: html-and-css/box-model-and-formatting/display-outer-and-inner
- id: bfc-definition
  front: "What is a block formatting context, and what is the box that starts one called?"
  back: "The layout environment for normal flow: blocks stack in the block direction, vertical margins between them collapse, and floats are placed and wrapped around. The box that starts a new one is a BFC root."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-contains-floats
  front: "How does a BFC root treat its floating descendants?"
  back: "It contains them. An `auto` height grows to the bottom of its floats, so a card with only a floated image doesn't collapse to `0`."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-avoids-floats
  front: "How does a BFC root behave next to a float outside it?"
  back: "Its border box sits beside the float in the same context and narrows to fit, instead of running underneath it."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-margins-dont-collapse-edge
  front: "What happens to a first child's `margin-top` inside a BFC root?"
  back: "Margins don't collapse across the root's edge, so the child's margin stays inside the root instead of leaking out through it."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-creators
  front: "Name common ways to create a new block formatting context."
  back: "The root element, `display: flow-root`, floats, absolute or fixed positioning, inline-blocks, table cells and captions, `overflow` other than `visible` or `clip`, flex and grid items, multi-column containers, and `contain: layout`, `paint` or `strict`."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-container-queries-align-content
  front: "Which `container-type` values and `align-content` values create a BFC?"
  back: "`container-type: size` or `inline-size`, and any `align-content` other than `normal` on a block container. `align-content: center` on a `<div>` also contains floats (Chrome 123, Firefox 125, Safari 17.4)."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-non-creators
  front: "Which properties do not create a BFC?"
  back: "`position: relative`, `transform`, `opacity`, `z-index`, `isolation` (they affect stacking, not layout), `overflow: clip`, and padding or borders, which stop margin collapsing but don't contain floats."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-overflow-hidden-vs-flow-root
  front: "Why is `display: flow-root` better than `overflow: hidden` for clearing floats?"
  back: "`overflow: hidden` works but also clips shadows and focus rings and creates a scroll container. `flow-root` is the purpose-built switch with no other effect."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-overflow-clip-no-bfc
  front: "Why doesn't `overflow: clip` contain floats?"
  back: "Overflow 3 says `clip` doesn't cause a new formatting context because it isn't a scroll container. Pair it with `display: flow-root` if you want both."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-body-overflow-propagation
  front: "Does `overflow: hidden` on `<body>` contain floats?"
  back: "Not when `<html>` is `overflow: visible`: the body's value propagates to the viewport and the body itself stays non-BFC. Its height was `0` around a `100px` float in Chrome 155 and Firefox 158."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-own-margins-still-collapse
  front: "Do a BFC root's own margins stop collapsing?"
  back: "No. They still collapse with its siblings: a `20px` margin and a `flow-root` box's `30px` margin left a `30px` gap."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-independent-formatting-context
  front: "What is an independent formatting context?"
  back: "CSS Display 3's general term: a box whose contents are laid out isolated from outside floats and margins. A block container that establishes one has a used inner display of `flow-root`; flex and grid containers establish flex and grid contexts instead."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-block-overlaps-float
  front: "Why does an ordinary block overlap a float but a BFC root doesn't?"
  back: "In a BFC, every block's border edge touches the containing block's edge, and only its line boxes shorten around floats. CSS 2.2 §9.5 requires a BFC root's border box not to overlap floats in the same context, so the whole box narrows."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-flex-container
  front: "Does a flex container create a BFC?"
  back: "No. It creates a flex formatting context, and each item establishes its own independent context. `float` on a flex item is ignored, so a flex container around a `100px` float is `100px` tall."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-containment-rules
  front: "Which CSS 2.2 rules produce float containment, float avoidance and the margin wall of a BFC?"
  back: "§10.6.7: an `auto`-height root includes floats' bottom margin edges. §9.5: a root's border box must not overlap floats in the same BFC. Margins collapse only within one context, so the root's edge is a wall."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-contain-size
  front: "Does `contain: size` alone create a BFC?"
  back: "No. Size containment alone didn't stop a child's margin escaping in Chrome 155 or Firefox 158; layout and paint containment do."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-floated-inline-block
  front: "What happens to a floated `inline-block`'s BFC status?"
  back: "It computes to `block`, losing `flow-root`, but the float itself makes it a BFC root, so nothing changes in layout."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-media-object
  front: "How do you build a media object (floated avatar beside text) with BFCs and no clearfix?"
  back: "Make the parent `display: flow-root` so it contains the float, and make the text column `display: flow-root` so it narrows beside the float instead of running underneath it."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-flow-root-support
  front: "Since when has `display: flow-root` shipped, and what does it replace?"
  back: "Chrome 58, Firefox 53 and Safari 13. It replaces the clearfix hack `::after { content: \"\"; display: table; clear: both }`, now needed only for older browsers."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: bfc-trigger-baggage
  front: "What baggage do BFC triggers other than `flow-root` bring?"
  back: "`overflow` clips and creates a scroll container, floats and absolute positioning leave the flow, `inline-block` puts the box on a line with a baseline gap, and `contain` changes painting and sizing assumptions."
  question: html-and-css/box-model-and-formatting/block-formatting-context
- id: margin-collapse-condition
  front: "When do block-axis margins collapse?"
  back: "When two or more adjoining margins belong to in-flow block-level boxes in the same BFC, with no line box, padding, border or clearance between them. They combine into one margin."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-horizontal-never
  front: "Do horizontal margins collapse?"
  back: "Never in horizontal writing. In vertical writing modes the block axis is horizontal, so those margins do."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-three-adjoining-cases
  front: "Which three situations make margins adjoin?"
  back: "Adjacent siblings, a parent and its first or last child, and an empty block whose own top and bottom margins collapse together (and can collapse with neighbours through it)."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-parent-child-leak
  front: "What is the surprising parent and first-child margin collapse?"
  back: "A child's `margin-top` collapses with its parent's when the parent has no top padding or border, so the child's margin appears outside the parent and pushes the parent down. The bottom case also needs the parent's height to be `auto`."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-collapse-arithmetic
  front: "What is the collapsed margin of `30px` and `-10px`, and how is it computed in general?"
  back: "`20px`. Take the largest positive margin and add the most negative one. `30px` and `20px` give `30px`; `-30px` and `-10px` give `-30px`."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-prevent-parent-child
  front: "How do you stop a child's margin collapsing through its parent?"
  back: "Give the parent padding or a border (even `1px`), or make it a BFC root with `display: flow-root`. A BFC's children never collapse with it. `clear` or inline content between the margins also separates them."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-flex-grid-no-collapse
  front: "Do margins collapse in flex or grid layouts?"
  back: "No. Items never collapse with each other or with the container, so `gap` or margins add up. A `30px` bottom and `20px` top margin gave a `50px` gap in a flex column, and the same in a grid."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-never-collapsing-boxes
  front: "Which boxes never collapse their margins?"
  back: "Floats, absolutely positioned boxes and inline-blocks. The root element's margins don't collapse either."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-heading-moves-card
  front: "Why does adding `margin-top` to a heading inside a card move the card?"
  back: "The heading's margin collapsed through the card's top edge. Give the card padding or `display: flow-root`."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-min-height-bottom
  front: "Does a non-zero `min-height` block bottom margin collapsing in practice?"
  back: "CSS 2.2 says it does, but Chrome 155 and Firefox 158 still collapsed a child's `20px` bottom margin through a parent with `min-height: 5px` and `10px` of content. Only a `min-height` that changed the height stopped it."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-siblings-larger-not-sum
  front: "If both adjacent list items have margins, is the gap their sum?"
  back: "No. Siblings get the larger of the two margins, not the sum."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-flow-root-own-margins
  front: "Do the margins of a `display: flow-root` box itself collapse?"
  back: "Yes, with its siblings and its own parent, because the box still takes part in the outer BFC. It only stops its children's margins from collapsing with its own."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-trim
  front: "What is `margin-trim`, and who supports it?"
  back: "A Box 4 property that drops children's margins where they meet the container's edge. `margin-trim: block` trimmed the first child's top and last child's bottom margin in Chrome 155 (shipped there and in Safari 16.4); Firefox 158 doesn't support it."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-one-direction
  front: "Why do people advise setting margins in one direction only?"
  back: "If every block sets only `margin-block-end` (or you use `gap` in flex and grid), there's never a pair to collapse and the spacing is predictable."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: margin-empty-block-flex
  front: "A `10px` margin, an empty block with `20px 0 30px` margins, then a `-15px` margin: what is the gap in normal flow versus a flex column?"
  back: "`15px` in normal flow: the empty block's margins collapse through it, so all four adjoin and the largest positive (`30px`) plus the most negative (`-15px`) wins. A flex column gave `45px`, the plain sum."
  question: html-and-css/box-model-and-formatting/margin-collapsing
- id: line-ifc-definition
  front: "What is an inline formatting context and a line box?"
  back: "A block container whose children are inline-level establishes an inline formatting context. Its content breaks into line boxes, stacked one per line, each as tall as needed to hold everything on it."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-inline-box-heights
  front: "How tall is each inline-level box when computing a line box?"
  back: "A text inline box is exactly its `line-height`: the content area (ascent plus descent) with the difference split as half-leading above and below. Replaced elements and inline-blocks use their margin box."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-vertical-align-default
  front: "What does `vertical-align` do by default, and what does `top` align to?"
  back: "Default `baseline` lines a box's baseline up with its parent's. `middle`, `text-top`, `sub` or a length shift it relative to the parent; `top` and `bottom` align to the line box itself."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-height-calculation
  front: "How is the line box's height measured once boxes are aligned?"
  back: "From the highest box top to the lowest box bottom."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-strut
  front: "What is the strut?"
  back: "An invisible, zero-width inline box at the start of every line with the block's own font and `line-height`. A line is never shorter than the block's `line-height`, and the baseline sits where the block's text would."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-image-gap
  front: "Why is there a gap under an inline `<img>`?"
  back: "The image sits on the baseline and the strut reserves room for descenders below it, so the block ends a few pixels below the image."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-image-gap-fixes
  front: "How do you remove the gap under an image?"
  back: "Take the image off the baseline or remove the strut's descent: `display: block`, `vertical-align: top | middle | bottom`, or `line-height: 0` on the parent."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-span-padding
  front: "Do vertical padding and borders on an inline `<span>` affect the line box?"
  back: "No. They paint but don't change the line box height. A span with `10px` padding and a `5px` border inside a `20px` line left the line at `20px`."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-vertical-align-applies-to
  front: "Which boxes does `vertical-align` apply to?"
  back: "Only inline-level boxes and table cells. It can't centre a block: a table cell's content moved down under `vertical-align: middle`, a `<div>`'s didn't."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-quirks-no-strut
  front: "Why must you test the image gap with `<!DOCTYPE html>`?"
  back: "In quirks and limited-quirks mode the strut isn't created, so the same canvas measured `100` instead of `105`. The gap only shows up in standards mode."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-font-size-zero
  front: "Does `font-size: 0` remove the image gap when `line-height` is a length?"
  back: "No. The strut keeps its `20px` height, centred on the baseline, so the block grew to `110px`. With a unitless `line-height` of `1.25`, `1.25 × 0` is `0` and the gap went away."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-height-length-vs-number
  front: "Why prefer a unitless `line-height` on a container with mixed font sizes?"
  back: "Children inherit a length like `20px` regardless of their size, while a unitless number scales with each element's own font."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-mixed-size-stagger
  front: "Why does a line with a big `32px` span in `20px` line-height text grow?"
  back: "Each box is `20px` tall, but the big letter's baseline sits lower in its box, so the boxes stagger vertically and the line grows (to `26px` in the example, depending on the monospace font)."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-inline-block-baseline
  front: "Where is an inline-block's baseline?"
  back: "On its last line box, unless it has no in-flow lines or `overflow` other than `visible`: then it's the bottom margin edge. A two-line inline-block made a `40px` line; with `overflow: hidden` the line grew to `45px`."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-text-box-trim
  front: "How do you trim the space above capitals and below the baseline, and where is it supported?"
  back: "`text-box: trim-both cap alphabetic` (CSS Inline 3; Chrome 133, Firefox 154, Safari 18.2) trims the first and last line to the cap height and baseline. A `16px/20px` paragraph went from `20px` to `12px` tall."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: line-vertical-align-middle
  front: "What does `vertical-align: middle` actually align?"
  back: "The box's midpoint with the parent's baseline plus half the parent's x-height: the middle of lowercase letters, not of the line box. That's why icons next to text often look a pixel or two off."
  question: html-and-css/box-model-and-formatting/line-boxes-and-vertical-align
- id: overflow-what-it-is
  front: "When does content overflow, and what does the `overflow` shorthand cover?"
  back: "When it extends past the box's padding edge: a long word, a fixed-height card, a wide table. `overflow` is shorthand for `overflow-x` and `overflow-y`."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-visible
  front: "What does `overflow: visible` do, and is it a scroll container?"
  back: "It is the initial value: overflow paints outside the box. It is not a scroll container."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-hidden
  front: "What does `overflow: hidden` do, and can it still scroll?"
  back: "It clips to the padding box with no scrollbars or user scrolling, but the box is still a scroll container. Script (`scrollTop`, `scrollIntoView()`) and focusing an element inside it can scroll it."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-scroll-auto
  front: "How do `overflow: scroll` and `auto` differ?"
  back: "`scroll` clips and always shows a scrolling mechanism. `auto` behaves like `scroll` when there's overflow and like `hidden` otherwise, which is usually what you want."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-clip
  front: "What does `overflow: clip` do?"
  back: "It clips to the overflow clip edge and forbids scrolling through any mechanism. It is not a scroll container."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-scroll-container-side-effects
  front: "What side effects come from being a scroll container?"
  back: "It establishes a new BFC (contains floats, stops margin collapsing), becomes the scrollport for `position: sticky` descendants, and can be scrolled by focus and `scrollIntoView()`. `clip` has none of these."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-sticky-breaks
  front: "Why does `overflow-x: hidden` on a wrapper break `position: sticky` inside it?"
  back: "The wrapper became a scroll container, so the sticky child sticks to it, not the page. It scrolled away at `-400px` while the same child under `overflow-x: clip` stayed at `0`."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-mixing-axes
  front: "What happens to the other axis if only `overflow-x: hidden` is set?"
  back: "If one axis is scrollable, `visible` in the other computes to `auto` and `clip` to `hidden`, so `overflow-y` becomes `auto`."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-clip-one-axis
  front: "What is the reliable way to clip only one axis?"
  back: "`overflow-x: clip`, which leaves `overflow-y: visible`."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-viewport-propagation
  front: "Where does `overflow` on `<html>` or `<body>` go?"
  back: "`overflow` on `<html>`, or on `<body>` when `<html>` is `visible`, is applied to the viewport instead of the element."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-hidden-focus-scroll
  front: "Does `overflow: hidden` stop a carousel scrolling when a hidden button gets focus?"
  back: "No. Focusing the third button in a `200px` track scrolled it in Chrome 155 and Firefox 158. With `clip`, `scrollLeft` stayed `0`, so a keyboard user focuses a button they can't see."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-hidden-clearing-floats-cost
  front: "What is the cost of using `overflow: hidden` to clear floats?"
  back: "It clips focus rings and shadows as a side effect. Use `display: flow-root` for containment."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-abs-child-not-clipped
  front: "Does `overflow` clip an absolutely positioned child whose containing block is outside the box?"
  back: "No. Clipping applies only to descendants whose containing block is the box or inside it."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-clip-margin
  front: "What does `overflow-clip-margin` do, and who supports it?"
  back: "It pushes the clip edge out from the box: `overflow: clip; overflow-clip-margin: 20px` lets content paint `20px` past the padding box, so shadows survive. No effect on `hidden`. Firefox 102 supports it; Chrome's support is partial (both axes must be `clip`)."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-scrollheight-padding
  front: "Does a scroll container's end padding and child margin count in its scrollable area?"
  back: "Yes in Chrome 155 and Firefox 158: a `100px` box with `20px` bottom padding around a `300px` child with a `50px` bottom margin had `scrollHeight` `370`. Overflow 3 lets UAs include those margins."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: overflow-body-hidden-clip
  front: "Does `overflow: hidden` on `<body>` clip the body?"
  back: "Not while `<html>` is `visible`: the value propagates to the viewport and the body's used value becomes `visible`. On the root it may also not clip everything outside a small initial containing block, which can happen on mobile."
  question: html-and-css/box-model-and-formatting/overflow-and-scroll-containers
- id: float-what-it-does
  front: "What does `float: left` do to a box?"
  back: "It takes the box out of normal flow and shifts it to that edge of its containing block, as high as it can go without overlapping earlier floats. `inline-start` and `inline-end` are the logical values."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-blockified-shrink
  front: "How does a float's display and width behave?"
  back: "Its `display` is blockified, and without an explicit width it is shrink-to-fit: as wide as its content needs."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-lines-vs-blocks
  front: "How do following lines and blocks react to a float?"
  back: "Line boxes shorten and flow beside it. Block boxes don't move: a paragraph starts at the container's edge underneath the float, and only its text is pushed aside. A BFC-establishing block narrows beside it instead."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-stacking-wrap-down
  front: "What happens when the next float doesn't fit beside earlier ones?"
  back: "It moves down to the first place it fits. In a `300px` container, `100px` and `150px` floats fill `250px`, so a third `100px` float lands at left `0`, below them."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-clear-clearance
  front: "What does `clear` do and how is clearance added?"
  back: "`clear: left | right | both` makes a block start below earlier floats on that side. The browser adds clearance above the block's top margin, enough to put its border edge below the float; the margin is absorbed into that space."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-clear-margin-absorbed
  front: "What happens to `margin-top` on a cleared block?"
  back: "It is swallowed by clearance. A `20px` margin had no effect and a `120px` one gave `120`. Put spacing on the float's `margin-bottom` instead."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-parent-doesnt-contain
  front: "Does a parent grow to contain its floats?"
  back: "Not unless it is a BFC root. The fix is `display: flow-root`."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-flex-grid-items
  front: "What does `float` do on a flex or grid item?"
  back: "Nothing. `float` doesn't apply to them and is silently ignored."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-still-useful
  front: "Where do floats still belong, and what lets text follow a curve?"
  back: "Wrapping text around an image, pull quote or figure in an article, which flex and grid can't do. `shape-outside` makes the text follow a circle, polygon or image alpha. Use flex or grid for page layout."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-paragraph-background
  front: "Why does a paragraph's background run under a float, and how do you fix it?"
  back: "Only its line boxes shorten, so its box and background keep the full width. Make the paragraph `display: flow-root` so it narrows instead."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-equal-height
  front: "Why are floats a bad fit for equal-height columns?"
  back: "Floats have no notion of a row. Use grid."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-shape-outside
  front: "What does `shape-outside` change?"
  back: "The float's exclusion area. `shape-outside: circle(50%)` on a `100px` float made the first `20px` line start at `90px` instead of `100px`. It affects only wrapping, not painting; add a matching `clip-path` or `border-radius` for the visuals."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-inline-start
  front: "Why use `float: inline-start` instead of `left`?"
  back: "It follows the writing direction: in a `direction: rtl` container it floated to the right edge. Shipped in Chrome 118, Firefox 55 and Safari 15."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: float-initial-letter
  front: "Is floating still how you make a drop cap?"
  back: "It was. `initial-letter` sizes and sinks the first letter properly and is supported in Chrome 110 and, prefixed, in Safari; Firefox doesn't support it, so a floated `::first-letter` remains the fallback."
  question: html-and-css/box-model-and-formatting/floats-and-clear
- id: intrinsic-min-content
  front: "What are `min-content` and `max-content`?"
  back: "`min-content` is the smallest size without overflow, taking every wrap opportunity (the longest word for text). `max-content` is the size the content wants with infinite room, taking none (all text on one line)."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-where-used
  front: "Where can the intrinsic size keywords be used?"
  back: "In `width`, `height`, `min-*`, `max-*`, `flex-basis` and grid tracks."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-width-min-max
  front: "What do `width: min-content` and `width: max-content` do?"
  back: "`min-content` wraps as much as possible, useful for a figure whose caption shouldn't be wider than its image. `max-content` never wraps and can overflow the container."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-fit-content
  front: "How is `width: fit-content` defined, and what is it used for?"
  back: "`min(max-content, max(min-content, available space))`: short content shrink-wraps, long content fills the container and wraps. It is how floats, inline-blocks and absolute boxes size by default. `fit-content; margin-inline: auto` centres a shrink-wrapped block."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-block-axis-keywords
  front: "What do the intrinsic keywords mean in the block axis?"
  back: "For ordinary blocks they equal `auto`, because height already comes from content. A block with a `37px` child and `height: min-content` was `37px`. They are mainly useful in the inline axis and in grid tracks."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-stretch
  front: "What does `width: stretch` do, and who supports it?"
  back: "It fills the containing block, margins included, as `width: auto` does for a block, but for boxes that would otherwise shrink-wrap. Chrome 138 and Safari 27 support it unprefixed; Firefox 158 only accepts `-moz-available` and `-webkit-fill-available`."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-stretch-fallback
  front: "What happened with `width: stretch` on a floated box in Firefox 158?"
  back: "Firefox ignored it and the box collapsed to `0px`. Declare `width: -moz-available` before it."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-aspect-ratio
  front: "How does `aspect-ratio` size a box, and when is it ignored?"
  back: "It sets a preferred ratio so one axis follows the other: `width: 320px; aspect-ratio: 16 / 9` gives `180px` of height. It is ignored when both sizes are set."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-aspect-ratio-min-content
  front: "Why does an `aspect-ratio` box with tall content grow instead of overflowing?"
  back: "Sizing 4 gives a non-replaced box that isn't a scroll container an automatic minimum of `min-content`. Add `overflow: auto` or `min-height: 0` to keep the ratio and let content overflow or scroll."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-wrap-opportunities
  front: "How do `overflow-wrap: anywhere` and `break-word` affect `min-content`?"
  back: "`anywhere` adds wrap opportunities and lowers `min-content` (a `193px` word shrank to one character, `10px`). `break-word` breaks long words only at layout time and doesn't change it."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-fit-content-function
  front: "Is `width: fit-content(200px)` valid?"
  back: "Only in grid track sizing in Chrome 155 and Firefox 158. On `width` it's dropped and the box stays `auto`."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-flex-grid-min
  front: "Why won't flex and grid items shrink below their longest word?"
  back: "They have an automatic minimum, `min-width: auto`, based on `min-content`."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-float-width
  front: "How is an `auto`-width float sized?"
  back: "Shrink-to-fit: `min(max(min-content, available), max-content)`, the same as `fit-content`. A float with three `50px` inline-blocks in a `120px` container was `120px` wide."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
- id: intrinsic-fit-vs-auto
  front: "How do `fit-content` and `auto` differ for a block holding one `50px` item in a `120px` container?"
  back: "`fit-content` shrinks to `50px` around the item, while `auto` always fills at `120px`. With three `50px` items, `max-content` overflowed to `150` and `fit-content` capped at `120`."
  question: html-and-css/box-model-and-formatting/intrinsic-sizing
# 05 Flexbox and grid
- id: fvg-flex-one-dimensional
  front: "In what sense is flexbox one-dimensional, even with `flex-wrap: wrap`?"
  back: "Items flow along one main axis, and with wrapping each line is laid out independently: flexing and `justify-content` only see the items on that line. Nothing lines the second row up with the first."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-grid-two-dimensional
  front: "What makes grid two-dimensional?"
  back: "The container defines column and row tracks and items are placed into cells. A column is shared by every item in it, so items align across rows and columns, can span tracks and can overlap."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-sizing-direction
  front: "Which direction does each layout size from, according to the grid spec's summary?"
  back: "Grid works top-down: structure comes from the container (layout in). Flexbox works bottom-up from the content, distributing space within one axis."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-choose-test
  front: "What question decides between flexbox and grid?"
  back: "\"When this wraps, should the second row line up with the first?\" If yes, use grid. Flexbox suits a row or column sized by content (nav bars, tag lists); grid suits things that must align in both directions."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-last-row-wrap
  front: "What goes wrong in a wrapping flex card gallery's last row?"
  back: "Its items grow wider than the rest with `flex-grow`, or with `space-between` land at the far edges with a hole between. A `330px` flex row of five `flex: 1 1 100px` items gave `110 110 110 165 165`; grid kept `110px` cells."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-grid-content-sized
  front: "Can grid size tracks from content?"
  back: "Yes. `grid-template-columns: max-content 1fr` gives a label column as wide as the widest label, sized across every item in the column. Tracks can use `auto`, `max-content` or `fit-content()`."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-flex-percent-gap
  front: "Why does mixing percentage widths with `gap` fail in flexbox?"
  back: "Three `33.333%` items with `gap: 15px` in `330px` need `360px`, so the third wraps. In grid, `fr` tracks share the space left after gaps."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-order-accessibility
  front: "Does reordering with `order` or grid placement change reading and tab order?"
  back: "No. Keyboard and screen-reader order still follow the DOM, which the spec warns about. Keep the DOM order meaningful."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-flex-2d-via-nesting
  front: "Can flexbox make a two-dimensional layout?"
  back: "Only by nesting rows of flex containers, and columns line up only if you fix every item's width. Each row is an independent formatting context, so a wider item in one row can't widen the matching item in another."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-button-bottom
  front: "How do you pin a card's button to the bottom when cards sit in one grid row?"
  back: "Grid stretches every card to the row height. Make each card a column flex container and give the button `margin-top: auto`; the auto margin absorbs the card's spare height."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-subgrid-alignment
  front: "How can a nested element line up with the outer grid's tracks?"
  back: "Use `subgrid`: the nested grid adopts the parent's tracks in that axis instead of defining its own. A flex row inside a grid cell can't do this."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-algorithms
  front: "How do the flex and grid algorithms differ in what competes for space?"
  back: "Flex works per item then per line, so an item only competes with neighbours on the same line. Grid places every item, then sizes columns and then rows, so content in row 3 can widen a column for rows 1 and 2."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-label-field
  front: "Why do fields in separate flex rows start at different offsets but align in a grid with `max-content 1fr`?"
  back: "Each flex row sizes its label from its own content (fields start at `40` and `80`). The grid's `max-content` column is as wide as the widest label, so both fields start at `80`."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-column-flex-wrap
  front: "What does column flex wrapping need to wrap?"
  back: "A definite or maximum height. Otherwise the line is as tall as its content and never wraps."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-grid-flow-column
  front: "Is a one-dimensional grid fine, and when is flexbox preferable?"
  back: "Yes: `grid-auto-flow: column` puts each item in a new column. Prefer flexbox when items should share leftover space by content size rather than by track."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: fvg-flexbox-tradeoff
  front: "What is flexbox's main strength and cost versus grid?"
  back: "It needs no up-front structure: add or remove items and the line rebalances, which suits content of unknown size and count. The cost is that alignment only holds within one line."
  question: html-and-css/flexbox-and-grid/flexbox-vs-grid
- id: flex-base-size
  front: "How is the flex base size determined?"
  back: "From `flex-basis`. A length or percentage is used as is. `auto` means use `width` (or `height` in a column), and if that is `auto` too, `content`, roughly max-content. Clamping by min and max gives the hypothetical main size."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-free-space
  front: "How is free space computed, and what decides whether grow or shrink applies?"
  back: "The container's inner size minus the items' outer hypothetical sizes. Positive free space uses the grow factors; negative uses the shrink factors."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-grow-distribution
  front: "How is positive free space shared among flex items?"
  back: "Each item gets free space × its `flex-grow` ÷ the sum of `flex-grow`. In a `600px` row with bases `100` and `200`, grows 1 and 2 gave `200` and `400`."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-shrink-scaled
  front: "How does shrinking differ from growing in the flex algorithm?"
  back: "Each `flex-shrink` is first multiplied by the item's inner flex base size. With equal factors a `300px` item gives up three times as much as a `100px` one, so small items don't collapse first. `flex-grow` is not scaled."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-shrink-example
  front: "In a `300px` row, what do `flex: 1 1 100px` and `flex: 1 1 300px` become?"
  back: "`75px` and `225px`. The overflow is `100px`, and the scaled factors `100` and `300` take `25` and `75`."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-frozen-clamped
  front: "What happens when a flex item hits its min or max clamp?"
  back: "It is frozen at that size and the others share what's left again, until every item is frozen. In a `500px` row of three `flex: 1` items with one `max-width: 100px`, the result was `200`, `200`, `100`."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-shorthand-values
  front: "What do the initial `flex`, `flex: auto`, `flex: 1` and `flex: none` expand to?"
  back: "Initial: `0 1 auto`, content-sized, shrinks, never grows. `auto`: `1 1 auto`. `1`: `1 1 0%`, so all space is shared by ratio. `none`: `0 0 auto`, rigid."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-one-basis-computed
  front: "What does `flex: 1` compute to in Chrome 155 and Firefox 158, versus the spec's omitted basis?"
  back: "Both compute it to `1 1 0%`; the spec says an omitted basis is `0`."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-grow-fraction
  front: "What happens when flex-grow factors add up to less than 1?"
  back: "Items take only that share of the free space. Two items with `flex-grow: 0.25` leave half of it unused; with basis `0` in a `400px` row each got `100px`. The spec intends growth to fade smoothly to zero."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-one-vs-auto
  front: "How do `flex: 1` and `flex: auto` differ when sharing space?"
  back: "`flex: 1` starts from a zero basis and ignores content, giving equal widths (`200 200`). `flex: auto` starts from content and shares only the extra, so sizes differ (`150 250` for `50px` and `150px` content in `400px`)."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-one-unequal-columns
  front: "Why can `flex: 1` columns come out unequal?"
  back: "The automatic minimum stops an item at its min-content width. Add `min-width: 0`."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-one-zero-gotcha
  front: "What does `flex: 1 0` compute to?"
  back: "`1 0 0%`. A unitless zero after one factor is the shrink factor, not the basis, so the item no longer shrinks."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-basis-vs-width
  front: "Which wins, `width` or `flex-basis`?"
  back: "A non-`auto` `flex-basis` replaces `width`: `width: 300px; flex-basis: 100px` is `100px` wide. `min-width` and `max-width` still clamp."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-basis-percent
  front: "What does a percentage `flex-basis` resolve against?"
  back: "The flex container's inner main size. If that size is indefinite, the used basis is `content`. A `flex-basis: 50%` item in a `600px` row was `300px` wide."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-shrink-padding
  front: "Does padding count in the flex-shrink ratio?"
  back: "No: the factor is scaled by the inner (content-box) base size. In a `300px` row, a `100px`-basis item with `100px` of left padding beside a `200px` item ended at `166.67px` and `133.33px` outer widths."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-resolve-algorithm
  front: "What are the steps of resolving flexible lengths for a flex line?"
  back: "Pick grow or shrink by comparing sizes, freeze inflexible items, compute initial free space, then loop: distribute by factor, clamp by min and max, sum the violations and freeze (zero: all; positive: min violators; negative: max violators), repeat."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-min-violation-example
  front: "Two `flex: 1 1 200px` items in `300px`, the first with `min-width: 180px`: what are the widths?"
  back: "`180` and `120`. Pass 1 targets `150` each; the first is clamped up to `180` (a positive violation) and freezes. Pass 2 gives the remaining `−80px` entirely to the second."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-base-ignores-min-max
  front: "Does clamping apply to the flex base size?"
  back: "No. Clamping happens for the hypothetical size and after distribution, never to the base size. That's why a max-clamped item is frozen early when growing."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-border-box-negative-base
  front: "What happens to `flex-basis: 0` with `20px` padding under `border-box`?"
  back: "The inner base size is negative. The spec allows this and floors it later."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-percent-basis-indefinite-column
  front: "What does a percentage `flex-basis` do in an auto-height column container?"
  back: "It falls back to `content`, because the container's height is indefinite. With `overflow: hidden`, a `flex-basis: 50%` item with `30px` of content was `30px` tall."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-sidebar-main
  front: "How do you write a fixed sidebar with a fluid main area, and why does main need `min-width: 0`?"
  back: "`.sidebar { flex: 0 0 240px }` and `.main { flex: 1; min-width: 0 }`. Without `min-width: 0`, a `1000px` child kept `.main` at `1000px` and overflowed the row; with it `.main` stayed `560px`."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: flex-use-flex-vs-width
  front: "Should you size flex items with `flex-basis` or `width`?"
  back: "Prefer `flex-basis` through the `flex` shorthand, which the spec recommends because it resets unspecified parts to useful values. Use `width` when the item may stop being a flex item."
  question: html-and-css/flexbox-and-grid/flex-sizing-algorithm
- id: ams-what-it-is
  front: "What is the automatic minimum size of flex and grid items?"
  back: "`min-width` and `min-height` start as `auto`. On ordinary blocks that means `0`, but flex and grid items get a content-based minimum, essentially min-content: the longest word or the widest image or fixed-width child."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-symptoms
  front: "What symptoms does the automatic minimum size cause?"
  back: "A `flex: 1` item stops shrinking at its min-content width and overflows. `text-overflow: ellipsis` never appears, a long URL or `<pre>` widens a column, and a nested scroll panel grows instead of scrolling."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-flex-rule
  front: "How does flexbox compute the content-based minimum?"
  back: "Main axis only, for items that aren't scroll containers: the min-content size, capped by the item's definite `width` (or `height`) and by its max size. A `width: 100px` item can shrink to `100px` but not further."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-grid-rule
  front: "When does grid apply the automatic minimum?"
  back: "Only when the item spans a track whose minimum sizing function is `auto`: `auto` tracks and `1fr` (which is `minmax(auto, 1fr)`). Fixed tracks don't enforce it."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-fixes
  front: "What are the fixes for the automatic minimum, most targeted first?"
  back: "`min-width: 0` on the item (`min-height: 0` in a column), `overflow: hidden | auto | scroll` (scroll containers have a zero minimum), or `minmax(0, 1fr)` in grid."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-overflow-clip
  front: "Does `overflow: clip` remove the automatic minimum?"
  back: "No. It isn't a scroll container, so it clips the paint but the layout still overflows. A `300px` child kept its item at `300px` with `overflow: clip`."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-spec-suggestion
  front: "What does the spec suggest for main content areas instead of the content-based minimum?"
  back: "A deliberate font-relative minimum such as `min-width: 12em`."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-min-width-placement
  front: "Where must `min-width: 0` go in nested flex containers?"
  back: "On the flex item, and on every nested flex item between the container and the wide content. An inner item without it stayed `300px` inside an outer item fixed at `200px`."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-block-axis
  front: "How does the automatic minimum bite in the block axis?"
  back: "In nested column flex containers, a `flex: 1` middle wrapper takes its content's height, so an inner `overflow: auto` list never scrolls. The wrapper grew to `500px` in a `200px` app; with `min-height: 0` it was `160px` and the list scrolled."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-width-caps-minimum
  front: "Does an explicit `width` let a flex item shrink further?"
  back: "No. The width caps the minimum, but it is still a minimum: in a `50px` row, a `width: 100px` item holding a `300px` child stayed `100px`."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-1fr-vs-minmax
  front: "Why does `1fr` overflow while `minmax(0, 1fr)` doesn't?"
  back: "`1fr` is `minmax(auto, 1fr)`, and an `auto` minimum makes the track's base size its items' minimum contributions, including their content-based minimum. `minmax(0, 1fr)` starts at zero and turns the automatic minimum off."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-scroll-container-exempt
  front: "Why are scroll containers exempt from the automatic minimum?"
  back: "Their content can be scrolled into view, so the spec gives them the usual zero automatic minimum. That is why `overflow: auto` on the item doubles as a fix."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-image
  front: "Why won't an image in a flex row shrink?"
  back: "Its content size suggestion is its natural width. A `400px`-wide SVG in a `200px` row stayed `400px`. `min-width: 0` or `max-width: 100%` (which caps the minimum) shrank it to `200px`."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: ams-width-100-min-content-300
  front: "A `width: 100px` flex item holds a `300px` child in a `50px` row. What are the widths with and without `min-width: 0`?"
  back: "`100px` without it, since the minimum is the smaller of min-content (`300px`) and the specified width (`100px`). `50px` with `min-width: 0`."
  question: html-and-css/flexbox-and-grid/automatic-minimum-size
- id: align-axes
  front: "Which axis do `justify-*` and `align-*` work on?"
  back: "`justify-*` works on the inline axis and `align-*` on the block axis. In flexbox, `justify-*` follows the main axis and `align-*` the cross axis, so `flex-direction: column` swaps them visually."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-content-subjects
  front: "What do `justify-content` and `align-content` move in grid and flex?"
  back: "They distribute space around the alignment subjects as a group: in grid, the tracks (visible only when smaller than the container); in flexbox, `justify-content` moves the items on each line and `align-content` moves the lines."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-content-nowrap
  front: "Does `align-content` do anything in a `nowrap` flex container?"
  back: "No. The single line fills the container's cross size. Use `align-items` or switch to `flex-wrap: wrap`, where the line is as tall as its content and `align-content: center` centres it."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-items-self
  front: "What do `*-items` and `*-self` do?"
  back: "`*-items` on the container sets the default `*-self` for every child. `*-self` aligns one item inside its alignment container: its grid area or, for `align-self`, its flex line."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-flex-no-justify-self
  front: "Does flexbox support `justify-self` or `justify-items`?"
  back: "No, they don't apply, since there is more than one item on the main axis. Use `justify-content` for the group and auto margins for individual items."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-auto-margins-first
  front: "In what order do auto margins and `justify-content` take effect in flexbox?"
  back: "Auto margins first. Positive free space goes to `auto` margins before `justify-content` and `align-self` run, so `margin-left: auto` pushes an item and everything after it to the end and leaves `justify-content` nothing."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-grid-margin-auto
  front: "What does `margin: auto` do on a grid item?"
  back: "Centres it in its area. A `50 × 20` item in a centred `100 × 40` cell landed at `175,10` in a `400px` grid. `place-self: center` also works."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-normal
  front: "What does the initial `normal` alignment value behave as?"
  back: "`stretch` for flex lines and for grid `auto` tracks. For grid items it stretches non-replaced boxes without a set size and start-aligns replaced ones like images."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-place-shorthand
  front: "In what order do the `place-*` shorthands take their values?"
  back: "Align value first: `place-items: end start` is `align-items: end; justify-items: start`. Reading it as x then y is a common mistake."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-gap
  front: "Where does `gap` add space?"
  back: "Between tracks or items only (`row-gap`, `column-gap`), never at the edges."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-safe
  front: "What does the `safe` keyword change, and where is it supported?"
  back: "When the item overflows it aligns as if `flex-start`, so content isn't pushed past the start edge where it can't be scrolled to. A `200px` item in a `100px` container started at `-50` with `center`, at `0` with `safe center`. Chrome 115, Firefox 63, Safari 17.6."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-grid-content-vs-items
  front: "In grid, how do `justify-content` and `justify-items` differ?"
  back: "`justify-content` moves the columns inside the container when they don't fill it. `justify-items` moves each item inside its own column area."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: align-auto-margin-vs-center
  front: "Does `justify-content: center` centre an item that also has an auto margin?"
  back: "No. Auto margins consume the free space first. In a `400px` row the auto margin took all `250px`, and `justify-self: end` was ignored."
  question: html-and-css/flexbox-and-grid/box-alignment
- id: track-kinds
  front: "What three kinds of track sizing functions are there?"
  back: "Fixed (a length or percentage), intrinsic (`min-content`, `max-content`, `auto`, `fit-content(limit)`, sized from the items), and flexible (`fr`, a share of the leftover space)."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-fr-leftover
  front: "What is an `fr` unit a share of?"
  back: "The leftover space: what remains after the other tracks and the gaps are sized. `100px 1fr 2fr` in `400px` gives `100 100 200`."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-bare-fr
  front: "What does a bare `1fr` mean, and why aren't `1fr 1fr` guaranteed equal?"
  back: "`minmax(auto, 1fr)`. Its `auto` minimum takes the items' content-based minimum, so a wide child forces its column open. `minmax(0, 1fr)` is the guaranteed-equal form."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-auto
  front: "What is an `auto` track, and how does it use leftover space?"
  back: "`minmax(auto, auto)`: at least the content minimum, up to max-content. When `justify-content` is `normal` or `stretch`, `auto` tracks share any space left at the end."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-auto-fill
  front: "How many tracks does `repeat(auto-fill, ...)` create?"
  back: "As many as fit in the container, gaps included, measuring each by its fixed max, or else its fixed min: `minmax(100px, 1fr)` counts as `100px`. If none fit it is one; with `150px` tracks and `gap: 10px` in `400px`, two."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-auto-fit
  front: "How does `auto-fit` differ from `auto-fill`?"
  back: "`auto-fit` collapses repeated tracks that no item occupies to `0`, gutters included, so `fr` tracks with items absorb the space. With enough items to fill every track, the two are identical."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-auto-fill-vs-fit-use
  front: "When do you pick `auto-fill` versus `auto-fit`?"
  back: "`auto-fill` keeps cell size consistent when there are few items, so a sparse row stays aligned with full rows. `auto-fit` stretches the few items to fill the row."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-repeat-indefinite
  front: "What does `repeat(auto-fill, ...)` do without a definite container size?"
  back: "Without a definite size, maximum or minimum on the container, the list repeats once."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-algorithm-steps
  front: "What are the five steps of the track sizing algorithm?"
  back: "Per axis, columns first then rows: initialise base sizes and growth limits, resolve intrinsic sizes from items, maximize tracks to their limits with free space, expand `fr` tracks, then stretch `auto` tracks."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-used-values
  front: "How can you inspect used track sizes?"
  back: "`getComputedStyle(grid).gridTemplateColumns` returns the used track sizes."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-percent-gap
  front: "What happens with `50% 50%` columns and `gap: 20px` in `400px`?"
  back: "They add up to `420px` and overflow. `1fr 1fr` gave `190px` each, since `fr` shares the space after gaps."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-fit-content-cap
  front: "Is `fit-content(150px)` a hard cap?"
  back: "No. Its minimum is still `auto`, so a `300px` child made the track `300px` wide. The limit doesn't clamp the automatic minimum."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-fr-fraction
  front: "What do `0.25fr 0.25fr` do in `400px`?"
  back: "Factors summing below 1 take only that fraction: each got `100px`, leaving `200px` empty. The sum of factors is floored at 1 when finding the `fr` size."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-auto-vs-fr
  front: "How do `auto` and `1fr` tracks differ in sharing space?"
  back: "`auto` tracks start from their content and share only the remaining space: with `50px` and `100px` items in `400px`, `auto auto` gave `175 225`. `fr` tracks share leftover space by factor from a zero base."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-base-growth
  front: "What are a track's base size and growth limit?"
  back: "The base size is how small it may be and only grows; the growth limit is where it wants to stop. A fixed minimum becomes the base size, a fixed maximum becomes the growth limit, and intrinsic or flexible maximums start at infinity."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-fr-restart
  front: "How does the `fr` size get resolved when a track's base size exceeds its share?"
  back: "The hypothetical `1fr` is leftover space ÷ sum of factors. If a track's base size is already larger, it is treated as fixed and the calculation restarts. `1fr 1fr 1fr` in `400px` with a `300px` child gave `300 50 50`."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-intrinsic-spans
  front: "In what order do items contribute to intrinsic track sizes?"
  back: "Items spanning one track first, then items spanning 2, 3 and so on content-sized tracks. Items crossing an `fr` track come last and put their space only into the flexible tracks."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-no-shrink
  front: "Does the track sizing algorithm shrink overflowing tracks?"
  back: "No. It has no shrink step like flexbox's, so a grid with fixed sizes or content minimums that exceed the container overflows it."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-indefinite-height
  front: "How does `fr` behave in an auto-height grid?"
  back: "The `fr` size is chosen so every flexible track fits its content at its ratio: `1fr 2fr` rows holding `50px` and `20px` items came out `50px 100px`. A `1fr` row only fills spare space when the container has a height or `min-height`."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-app-shell
  front: "What grid template makes a footer sit at the bottom and keeps wide content from breaking the layout?"
  back: "`grid-template-rows: auto 1fr auto` with `min-height: 100dvh`, and `grid-template-columns: 240px minmax(0, 1fr)`. A `600px` `<pre>` overflowed inside its cell instead of widening the page."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-fr-vs-percent
  front: "When should you prefer `fr` over `%`?"
  back: "`fr` shares space after gaps, percentages ignore them. Prefer `fr` unless a track must match a fraction of the container exactly."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: track-auto-stretch-start
  front: "Why does `100px auto` give `100px 300px` in `400px`, but `100px 50px` with `justify-content: start`?"
  back: "With `normal` the last step stretches `auto` tracks into the remaining space. `justify-content: start` turns that step off, so the track stays at its content size."
  question: html-and-css/flexbox-and-grid/grid-track-sizing
- id: place-line-numbers
  front: "How are grid lines numbered, and what does `-1` mean?"
  back: "From 1 at the start edge. Negative numbers count back from the end of the explicit grid, so `-1` is its last line. `grid-column: 1 / -1` spans the full explicit width."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-spans
  front: "How do you place an item with a span?"
  back: "`grid-column: span 2` starts wherever auto-placement puts it; `2 / span 2` starts at line 2."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-named-lines
  front: "How do named lines work, and what is created by a `foo-start` and `foo-end` pair?"
  back: "`grid-template-columns: [content-start] 1fr [content-end]` lets you write `grid-column: content-start / content-end`. A `-start`/`-end` pair also creates an implicit area, so `grid-column: content` works."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-template-areas
  front: "What are the rules for `grid-template-areas`?"
  back: "The layout is drawn as strings; each name must form one rectangle, and `.` marks an empty cell. Each area creates `name-start` and `name-end` lines, and `grid-area: main` places an item there."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-non-rectangular
  front: "What happens with a non-rectangular area such as `\"a a\" \"a b\"`?"
  back: "The whole `grid-template-areas` declaration is invalid and computes to `none`."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-implicit-tracks
  front: "What are implicit tracks and what sizes them?"
  back: "Items placed outside the explicit grid create them. They are sized by `grid-auto-rows` and `grid-auto-columns`, which default to `auto`."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-minus-one-explicit
  front: "Does `grid-column: 1 / -1` span implicit columns?"
  back: "No, `-1` is the end of the explicit grid. With two explicit `100px` columns and another item forced into column 3, a `1 / -1` item was still `200px` wide."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-auto-order
  front: "In what order does auto-placement place items?"
  back: "First items with a definite position, then items locked to a row, then the rest in order-modified document order. Explicitly placed items go first, so an unplaced item early in the DOM can end up last on screen."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-auto-flow
  front: "What does the auto-placement cursor do with `grid-auto-flow: row` versus `column`?"
  back: "With `row` (default) it moves across each row and down, adding rows as needed. `column` fills columns top to bottom and adds columns."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-sparse-dense
  front: "What is the difference between sparse and `dense` auto-placement?"
  back: "Sparse (default): the cursor never moves backwards, so items keep their order and holes can remain. `dense` restarts the search from the top for each item and fills holes with later, smaller items."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-dense-a11y
  front: "Why is `dense` risky on an ordered list such as search results?"
  back: "It fills holes with later items, so visual order no longer matches the reading order. Visual placement never changes reading or tab order; the DOM order must stay logical."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-overlap
  front: "What happens when grid items are placed in the same cells?"
  back: "They overlap. Later items in order-modified DOM order paint on top, and `z-index` works without `position`."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-sparse-vs-dense-example
  front: "With `repeat(3, 100px)` columns, spans of 2 for A and B, and a one-cell C, where does C go in sparse and `dense` flow?"
  back: "Sparse: row 2, column 3 (`200,20`), since B doesn't fit and the cursor never goes back. Dense: row 1, column 3 (`200,0`), filling the hole."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-area-implicit-lines
  front: "What implicit line names does an area `main` create?"
  back: "Both its row and column start lines get `main-start` and both end lines `main-end`. They don't appear in `grid-template-columns`, but placement can use them: `grid-column: main-start / main-end`."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: place-full-bleed
  front: "How do you make a full-bleed row inside a centred content column?"
  back: "Name the lines: `[full-start] 1fr [content-start] 200px [content-end] 1fr [full-end]`. Children get `grid-column: content`; a full-bleed child gets `grid-column: full`."
  question: html-and-css/flexbox-and-grid/grid-placement
- id: sub-independent-grid
  front: "Why can't cards in the same grid row align their inner parts without subgrid?"
  back: "A grid only lays out its direct children, so a grid item that is a grid gets an independent grid sized only from its own children. A short header in one card and a tall one in the next leave bodies and footers at different heights."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-what-it-does
  front: "What does `grid-template-rows: subgrid` mean on a grid item?"
  back: "Don't define tracks in this axis; use the ones I span in my parent. The subgrid's explicit tracks are the parent tracks it covers, and its children are laid out in the parent's track sizing."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-needs-span
  front: "What must a card have to get three subgrid rows?"
  back: "`grid-row: span 3`, since the subgrid has as many tracks as its span. With `grid-row: auto` it spans one row and all three children overlapped at offset `0`."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-shared-sizing
  front: "How are shared rows sized with subgrid?"
  back: "The tallest header, body and footer in the row size the parent's rows for every card. In the example the rows became `50`, `40` and `10`."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-line-numbers
  front: "What do line numbers and names mean inside a subgrid?"
  back: "Numbers restart at 1 on the subgrid's first line. The parent's line names are inherited, and named areas from the parent's `grid-template-areas` produce `-start` and `-end` names inside."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-no-implicit
  front: "Does a subgridded axis have implicit tracks?"
  back: "No. Items placed beyond its tracks are clamped into them: an item at `grid-column: 4` in a two-column subgrid landed in the second column."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-gaps
  front: "How do a subgrid's gaps relate to the parent's?"
  back: "Inherited by default (`gap: normal`). A subgrid may set its own; the difference is applied as extra margin on its inner items, so its gutters centre on the parent's."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-other-axis
  front: "Is the other axis of a subgrid also inherited?"
  back: "No, it stays independent unless it's subgridded too: `grid-template: subgrid / subgrid`."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-falls-back-none
  front: "When does `subgrid` behave as `none`?"
  back: "Without a parent grid, or when the box must be an independent formatting context, for example under `contain: layout`. A card with `contain: layout` stopped being a subgrid."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-padding-border
  front: "Do a subgrid's padding and border affect parent track sizes?"
  back: "Yes. The spec adds them as extra margin on the edge items when sizing parent tracks: a card with `padding-top: 40px` and a `20px` header made the shared first row `60px`, beating the other card's `50px` header."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-vs-display-contents
  front: "Why not use `display: contents` on the card instead of subgrid?"
  back: "It removes the card's box: its children become the parent's grid items and align, but the card loses its border, background, padding and own grid. Fixed heights were the other workaround and break on longer content."
  question: html-and-css/flexbox-and-grid/subgrid
- id: sub-support
  front: "Since when is subgrid supported?"
  back: "Firefox 71, Safari 16 and Chrome 117."
  question: html-and-css/flexbox-and-grid/subgrid
# 06 Positioning and stacking
- id: pos-containing-block-def
  front: "What is a containing block?"
  back: "The rectangle a box's insets (`top`, `right`, `bottom`, `left`, `inset`) and percentages resolve against. Each `position` value picks a scheme and with it a containing block."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-static
  front: "What does `position: static` do, and where does its containing block come from?"
  back: "Normal flow; insets don't apply. Its containing block comes from its formatting context, usually the content box of the nearest block container, so a static child's `width: 50%` means half the parent's content width."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-relative
  front: "What does `position: relative` do?"
  back: "The box is laid out exactly as static, then shifted visually by the insets. The space it left behind stays reserved, so siblings don't move."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-absolute-containing-block
  front: "What is the containing block of an `absolute` box?"
  back: "The padding box of the nearest ancestor that establishes an absolute positioning containing block (any `position` but `static`, plus `transform`, `filter`, `contain: layout`/`paint` and similar). With none, it is the initial containing block."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-initial-containing-block
  front: "What is the initial containing block, and why doesn't `bottom: 0` reach the page bottom there?"
  back: "A viewport-sized rectangle anchored at the top of the document, scrolling with it. With no positioned ancestor, `bottom: 0` ended at `768` on a 2000px page, the bottom of the first screen."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-absolute-out-of-flow
  front: "How does an absolutely positioned box affect layout?"
  back: "It is out of flow, so it no longer affects siblings or its parent's size. A parent containing only absolute children has zero content height unless it sets one."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-fixed
  front: "What is the containing block of a `fixed` box?"
  back: "The viewport, so it doesn't move when the page scrolls. Non-position properties such as `transform` and `filter` on an ancestor still capture it, but `position: relative` does not."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-sticky-summary
  front: "How does `position: sticky` behave?"
  back: "In flow like relative, but its offset is adjusted while scrolling to keep it inside the nearest scrollport, within its own containing block."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-relative-anchor
  front: "Why is `position: relative` with no insets the usual anchor for a child overlay?"
  back: "Every value except `static` makes the element a containing block for absolute descendants."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-inset-modified
  front: "What happens to the containing block of absolute and fixed boxes, and what is the static position?"
  back: "The insets shrink it into an inset-modified containing block. An axis with both insets `auto` keeps the box at its static position, where it would have been in flow."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-blockify-float
  front: "What else do absolute and fixed positioning change?"
  back: "They blockify the box (`display: inline` computes to `block`) and force `float` to `none`."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-padding-box-insets
  front: "Where do an absolute child's insets and percentages start from?"
  back: "The containing block's padding edge, not its content box. In the example `width: 50%` was half the 240px padding box."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-transform-captures-absolute
  front: "Does a `transform` on an ancestor affect absolute children?"
  back: "Yes. A `transform` or `filter` on any ancestor captures both absolute and fixed children before an outer `position: relative` does. In the exercise it gave `105 105` with `display: block` instead of the positioned `.b`'s offset."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-relative-top-percent
  front: "What does `top: 50%` do on a relative box whose parent has `height: auto`?"
  back: "In Chrome 155 and Firefox 158 it moved by `0`; with `height: 200px` on the parent it moved by `100`."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-center-auto-margins
  front: "Why does `position: absolute; inset: 0; margin: auto; width: 40px; height: 40px` centre the box?"
  back: "With no `auto` insets, the remaining space in the inset-modified containing block is split between the `auto` margins in each axis. In a 300×300 parent it landed at `130, 130`."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-absolute-width-auto
  front: "What sizes an absolute box with `width: auto`?"
  back: "With both horizontal insets set (and `justify-self: normal`), it stretches to fill the inset-modified containing block. If either inset is `auto`, it shrinks to fit its content."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-absolute-creators
  front: "Which properties make an ancestor an absolute positioning containing block?"
  back: "Any `position` other than `static`, `transform`, `translate`/`rotate`/`scale`, `perspective`, `filter`, `backdrop-filter`, `contain: layout` or `paint`, `content-visibility: auto`, and `will-change` naming one of those."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-not-containing-blocks
  front: "Which properties create other effects but are not containing blocks?"
  back: "`opacity`, `isolation`, `mix-blend-mode`, `clip-path`, `overflow` and `z-index`. `transform: none` and `filter: none` establish nothing either. `container-type: inline-size` and `size` weren't in Chrome 155 and Firefox 158."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-fixed-walk
  front: "How does the containing-block walk for `fixed` differ from `absolute`?"
  back: "It skips `position` and stops only at the non-position creators like `transform` or `filter`; failing that, the containing block is the layout viewport."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-absolute-layout-steps
  front: "What are the steps of the absolute layout model?"
  back: "Insets carve out the inset-modified containing block; `width`/`height` resolve (`auto` stretches or shrinks to fit); `auto` margins split the leftover space, and can go negative; the margin box is aligned inside that rectangle."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-grid-area-containing-block
  front: "How can an absolute child's containing block be narrowed inside a grid?"
  back: "When the containing block is a grid container, `grid-row`/`grid-column` on the absolute child can narrow it to a grid area."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-overflow-clip-absolute
  front: "When does `overflow` clip an absolute box?"
  back: "Only if the clipping element is its containing block or an ancestor of it. A menu inside a non-positioned `overflow: hidden` wrapper still received hits 60px below the wrapper's edge; with `position: relative` on the wrapper, those hits stopped."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-inline-ancestor
  front: "What is the containing block when the nearest positioned ancestor is an inline box?"
  back: "It is built from the first and last fragments' content edges, not a padding box. The spec still marks the multi-line case as an open issue."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-dropdown-clipped
  front: "Why is a dropdown clipped when its card has `position: relative; overflow: hidden`?"
  back: "The card is both its containing block and its clipper. Moving `position: relative` to a wrapper outside the card keeps the menu positioned but unclipped."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-relative-vs-transform-nudge
  front: "How do `position: relative; top` and `transform: translateY` differ as nudges?"
  back: "Both leave siblings undisturbed. Relative's only side effect is becoming a containing block for absolute descendants; `transform` animates cheaply but also creates a stacking context and captures fixed descendants."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: pos-overlap-grid
  front: "What is often better than absolute positioning for overlapping in-flow boxes, such as a caption on an image?"
  back: "Placing both in the same grid area, which overlaps them while still sizing the parent."
  question: html-and-css/positioning-and-stacking/position-and-containing-block
- id: sticky-definition
  front: "What is `position: sticky`?"
  back: "Relative positioning with an offset the browser recomputes as you scroll. The box is laid out in flow and keeps its space, like `relative`."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-view-rectangle
  front: "What is the sticky view rectangle?"
  back: "The scrollport of the nearest ancestor scroll container, shrunk by the box's non-`auto` insets. `top: 0` means the top edge of that scrollport."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-stops-at-containing-block
  front: "Why does a sticky section heading scroll away with the end of its section?"
  back: "The shift stops when the box reaches the edge of its containing block, usually its parent."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-no-inset
  front: "What does `position: sticky` do with `top`, `right`, `bottom` and `left` all `auto`?"
  back: "There is no edge to stick to, so it behaves like `relative`."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-wrong-scroll-container
  front: "Why does a sticky element under an `overflow: hidden` ancestor look dead?"
  back: "Any ancestor with `overflow` other than `visible` or `clip` is a scroll container, even `hidden`, which never scrolls. The element sticks to that ancestor, which moves with the page. `overflow-x: hidden` alone also counts."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-no-room
  front: "Why might a sticky sidebar in a flex or grid row not stick?"
  back: "Its containing block is barely taller than the box, so there's nowhere to slide. A sidebar stretched to the 600px row height scrolled away (`-100` at 100px of scroll); `align-self: start` kept it at `0`."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-multiple-stacking
  front: "How do multiple sticky boxes in one container behave, and what do they form?"
  back: "They are offset independently, so they can overlap. A sticky box always forms a stacking context, even with `z-index: auto`."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-overflow-x-hidden
  front: "What happens to a sticky header when the page wrapper has `overflow-x: hidden`?"
  back: "Its `overflow-y` computed to `auto`, and a `top: 0` header sat at `-500` after scrolling 500px. With `overflow-x: clip` it stayed at `0`."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-fix-overflow-hidden
  front: "How do you fix a sticky element under an `overflow: hidden` ancestor?"
  back: "Use `overflow: clip` if the ancestor only needs clipping, since it isn't a scroll container. Otherwise move the sticky element outside that ancestor, or make that ancestor the intended scroller with a real height."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-nearest-scroller
  front: "Does `top: 0` on a sticky element stick to the window?"
  back: "Only if the window is the nearest scroll container. It sticks to the nearest ancestor scroll container, whichever that is."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-bottom
  front: "What does `bottom: 0` do on a sticky element?"
  back: "It keeps the box from going below the scrollport's bottom edge. A footer laid out 500px down a 200px scroller sat at `170` until its natural position scrolled into view."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-top-only-direction
  front: "Can a sticky box with only `top` set be offset upwards?"
  back: "No. The sticky offset only pushes it down from its in-flow position. When its containing block's end edge arrives, the offset shrinks back toward zero, so the box leaves with its section."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-top-natural-position
  front: "With `top: 10px` on a sticky heading at natural position `0`, what is its offset at scroll 0?"
  back: "`10`. The natural position is already above the inset edge, so it's pushed down to `10`. It stays at `10` at scroll 50 and reaches `-10` at 270, where its section's end limits it."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: sticky-tight-parent
  front: "Why doesn't a heading stay put when its section is only its own height?"
  back: "Its containing block is barely taller than the box, so there is no room to slide."
  question: html-and-css/positioning-and-stacking/sticky-positioning
- id: z-index-local
  front: "What does `z-index` actually order?"
  back: "Boxes within one stacking context. A stacking context is painted atomically, so everything inside it finishes before anything outside it at a higher level."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-modal-trapped
  front: "Why does a toast at `z-index: 2` beat a `z-index: 9999` modal inside a card that forms a context?"
  back: "The comparison is between ancestors that are siblings in the same stacking context. The toast is above the whole card, modal included; the 9999 only competes with the card's other descendants."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-creators-position
  front: "Which positioning and layout cases create a stacking context?"
  back: "The root element; a positioned box with `z-index` other than `auto`; a flex or grid item with `z-index` other than `auto`, even unpositioned; and `position: fixed` or `sticky`, always."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-creators-effects
  front: "Which effect properties create a stacking context?"
  back: "`opacity` below 1; `transform` and its relatives other than `none`; `filter`, `backdrop-filter`, `clip-path`, `mask` other than `none`; `mix-blend-mode` other than `normal`; `isolation: isolate`; `contain: layout` or `paint`; and `will-change` naming any of these."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-index-applies-to
  front: "Where does `z-index` apply?"
  back: "Only to positioned boxes and to flex and grid items. On a static block it computes but does nothing: `9999` stacked nothing there but does on a flex or grid item."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-fix-losing-overlay
  front: "How do you fix an overlay that loses?"
  back: "Raise the stacking context, not the child: give the ancestor that forms the context a higher `z-index`, remove the property that created the context, or move the overlay out of it. Dialogs and popovers use the top layer."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-isolation
  front: "What is `isolation: isolate` for?"
  back: "It creates a stacking context with no other side effect, so a component's internal `z-index` values can't leak out and fight the page. It also makes the element a blending group, so a `mix-blend-mode` child no longer blends with the page behind."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-invisible-creators
  front: "Which invisible properties surprised the test browsers by creating a stacking context?"
  back: "`opacity: 0.99`, `transform: translateY(0)`, `filter: blur(0)` and `will-change: opacity` created one in both Chrome 155 and Firefox 158; `opacity: 1` did not."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-auto-vs-zero
  front: "How do `z-index: auto` and `z-index: 0` differ on a positioned parent?"
  back: "With `auto`, the box is painted as if a context but its positioned descendants are hoisted into the parent context, so a child's `z-index: 10` beat an outside `1`. With `0` it's a real context and traps its children."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-overflow-no-context
  front: "Does `overflow: hidden` create a stacking context?"
  back: "No. It clips and creates a scroll container and a BFC, but a child's `z-index: 10` still escaped it in both test browsers. `contain: paint` both clips and creates a context."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-container-type
  front: "Do `container-type: size` and `inline-size` create a stacking context?"
  back: "No. They apply size and style containment, not layout or paint containment; in Chrome 155 and Firefox 158 a child's `z-index` escaped them."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-showmodal-top-layer
  front: "How does a `showModal()` dialog beat every `z-index`?"
  back: "It is rendered in the top layer, painted after the whole document in its own ordering, so no `z-index` in the page can compete."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-paint-order
  front: "What is the paint order inside a stacking context, bottom to top?"
  back: "The context's own background and border; negative `z-index` child contexts; in-flow block backgrounds; floats; inline content; positioned `auto`/`0` descendants and level-0 contexts in tree order; positive `z-index` contexts."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-atomic-recursion
  front: "How are child stacking contexts painted?"
  back: "Atomically at their slot, by running the same steps on their own subtree. A descendant's `z-index` can only reorder it among steps of its nearest ancestor context."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-why-effects-create
  front: "Why do effects like `opacity` and `filter` create stacking contexts?"
  back: "The effect has to be applied to the subtree as one flattened image: you can't blur or fade half of an interleaved stack."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-negative-behind-parent
  front: "When does a negative `z-index` child go behind its parent's background?"
  back: "Only if the parent is not a stacking context. If the parent is a context (`z-index: 0`, `isolation: isolate`), its background is step 1 and the child's step 2 lands above it."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-will-change
  front: "When does `will-change: opacity` create a stacking context?"
  back: "Even before the property changes, by design, so the start of an animation doesn't reorder the page."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-hit-testing
  front: "How do hit testing and stacking contexts interact?"
  back: "Hit testing follows paint order, so a transparent stacking context on top swallows clicks. `pointer-events: none` on it lets them through without changing what's painted."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-header-widget-scenario
  front: "A sticky header at `z-index: 10` has a menu at `1000`, and a later chat widget is at `50`. Why does the menu open under it?"
  back: "Inside the header, `1000` is local to the header's context. The real comparison is header `10` versus widget `50`. Fix with a popover, a page-level layer scale, or `isolation: isolate` on components."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-global-scale
  front: "When does a global `z-index` scale work?"
  back: "Only if each value sits on an element that's a child of the root context. Once a value lands inside a nested context it is silently local."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: z-compositing-layers
  front: "Are stacking contexts the same as compositing layers?"
  back: "No, compositing layers are a separate browser concern. Creating contexts through `transform` or `will-change` to promote GPU layers changes stacking and containing blocks as a side effect."
  question: html-and-css/positioning-and-stacking/stacking-contexts
- id: fixed-transform-rule
  front: "How does a `transform` on an ancestor change `position: fixed` descendants?"
  back: "Any `transform` other than `none` establishes a fixed positioning containing block, so the element becomes the containing block for all descendants, absolute and fixed alike, using its padding box. The fixed box scrolls with it."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-transform-side-effects
  front: "What other side effects does a transformed ancestor bring for a fixed child?"
  back: "`width: 100%` means the ancestor's width, a transform also creates a stacking context so the `z-index` is trapped there, and ancestors' `overflow` can clip the box."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-capturing-list
  front: "Which properties capture fixed descendants like `transform`?"
  back: "`translate`, `rotate`, `scale` (even `translate: 0`), `perspective`, `transform-style: preserve-3d`, `filter` and `backdrop-filter` (except on the root), `contain: layout`/`paint`/`strict`/`content`, `content-visibility: auto`, and `will-change` naming any of these."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-not-capturing
  front: "Which properties do not capture fixed descendants?"
  back: "`opacity`, `isolation`, `mix-blend-mode`, `clip-path`, `overflow`, `z-index` and `container-type` (which applies size and style containment, not layout)."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-transform-rationale
  front: "Why does a transform capture fixed descendants?"
  back: "The spec states the rule without a rationale, but a transform maps its subtree into a new local coordinate system, so a descendant drawn there can't also stay pinned to the untransformed viewport."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-fixes
  front: "How do you fix a fixed element trapped by a transformed ancestor?"
  back: "Move it out of the transformed subtree (a portal to `<body>`), remove the transform once an animation finishes (`transform: none` releases it), or render it in the top layer as a popover or modal dialog."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-animation-end-state
  front: "Why can an animation's leftover `transform: translateY(0)` break a fixed descendant?"
  back: "It looks like a no-op but still captures fixed descendants; `transform: none` doesn't."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-will-change-wrapper
  front: "What does `will-change: transform` on a page wrapper do?"
  back: "It captures every fixed descendant in the app, even though it was added for performance."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-root-filter-exempt
  front: "Do `filter` and `transform` on `<html>` capture fixed descendants?"
  back: "`filter` on `<html>` doesn't capture, because the spec exempts the root; on any other element it does. `transform` on `<html>` is not exempt: a fixed box under a transformed root scrolled away (`-500` after scrolling 500px)."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-top-layer-escape
  front: "Do popovers and modal dialogs inside a transformed ancestor have this problem?"
  back: "No. Top-layer elements are rendered as siblings of the root, and a fixed one's containing block is the viewport. A `popover=\"manual\"` inside a transformed, `overflow: hidden` wrapper stayed at `0`; a plain fixed sibling went to `-400`."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-also-absolute-bg
  front: "Besides fixed boxes, what else does a transformed element capture?"
  back: "It is also the containing block for absolute descendants (before any outer positioned ancestor), and the spec includes `background-attachment: fixed` backgrounds inside it."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-perspective
  front: "Why does `perspective` capture fixed descendants when it doesn't move anything?"
  back: "The Transforms 2 spec defines it that way and notes in an issue that it probably doesn't need to, but web compatibility may prevent changing it."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: fixed-exercise-results
  front: "Among `opacity: 0.5`, `filter: grayscale(1)`, `will-change: opacity`, `container-type: inline-size` and `contain: paint`, which capture a fixed child?"
  back: "Only `filter` and `contain: paint`. The others create a stacking context at most, and their fixed children stayed at the top of the viewport."
  question: html-and-css/positioning-and-stacking/transform-breaks-fixed
- id: top-layer-definition
  front: "What is the top layer?"
  back: "An ordered set of elements the browser paints after the document. Each generates boxes as if it were a sibling of the root element, in its own stacking context above the document, untouched by ancestors' `overflow`, `opacity`, `transform`, `filter` or `z-index`."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-containing-block
  front: "What is a top-layer element's containing block and position?"
  back: "The viewport if it's `position: fixed`, otherwise the initial containing block. A `position` other than `absolute` or `fixed` computes to `absolute`."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-order
  front: "How are top-layer elements ordered?"
  back: "In the order they were added: the last one opened is on top, and `z-index` doesn't reorder them. A popover at `z-index: 999` opened first lay under one at `z-index: 1` opened second; reopening the first put it on top."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-entry-apis
  front: "How does an element enter the top layer?"
  back: "Authors can't do it directly: `dialog.showModal()`, `showPopover()` (or a `popovertarget` button) and `requestFullscreen()` do it. `dialog.show()` and the `open` attribute don't; that dialog is laid out in place and gets buried like anything else."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-backdrop
  front: "What is `::backdrop`?"
  back: "A pseudo-element on each top-layer element, painted directly beneath it and above everything earlier. The UA gives it `position: fixed; inset: 0`; a modal dialog's is `rgba(0, 0, 0, 0.1)`, a popover's transparent with `pointer-events: none`."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-backdrop-hit
  front: "What does `elementFromPoint` return at the viewport corner with a modal dialog open?"
  back: "The modal. Its `::backdrop` covers the viewport, and a pseudo-element hit-tests as its element."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-exit-animation
  front: "Why do exit animations break for top-layer elements?"
  back: "Closing takes the element out of the top layer at the next rendering update, cutting off the fade-out."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-overlay
  front: "What is the `overlay` property and how do you use it?"
  back: "Set only by the browser, it says whether an element is actually rendered in the top layer. Transition it with `transition: overlay 0.3s allow-discrete` (alongside `display`) to keep the element on top until the fade-out ends. Chrome 117+ only; not Firefox 158 or Safari."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-overlay-ua
  front: "Can you set `overlay: auto` yourself?"
  back: "No. The UA stylesheet has `* { overlay: none !important; }` plus an `!important` `overlay: auto` rule for each top-layer element. Authors can only control when the value flips by transitioning it."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-display-none-ancestor
  front: "Does the top layer override `display: none` on an ancestor?"
  back: "No. A popover inside a hidden `<div>` reported `:popover-open` but had a `0` width."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-show-vs-showmodal
  front: "What is the difference between `dialog.show()` and `showModal()` for stacking?"
  back: "Only `showModal()` uses the top layer. A non-modal dialog is clipped and stacked by its ancestors: in the example it stayed `absolute` and lost to a banner."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-overlay-chrome-156
  front: "What happened in Chrome 156 with only `display` transitioned on a fading popover?"
  back: "It kept `display: block` but fell below a `z-index: 10` banner for the rest of the transition; adding `overlay … allow-discrete` kept it on top."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-popover-transformed
  front: "What is a popover's containing block inside a transformed ancestor?"
  back: "The viewport, because popovers are `position: fixed` by default and top-layer rendering ignores ancestors. Anchor positioning places it next to its invoker again."
  question: html-and-css/positioning-and-stacking/top-layer
- id: top-layer-above-root
  front: "Where does the top layer sit relative to the root stacking context?"
  back: "Above it. The document paints the root's stacking context first, then each top-layer element's `::backdrop` and the element itself, in top-layer order."
  question: html-and-css/positioning-and-stacking/top-layer
- id: anchor-what
  front: "What does anchor positioning do?"
  back: "It lets an absolutely positioned box (`absolute` or `fixed`) place and size itself against another element's box, with no JavaScript measuring."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-name
  front: "How do you name an anchor, and what if names repeat?"
  back: "`anchor-name: --save` on the target. Names needn't be unique: the nearest ancestor wins, otherwise the last match in tree order. `anchor-scope: --save` limits a name to a subtree."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-position-anchor
  front: "What does `position-anchor` do and what is its initial value's behaviour?"
  back: "It picks the default anchor for the positioned box. The initial value `normal` uses the element's implicit anchor when `position-area` is set: a popover opened by a `popovertarget` button (or `showPopover({ source })`) gets that button."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-position-area
  front: "What does `position-area` do?"
  back: "It picks cells of a 3×3 grid formed by the anchor's edges and the containing block's edges, and makes that area the containing block; `auto` insets and margins become `0`. A single `top` spans the full width and centres on the anchor."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-function
  front: "What does the `anchor()` function give?"
  back: "A length for an inset: `top: anchor(bottom)` puts the box's top at the anchor's bottom. `anchor(--other right, 8px)` names another anchor with a fallback length."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-size
  front: "How do you size a box from its anchor?"
  back: "`anchor-size(width)` in sizing properties, margins or insets."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-try-fallbacks
  front: "How does a positioned box handle overflow?"
  back: "`position-try-fallbacks: flip-block, flip-inline` or named `@position-try` rules give alternatives tried in order when it overflows its inset-modified containing block. Without them, a tooltip with 10px above the button overlapped it."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-position-visibility
  front: "What happens by default when the anchor scrolls out of view or is clipped?"
  back: "The `position-visibility` default hides the positioned box."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-laid-out-before
  front: "What is the catch with anchor and positioned box placement in the tree?"
  back: "The anchor must be laid out before the positioned box. Roughly, it must sit inside the positioned box's containing block; an anchor in a different `position: relative` card is invisible to it."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-support
  front: "Which browsers support anchor positioning, and when did `normal` arrive?"
  back: "Chrome 125, Firefox 147 and Safari 26. The `normal` initial value arrived in Chrome 151, Firefox 151 and Safari 27."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-list-scope
  front: "What goes wrong when two list rows share `anchor-name: --row`?"
  back: "Both tooltips go to the last row. `anchor-scope: --row` on each row fixed it."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-anchor-misuse
  front: "Where is `anchor()` valid?"
  back: "Only in inset properties of an absolutely positioned box. Elsewhere it's invalid; on a box that isn't absolutely positioned it resolves to its fallback or invalidates the declaration at computed-value time."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-popover-implicit
  front: "How do you anchor a popover to its button without naming anything?"
  back: "Give the popover `position-area: bottom` and open it with `popovertarget`. The button becomes its implicit anchor; a 60px popover under a 100px button at `600, 200` landed at `620, 240`."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-missing-fallback
  front: "What happens if `anchor()` can't find its anchor?"
  back: "It uses its fallback argument; with none, the declaration is invalid at computed-value time, so the inset becomes `auto`. `top: anchor(bottom, 7px)` with an unreachable anchor put the box 7px down."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-with-top-layer
  front: "Why combine anchor positioning with the top layer?"
  back: "The top layer escapes clipping and `z-index`, but its containing block is the viewport, so the box loses its place on the page. Anchor positioning puts it back next to its invoker."
  question: html-and-css/positioning-and-stacking/anchor-positioning
- id: anchor-wrong-card
  front: "Why did a tooltip in a different card from its anchor stay at its static position?"
  back: "Its containing block (a `position: relative` card) doesn't contain the anchor, so the anchor isn't acceptable and `position-area` has no effect. As a child of `<body>` it centred under the anchor."
  question: html-and-css/positioning-and-stacking/anchor-positioning
# 07 Responsive design
- id: responsive-intrinsic-vs-conditional
  front: "What are the two ways to make a layout responsive, and which should you lead with?"
  back: "Intrinsic layout, where flex and grid respond to available space themselves, and conditional rules (media and container queries) that switch styles at a threshold. Lead with intrinsic layout."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-flex-wrap-technique
  front: "How does `flex-wrap: wrap` with a `flex-basis` make a layout responsive?"
  back: "Items sit side by side when they fit and stack when they don't, with no media query."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-grid-auto-fit-minmax
  front: "Which grid declaration makes as many columns as fit, without overflowing a narrow container?"
  back: "`repeat(auto-fit, minmax(min(12rem, 100%), 1fr))`. The `min()` stops the `12rem` minimum overflowing a container narrower than `12rem`."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-minmax-without-min
  front: "What happened in a 160px container with `minmax(12rem, 1fr)` and no `min()`?"
  back: "The track stayed `192px` and the grid overflowed by 32px. `minmax(min(12rem, 100%), 1fr)` gave one `160px` track."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-fluid-values
  front: "Which two functions cap line length and scale type and spacing between bounds?"
  back: "`width: min(100%, 70ch)` caps line length; `clamp()` scales type and spacing between bounds."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-breakpoints-for-structure
  front: "What are breakpoints for, if intrinsic layout handles size?"
  back: "Structural changes no algorithm can infer, such as navigation collapsing into a menu button or a table turning into cards."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-content-decides-breakpoints
  front: "How do you choose a breakpoint width?"
  back: "Content decides, not devices. Widen the window until the design looks wrong; that is the breakpoint. Device widths change every year."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-mobile-first
  front: "What does mobile-first mean for the CSS, and what is the real gain?"
  back: "Base styles are the narrow layout and `@media (width >= 48em)` adds to them. It barely helps performance, since every device downloads the whole stylesheet; the gain is in the cascade, with no desktop styles to reset."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-wcag-reflow
  front: "What does WCAG 1.4.10 Reflow require, and what window does it correspond to?"
  back: "Content usable at 320 CSS px wide, which is a 1280px window at 400% zoom. So the narrow layout matters on desktop too."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-em-breakpoints
  front: "What is `em` relative to inside a media query?"
  back: "The initial `font-size`, the user's default. Someone with larger text gets the narrower layout sooner, and the page's `html { font-size }` has no effect."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-component-container-queries
  front: "Why do components use container queries rather than viewport breakpoints?"
  back: "A card in a sidebar and in the main column sees the same viewport but different space."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-viewport-meta-missing
  front: "What happens without the viewport `<meta>`?"
  back: "Mobile browsers lay out at a desktop-sized width, so no query sees the phone's real width."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-wrap-point-computed
  front: "In the sidebar plus `.main` flex example, why does `.main` wrap under the nav below 640px?"
  back: "The sidebar wants `15rem` (240px) and `.main` has `flex-basis: 0` but a minimum of 60% of the container. Both fit only when `240 + 16 + 0.6W ≤ W`, so the wrap point is computed, not declared."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-wider-fewer-columns
  front: "In the intrinsic example, why did a wider viewport (639px to 640px) give fewer grid columns?"
  back: "The cards respond to their own slot, not the window: at 640px the sidebar sits beside `.main`, narrowing it. A viewport query can't express that."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-flex-grow-999
  front: "Why give `.main` `flex-grow: 999` next to a sidebar with `flex: 1 1 15rem`?"
  back: "Once the two sit side by side, nearly all free space goes to `.main` and the sidebar stays close to `15rem`."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-em-query-default-font
  front: "In Chrome 156 and Firefox 158, did a 1024px window match `(min-width: 40em)` with the browser default font size at 32px?"
  back: "No. 40em had become 1280px. With a 16px default it matched. `html { font-size: 10px }` changed neither result, and `rem` breakpoints behave the same."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-auto-min-overflow
  front: "A long URL or wide `<pre>` in a flex or grid item makes the page overflow. Why, and what fixes it?"
  back: "Flex and grid items have an automatic minimum width of roughly their min-content size, so they won't shrink. `min-width: 0` on the item fixes it."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-min-max-gap
  front: "Why does pairing `max-width: 767px` with `min-width: 768px` leave a gap?"
  back: "Fractional viewport widths (zoom, non-integer pixel ratios) fall between them. Range syntax (`width < 48em`, `width >= 48em`) has no gap."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-when-media-query-still
  front: "When do you still need a media query besides structural changes?"
  back: "When the change isn't a size adjustment: a different navigation pattern, hiding secondary content, switching a table to a list, or responding to user preferences like `prefers-reduced-motion`."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-test-layout
  front: "How do you test a responsive layout?"
  back: "Drag the window through every width instead of jumping between presets, zoom a 1280px window to 400%, and raise the browser's default font size."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: responsive-card-two-layers
  front: "A product card sits in a three-column listing grid and a 280px sidebar. How is it fixed in two layers?"
  back: "An intrinsic grid decides how many cards fit each slot, and a container query on the card's wrapper switches the card between stacked and horizontal at its own width."
  question: html-and-css/responsive-design/intrinsic-responsive-layout
- id: mq-what-it-tests
  front: "What is a media query, and where can one appear?"
  back: "A condition on the environment the document renders in, such as `screen and (width >= 48em) and (hover: hover)`. It appears in `@media`, `<link media>`, `<source media>` and `matchMedia()`."
  question: html-and-css/responsive-design/media-queries
- id: mq-media-types
  front: "Which media types are current, and what about `tv` and `handheld`?"
  back: "`all`, `screen` and `print`. The others (`tv`, `handheld`) are deprecated and never match."
  question: html-and-css/responsive-design/media-queries
- id: mq-combinators-comma
  front: "How do `and`, `or`, `not` and commas combine in a media query?"
  back: "Features sit in parentheses and combine with `and`, `or` and `not`. A comma-separated list matches if any query in it matches."
  question: html-and-css/responsive-design/media-queries
- id: mq-leading-not
  front: "What does a leading `not` negate in `not screen and (color)`?"
  back: "The whole query, type included: it means \"not (a colour screen)\"."
  question: html-and-css/responsive-design/media-queries
- id: mq-only-keyword
  front: "What does `only` do in a media query today?"
  back: "Nothing. It exists to hide a query from pre-media-query browsers."
  question: html-and-css/responsive-design/media-queries
- id: mq-range-syntax
  front: "What is range syntax in media queries, and which browsers support it?"
  back: "Comparison with `<`, `<=`, `>`, `>=` that can bound both sides, like `(400px <= width < 768px)`. Supported since Chrome 104, Firefox 102 and Safari 16.4."
  question: html-and-css/responsive-design/media-queries
- id: mq-min-max-inclusive
  front: "Are `min-width` and `max-width` inclusive or exclusive?"
  back: "Inclusive: they mean `>=` and `<=`."
  question: html-and-css/responsive-design/media-queries
- id: mq-width-vs-device-width
  front: "What does the `width` media feature measure, and why prefer it to `device-width`?"
  back: "`width` is the viewport, including any scrollbar. `device-width` is the screen's size, not the space the document has; it ignores window size and split screens, and the spec deprecates it."
  question: html-and-css/responsive-design/media-queries
- id: mq-hover-pointer
  front: "What do `hover` and `pointer` describe, and how do `any-hover` and `any-pointer` differ?"
  back: "`hover` and `pointer` (`none`/`coarse`/`fine`) describe the primary input. `any-hover` and `any-pointer` match if any input qualifies."
  question: html-and-css/responsive-design/media-queries
- id: mq-hover-not-desktop
  front: "Why is `hover: hover` a poor way to detect \"desktop\"?"
  back: "It describes only the primary input; the spec says a touchscreen device with an optional mouse should match `hover: none`. Use `any-hover` if any hover-capable input will do."
  question: html-and-css/responsive-design/media-queries
- id: mq-user-preference-features
  front: "Which media features report user preferences?"
  back: "`prefers-reduced-motion`, `prefers-color-scheme`, `prefers-contrast` and `forced-colors`."
  question: html-and-css/responsive-design/media-queries
- id: mq-relative-units-initial
  front: "What do `em` and `rem` resolve against in a media query?"
  back: "The initial font size, the user's default, ignoring page styles. So `html { font-size: 62.5% }` does not change them."
  question: html-and-css/responsive-design/media-queries
- id: mq-matchmedia
  front: "What does `matchMedia(query)` return, and how do scripts react to changes?"
  back: "A `MediaQueryList` with `.matches` and a `change` event, so scripts react to the same conditions as CSS."
  question: html-and-css/responsive-design/media-queries
- id: mq-unknown-feature-false
  front: "What does an unknown media feature like `(colour: red)` evaluate to, and what about `not (colour: red)`?"
  back: "Unknown, which counts as false. Negating unknown is still unknown, so `not (colour: red)` is also false. Chrome 156 and Firefox 158 agreed."
  question: html-and-css/responsive-design/media-queries
- id: mq-example-strict-vs-inclusive
  front: "At a 600px viewport, what do `(min-width: 600px)` and `(width > 600px)` return?"
  back: "`true` for `(min-width: 600px)` (inclusive) and `false` for `(width > 600px)`."
  question: html-and-css/responsive-design/media-queries
- id: mq-reduced-motion-change
  front: "In Chrome 156, what happened when `prefers-reduced-motion: reduce` was emulated?"
  back: "The `MediaQueryList` fired `change` with `matches: true`, and a `@media` rule setting `transition-duration: 0s` applied at the same time."
  question: html-and-css/responsive-design/media-queries
- id: mq-reduced-motion-meaning
  front: "What does `prefers-reduced-motion: reduce` require of you?"
  back: "The user asked the system to minimise non-essential motion, so remove or replace motion that can cause discomfort or distraction. The query only reports the setting; which animations to change is an accessibility decision."
  question: html-and-css/responsive-design/media-queries
- id: mq-min-orientation
  front: "Why does `(min-orientation: portrait)` evaluate to false, and what does `not` of it give?"
  back: "`orientation` is discrete and takes no `min-` prefix, so `min-orientation` is an unknown feature. Unknown is false, and so is its negation."
  question: html-and-css/responsive-design/media-queries
- id: mq-not-whole-query-example
  front: "At a 600px viewport, what does `not screen and (width < 600px)` return, and why?"
  back: "`true`. `not` negates the whole query, and `screen and (width < 600px)` is false at 600px."
  question: html-and-css/responsive-design/media-queries
- id: cq-media-vs-container
  front: "How does a container query differ from a media query?"
  back: "A media query asks about the viewport; a container query asks about an ancestor element, so a component adapts to the slot it's placed in."
  question: html-and-css/responsive-design/container-queries
- id: cq-two-steps
  front: "What are the two steps to use a container query?"
  back: "Make a query container with `container-type`, then query it with `@container name (width >= 400px) { … }`, which styles descendants."
  question: html-and-css/responsive-design/container-queries
- id: cq-container-type-values
  front: "What do `container-type: inline-size` and `container-type: size` allow queries on?"
  back: "`inline-size` allows queries on the inline size (width in horizontal writing); `size` allows both axes."
  question: html-and-css/responsive-design/container-queries
- id: cq-container-shorthand
  front: "What is the `container` shorthand?"
  back: "Name then type: `container: card-slot / inline-size` sets `container-name` and `container-type`."
  question: html-and-css/responsive-design/container-queries
- id: cq-unnamed-query
  front: "Which container does an unnamed `@container` query use?"
  back: "The nearest ancestor container that supports the features it tests."
  question: html-and-css/responsive-design/container-queries
- id: cq-containment-loop
  front: "Why does `container-type: inline-size` apply inline-size containment?"
  back: "A query that could change its container's size would loop: width triggers a style, the style changes the width. Containment cuts that dependency in the queried axis."
  question: html-and-css/responsive-design/container-queries
- id: cq-inline-size-containment-effect
  front: "What does inline-size containment do to the container's intrinsic size?"
  back: "Its inline-axis intrinsic size is computed as if it had no content, so it must get its width from outside, like a block in normal flow or a grid track."
  question: html-and-css/responsive-design/container-queries
- id: cq-shrink-to-fit-collapse
  front: "What happens to an inline-block, float or flex item with `flex-basis: auto` that has `container-type: inline-size`?"
  back: "As a shrink-to-fit box it collapses to `0` width. In the test, an inline-block and a flex item each holding a line of text were both `0` px wide."
  question: html-and-css/responsive-design/container-queries
- id: cq-size-type-height
  front: "What happens with `container-type: size` and no height set?"
  back: "The container's block size ignores its content too; it measured `0` px tall."
  question: html-and-css/responsive-design/container-queries
- id: cq-container-units
  front: "What are the container query units, and what do they fall back to with no container?"
  back: "`cqw`, `cqh`, `cqi`, `cqb`, `cqmin`, `cqmax`: 1% of the nearest suitable container. With none, they fall back to the small viewport units."
  question: html-and-css/responsive-design/container-queries
- id: cq-cqi-no-container
  front: "What did `width: 10cqi` compute to with no container in a 1000px viewport, and inside a 300px container?"
  back: "`100px` with no container (10% of the small viewport width) and `30px` inside a 300px container."
  question: html-and-css/responsive-design/container-queries
- id: cq-style-queries
  front: "What is a style query, and which elements are style containers?"
  back: "`@container style(--variant: compact)` tests a computed value. Every element is a style container by default."
  question: html-and-css/responsive-design/container-queries
- id: cq-no-self-query
  front: "Can an element query its own container type?"
  back: "No. An element never queries itself; `@container` rules on the element with `container-type` query its ancestors, and with none the rule silently doesn't apply."
  question: html-and-css/responsive-design/container-queries
- id: cq-size-support
  front: "Which browsers shipped size container queries, and when?"
  back: "Chrome 105, Firefox 110 and Safari 16."
  question: html-and-css/responsive-design/container-queries
- id: cq-nested-nearest-wins
  front: "An 800px container named `page` holds an unnamed 300px container. Does an unnamed `@container (width > 500px)` match a paragraph in both?"
  back: "No; the nearest container (300px) answers. `@container page (width > 500px)` did match. Chrome 156 and Firefox 159 agreed."
  question: html-and-css/responsive-design/container-queries
- id: cq-not-replace-media
  front: "Do container queries replace media queries?"
  back: "No. Page-level layout, user preferences (`prefers-*`), input type (`hover`, `pointer`) and print styles concern the environment, not an element."
  question: html-and-css/responsive-design/container-queries
- id: cq-why-not-measure-like-viewport
  front: "Why can't the browser measure a container like a media query measures the viewport?"
  back: "The viewport's size doesn't depend on the page, but a box's size depends on its content. Containment cuts that dependency so applying query results can't change the size that was queried."
  question: html-and-css/responsive-design/container-queries
- id: cq-containment-effects
  front: "What does `container-type` apply beyond marking the element?"
  back: "`inline-size` adds style and inline-size containment; `size` adds style and full size containment. Both make the box an independent formatting context. Its block size still grows with content under `inline-size`."
  question: html-and-css/responsive-design/container-queries
- id: cq-layout-containment-dropped
  front: "Did container-type apply layout containment in Chrome 156 and Firefox 159?"
  back: "No. Contain 3 (the Candidate Recommendation) applied layout containment, but the current CSS Conditional 5 draft dropped it, and both browsers follow the draft: `fixed` and `absolute` children still position against the viewport."
  question: html-and-css/responsive-design/container-queries
- id: cq-query-container-selection
  front: "How does the browser pick the query container for an element?"
  back: "From ancestors valid for every feature in the condition (`width` needs `inline-size` or `size`; `height` needs `size`), filtered by name if given, nearest first. If none qualifies, the query is unknown and its rules don't apply."
  question: html-and-css/responsive-design/container-queries
- id: cq-units-per-axis
  front: "Can `cqi` and `cqb` in the same rule come from different containers?"
  back: "Yes. Each is evaluated per axis: `cqi` uses the nearest container that accepts inline-size queries, `cqb` the nearest for block size. With none, `cqi` behaves like `svw` in horizontal writing."
  question: html-and-css/responsive-design/container-queries
- id: cq-style-query-standard-props
  front: "Did `style(display: flex)` match a `display: flex` parent in Chrome 156 and Firefox 159?"
  back: "No, although the spec allows it. `style(--variant: compact)` did match. Custom-property style queries shipped in Chrome 111, Firefox 151 and Safari 18."
  question: html-and-css/responsive-design/container-queries
- id: cq-pseudo-elements
  front: "How do pseudo-elements relate to container queries?"
  back: "They query their originating element's ancestors and can't be containers."
  question: html-and-css/responsive-design/container-queries
- id: cq-wrapper-trade-off
  front: "Why do container-query components often need an extra wrapper?"
  back: "The container can't be the element being restyled, so components need a wrapper, or the slot itself becomes the container."
  question: html-and-css/responsive-design/container-queries
- id: cq-formatting-context-floats
  front: "What side effect does a container's independent formatting context have on floats?"
  back: "The container contains its floats."
  question: html-and-css/responsive-design/container-queries
- id: cq-cqi-text-clamp
  front: "How should text combine `cqi` so user font settings still apply?"
  back: "Combine it with `rem` in `clamp()`, for example `clamp(1rem, 0.5rem + 3cqi, 2rem)`."
  question: html-and-css/responsive-design/container-queries
- id: cq-scroll-state
  front: "Which browsers support scroll-state queries (`container-type: scroll-state`)?"
  back: "Chrome since 133; not Firefox or Safari."
  question: html-and-css/responsive-design/container-queries
- id: cq-style-query-variant
  front: "How can a component variant like `compact` avoid a modifier class passed through every layer?"
  back: "Set it as a custom property and query it with `style(--card-variant: compact)`."
  question: html-and-css/responsive-design/container-queries
- id: cq-nested-queries
  front: "Can container queries be nested?"
  back: "Yes. Several nested `@container` rules can ask about different containers at once, for example `@container page (width > 60rem)` containing `@container (width < 20rem)`."
  question: html-and-css/responsive-design/container-queries
- id: units-em-reference
  front: "What is `em` relative to, and what is the exception?"
  back: "The element's own computed `font-size`. Inside `font-size` and other `font-*` properties it uses the parent's, so `font-size: 1.2em` multiplies at every level of nesting."
  question: html-and-css/responsive-design/relative-units
- id: units-rem-reference
  front: "What is `rem` relative to?"
  back: "The root element's computed `font-size`. On the root itself it uses the initial value, the user's default font size (16px unless changed)."
  question: html-and-css/responsive-design/relative-units
- id: units-percent-per-property
  front: "What does `%` resolve against?"
  back: "Each property defines its own reference. `width`, all four margins and all four paddings use the containing block's width (inline size), even `padding-top`. `font-size` uses the parent's font size; `line-height` the element's own."
  question: html-and-css/responsive-design/relative-units
- id: units-percent-height
  front: "When does `height: 50%` work?"
  back: "Only if the containing block's height is definite; otherwise it behaves as `auto`. It does nothing inside a parent with `height: auto`."
  question: html-and-css/responsive-design/relative-units
- id: units-ch
  front: "What is `ch`, and how exact is it as a character count?"
  back: "The advance width of the \"0\" glyph in the element's font (or `0.5em` if it can't be measured). Exact only in monospace fonts; in proportional fonts sixty `0` glyphs is not sixty characters."
  question: html-and-css/responsive-design/relative-units
- id: units-lh-rlh
  front: "What are `lh` and `rlh`?"
  back: "The computed `line-height` of the element or the root, for vertical rhythm."
  question: html-and-css/responsive-design/relative-units
- id: units-rem-for-scale
  front: "Why use `rem` for type scale and layout spacing?"
  back: "It follows the user's default font size, which `px` ignores."
  question: html-and-css/responsive-design/relative-units
- id: units-em-for-local
  front: "When is `em` the right unit?"
  back: "For things that should grow with local text: button padding, icon size, the gap next to a label."
  question: html-and-css/responsive-design/relative-units
- id: units-ch-for-measure
  front: "What is `ch` used for?"
  back: "Line length (`max-width: 65ch`) and inputs sized to their content (`width: 6ch`)."
  question: html-and-css/responsive-design/relative-units
- id: units-em-media-query
  front: "What do `em` and `rem` use in media queries?"
  back: "The initial font size, since no element is involved."
  question: html-and-css/responsive-design/relative-units
- id: units-example-values
  front: "A `.child` in a 20px, 400px-wide parent has `font-size: 1.5em`, `padding: 1em` and `padding-top: 10%`. What are its computed font size, left padding and top padding?"
  back: "`30px`, `30px` and `40px`. `1.5em` in `font-size` uses the parent's 20px, `1em` padding uses the child's own 30px, and `10%` is of the 400px containing block width."
  question: html-and-css/responsive-design/relative-units
- id: units-lh-example
  front: "With `line-height: 1.5` and `font-size: 30px`, what does `height: 2lh` compute to?"
  back: "`90px`: two 45px lines."
  question: html-and-css/responsive-design/relative-units
- id: units-em-nesting-compounds
  front: "Two nested elements each with `font-size: 1.5em` inside a 30px parent: what are their sizes, and does `rem` compound?"
  back: "`45px` then `67.5px`, because each level multiplies the last. `rem` doesn't compound."
  question: html-and-css/responsive-design/relative-units
- id: units-line-height-percent
  front: "Why is `line-height: 150%` a pitfall compared with unitless `1.5`?"
  back: "A percentage computes to a length and children inherit that length: a 40px child of a 10px parent got a `15px` line height. Unitless `1.5` gave `60px`."
  question: html-and-css/responsive-design/relative-units
- id: units-html-font-size-px
  front: "What happens to `html { font-size: 10px }` when the browser's default font size is 24px?"
  back: "The root stayed `10px`, ignoring the user's setting. `62.5%` gave `15px`, keeping the user's choice."
  question: html-and-css/responsive-design/relative-units
- id: units-zoom-vs-default-font
  front: "Doesn't page zoom make `px` and `rem` equivalent?"
  back: "For zoom, yes: it scales every CSS pixel. The difference is the browser's default font size setting, which changes `rem` and `em` but not `px`."
  question: html-and-css/responsive-design/relative-units
- id: units-em-line-height
  front: "What is `em` inside `line-height`, and what do `lh` and `rlh` do there?"
  back: "The element's own font size, like everywhere except font properties. Only `lh` and `rlh` switch to the parent's values when used in `line-height`."
  question: html-and-css/responsive-design/relative-units
- id: units-nested-list-exercise
  front: "With `li { font-size: 0.8em }`, how big is a third-level list item, and with `0.8rem`?"
  back: "About 8.2px (16 × 0.8³): Chrome 156 printed `8.192px`, Firefox 159 `8.18333px`. With `0.8rem` both printed `12.8px` at every level."
  question: html-and-css/responsive-design/relative-units
- id: vp-units-definition
  front: "What are viewport-percentage units 1% of?"
  back: "The initial containing block, which on screen is the viewport."
  question: html-and-css/responsive-design/viewport-units
- id: vp-lvh
  front: "What viewport size do `lvh` units assume, and what is the downside?"
  back: "The large viewport, with every retractable UI retracted. It is fixed so never causes relayout, but content can be hidden behind the toolbar when it's showing."
  question: html-and-css/responsive-design/viewport-units
- id: vp-svh
  front: "What viewport size do `svh` units assume, and what is the downside?"
  back: "The small viewport, with the UI expanded. It is fixed and `100svh` always fits, but leaves a gap once the toolbar hides."
  question: html-and-css/responsive-design/viewport-units
- id: vp-dvh
  front: "What do `dvh` units measure, and what does it cost?"
  back: "The current size, between small and large. It is exact but changes while the user scrolls, which can resize content mid-scroll and costs layout work. Browsers may hold the value during the toolbar animation."
  question: html-and-css/responsive-design/viewport-units
- id: vp-vh-is-large
  front: "Which viewport size are plain `vh` and `vw` defined as, and what bug does that cause?"
  back: "The large viewport. That's why `height: 100vh` heroes on phones had their bottom covered by the toolbar."
  question: html-and-css/responsive-design/viewport-units
- id: vp-why-default-large
  front: "Why are the default units the large viewport rather than the dynamic one?"
  back: "Stability. Large and small sizes change only when the viewport itself resizes, so content never relayouts during scrolling. Large also guarantees `100vh` fills the screen once the toolbar hides."
  question: html-and-css/responsive-design/viewport-units
- id: vp-variants-support
  front: "Which axis and min/max variants exist, and when did the `s`/`l`/`d` prefixes ship?"
  back: "`w`, `h`, `i` (inline), `b` (block), `min` and `max`, such as `svi` and `dvmax`. The new prefixes shipped in Chrome 108, Firefox 101 and Safari 15.4."
  question: html-and-css/responsive-design/viewport-units
- id: vp-keyboard
  front: "Do on-screen keyboards change viewport units?"
  back: "Usually not: they overlay the page and change none of these units."
  question: html-and-css/responsive-design/viewport-units
- id: vp-scrollbars
  front: "Do viewport units account for scrollbars?"
  back: "They are sized as if there were no scrollbar, unless the root's `overflow` (for example `overflow: scroll`) or `scrollbar-gutter` reserves space unconditionally."
  question: html-and-css/responsive-design/viewport-units
- id: vp-rule-of-thumb
  front: "Which unit for a hero that must fit on load, a full-screen app shell, and a backdrop with no gap?"
  back: "`min-height: 100svh` for the hero, `100dvh` for an app shell that must track the toolbar, and `lvh` for backgrounds that should never show a gap."
  question: html-and-css/responsive-design/viewport-units
- id: vp-dvh-everywhere
  front: "Why avoid `100dvh` everywhere?"
  back: "It resizes content while the user scrolls; reserve it for layouts that must track the visible area."
  question: html-and-css/responsive-design/viewport-units
- id: vp-100vw-scrollbar
  front: "What did `width: 100vw` do in Firefox 159 with classic scrollbars?"
  back: "The box was 1000px in a window whose content area was 985px, adding a horizontal scrollbar. `width: 100%` doesn't."
  question: html-and-css/responsive-design/viewport-units
- id: vp-overflow-scroll-root-firefox
  front: "Did `html { overflow-y: scroll }` fix the `100vw` overflow in Firefox 159?"
  back: "No: with classic scrollbars and that rule, `100vw` was still 1000px against a 985px content width. Headless Chrome uses overlay scrollbars, so it couldn't be checked there."
  question: html-and-css/responsive-design/viewport-units
- id: vp-vw-text
  front: "Why is sizing text in `vw` alone a problem?"
  back: "It ignores the user's default font size and doesn't grow with page zoom; combine it with `rem` in `clamp()`."
  question: html-and-css/responsive-design/viewport-units
- id: vp-vmin
  front: "What is `vmin` for?"
  back: "The smaller of `vw` and `vh`, for something that must fit both ways regardless of orientation. In a 1000 × 700 viewport, `50vmin` was `350px`."
  question: html-and-css/responsive-design/viewport-units
- id: vp-desktop-equal
  front: "On desktop Chrome 156 and Firefox 159, how do `svh`, `lvh`, `dvh` and `vh` compare?"
  back: "Equal: a desktop window has no retractable UI, so all four were the same 700px in a 700px-tall viewport."
  question: html-and-css/responsive-design/viewport-units
- id: fluid-min-function
  front: "What does `min(a, b, …)` return, and what does it effectively set?"
  back: "The smallest value, so it sets a maximum: `width: min(100%, 60rem)` is full width until 60rem, replacing `width` plus `max-width`."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-max-function
  front: "What does `max(a, b, …)` return, and what does it effectively set?"
  back: "The largest value, so it sets a minimum: `padding: max(1rem, 3vw)`."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-min-for-minimum
  front: "Why is `min(1rem, 2vw)` a wrong way to set a minimum?"
  back: "It is never more than `1rem`. A minimum needs `max()`."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-clamp-definition
  front: "What is `clamp(MIN, VAL, MAX)` equivalent to, and who wins if MIN exceeds MAX?"
  back: "Exactly `max(MIN, min(VAL, MAX))`. If MIN is greater than MAX, MIN wins."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-clamp-backwards
  front: "What did `clamp(3rem, 2.5vw, 1rem)` compute to?"
  back: "`48px` everywhere: MIN beats MAX."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-no-calc
  front: "Do you need `calc()` inside `clamp()`?"
  back: "No. Each argument is already a calculation, so `clamp(1rem, 1rem + 1vw, 3rem)` is valid as written."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-typography
  front: "How does fluid typography avoid jumps at breakpoints?"
  back: "A viewport-relative preferred value, like `font-size: clamp(1rem, 1rem + 1vw, 3rem)`, grows smoothly with the window. Container units (`cqi`) do the same per component."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-zoom-catch
  front: "Why does a pure-`vw` font size not grow when the user zooms?"
  back: "Zoom enlarges CSS pixels so the viewport has fewer of them. A `vw` value shrinks in CSS pixels by exactly as much as each pixel grows, so on screen it stays the same size."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-zoom-measurement
  front: "How did a `2.5vw` heading behave at emulated 100%, 200% and 300% zoom?"
  back: "It stayed 30 device pixels at all three, and it ignored the user's default font size too."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-wcag-f94
  front: "Which WCAG criterion and failure technique apply to text sized with viewport units?"
  back: "SC 1.4.4 requires text to be resizable to 200%; failure F94 is text sized mainly with viewport units."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-rem-in-preferred
  front: "What is the fix for the zoom catch, and why does it work?"
  back: "Give `rem` part of the preferred value, because only the `rem` part scales. At zoom `z`, rendered size is `z × rem part + vw part`. Keep the `vw` coefficient small and the bounds in `rem`."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-wcag-higher-zoom
  front: "Does WCAG require text to double at exactly 200% zoom?"
  back: "No: the Understanding document allows reaching 200% at a higher zoom level; its example halves the font size at 400% zoom and still counts the text as twice as large."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-vw-only-clamp
  front: "What happened to `clamp(1rem, 2.5vw, 3rem)` at 100% and 200% zoom in a 1280px window?"
  back: "It rendered 32 device px at both; it grows only once zoom pushes it onto the `1rem` floor."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-px-bounds
  front: "Why avoid `px` bounds in `clamp()`?"
  back: "They don't follow the user's default font size; `rem` bounds do."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-example-results
  front: "With `clamp(1rem, 1rem + 1vw, 3rem)`, what did the heading render at 1200px/100% and 300% zoom (400px viewport)?"
  back: "28 device px at 100% and 60 at 300%, reaching 2× (56px) only at 300%. Chrome 156 and Firefox 159 agreed."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-derive-preferred
  front: "How do you derive the preferred value for 16px at 320px wide and 32px at 1280px?"
  back: "Slope = (32 − 16) ÷ (1280 − 320) = 1/60 per px, i.e. `1.6667vw`. Intercept = 16 − 320 ÷ 60 ≈ 10.67px = `0.6667rem`. Result: `clamp(1rem, 0.6667rem + 1.6667vw, 2rem)`."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-14-4-text-only
  front: "Is WCAG 1.4.4 about text-only zoom?"
  back: "No. It only requires resizing to 200% without assistive technology; the Understanding document lists page zoom, text-only resizing and a configured text size as ways user agents do it. F94 says viewport-unit text defeats most of them."
  question: html-and-css/responsive-design/fluid-sizing-clamp
- id: fluid-size-at-800
  front: "What does `clamp(1rem, 0.6667rem + 1.6667vw, 2rem)` give at 800px, 320px and 1280px+?"
  back: "About 24px at 800px (Firefox 159 printed `24px`, Chrome 156 `24.0008px` from rounded coefficients), 16px at 320px, and `32px` from 1280px up."
  question: html-and-css/responsive-design/fluid-sizing-clamp
# 08 Modern CSS
- id: cp-what-is
  front: "What is a custom property, and how does it behave in the cascade and inheritance?"
  back: "Any property whose name starts with `--`. It goes through the cascade like `color`, and unregistered it inherits by default. Names are case-sensitive: `--accent` and `--Accent` are two properties."
  question: html-and-css/modern-css/custom-properties
- id: cp-token-list
  front: "What does CSS check about a custom property's value at parse time?"
  back: "Essentially nothing. The value is a token list, because CSS doesn't know what it will be used for; `--accent: 20px` is valid."
  question: html-and-css/modern-css/custom-properties
- id: cp-var-computed-value-time
  front: "When is `var(--accent, red)` substituted?"
  back: "At computed-value time."
  question: html-and-css/modern-css/custom-properties
- id: cp-fallback-when
  front: "When does the `var()` fallback apply?"
  back: "Only when the custom property has the guaranteed-invalid value: never set, set to `initial`, or part of a cycle. Otherwise its value is substituted even if invalid for the target property; the fallback is not a type check."
  question: html-and-css/modern-css/custom-properties
- id: cp-no-fallback-invalid
  front: "What if the custom property is guaranteed-invalid and `var()` has no fallback?"
  back: "The declaration is invalid at computed-value time."
  question: html-and-css/modern-css/custom-properties
- id: cp-invalid-at-computed-value-time
  front: "What happens when a substituted `var()` value doesn't match the property's grammar?"
  back: "The declaration is invalid at computed-value time. The cascade already discarded the others, so the property behaves as `unset`: inherited properties take the parent's value, others their initial value."
  question: html-and-css/modern-css/custom-properties
- id: cp-typo-vs-var
  front: "Why does `color: 20px` differ from `color: var(--accent)` with `--accent: 20px`?"
  back: "`color: 20px` is dropped at parse time, so an earlier `color` still applies. The `var()` declaration is kept, wins the cascade, then fails, so the text inherits its colour instead."
  question: html-and-css/modern-css/custom-properties
- id: cp-var-in-custom-resolved-early
  front: "Where is `var()` inside a custom property resolved?"
  back: "On the element that declares it, and the result is what inherits. Derived variables on `:root` don't react to overrides further down."
  question: html-and-css/modern-css/custom-properties
- id: cp-example-outputs
  front: "With `.card { color: blue; --accent: 20px }`, what colour does `color: var(--accent, red)` give a child?"
  back: "Blue (`rgb(0, 0, 255)`): the fallback is skipped and the invalid value acts as `unset`, so the child inherits blue. Chrome 156 and Firefox 159 agreed."
  question: html-and-css/modern-css/custom-properties
- id: cp-earlier-declaration-discarded
  front: "In `color: green; color: var(--accent);` with `--accent: 20px`, what colour results?"
  back: "The inherited colour (blue in the example), not green. The `var()` declaration wins the cascade and green is discarded."
  question: html-and-css/modern-css/custom-properties
- id: cp-undefined-fallback
  front: "What does `color: var(--missing, red)` give when `--missing` is never set?"
  back: "Red. The property is guaranteed-invalid, so the fallback is used."
  question: html-and-css/modern-css/custom-properties
- id: cp-non-inherited-fallback-initial
  front: "What does `background-color: var(--accent)` with `--accent: 20px` compute to?"
  back: "`rgba(0, 0, 0, 0)`: `background-color` doesn't inherit, so the failed declaration falls to its initial `transparent`."
  question: html-and-css/modern-css/custom-properties
- id: cp-fallback-before-var
  front: "What does writing a fallback declaration before a `var()` one protect against?"
  back: "Browsers that can't parse `var()`, not a bad value."
  question: html-and-css/modern-css/custom-properties
- id: cp-derived-space-pitfall
  front: "Why doesn't overriding `--base` on a component change `--space: calc(var(--base) * 2)` defined on `:root`?"
  back: "`--space` was already computed at the root, so the component inherits `16px`. Redeclaring `--space` where `--base` changes recomputes it."
  question: html-and-css/modern-css/custom-properties
- id: cp-glue-units
  front: "Why does `var(--gap)px` fail, and what is the fix?"
  back: "It gives two tokens (`20` and `px`), so the declaration fails. Use `calc(var(--gap) * 1px)`."
  question: html-and-css/modern-css/custom-properties
- id: cp-reset-initial
  front: "How do you reset a custom property so fallbacks apply again, and how does `--accent: ;` differ?"
  back: "`--accent: initial` sets the guaranteed-invalid value, so `var(--accent, red)` gave red. `--accent: ;` is a valid empty value, so `var(--accent, red)` substituted nothing and inherited."
  question: html-and-css/modern-css/custom-properties
- id: cp-var-limits
  front: "Where can `var()` be used?"
  back: "Only in property values, not selectors, property names or media query conditions. `@media (width > var(--bp))` never matched in Chrome 156 or Firefox 159. Container style queries can test a custom property's value instead."
  question: html-and-css/modern-css/custom-properties
- id: cp-unregistered-animation
  front: "How do unregistered custom properties animate?"
  back: "Discretely: a `@keyframes` animation from `--v: a` to `--v: b` read `a` at 499 ms of 1 s and `b` at 500 ms. Registering a type with `@property` makes them interpolate."
  question: html-and-css/modern-css/custom-properties
- id: cp-spec-definition
  front: "How does the spec define the `--*` property?"
  back: "Value `<declaration-value>?` (almost any tokens), initial value the guaranteed-invalid value, inherited, computed value the specified value with variables substituted."
  question: html-and-css/modern-css/custom-properties
- id: cp-parse-time-rejects
  front: "What does the parser reject in a custom property declaration?"
  back: "Only unmatched closing brackets, top-level semicolons and a few bad tokens. A declaration using `var()` is kept without checking, since its final value is unknown."
  question: html-and-css/modern-css/custom-properties
- id: cp-important-cascade
  front: "How does `!important` work on a custom property?"
  back: "Each `--*` name is its own property in the cascade, so `!important` applies to the custom property's own cascade; it is not carried into the value."
  question: html-and-css/modern-css/custom-properties
- id: cp-token-substitution
  front: "Is `var()` substitution text-level or token-level?"
  back: "Token-level: you can't build a single token, such as `20px`, from two parts."
  question: html-and-css/modern-css/custom-properties
- id: cp-dense-fixed
  front: "What did `getPropertyValue(\"--space\")` return on an element inheriting `--space` from `:root`?"
  back: "`calc(8px * 2)`, already resolved with the root's `--base`. Redeclaring `--space` on the element where `--base` changes, as `.fixed` did, recomputes it."
  question: html-and-css/modern-css/custom-properties
- id: cp-cycles
  front: "What happens with `--one: var(--two); --two: var(--one);`?"
  back: "Both become guaranteed-invalid, so `width: var(--one, 7px)` used `7px`. `--x: var(--x)` is also a cycle of one, so there is no way to read the parent's value of the same name."
  question: html-and-css/modern-css/custom-properties
- id: cp-empty-value
  front: "Is `--a: ;` valid, and what about `var(--a,)`?"
  back: "`--a: ;` is a valid empty value, and `var(--a,)` has a valid empty fallback."
  question: html-and-css/modern-css/custom-properties
- id: cp-wide-keywords
  front: "Can a custom property hold the value `initial`?"
  back: "No; `--x: initial` resets the custom property itself. A fallback can: `color: var(--missing, initial)` behaves as `color: initial`."
  question: html-and-css/modern-css/custom-properties
- id: cp-shorthand-var
  front: "Can one variable fill several longhands?"
  back: "Yes. `margin: var(--m, 4px)` with `--m: 1px 2px` computed to `1px 2px`."
  question: html-and-css/modern-css/custom-properties
- id: cp-whitespace
  front: "Is whitespace around a custom property's value kept?"
  back: "No; leading and trailing whitespace is trimmed. `--x:   red  ;` read back as `\"red\"` in both browsers."
  question: html-and-css/modern-css/custom-properties
- id: cp-js-setproperty
  front: "How can JavaScript drive styles through custom properties?"
  back: "`el.style.setProperty(\"--x\", \"9px\")` changed the computed `margin` of an element using `var(--x)` immediately, with no class juggling."
  question: html-and-css/modern-css/custom-properties
- id: cp-tradeoffs
  front: "What are the downsides of unregistered custom properties?"
  back: "No types, so errors surface as `unset` at computed-value time far from the cause; discrete animation until registered; global reach of a token set on `:root`; and values only, not selectors or media conditions."
  question: html-and-css/modern-css/custom-properties
- id: cp-inline-gap-margin-exercise
  front: "What margin-top results from `margin-top: 10px; --gap: 20; margin-top: var(--gap)px;`?"
  back: "`0px`. The second declaration wins, then substitutes to `20 px`, invalid for `margin-top`, so it acts as `unset`. `margin-top` doesn't inherit, so it takes its initial `0`."
  question: html-and-css/modern-css/custom-properties
- id: prop-what-it-is
  front: "What does `@property` turn a custom property into?"
  back: "Something close to a built-in property, with a `syntax`, an `inherits` flag and an `initial-value`. A plain custom property is an untyped token list that inherits everywhere and starts guaranteed-invalid."
  question: html-and-css/modern-css/registered-properties
- id: prop-animation
  front: "Why can a registered `<angle>` property animate where an unregistered one can't?"
  back: "Transitions and keyframes interpolate it by its type. Unregistered, `--angle` from `0deg` to `360deg` is discrete; registered, it passes through `90deg`. That is how you animate a gradient angle or a colour stop."
  question: html-and-css/modern-css/registered-properties
- id: prop-computed-type
  front: "How does a registered `<length>` compute `--x: 8em` with `font-size: 10px`?"
  back: "To `80px`, so children inherit a length, not tokens to re-resolve."
  question: html-and-css/modern-css/registered-properties
- id: prop-initial-no-fallback
  front: "Does a `var()` fallback ever apply to a registered property?"
  back: "No. It is never guaranteed-invalid because it always has a value: with `initial-value: 4px` and nothing set, `var(--size, 99px)` gave `4px`."
  question: html-and-css/modern-css/registered-properties
- id: prop-inherits-false
  front: "What does `inherits: false` do?"
  back: "A value set on a parent doesn't reach its children; they get the initial value. Set the value on the element that uses it, not a wrapper."
  question: html-and-css/modern-css/registered-properties
- id: prop-type-check-late
  front: "When is a registered syntax checked, and what happens to a wrong value?"
  back: "At computed-value time, not parse time. A wrong value still wins the cascade, then makes the custom property itself act as `unset`, so its inherited or initial value is substituted."
  question: html-and-css/modern-css/registered-properties
- id: prop-wrong-type-earlier
  front: "With `<length>` and `initial-value: 4px`, what does `--size: 10px; --size: red;` give?"
  back: "`4px`, not `10px`. The wrong-typed declaration still wins the cascade."
  question: html-and-css/modern-css/registered-properties
- id: prop-required-descriptors
  front: "Which `@property` descriptors are required?"
  back: "`syntax` and `inherits`. `initial-value` is required unless the syntax is `\"*\"`, and it must be computationally independent."
  question: html-and-css/modern-css/registered-properties
- id: prop-relative-initial
  front: "What happens with `initial-value: 1em`?"
  back: "It is not computationally independent (`var(--x)` is rejected too), so the whole rule is dropped and the property stays unregistered. Both browsers left it out of `cssRules` entirely, with no report."
  question: html-and-css/modern-css/registered-properties
- id: prop-registration-scope
  front: "How global are registrations, and which registration wins?"
  back: "Registrations are document-global, even from a shadow tree. The last `@property` wins; `CSS.registerProperty()` beats both."
  question: html-and-css/modern-css/registered-properties
- id: prop-support
  front: "Which browsers support `@property`, and since when?"
  back: "Chrome 85, Firefox 128, Safari 16.4."
  question: html-and-css/modern-css/registered-properties
- id: prop-keyframe-quarter
  front: "At 250 ms of a 1 s keyframe animation to `--angle: 360deg`, what do a registered `--angle` and an unregistered `--plain` read?"
  back: "`90deg` for the registered one; `--plain` still `0deg`, jumping to `360deg` at the halfway point. Chrome 156 and Firefox 159 agreed."
  question: html-and-css/modern-css/registered-properties
- id: prop-supports-registered
  front: "Does `@supports (--size: red)` fail when `--size` is registered as `<length>`?"
  back: "No. Custom properties accept nearly any value at parse time, registered or not, so `CSS.supports(\"--size: red\")` returned `true`."
  question: html-and-css/modern-css/registered-properties
- id: prop-transition
  front: "What does `transition: --w 1s` do on an unregistered versus a `<length>` registered `--w`?"
  back: "Unregistered: no transition, the value switches at once. Registered as `<length>`: one `CSSTransition`, at `50px` halfway from `0px` to `100px`."
  question: html-and-css/modern-css/registered-properties
- id: prop-registerproperty-errors
  front: "What errors does `CSS.registerProperty()` throw?"
  back: "`InvalidModificationError` for a name already registered by it; `SyntaxError` for a relative `initialValue`."
  question: html-and-css/modern-css/registered-properties
- id: prop-var-fallback-syntax
  front: "Must a `var()` fallback match the registered syntax?"
  back: "The 2024 Working Draft said yes, even when unused; the editor's draft dropped that rule. Chrome 156 and Firefox 159 follow the draft: `width: var(--size, red)` with `--size: 10px` gave `10px`."
  question: html-and-css/modern-css/registered-properties
- id: prop-color-exercise
  front: "With `--c` registered as `<color>`, `initial-value: black`, `inherits: true`, what colour does `p { --c: 12px; color: var(--c); }` get inside a `color: blue` box?"
  back: "Black. `12px` fails the `<color>` syntax, so `--c` acts as `unset`: it inherits, no ancestor sets it, so it takes `initial-value: black`. Unregistered, `color` itself would fail and inherit blue."
  question: html-and-css/modern-css/registered-properties
- id: has-what
  front: "What does `:has()` change about what selectors can express?"
  back: "Selectors used to look only down and forward. `:has()` lets the subject depend on what's around it, taking a relative selector anchored at the element being tested."
  question: html-and-css/modern-css/has-selector
- id: has-descendant-child
  front: "What do `.card:has(img)` and `.card:has(> img)` match?"
  back: "`.card:has(img)`: a card containing an image anywhere. `.card:has(> img)`: a card with an image child. Use `> img` when nested cards would otherwise make an outer card match."
  question: html-and-css/modern-css/has-selector
- id: has-previous-sibling
  front: "How does `:has()` give previous-sibling selection?"
  back: "`h2:has(+ p)` is a heading immediately followed by a paragraph; `h2:has(~ .note)` is a heading with any later sibling `.note`."
  question: html-and-css/modern-css/has-selector
- id: has-state
  front: "Give examples of `:has()` reacting to state without JavaScript."
  back: "`form:has(:invalid)`, `label:has(+ input:invalid)` and `html:has(#dark:checked)`."
  question: html-and-css/modern-css/has-selector
- id: has-quantity
  front: "How does `:has()` simplify quantity queries?"
  back: "`ul:has(> li:nth-child(4))` matches lists with four or more items."
  question: html-and-css/modern-css/has-selector
- id: has-no-nesting
  front: "Can `:has()` be nested inside `:has()`?"
  back: "No, not even wrapped in `:is()` or `:not()`. `selector(:is(:has(a)))` was supported, but `:has(:is(:has(a)))` and `:has(:not(:has(a)))` were not."
  question: html-and-css/modern-css/has-selector
- id: has-no-pseudo-elements
  front: "Can pseudo-elements appear inside or after `:has()`?"
  back: "No. Pseudo-elements aren't allowed inside it, and it can't follow one: `::before:has(a)` is invalid."
  question: html-and-css/modern-css/has-selector
- id: has-unforgiving
  front: "What happens to `:has(.a, :foo)` when `:foo` is unknown?"
  back: "The whole selector is invalid, so the rule is dropped. The list was forgiving until a 2022 spec change. Use separate rules, or wrap the arguments in `:is()`, which is forgiving."
  question: html-and-css/modern-css/has-selector
- id: has-specificity
  front: "What specificity does `:has()` contribute?"
  back: "That of its most specific argument, like `:is()`: `div:has(#target)` is (1, 0, 1) and beat `div.k.l`. Wrap in `:where()` to make it zero."
  question: html-and-css/modern-css/has-selector
- id: has-not-order
  front: "How do `section:not(:has(h2))` and `section:has(:not(h2))` differ?"
  back: "The first is a section with no `h2`; the second is a section with any non-`h2` descendant."
  question: html-and-css/modern-css/has-selector
- id: has-js
  front: "Does `:has()` work in JavaScript selector APIs?"
  back: "Yes, in `querySelectorAll` and `matches`. An invalid use like `document.querySelector(\":has(:has(a))\")` throws a `SyntaxError`."
  question: html-and-css/modern-css/has-selector
- id: has-support
  front: "Which browsers support `:has()`, and since when?"
  back: "Chrome 105, Firefox 121, Safari 15.4."
  question: html-and-css/modern-css/has-selector
- id: has-detect
  front: "How do you test for `:has()` support?"
  back: "`@supports selector(:has(a))` in CSS or `CSS.supports(\"selector(:has(a))\")` in JavaScript. Both browsers returned `false` for `selector(:has(:has(a)))`, so the same check catches invalid uses."
  question: html-and-css/modern-css/has-selector
- id: has-label-before-input
  front: "In the example, why can a `label` before an `input` react to its validity?"
  back: "`label:has(+ input:invalid)` looks at the following sibling, and it updates as soon as the value changes (red when invalid, black after entering `a@b.co`)."
  question: html-and-css/modern-css/has-selector
- id: has-sections-exercise
  front: "Given `section:has(:not(h2)) { background: yellow }`, which sections match: one with `h2` and `p`, one with only an `h2`?"
  back: "Only the first: it has a descendant that isn't an `h2` (the `p`). The `h2`-only section does not."
  question: html-and-css/modern-css/has-selector
- id: nest-what
  front: "What can a native nested style rule contain?"
  back: "Other style rules and group rules: `@media`, `@supports`, `@container`, `@layer`, `@scope`."
  question: html-and-css/modern-css/css-nesting
- id: nest-relative-selector
  front: "What does a nested selector without `&` mean?"
  back: "A descendant of the parent; it may start with a combinator. `&` places the parent anywhere in the selector."
  question: html-and-css/modern-css/css-nesting
- id: nest-type-selector-support
  front: "Which browsers allow a nested selector to start with a type selector like `p`?"
  back: "Chrome 120, Firefox 117 and Safari 17.2."
  question: html-and-css/modern-css/css-nesting
- id: nest-amp-is
  front: "What does `&` represent in native nesting?"
  back: "The elements the parent rule matches, as if written `:is(<parent selector>)`. It is not text substitution as in Sass."
  question: html-and-css/modern-css/css-nesting
- id: nest-specificity
  front: "In `#nav, .menu { & a {} }`, what specificity does the nested rule have for `.menu a`?"
  back: "(1, 0, 1), because `:is()` takes its most specific argument. Sass emits `#nav a, .menu a`, each with its own specificity."
  question: html-and-css/modern-css/css-nesting
- id: nest-no-suffix
  front: "What happens to Sass-style `&__title` or `&-bar` in native CSS?"
  back: "It is invalid and the nested rule is dropped without an error, so write the full class."
  question: html-and-css/modern-css/css-nesting
- id: nest-matching-order
  front: "How does `.a .b { .c & {} }` match, versus Sass?"
  back: "It is `.c :is(.a .b)`: a `.b` with `.a` and `.c` ancestors in either order. Sass writes `.c .a .b`, which requires that order."
  question: html-and-css/modern-css/css-nesting
- id: nest-pseudo-element
  front: "Can `&` represent a pseudo-element?"
  back: "No, the same restriction as `:is()`. `.foo::before { &:hover {} }` matches nothing, unlike in Sass."
  question: html-and-css/modern-css/css-nesting
- id: nest-declarations-order
  front: "What happens to declarations placed after nested rules?"
  back: "They keep their place, wrapped in a nested declarations rule (Chrome 130, Firefox 132, Safari 18.2); earlier versions moved them to the top."
  question: html-and-css/modern-css/css-nesting
- id: nest-cssom
  front: "How does the CSSOM represent a nested `p` rule?"
  back: "As a child rule with `selectorText` `& p`."
  question: html-and-css/modern-css/css-nesting
- id: nest-example-result
  front: "In the nesting example, what colours do the link and the `.b` paragraph get natively?"
  back: "The link is red and the paragraph blue. Sass 1.107 compiled output would make the link green, since `.menu .link` (0, 2, 0) beats `.menu a` (0, 1, 1), and the paragraph not blue."
  question: html-and-css/modern-css/css-nesting
- id: nest-deep
  front: "Why avoid nesting deep to mirror the DOM?"
  back: "Each level adds specificity and coupling, and nesting doesn't scope anything; that's what `@scope` is for."
  question: html-and-css/modern-css/css-nesting
- id: nest-amp-top-level
  front: "What does `&` mean outside any style rule?"
  back: "The same as `:scope`, which in a document stylesheet is the root element: a top-level `& { --top: yes; }` applied to `<html>`."
  question: html-and-css/modern-css/css-nesting
- id: nest-why-is
  front: "Why define `&` as `:is()` rather than expanding selectors like Sass?"
  back: "Expansion multiplies: three levels of three-item lists give 27 selectors. `:is()` keeps one selector, and the spec notes a single specificity per selector keeps matching fast."
  question: html-and-css/modern-css/css-nesting
- id: nest-at-rule-declarations
  front: "Can an at-rule nested in a style rule hold bare declarations?"
  back: "Yes. `.box { display: block; @media (width > 100px) { display: flex; } }` worked; the CSSOM showed the inner `display` in a `CSSNestedDeclarations` rule inside the `CSSMediaRule`."
  question: html-and-css/modern-css/css-nesting
- id: nest-article-exercise
  front: "In `article { color: green; & { color: blue; } color: red; }`, what colour is the article?"
  back: "Red. The last declaration is wrapped in a nested declarations rule that keeps its place; all three have specificity (0, 0, 1), so the last wins. Before that change it was hoisted and blue won."
  question: html-and-css/modern-css/css-nesting
- id: scope-what
  front: "What does `@scope (.card) to (.slot)` do?"
  back: "Limits rules to elements inside a `.card` but not inside its `.slot`: a \"donut\". The root matches `.card`; the optional limit cuts holes so a component doesn't reach into content slotted into it."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-relative-selectors
  front: "How are inner selectors in `@scope` interpreted?"
  back: "Relative to the root: `p` means `:scope p`. Only the subject must be in scope; `.page :scope p` can still look outside."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-no-root-specificity
  front: "Does the scope root's selector add specificity?"
  back: "No. `@scope (#hero) { em {} }` is (0, 0, 1) and lost to `div em`. `:scope` is (0, 1, 0); `&` is `:where(:scope)`, zero."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-no-prelude
  front: "What does `@scope { … }` with no prelude inside a `<style>` element scope to?"
  back: "That element's parent."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-proximity-rule
  front: "What is scope proximity, and how are unscoped rules treated?"
  back: "Between declarations from rules with different scoping roots, the one whose root is fewer generational or sibling hops from the element wins. Unscoped rules count as infinitely far."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-proximity-position
  front: "Where does scope proximity sit in the cascade order?"
  back: "After specificity and before order of appearance. Layers come before specificity. A scoped `p` lost to an unscoped, more specific `p.n`, but beat a later unscoped `p` of equal specificity."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-draft-prose-conflict
  front: "Does proximity apply \"regardless of specificity\" in the draft?"
  back: "The draft's §3.5.1 prose says so, but its cascade criteria list puts proximity after specificity, and Chrome 156 and Firefox 159 follow the list."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-not-encapsulation
  front: "Is `@scope` encapsulation?"
  back: "No. Outside rules still match inside, and inheritance is unaffected; isolation is Shadow DOM's job. A global `p { }` with higher specificity still reaches inside."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-support
  front: "Which browsers support `@scope`?"
  back: "Chrome 118, Safari 17.4, Firefox 146."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-theme-example
  front: "With `@scope (.light)` and `@scope (.dark)` rules setting `a` black and white, and `.light` nested in `.dark`, what colour is the link?"
  back: "Black. The nearer `.light` root wins wherever the rules sit; with plain `.light-plain a` and `.dark-plain a` the later rule wins and the link was white. Chrome 156 and Firefox 159 agreed."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-limit-excluded
  front: "With `to (.slot)`, does a `.slot { }` rule inside the scope match the slot element?"
  back: "No; the limit element is excluded too."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-vs-bem
  front: "How does `@scope` compare with BEM or CSS Modules?"
  back: "Those make every selector unique by name. `@scope` needs a class only on the root and limits, keeps short inner selectors at low specificity, and adds proximity, which naming conventions can't express."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-layers
  front: "Where does proximity sit relative to cascade layers?"
  back: "Layers come before specificity, which comes before proximity. A scoped rule in an earlier layer loses to any unlayered rule, however near its root."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-cssom
  front: "What does the CSSOM expose for `@scope`?"
  back: "A `CSSScopeRule` with `start` and `end`: `@scope (.card) to (.slot)` gave `.card` and `.slot`."
  question: html-and-css/modern-css/scope-at-rule
- id: scope-exercise
  front: "With `@scope (.card) { :scope { color: red } }`, `@scope (.card) { & { color: green } }` and `.card { color: blue }`, what colour is the card?"
  back: "Red. `:scope` is (0, 1, 0), tying with `.card`, and proximity (0 hops versus infinitely far) decides before source order. `&` is zero specificity, so it loses to `.card` outright."
  question: html-and-css/modern-css/scope-at-rule
- id: logical-vs-physical
  front: "What are logical properties tied to, versus physical ones?"
  back: "Physical properties (`margin-left`, `top`, `width`) are tied to the screen. Logical ones are tied to the element's writing mode and direction."
  question: html-and-css/modern-css/logical-properties
- id: logical-axes
  front: "What are the inline and block axes?"
  back: "The inline axis is the direction text runs within a line; the block axis is the direction lines and blocks stack. Each axis has a start and an end."
  question: html-and-css/modern-css/logical-properties
- id: logical-margin-inline-start-map
  front: "What does `margin-inline-start` map to in `ltr`, `rtl` and `vertical-rl`?"
  back: "Left in horizontal `ltr`, right in horizontal `rtl`, and top in `vertical-rl`."
  question: html-and-css/modern-css/logical-properties
- id: logical-block-start-inline-size-map
  front: "What do `margin-block-start` and `inline-size` map to in `ltr`, `rtl` and `vertical-rl`?"
  back: "`margin-block-start`: top, top, right. `inline-size`: width, width, height."
  question: html-and-css/modern-css/logical-properties
- id: logical-families
  front: "Which families do logical properties cover, and how do two-value shorthands read?"
  back: "Margins, padding, borders and border radii (`border-start-end-radius`), insets (`inset-inline-start`), sizes (`inline-size`, `max-block-size`), plus values like `text-align: start` and `float: inline-start`. Two values set start then end: `padding-inline: 4px 12px`."
  question: html-and-css/modern-css/logical-properties
- id: logical-why
  front: "Why prefer `margin-inline-end` over `margin-right` for UI spacing?"
  back: "Most UI spacing is about reading order, not screen sides, so it stays correct under `dir=\"rtl\"` with no `[dir=rtl]` overrides. Keep physical properties where the screen matters, such as a drop shadow's offset."
  question: html-and-css/modern-css/logical-properties
- id: logical-cascade-pairs
  front: "How do a logical property and its physical mapping cascade?"
  back: "As a pair that cascades together. In `margin-inline-start: 1px; margin-left: 2px;` in `ltr`, the later declaration wins and the left margin is `2px`."
  question: html-and-css/modern-css/logical-properties
- id: logical-own-writing-mode
  front: "Which writing mode does an element use to map logical properties?"
  back: "Its own computed `writing-mode` and `direction`. A horizontal child inside a vertical parent maps `inline-size` to width."
  question: html-and-css/modern-css/logical-properties
- id: logical-four-value-physical
  front: "Are four-value shorthands like `margin: 0 1rem 0 2rem` logical?"
  back: "No; `margin` and `padding` four-value shorthands stay physical. A `logical` keyword (`margin: logical 1px 2px`) is in the draft, marked as almost certain to change, and no browser supports it."
  question: html-and-css/modern-css/logical-properties
- id: logical-support
  front: "Which browsers support the `-inline`/`-block` shorthands?"
  back: "Chrome 87, Firefox 66, Safari 14.1."
  question: html-and-css/modern-css/logical-properties
- id: logical-example-outputs
  front: "With `margin-inline-start: 8px` and `border-inline-start: 3px solid`, where do the gap and border land in `ltr`, `rtl` and `vertical-rl`?"
  back: "Left, right, then top. `getComputedStyle` margin read `0px 0px 0px 8px`, `0px 8px 0px 0px` and `8px 0px 0px`. Chrome 156 and Firefox 159 agreed."
  question: html-and-css/modern-css/logical-properties
- id: logical-inherit-pitfall
  front: "What did `margin-inline-start: inherit` take from the parent in Chrome 156 and Firefox 159 when the child has `dir=\"rtl\"`?"
  back: "The parent's physical side (`margin-right`, `0px`), not its `20px` start margin. The spec says it takes the parent's `margin-inline-start`."
  question: html-and-css/modern-css/logical-properties
- id: logical-no-form
  front: "Which properties have no logical form here?"
  back: "Shadows, transforms and `background-position` stay physical."
  question: html-and-css/modern-css/logical-properties
- id: logical-computed-same
  front: "What do `marginRight` and `marginInlineStart` return in an `rtl` element with `margin-inline-start: 8px`?"
  back: "Both `8px`: they map to the same side."
  question: html-and-css/modern-css/logical-properties
- id: logical-float-support
  front: "Which logical values cover `float` and `text-align`, and when did `float: inline-start` ship?"
  back: "`text-align: start | end` and `float: inline-start | inline-end`. `float: inline-start` shipped in Chrome 118, Firefox 55 and Safari 15."
  question: html-and-css/modern-css/logical-properties
- id: logical-rtl-exercise
  front: "In a `dir=\"rtl\"` paragraph with `margin-inline-start: 1px; margin-left: 2px; margin-inline-end: 3px`, what are the left and right margins?"
  back: "Left `3px`, right `1px`. `margin-inline-end` pairs with `margin-left` and comes later, so it wins. In `ltr` the result was left `2px`, right `3px`."
  question: html-and-css/modern-css/logical-properties
- id: supports-recovery-smallest
  front: "What unit does CSS error recovery throw away?"
  back: "The smallest piece it can: a declaration, a style rule, or an at-rule block."
  question: html-and-css/modern-css/feature-queries
- id: supports-declaration-fallback
  front: "Why does writing the fallback declaration first work?"
  back: "A declaration with an unknown property or value is dropped up to the next `;`, and earlier declarations still apply: `width: 100px; width: stretch;`."
  question: html-and-css/modern-css/feature-queries
- id: supports-selector-list-dropped
  front: "What happens to `.a, .b:new-state { }` in a browser that doesn't know `:new-state`?"
  back: "The style rule is dropped whole, `.a` included, because the selector list is invalid."
  question: html-and-css/modern-css/feature-queries
- id: supports-forgiving-is
  front: "Which selectors take a forgiving list, and what does that do?"
  back: "`:is()` and `:where()`. `:is(.a, .b:new-state)` keeps `.a`. `:has()` doesn't. Forgiving parsing was added only to those two, since Selectors 4 keeps the legacy rule."
  question: html-and-css/modern-css/feature-queries
- id: supports-unknown-at-rule
  front: "What happens to an at-rule the browser doesn't know?"
  back: "It is skipped with its whole block. Nested inside a style rule, only the at-rule was dropped; both declarations around it applied."
  question: html-and-css/modern-css/feature-queries
- id: supports-when-to-use
  front: "When should you use a feature query rather than a fallback declaration?"
  back: "When a change needs several declarations to move together, or the fallback would conflict with the new value."
  question: html-and-css/modern-css/feature-queries
- id: supports-what-tests
  front: "What does `@supports` test?"
  back: "Whether the browser accepts a declaration as it would in a style rule. `selector()` tests a selector; newer functions test fonts (`font-tech()`, `font-format()`) and at-rules (`at-rule(@scope)`, Chrome 148 and Firefox 157 only)."
  question: html-and-css/modern-css/feature-queries
- id: supports-syntax-rules
  front: "What are the syntax rules for combining `@supports` conditions?"
  back: "`and`, `or` and `not` need parentheses, and `and` and `or` can't be mixed without them. An invalid condition drops the whole `@supports` rule."
  question: html-and-css/modern-css/feature-queries
- id: supports-js
  front: "What is the JavaScript equivalent of `@supports`?"
  back: "`CSS.supports()`."
  question: html-and-css/modern-css/feature-queries
- id: supports-unknown-false
  front: "Is unknown syntax inside `@supports` false or invalid?"
  back: "False, not invalid. `@supports not (wobble(3))` is true, so a `not` query matches in browsers that don't understand what it tests."
  question: html-and-css/modern-css/feature-queries
- id: supports-parsing-not-working
  front: "Does passing `@supports` mean a feature works?"
  back: "No. A buggy or partial implementation still passes, and `(color: var(--x))` is always true because `var()` defers checking."
  question: html-and-css/modern-css/feature-queries
- id: supports-selector-strict
  front: "Is `selector()` forgiving like `:is()`?"
  back: "No; it is strict. `selector(:is(:new-state))` is false even though a rule using it would be kept."
  question: html-and-css/modern-css/feature-queries
- id: supports-selector-one
  front: "How many selectors can `selector()` take?"
  back: "One complex selector; `selector(.a, .b)` returned `false`."
  question: html-and-css/modern-css/feature-queries
- id: supports-pattern
  front: "What is the progressive-enhancement pattern for new CSS?"
  back: "Write the baseline unconditionally, then layer the enhancement with fallback declarations, forgiving selectors, or `@supports`."
  question: html-and-css/modern-css/feature-queries
- id: supports-cssom-difference
  front: "How did Chrome 156 and Firefox 159 differ for `:is(.c, .d:new-state)` in the CSSOM?"
  back: "Both applied the same styles, but Chrome stored `selectorText` as `:is(.c)` while Firefox kept `:is(.c, .d:new-state)`."
  question: html-and-css/modern-css/feature-queries
- id: supports-not-old-browsers
  front: "Why isn't `@supports not (new-syntax)` \"old browsers only\"?"
  back: "Browsers that predate `@supports` skip the block, and ones that can't parse the test treat it as false, so `not` makes it true."
  question: html-and-css/modern-css/feature-queries
- id: supports-custom-property-type
  front: "Can `@supports (--x: value)` test a registered type?"
  back: "No. Custom properties accept almost anything at parse time, so it's true for any value."
  question: html-and-css/modern-css/feature-queries
- id: supports-webkit-pseudo
  front: "How are unknown `::-webkit-` pseudo-elements treated in selector lists?"
  back: "Valid for compatibility but matching nothing, so `.d, .e::-webkit-made-up` kept the rule and styled `.d`. `selector(::-webkit-made-up)` still returned `false`."
  question: html-and-css/modern-css/feature-queries
- id: supports-exercise
  front: "Which of these apply: `(display: grid) and (not (display: wobble))`, `display: grid` without parentheses, or `(display: grid) and (display: flex) or (display: block)`?"
  back: "Only the first. The second lacks parentheses and the third mixes `and` with `or` without grouping; both are invalid, so each rule is dropped with its contents."
  question: html-and-css/modern-css/feature-queries
# 09 Typography, colour and motion
- id: font-match-per-character
  front: "Does font matching run per element or per character?"
  back: "Per character (CSS Fonts 4, §5), not per element."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-match-family-lookup
  front: "How are names in `font-family` looked up?"
  back: "A generic (`serif`, `system-ui`) maps to a real family; other names are looked up in `@font-face` rules first, then installed fonts. A name defined by `@font-face` never falls through to an installed font of the same name, even if every face fails to load."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-match-narrowing-order
  front: "In what order does the browser narrow a family's faces?"
  back: "By `font-width`, then `font-style`, then `font-weight`. For `@font-face` faces the descriptors count, not what the file contains."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-match-missing-glyph
  front: "What happens when the matched face lacks a glyph for the character?"
  back: "The browser moves to the next family; other faces in the same family aren't tried. After the list runs out, the browser's own system fallback picks a font."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-match-weight-search
  front: "How does the weight search work for targets below 400, above 500, and from 400 to 500?"
  back: "Below 400: lighter first, then heavier. Above 500: heavier first, then lighter. From 400 to 500: up to 500, then lighter, then above 500."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-match-400-picks-500
  front: "With faces at 300, 500 and 700, which face does `font-weight: 400` pick?"
  back: "500. `document.fonts.load(\"600 16px Demo\")` picked 700 and `350` picked 300 in the same family. Chrome 156 and Firefox 159 on macOS agreed."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-match-style-beats-weight
  front: "Does style or weight take priority in face matching?"
  back: "Style beats weight. `font: italic 700` in a family with a regular italic and an upright bold picks the italic and makes it bold another way."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-synthesis-what
  front: "What is font synthesis, and how do you turn it off?"
  back: "When the matched face is lighter or more upright than asked, the browser may fake bold (thickening strokes) or oblique (shearing glyphs). `font-synthesis: none`, or the longhands `font-synthesis-weight` and `font-synthesis-style`, turn it off."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-variable-axes
  front: "Are variable-font axes synthesis, and how do you expose a range?"
  back: "No. A variable font's `wght`, `wdth`, `slnt` and `ital` axes aren't synthesis: declare a range (`font-weight: 100 900`) and the browser treats every value in it as an available face."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-synthesis-position
  front: "Which browsers support `font-synthesis-position`?"
  back: "Firefox 118 only, not Chrome or Safari."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-bold-descriptor-default
  front: "What happens if a bold file's `@font-face` omits `font-weight: 700`?"
  back: "The descriptor defaults to `auto`, which matches as `normal`. Firefox 159 then synthesised bold over the real bold (text widened from 362.6px to 375.8px); Chrome 156 didn't."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-missing-bold-no-fallback
  front: "Does a missing bold fall back to the next family?"
  back: "No. Fallback happens only when no face matches or a glyph is missing; a missing weight is synthesised or approximated within the family."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-italic-without-style
  front: "What happens if an italic file shares the family name but lacks `font-style: italic`?"
  back: "It matches as an upright face. With two upright faces at 400, the later rule rendered plain text in italics in Chrome 156 and Firefox 159."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-weight-animation
  front: "What happens when you animate `font-weight` over static faces?"
  back: "The value changes continuously but the face jumps at the search boundaries; only a variable font moves smoothly."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-synthetic-bold-layout
  front: "Does synthetic bold change layout?"
  back: "It depends on the engine. With Georgia Regular faked to 700, Firefox 159 widened the text from 310.4px to 323.6px; Chrome 156 kept 310.4px and only thickened the strokes. Georgia's real bold was 362.6px in both."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-first-available
  front: "What is the \"first available font\", and why does it matter?"
  back: "The first font in the list whose `unicode-range` covers U+0020 (space), whether or not it has a space glyph. Font-relative units like `ex` and `line-height` use its metrics, even when other fonts draw the glyphs."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-synthesis-default-on
  front: "Why do browsers keep font synthesis on by default?"
  back: "Faking is better than showing the wrong weight when a family ships only one face. Turn it off for scripts where shearing or thickening damages legibility, or when a design system ships every face it uses."
  question: html-and-css/typography-colour-motion/font-matching
- id: font-weight-450
  front: "With faces at 300, 400 and 600, which face renders `font-weight: 450`?"
  back: "The 400 face: from 450 the search looks heavier only as far as 500 (none), then lighter, so 400 wins before 600. Chrome 156 and Firefox 159 fetched only `brand-400.woff2`; the others stayed `unloaded`."
  question: html-and-css/typography-colour-motion/font-matching
- id: trunc-one-line
  front: "Which three declarations truncate text to one line with an ellipsis?"
  back: "`white-space: nowrap` so it overflows sideways, `overflow: hidden` so it's clipped, and `text-overflow: ellipsis` to draw the \"…\"."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-text-overflow-role
  front: "What does `text-overflow` decide, and where must it be set?"
  back: "Only how clipped inline content is drawn, so it needs overflowing content and a clipping box. It applies to block containers and isn't inherited, so set it on the box that clips, not an inline child or flex container."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-missing-parts
  front: "What happens if you drop `nowrap` or `overflow: hidden` from the one-line recipe?"
  back: "Without `nowrap` the text wraps instead of overflowing; without `overflow: hidden` it spills out visibly."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-line-clamp-standard
  front: "What is the standard `line-clamp: 3`, and does any stable browser ship it?"
  back: "A CSS Overflow 4 shorthand for `max-lines`, `block-ellipsis` and `continue` that fragments away everything after line 3 and puts an ellipsis at the end of the last line. No stable browser ships it yet."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-webkit-quartet
  front: "Which declarations make up the legacy multi-line clamp?"
  back: "`display: -webkit-box`, `-webkit-box-orient: vertical`, `-webkit-line-clamp: N` and `overflow: hidden`."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-webkit-needs-all
  front: "What does `-webkit-line-clamp` alone do?"
  back: "Nothing: without `display: -webkit-box` and `-webkit-box-orient: vertical` the paragraph stayed 80px tall."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-overflow-hidden-needed
  front: "Why is `overflow: hidden` still needed on a clamped box?"
  back: "The box shrinks to the clamped lines and draws the ellipsis, but the lines after the clamp otherwise keep painting: lines three and four painted below it in both browsers."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-display-flow-root
  front: "What does the draft do to the `display` of a `-webkit-line-clamp` box?"
  back: "Turns it into `flow-root`, and Chrome 156 and Firefox 159 report that."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-line-clamp-unprefixed
  front: "Does `CSS.supports(\"line-clamp: 2\")` return true in Chrome 156 and Firefox 159?"
  back: "No, it returned `false` and the box stayed 80px tall. Write the `-webkit-` form, optionally with `line-clamp` alongside."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-detect
  front: "How does script detect truncated text?"
  back: "`scrollWidth > clientWidth` (or `scrollHeight > clientHeight`)."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-overflow-wrap
  front: "What does `overflow-wrap: anywhere` do, and what do `balance` and `pretty` do for `text-wrap`?"
  back: "`overflow-wrap: anywhere` (or `break-word`) breaks a long word or URL that would overflow. `text-wrap: balance` evens out line lengths in short blocks like headings; `pretty` asks for slower, better breaking, such as avoiding a lone last word."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-text-wrap-support
  front: "Which browsers support `text-wrap: balance` and `text-wrap: pretty`?"
  back: "`balance`: Chrome 114, Firefox 121, Safari 17.5. `pretty`: Chrome 117, Safari 26, not Firefox."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-flex-container
  front: "Why doesn't `text-overflow: ellipsis` on a flex container work?"
  back: "Flex containers aren't block containers. Style the item, which is blockified."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-balance-differs
  front: "Do Chrome and Firefox balance a heading the same way?"
  back: "No; the spec leaves the algorithm to the browser. A 320px heading broke into three lines in both, but Chrome 156 started \"How do you truncate\" and Firefox 159 \"How do you truncate text\". The spec lets browsers treat `balance` as `auto` beyond ten lines."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-anywhere-vs-break-word
  front: "What is the difference between `overflow-wrap: anywhere` and `break-word`?"
  back: "Both break an unbreakable word that would overflow. Only `anywhere` counts those breaks in min-content size, so a flex item with a long word shrank to its 120px container with `anywhere` but stayed 191px wide with `break-word`."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-middle
  front: "Can CSS truncate in the middle, like `file…name.pdf`?"
  back: "No: `text-overflow` cuts at the end edge of the line. Middle truncation needs script that measures and rewrites the text, keeping the full string in `title` or an accessible name."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: trunc-flex-min-width
  front: "Why does a `text-overflow: ellipsis` title inside a flex row show no ellipsis and push a button out?"
  back: "The flex item's `min-width: auto` keeps it at its content width, so the title never overflows. Add `min-width: 0` to the item; the title then clipped and the button ended at the row's edge."
  question: html-and-css/typography-colour-motion/text-truncation-and-wrapping
- id: oklch-srgb-spaces
  front: "Which colour notations describe sRGB, and what does `hsl()` add?"
  back: "`rgb()`, hex and `hsl()` all describe sRGB, the gamut of the old web. `hsl()` only reshapes the RGB cube into hue, saturation and lightness; its lightness is arithmetic, not perceptual."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-hsl-lightness-example
  front: "What are the Oklab lightness values of `hsl(60 100% 50%)` and `hsl(240 100% 50%)`?"
  back: "0.97 for yellow and 0.45 for blue, although both share `50%` HSL lightness."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-what
  front: "What are the parts of `oklch(L C H)`?"
  back: "The polar form of Oklab. `L` (0–1 or 0–100%) is perceived lightness, `C` is chroma (0 is grey; in practice under 0.5), `H` is hue in degrees."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-why-palettes
  front: "Why do design systems build palettes in `oklch()`?"
  back: "Changing `H` at fixed `L` and `C` gives a new hue at the same visual weight."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-wide-gamut
  front: "What does `color(display-p3 1 0 0)` give, and is `oklch()` tied to a gamut?"
  back: "A red more saturated than any sRGB colour, visible on a P3 screen. `oklch()` isn't tied to any gamut, so one notation covers sRGB, P3 and beyond."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-gamut-mapping-spec
  front: "What does Color 4 describe for gamut mapping, and where does it apply?"
  back: "Reducing chroma at constant lightness and hue. The value is kept as written through computed value (`getComputedStyle` returns `oklch(0.7 0.4 30)` unchanged); only painting must bring it into range."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-clipping
  front: "How did Chrome 156 and Firefox 159 map out-of-gamut colours when painting to sRGB?"
  back: "They clipped each channel instead, so very different out-of-gamut colours can land on the same pixel. `oklch(70% 0.4 30)` painted the same pure red as `oklch(62.8% 0.2577 29.23)`."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-practice
  front: "What is the practical advice for writing colours in `oklch()`?"
  back: "Write colours in `oklch()`, keep chroma within the target gamut for important colours, and gate vivid P3 values with `@media (color-gamut: p3)`."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-support
  front: "Which browsers shipped `oklch()`, and when?"
  back: "Chrome 111, Firefox 113 and Safari 15.4."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-hsl-contrast
  front: "Why is HSL lightness a poor proxy for contrast?"
  back: "The same `L%` in `hsl()` gives text that passes on one hue and fails on another; compare `oklch()` `L` instead, then check real contrast."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-clip-shifts
  front: "What is the risk of pushing chroma past the gamut today?"
  back: "The browser doesn't pick a nice nearby colour; today's clipping can shift hue and lightness. Keep chroma in range or test on both kinds of screen."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-computed-unmapped
  front: "What does `getComputedStyle` return for an out-of-gamut colour?"
  back: "The unmapped value, not the displayed one: `rgb(from oklch(70% 0.4 30) r g b)` computed to `color(srgb 1.3196 -0.449799 -0.310059)` in Chrome 156."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-fallback
  front: "How do you provide a fallback for browsers older than Chrome 111 or Firefox 113?"
  back: "Declare a hex value first; the `oklch()` line overrides it where supported."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-hue-differs
  front: "Why is hue `30` red in `oklch()` but orange in `hsl()`?"
  back: "Hue angles aren't shared between spaces. HSL's 0° is sRGB red; OkLCh's 0° points along Oklab's positive `a` axis (purplish red), and sRGB red sits near 29°."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-out-of-range
  front: "How are out-of-range `oklch()` values parsed?"
  back: "`L` is clamped to 0–1 (`oklch(150% 0.1 30)` computed to `oklch(1 0.1 30)`), negative chroma to 0, and hue wraps: `390deg` computed to `30`."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: oklch-detect-p3
  front: "How do you detect a wide-gamut screen, and what did headless Chrome 156 and Firefox 159 match?"
  back: "`@media (color-gamut: p3)` or `matchMedia(\"(color-gamut: p3)\")`. Both headless browsers matched `srgb` but not `p3`."
  question: html-and-css/typography-colour-motion/oklch-and-wide-gamut
- id: mix-why-derive
  front: "Why derive colours with `color-mix()` and relative colour syntax instead of a preprocessor?"
  back: "One `--brand` token can produce hover, border and tint variants that follow it, even when it changes at runtime. Preprocessors run before `var()` exists."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-space-matters
  front: "How does the interpolation space change `color-mix()` results?"
  back: "Blue and yellow mixed `in srgb` gave exact grey; `in oklch` gave a vivid teal. Without `in …` the default is Oklab, a good general choice."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-percentages
  front: "How does `color-mix()` handle missing percentages and totals over 100%?"
  back: "One missing percentage is `100%` minus the other; both missing is 50/50. If they sum to more than 100% they're scaled down."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-under-100
  front: "What happens when `color-mix()` percentages sum to less than 100%?"
  back: "The mix is made at full strength and its alpha is multiplied by the sum: `red 20%, blue 20%` is a 50/50 purple at alpha 0.4. Give one colour no percentage for an opaque mix."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-polar-hue
  front: "How do polar spaces (`hsl`, `oklch`, `lch`) interpolate hue in `color-mix()`?"
  back: "Along the shorter arc unless you write `longer hue`, `increasing hue` or `decreasing hue`."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-relative-syntax
  front: "What does relative colour syntax do?"
  back: "Starts a colour function with `from <color>`. The origin is converted into that function's space and each channel keyword (`l`, `c`, `h`, `r`, `alpha`…) becomes a plain number you can keep, swap or compute with `calc()`."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-channel-ranges
  front: "What number ranges do the channel keywords have in `rgb(from …)` and `oklch(from …)`?"
  back: "`r` is 0–255 in `rgb()`; `l` is 0–1 in `oklch()`."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-when-to-use
  front: "When do you choose `color-mix()` over relative colour syntax?"
  back: "`color-mix()` to blend towards another colour (tints, overlays); relative syntax to adjust one channel precisely (lightness steps, alpha)."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-computed-time
  front: "When do both functions resolve, and what happens to `currentColor` inside `color-mix()`?"
  back: "At computed-value time, so `getComputedStyle` returns the final colour. A `currentColor` inside `color-mix()` stays unresolved so each element mixes with its own `color`."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-support
  front: "Which browsers support relative colour syntax?"
  back: "Chrome 122 (oklch), Firefox 128, Safari 18."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-example-values
  front: "What do `color-mix(in srgb, red 25%, blue)` and `color-mix(in srgb, blue, yellow)` compute to?"
  back: "`color(srgb 0.25 0 0.75)` and `color(srgb 0.5 0.5 0.5)` (grey). Chrome 156 and Firefox 159 printed the same values."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-hsl-vs-srgb
  front: "How do `color-mix(in hsl, red, blue)` and `in srgb` differ?"
  back: "The `hsl` mix goes round the hue wheel to magenta (`color(srgb 1 0 1)`); the `srgb` one averages channels to purple."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-relative-examples
  front: "What do `oklch(from var(--brand) calc(l - 0.1) c h)` and `calc(h + 180)` do to `oklch(60% 0.15 250)`?"
  back: "The first gives `oklch(0.5 0.15 250)` (darker); the second `oklch(0.6 0.15 70)` (the complement)."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-percent-in-l
  front: "Why does `calc(l - 10%)` fail in `oklch(from …)`?"
  back: "`l` is a number, so subtracting a percentage made the whole value invalid; use `calc(l - 0.1)`."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-legacy-commas
  front: "Does relative colour syntax work with legacy commas?"
  back: "No. `rgb(from red r, g, b)` was invalid; relative syntax only exists in the space-separated form."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-srgb-mud
  front: "Why avoid mixing opposite hues `in srgb`?"
  back: "Channel averaging passes through grey. Mix in `oklab` or `oklch`."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-one-or-three
  front: "Can `color-mix()` take one colour, or three?"
  back: "The current draft allows one or more. Firefox 159 accepted `color-mix(in srgb, red, blue, lime)` and computed `color(srgb 0.333333 0.333333 0.333333)`; Chrome 156 rejected it as invalid, as it did a single colour."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-currentcolor-inherit
  front: "What does a child inherit from a parent's `color-mix(in srgb, currentColor 50%, white)` in a registered `<color>` property?"
  back: "The function, not a colour. With a parent `color: red`, its blue child computed `color(srgb 0.5 0.5 1)`, mixed with its own blue."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: mix-relative-no-clamp
  front: "Do relative colours clamp channels into the gamut?"
  back: "No. `rgb(from oklch(70% 0.4 30) r g b)` computed to `r` above 1 and negative `g` and `b`; only painting brings them into range."
  question: html-and-css/typography-colour-motion/color-mix-and-relative-colour
- id: dark-media-not-enough
  front: "Why isn't `@media (prefers-color-scheme: dark)` enough for dark mode?"
  back: "It changes only what you style. Without `color-scheme`, inputs, scrollbars, the canvas and `Canvas`/`CanvasText` stay light. The browser can't darken them on its own, because an older page might put dark text on them."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-color-scheme-used
  front: "How does the browser choose an element's used colour scheme?"
  back: "The user's preference if it's listed in `color-scheme`, otherwise the first listed one, otherwise light."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-root-opt-in
  front: "What does `:root { color-scheme: light dark }` do?"
  back: "Turns the canvas, default text, form controls and system colours (`Canvas`, `CanvasText`, `Field`, `LinkText`…) dark for users who prefer dark. On the root it also covers the viewport's scrollbars and background."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-meta
  front: "What does `<meta name=\"color-scheme\" content=\"light dark\">` add?"
  back: "It sets the page's supported schemes from the HTML, so it takes effect without waiting for a stylesheet."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-subtree-only
  front: "How do you pin a subtree to a scheme, and what does `only` do?"
  back: "`color-scheme: dark` on the subtree. The `only` keyword (`light only`) forbids the browser from force-darkening or recolouring the page."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-light-dark
  front: "What does `light-dark(a, b)` compute to?"
  back: "Its first colour when the element's used scheme is light and the second when dark. It follows `color-scheme`, not a media query, so tokens are written once."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-theme-toggle
  front: "How does a theme toggle work with `light-dark()` tokens?"
  back: "It only changes `color-scheme` (for example `[data-theme=\"dark\"] { color-scheme: dark }`); every `light-dark()` follows, with no duplicated `@media` block."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-light-dark-support
  front: "Which browsers shipped `light-dark()`, and what does it accept?"
  back: "Chrome 123, Firefox 120 and Safari 17.5. Colours only, plus images since Chrome 150, Firefox 150 and Safari 27."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-light-dark-no-scheme
  front: "What does `light-dark()` return without `color-scheme`?"
  back: "Always its first colour: the used scheme stays light, even for users who prefer dark."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-hardcoded-surface
  front: "What goes wrong with `color-scheme: light dark` and `body { background: white }`?"
  back: "Default text turns light in dark mode, so the page goes white-on-white. Chrome 156 computed `rgb(255, 255, 255)` text, Firefox 159 `rgb(251, 251, 254)`; use `background: Canvas` or `light-dark()`."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-body-vs-root
  front: "Why set `color-scheme` on `:root` rather than `body`?"
  back: "The canvas and viewport scrollbars follow the root, and `color` inherits from the root's `CanvasText`: with only `body` dark, text stayed `rgb(0, 0, 0)`."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-non-colours
  front: "Does `light-dark()` accept non-colours?"
  back: "Not lengths: `padding: light-dark(1px, 2px)` was rejected as invalid."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-user-override
  front: "How do you respect the system setting but let users override it?"
  back: "Default to `color-scheme: light dark` on `:root`, and let the toggle set `light` or `dark` there (via a class or attribute) and store the choice. `light-dark()` tokens, system colours and form controls all follow."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-only-keyword
  front: "What does the `only` keyword do in `color-scheme: light only`?"
  back: "Without it, a browser with a user override may force the page into the preferred scheme and auto-adjust its colours. `light only` tells it the page must not be recoloured."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: dark-example-output
  front: "In the Chrome 156 example, what are the `color` and `Canvas` background under `color-scheme: dark`?"
  back: "`rgb(129, 217, 254)` on `rgb(18, 18, 18)`. Firefox 159 matched except its dark `Canvas`, `rgb(28, 27, 34)`."
  question: html-and-css/typography-colour-motion/dark-mode-color-scheme
- id: trans-start-conditions
  front: "When does a transition start?"
  back: "At a style change event, if the value changed and both values can interpolate, `transition-property` lists it (or `all`), and duration plus delay is above `0s`."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-change-driven
  front: "Why does nothing transition on page load or for a just-inserted element?"
  back: "Transitions are driven by changes: there is no before-change style to start from."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-starting-style
  front: "What does `@starting-style` do?"
  back: "Supplies the start values for an element with no before-change style, one just inserted or changing from `display: none`. The rules cascade like normal rules but only feed the starting style."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-allow-discrete
  front: "What does `transition-behavior: allow-discrete` do?"
  back: "Lets discrete properties (ones with no in-between values) transition. They flip at 50%, except `display`, which stays visible for the whole transition between `none` and a visible value."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-display-rule
  front: "Why does a `display` transition keep the element visible until the end?"
  back: "`display` borrows `visibility`'s rule: for progress strictly between 0 and 1 the interpolated value is the visible one, in both directions. CSS Display 4 makes the element inert while its real value is `none`."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-fade-recipe
  front: "How do you fade a toggled element in and out?"
  back: "`transition: opacity 0.4s, display 0.4s allow-discrete`, with `[hidden] { display: none; opacity: 0 }` and `@starting-style { .panel { opacity: 0 } }`. Top-layer elements also need `overlay 0.4s allow-discrete`."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-support
  front: "Which browsers support `transition-behavior` and `@starting-style`?"
  back: "Chrome 117 and Safari 17.4–17.5. Firefox 129 added both but, as of Firefox 159, doesn't transition `display`, so its exit simply cuts."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-example-chrome
  front: "In the Chrome 156 panel example, what are `display` and `opacity` at 100ms of showing and at 100ms of hiding?"
  back: "Showing: `block` and `0.25`. Hiding: `block` and `0.75`; at 400ms of hiding, `none` and `0`. Firefox 159 matched on show but started no transition on hide."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-insert-same-task
  front: "Why doesn't inserting an element and changing its class in the same task transition?"
  back: "There's no before-change style, so `getAnimations()` was empty in both browsers. Use `@starting-style` instead of forcing a reflow."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-height-auto
  front: "Why does `height` to `auto` jump, and what fixes it?"
  back: "Keywords don't interpolate. `interpolate-size: allow-keywords` (and `calc-size()`) fixes it in Chrome 129+ only; Firefox 159 doesn't support it, so use a fallback such as a measured pixel height."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-transitionend-cancel
  front: "When does `transitioncancel` fire instead of `transitionend`?"
  back: "When a transition is interrupted, overridden by `transition: none`, or hidden with `display: none`. Firefox 159 fired nothing for one cancelled before its first frame."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-all-allow-discrete
  front: "What is the danger of `transition: all … allow-discrete`?"
  back: "Every discrete property change now waits until 50%, including ones you never meant to animate."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-reverse
  front: "What happens when you reverse a transition halfway?"
  back: "The running one is cancelled and a new one starts from the current value, shortened by how far the first had got. Paused at 25% of a 1s `width` transition and reversed, the new one lasted 250ms in both browsers."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-delay-only
  front: "Does a `0s` duration with a delay transition?"
  back: "Yes, the rule is duration plus delay above zero: `width 0s 0.1s` created a transition that jumps after 100ms; `width 0s` created none."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-cascade-origin
  front: "Where do transitions and keyframe animations sit relative to `!important`?"
  back: "Transitions sit in their own origin above `!important` author declarations, so a transition still runs on an `!important` value. Keyframe animations sit below important declarations."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-bookkeeping
  front: "What state does the browser keep per element and longhand for transitions?"
  back: "At most one running transition and one completed transition."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-before-after-change
  front: "What are the before-change and after-change styles?"
  back: "Before-change is the computed style from the previous style change event, with running animations and transitions advanced to now. After-change is the new computed style, without any transitions."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-matching-property
  front: "How does the browser find the duration, delay and timing function for a longhand?"
  back: "It finds the last matching `transition-property` value, then uses the matching duration, delay, timing function and behaviour by list position."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-transitionable
  front: "What makes a property transitionable?"
  back: "Its animation type is neither \"not animatable\" nor \"discrete\", or, in Transitions 2, discrete with `allow-discrete`. Some pairs are discrete even when the property isn't: `box-shadow` between inset and non-inset can't interpolate. Custom properties are discrete unless registered."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-csstransition-object
  front: "How do you inspect a running transition and why does it override `!important`?"
  back: "It is a `CSSTransition` object visible through `element.getAnimations()`. Its effect writes into the transitions origin of the cascade, above even `!important` author rules. You can pause it and set `currentTime`."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-starting-style-cascade
  front: "How do `@starting-style` rules cascade?"
  back: "They inherit from the parent's after-change style and don't win by position: they cascade normally, so a more specific rule outside `@starting-style` can override them."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-discrete-50
  front: "When does a discrete property switch under `allow-discrete`?"
  back: "The transition holds the start value until 50% progress, then switches. In Chrome 156 and Firefox 159, `text-align: left` to `right` over 1s linear read `left` at 400ms and `right` at 600ms."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-events
  front: "What are the four transition events, and when are they dispatched?"
  back: "`transitionrun` (created, still in its delay), `transitionstart` (delay ends), `transitionend` (completes) and `transitioncancel` (removed early), each with `propertyName` and `elapsedTime`. They're dispatched at animation-frame time, not synchronously."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-reversing-factor
  front: "What is the reversing shortening factor?"
  back: "When a running transition's end value no longer matches but the new after-change value equals its start value, the reverse transition's duration is scaled by how much of the first completed."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-cancellation-causes
  front: "When does the browser cancel a running transition?"
  back: "When the property drops out of `transition-property` (including `transition: none`, which jumps to the end value), when the element stops being rendered (`display: none`) or leaves the document."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-cancel-event-engines
  front: "Did Chrome 156 and Firefox 159 fire `transitioncancel` for a transition started and cancelled in the same task?"
  back: "Chrome fired it; Firefox fired nothing, following the event-dispatch table where `idle` to `idle` dispatches nothing. The table guarantees exactly one `transitionend` or `transitioncancel` per `transitionrun`, so pair cleanup with `transitionrun`."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-inherited-completed
  front: "Why does the browser keep a completed-transitions set?"
  back: "One change can start transitions on an ancestor and a descendant at once; the set stops a child with a shorter duration from restarting while the parent's transition still feeds it new values."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-popover
  front: "Why does a popover exit transition also list `overlay`?"
  back: "Exiting removes the popover from the top layer, which would otherwise clip the fade and stack it under the page, so `overlay` joins `display` in the discrete list. Overlay transitions: Chrome 117 only."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-popover-firefox
  front: "How did the popover fade behave in Firefox 159?"
  back: "Firefox doesn't support `overlay` and started no transition on hide, so the popover vanished at once while the entry fade still worked. The same shape works for `<dialog>` with `[open]`."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-popover-chrome-midway
  front: "Halfway through a popover hide transition in Chrome 156, what were `display`, opacity and `overlay`?"
  back: "`block`, `0.5` and `auto`, even though `:popover-open` no longer matched."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-vs-keyframes
  front: "What suits transitions, and what can't they do?"
  back: "State changes: one start and one end value, triggered by a class, attribute or pseudo-class, with reversing for free. They can't loop, run without a trigger, or pass through intermediate keyframes. They restart from the current value, so interrupted hover effects look smooth."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: trans-starting-style-replaces
  front: "What old pattern do `@starting-style` plus `allow-discrete` replace?"
  back: "Removing `display: none`, forcing a reflow with `offsetWidth`, then adding the class. The CSS version is declarative, but its exit half depends on `display` transitions, which Firefox 159 doesn't do yet."
  question: html-and-css/typography-colour-motion/transitions-and-discrete-properties
- id: anim-vs-transition
  front: "How do transitions and `@keyframes` animations differ in what triggers them?"
  back: "Transitions react to a change: two values, one trigger, automatic reversing. Animations are declared: `@keyframes` names a sequence of states and `animation` runs it whenever it applies, including on page load or insertion."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-missing-keyframe
  front: "What happens with a missing `0%` or `100%` keyframe?"
  back: "It is built from the element's computed value, so `@keyframes grow { to { scale: 1.2 } }` starts from wherever the element is."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-important-keyframe
  front: "What does `!important` inside a keyframe do?"
  back: "It is ignored: the declaration is dropped from the keyframe, and an `!important` author rule beats the animation anyway."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-per-keyframe-timing
  front: "Can keyframes have their own timing functions?"
  back: "Yes; each keyframe can have its own `animation-timing-function`. They are `from`/`to` or percentages."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-repeat-direction
  front: "Which properties control repetition and swinging back?"
  back: "`animation-iteration-count` (`infinite` for loops) and `animation-direction` (`alternate` swings back and forth)."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-fill-modes
  front: "What do the `animation-fill-mode` values do?"
  back: "The default `none` affects nothing during the delay or after the end, so the element snaps back. `backwards` applies the first keyframe during the delay, `forwards` holds the last after the end, `both` does both."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-composition
  front: "What does `animation-composition: add` do, and where is it supported?"
  back: "Adds keyframe values to the underlying value instead of replacing it, so two animations on `transform` can stack. Chrome 112, Firefox 115, Safari 16."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-events
  front: "Which events do keyframe animations fire?"
  back: "`animationstart`, `animationiteration`, `animationend`, and `animationcancel` when it's removed early."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-removal-jumps
  front: "What happens when you remove the class or `animation-name`?"
  back: "The animation is cancelled and the value jumps back; there's no reverse like a transition's. `display: none` also cancels it, and showing the element again starts it over."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-change-running
  front: "What happens when you change duration or other `animation-*` values on a running animation?"
  back: "It updates the running animation without restarting it."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-cascade
  front: "Where do animations sit in the cascade?"
  back: "Above normal author declarations but below `!important` ones; transitions sit above `!important`."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-when-to-pick
  front: "When do you pick a transition versus a keyframe animation?"
  back: "A transition for state changes (hover, open/closed); a keyframe animation for anything that loops, plays on arrival, or needs more than two steps."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-fill-example
  front: "With `slide` from `0px` to `100px`, `margin-left: 50px`, 1s and 0.5s delay, what are the values at 250ms, 1250ms and 1600ms for `fill-mode: none` and `both`?"
  back: "`none`: 50px, 75px, 50px. `both`: 0px, 75px, 100px. Chrome 156 and Firefox 159 agreed."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-forwards-pitfall
  front: "Why is `forwards` a poor way to set a final state?"
  back: "The filled value keeps winning over normal declarations: setting `margin-left: 10px` inline afterwards still computed `100px`; only `!important` got through. Set the end state in a class instead."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-replay-class
  front: "Does re-adding the same class replay an animation?"
  back: "No. Remove it, force a style recalculation, then add it back, or seek the `CSSAnimation` from `getAnimations()`."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-alternate
  front: "What does `alternate` with three iterations do for a 1s `0px` to `100px` slide?"
  back: "Odd iterations run forwards, even ones backwards: 250ms read `25px`, 1250ms `75px`, 2250ms `25px`; at 3000ms it had ended and showed the element's own value."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-cancel-event
  front: "When does `animationcancel` fire?"
  back: "When a running animation stops early: its `animation-name` no longer applies or the element gets `display: none`. Chrome 156 and Firefox 159 fired it for both `animation: none` and `display: none` set 150ms into a 1s animation, with no `animationend`."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-cancel-support
  front: "Which browsers fully support `animationcancel`?"
  back: "Chrome 145, Firefox 54, Safari 13.1."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-custom-property
  front: "Can a keyframe animation move a custom property smoothly?"
  back: "Only if it's registered with `@property` and a type such as `<length>`. Over 1s linear `0px` to `100px`, a registered one read `40px` at 400ms and `60px` at 600ms; an unregistered one flipped at the halfway point."
  question: html-and-css/typography-colour-motion/keyframe-animations
- id: anim-important-exercise
  front: "At 500ms of a `slide` from `0px` to `100px`, what do `margin-left: 50px !important` and `animation-composition: add` with `margin-left: 50px` compute to?"
  back: "`50px` for the `!important` element: important author declarations beat animations. `100px` for `add`: the keyframe's `50px` is added to the underlying `50px`."
  question: html-and-css/typography-colour-motion/keyframe-animations
