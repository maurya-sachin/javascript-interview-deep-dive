# 01 The DOM
- id: dom-what-is-the-dom
  front: "What is the DOM, and which standards define it?"
  back: "The in-memory tree the browser builds from HTML, plus the API scripts use to read and change it. The WHATWG DOM Standard defines the tree and its generic interfaces; the HTML Standard defines the HTML element classes on top."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-node-types-and-numbers
  front: "Which `nodeType` numbers do `Element`, `Text`, `Comment`, `Document`, `DocumentType` and `DocumentFragment` report?"
  back: "`Element` is 1, `Text` 3, `Comment` 8, `Document` 9, `DocumentType` 10 and `DocumentFragment` 11. `Attr` is 2."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-attr-is-node-not-child
  front: "`Attr` is a `Node`. Does it ever appear in `childNodes`?"
  back: "No. `Attr` is a `Node` for historical reasons but never has a parent; attributes hang off their element, not the tree. Read them with `getAttribute()` or `attributes`."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-document-shape
  front: "What shape does the standard constrain a `Document` to?"
  back: "At most one doctype and one element child, `<html>`, which is `document.documentElement`. Elements contain elements and character data."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-characterdata-leaves
  front: "Which node types are `CharacterData`, and what do they hold?"
  back: "`Text` and `Comment`. They are leaves that hold a string."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-documentfragment-and-shadowroot
  front: "What is a `DocumentFragment`, and which other node is one?"
  back: "A parentless container for building subtrees. A shadow root is also a `DocumentFragment`."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-element-vs-htmlelement
  front: "What does `Element` hold versus `HTMLElement`?"
  back: "`Element` holds what every markup element shares: attributes, `id`, `classList`, selectors. `HTMLElement` adds HTML-only features such as `hidden`, `title` and `click()`; each tag gets its own subclass, e.g. `<p>` is `HTMLParagraphElement`."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-paragraph-prototype-chain
  front: "What is the prototype chain of a `<p>` element?"
  back: "`HTMLParagraphElement > HTMLElement > Element > Node > EventTarget > Object`. Chrome 156 and Firefox 159 printed the same."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-svg-not-htmlelement
  front: "Is an SVG element an `Element`? Is it an `HTMLElement`?"
  back: "It is an `Element` but not an `HTMLElement`. So `instanceof HTMLElement` is not a test for \"is an element\"; use `instanceof Element` or `nodeType === Node.ELEMENT_NODE`."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-unknown-vs-custom-element-class
  front: "Which class do `document.createElement('foo')` and `createElement('x-foo')` produce?"
  back: "`foo` is not a known element or valid custom element name, so it becomes `HTMLUnknownElement`. A valid custom element name like `x-foo` gets plain `HTMLElement`, so a later upgrade only extends the chain."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-node-vs-element-apis
  front: "How do `childNodes`/`firstChild`/`parentNode` differ from `children`/`firstElementChild`/`parentElement`?"
  back: "The node-level ones include text and comments; the element-level ones skip them. That's why whitespace between tags shows up as `#text` in `childNodes` but not in `children`."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-firstchild-whitespace
  front: "Why is `firstChild` often not the first tag in indented markup?"
  back: "The whitespace between tags is its own `#text` node, so `firstChild` is usually that. Use `firstElementChild` to get the first element."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-parentnode-vs-parentelement
  front: "For `<html>`, what are `parentNode` and `parentElement`?"
  back: "`document.documentElement.parentNode` is the `document`; its `parentElement` is `null`, because the document is not an element."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-not-same-as-source
  front: "Is the DOM the same as the HTML source?"
  back: "No. The parser repairs markup (closing a `<p>` before a `<div>`, adding `<head>` and `<body>`) and scripts change the tree afterwards. DevTools' Elements panel shows the DOM, not the source."
  question: browser/the-dom/dom-tree-and-node-types
- id: dom-nodename-tagname-localname
  front: "What are `nodeName`, `tagName` and `localName` for an HTML `<p>` in an HTML document?"
  back: "`nodeName` and `tagName` are the qualified name, uppercased for HTML elements in an HTML document: `\"P\"`. `localName` stays lowercase: `\"p\"`."
  question: browser/the-dom/dom-tree-and-node-types
- id: collections-live-vs-static
  front: "What is the difference between a live and a static collection?"
  back: "A live collection stores no members: `length` and indexing answer from the tree as it is now. A static collection is a snapshot of the matches at creation time; later changes don't touch it. The DOM Standard says collections are live unless stated otherwise."
  question: browser/the-dom/live-vs-static-collections
- id: collections-htmlcollection-live-sources
  front: "Which APIs return a live `HTMLCollection`?"
  back: "`children`, `getElementsByTagName()`, `getElementsByClassName()`, `document.forms` and `table.rows`."
  question: browser/the-dom/live-vs-static-collections
- id: collections-childnodes-live
  front: "Is `childNodes` live or static, and what type is it?"
  back: "A live `NodeList`. Not every `NodeList` is static."
  question: browser/the-dom/live-vs-static-collections
- id: collections-getelementsbyname-live
  front: "What does `document.getElementsByName()` return, and is it live?"
  back: "A live `NodeList`."
  question: browser/the-dom/live-vs-static-collections
- id: collections-queryselectorall-static
  front: "What does `querySelectorAll()` return, and is it live?"
  back: "A static `NodeList`: a snapshot of the matches at creation time. Elements added later don't appear in it; query again."
  question: browser/the-dom/live-vs-static-collections
- id: collections-liveness-by-method
  front: "Does liveness depend on the type (`NodeList` vs `HTMLCollection`) or the method?"
  back: "The method. An `HTMLCollection` is always live here, but a `NodeList` can be live (`childNodes`) or static (`querySelectorAll()`)."
  question: browser/the-dom/live-vs-static-collections
- id: collections-htmlcollection-nameditem
  front: "What does `HTMLCollection` hold and what does it add over `NodeList`?"
  back: "It holds only elements and adds `namedItem()`, lookup by `id` or `name`. The standard calls it \"a historical artifact\". `NodeList` can hold any node."
  question: browser/the-dom/live-vs-static-collections
- id: collections-foreach-only-nodelist
  front: "Which of `HTMLCollection` and `NodeList` has `forEach()`, and are both iterable?"
  back: "Only `NodeList` has `forEach()` (plus `keys()`, `values()`, `entries()`). Both have `length` and indexing and a `Symbol.iterator`, so `for…of`, spread and `Array.from()` work on both."
  question: browser/the-dom/live-vs-static-collections
- id: collections-no-foreach-reason
  front: "Why doesn't `HTMLCollection` get `forEach()`?"
  back: "Its IDL has no `iterable<>` declaration, which is what generates `forEach()`. The standard discourages new APIs from returning `HTMLCollection`, recommending plain sequences (arrays) instead."
  question: browser/the-dom/live-vs-static-collections
- id: collections-identity
  front: "Which collection-returning APIs give the same object on every call?"
  back: "`children` and `childNodes` return the same object every time; `getElementsBy*()` may return the same object for the same argument; `querySelectorAll()` always builds a new list."
  question: browser/the-dom/live-vs-static-collections
- id: collections-skip-loop-bug
  front: "What goes wrong removing a class from each item of `getElementsByClassName()` in an index loop?"
  back: "Each removal drops the item from the live collection and shifts the rest down, so every other element is skipped. With three `.todo` items the loop left `length` 1 and `live[0]` as `b` (Chrome 156 and Firefox 159)."
  question: browser/the-dom/live-vs-static-collections
- id: collections-infinite-loop
  front: "What happens inserting matching elements during `for…of` over a live collection?"
  back: "It can loop forever. In `for (const p of document.getElementsByTagName('p')) p.after(document.createElement('p'))` there is always a next item; with `querySelectorAll('p')` the loop runs only twice."
  question: browser/the-dom/live-vs-static-collections
- id: collections-safe-iteration
  front: "How do you safely iterate while mutating the tree under a live collection?"
  back: "Copy first (`[...live]`), use `querySelectorAll()`, or iterate backwards."
  question: browser/the-dom/live-vs-static-collections
- id: collections-no-change-events
  front: "How do you get notified when a collection's contents change?"
  back: "You don't: a live collection has no events and only answers correctly when read. To react to tree changes, use a `MutationObserver`."
  question: browser/the-dom/live-vs-static-collections
- id: attrs-content-vs-idl
  front: "In HTML Standard terms, what are a content attribute and an IDL attribute?"
  back: "A content attribute is what you write in markup: a name and a string value stored on the element, read and written with `getAttribute()`/`setAttribute()`. An IDL attribute is a property on the element's interface, implemented as a getter and setter."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-reflection
  front: "What does it mean for a property to reflect an attribute?"
  back: "The getter reads the content attribute and converts it by the property's type; the setter writes a string back. Setting a reflected property such as `link.id` therefore changes the attribute."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-string-missing
  front: "What does a reflected string property return when the attribute is missing?"
  back: "`\"\"`, not `null`."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-url-reflection
  front: "What do `a.href` and `img.src` return versus `getAttribute('href')`?"
  back: "The property is parsed against the document's base URL and returned absolute. `getAttribute('href')` returns the raw authored string."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-boolean-reflection
  front: "How does a boolean reflected property like `disabled` map to its attribute?"
  back: "It is `true` when the attribute is present at all. Setting `true` writes `\"\"`; setting `false` removes the attribute."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-setattribute-false-trap
  front: "Why does `el.setAttribute('disabled', 'false')` not enable a control?"
  back: "Any value means the boolean attribute is present, so it stays disabled. Use `el.disabled = false` or `removeAttribute()`."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-number-reflection
  front: "What does a number property like `maxLength` return for an invalid or missing attribute?"
  back: "A default value. For `maxLength` that is `-1`."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-enumerated-reflection
  front: "What does an enumerated property limited to known values, like `input.type`, return for an unknown keyword?"
  back: "The default state's keyword."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-renamed-properties
  front: "Which attribute names differ from their property names because of JavaScript clashes?"
  back: "`class` is `className` and `for` is `htmlFor`."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-custom-attribute-no-property
  front: "Does a made-up attribute such as `foo` get a property, and does `el.foo = 'x'` create an attribute?"
  back: "No to both. A made-up attribute gets no property, and expando properties never reach the markup. Use `setAttribute()` or `dataset`."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-input-value-default
  front: "For `<input>`, what is the `value` attribute versus the `value` property?"
  back: "The attribute is only the default value, reflected by `defaultValue`. The `value` property is the current value, and `getAttribute('value')` does not return what the user typed."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-dirty-value-flag
  front: "Why does `setAttribute('value', …)` often seem to do nothing on an input?"
  back: "Once the user edits the field or a script sets `value`, the control's dirty value flag is set and later attribute changes no longer reach it. `checked` and `defaultChecked` work the same way with a dirty checkedness flag."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-checked-example
  front: "For `<input type=\"checkbox\" checked>`, after `box.checked = false`, what do `hasAttribute('checked')` and `defaultChecked` return?"
  back: "Both `true`. Setting `checked` changes only the current state and sets the dirty checkedness flag, so the attribute stays and later attribute changes no longer move the box. Chrome 156 and Firefox 159 agreed."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-rule-of-thumb
  front: "When should you use properties and when attributes?"
  back: "Properties for state and typed values. Attributes for what's serialised, for CSS attribute selectors, and for names with no property."
  question: browser/the-dom/attributes-vs-properties
- id: attrs-name-case
  front: "Are attribute names case-sensitive in `setAttribute()`?"
  back: "Not on HTML elements in an HTML document: the name is lowercased, so `setAttribute('VALUE', 'x')` creates `value`. On SVG elements and in XML documents names keep their case."
  question: browser/the-dom/attributes-vs-properties
- id: insert-modern-methods
  front: "Which modern methods insert nodes, and what do they accept?"
  back: "`append()` and `prepend()` on the parent; `before()`, `after()` and `replaceWith()` on the node. Each takes any number of nodes and strings. `appendChild()` and `insertBefore()` take one node and return it."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-strings-as-text
  front: "What happens when you pass an HTML string to `append()`?"
  back: "Strings become `Text` nodes, so they are inserted as literal text and never parsed as HTML. Markup needs a parser API."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-multiple-args-fragment
  front: "How does `append(a, b, c)` insert several nodes, and what does a `MutationObserver` see?"
  back: "The DOM Standard first collects them into a `DocumentFragment`, so the insert happens once. A `MutationObserver` sees one `childList` record with three added nodes."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-moves-not-copies
  front: "What happens when you insert a node that's already in the tree?"
  back: "It is first removed from its old position: a node has one parent, so it moves. There's no copy unless you `cloneNode(true)`."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-append-prepend-move-example
  front: "For `<ul>` with `li` 1, 2, 3, after `list.append(one); list.prepend(three)`, what are the length and `textContent`?"
  back: "`3` and `321`. Appending `one` moves it to the end (2 3 1); prepending `three` moves it to the front (3 2 1). No nodes are created."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-removing
  front: "How do you remove a node and how do you empty a parent?"
  back: "`node.remove()` removes a node, and `parent.replaceChildren()` with no arguments empties a parent."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-replacechildren
  front: "What does `replaceChildren(...nodes)` do and why is it good for re-rendering a list?"
  back: "It replaces every child in one step, so it is the clean way to re-render a list. It also clears with no arguments."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-replacechildren-vs-innerhtml
  front: "Is `el.innerHTML = ''` or `replaceChildren()` better for clearing?"
  back: "`replaceChildren()`: it says what it means and involves no parser. Both remove all children in one operation."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-fragment
  front: "What happens to a `DocumentFragment` when you insert it?"
  back: "Its children move into the target and the fragment is left empty. So you can build many nodes off-tree and insert once."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-batching-why
  front: "What does each insertion run, and is layout recomputed per inserted node?"
  back: "Each insertion runs insertion steps: mutation records, custom element callbacks, and side effects such as scripts running or iframes loading. Layout is lazy, so it isn't redone per node unless you read geometry like `offsetHeight` between writes."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-layout-read-write
  front: "What is the safe order for DOM writes and layout reads?"
  back: "Build first, insert once, read afterwards. A geometry read such as `offsetHeight` after a write forces synchronous layout, so interleaving reads and writes in a loop is slow."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-movebefore-purpose
  front: "Why does `moveBefore()` exist versus `insertBefore()` on a connected node?"
  back: "`insertBefore()` on a connected node is a remove plus an insert, so an iframe reloads, a focused element loses focus and running CSS animations restart. `moveBefore()` is an atomic move that runs separate moving steps and keeps that state."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-movebefore-throws
  front: "When does `moveBefore()` throw `HierarchyRequestError`?"
  back: "When the node and the new parent don't share a root (for example a node not yet in the document) or the node isn't an element or character data. Fall back to `insertBefore()` there."
  question: browser/the-dom/inserting-and-moving-nodes
- id: insert-movebefore-support
  front: "Which browsers shipped `moveBefore()`, and how should you call it?"
  back: "Chrome 133 and Firefox 144; Safari doesn't have it. Feature-detect and fall back to `insertBefore()` rather than calling it unconditionally."
  question: browser/the-dom/inserting-and-moving-nodes
- id: html-innerhtml-getter-setter
  front: "What do the `innerHTML` getter and setter do?"
  back: "The getter serialises the element's children as HTML. The setter runs the HTML fragment parser with the element as context and replaces all children with the result."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-innerhtml-scripts
  front: "Do `<script>` elements created through `innerHTML` run?"
  back: "No. The fragment is parsed in an inert scripting mode. To run a script, create it with `createElement('script')` and insert it."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-innerhtml-xss
  front: "Why is assigning untrusted strings to `innerHTML` an XSS hole although scripts don't run?"
  back: "Everything else is live markup. `<img src=x onerror=…>` runs its handler when the image fails."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-textcontent-getter
  front: "What does the `textContent` getter return on an element, and on `document`?"
  back: "On an element, the concatenated data of all descendant `Text` nodes in tree order, including text in `<script>`, `<style>` and elements hidden by CSS or `hidden`. On `document` it is `null`."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-textcontent-setter
  front: "What does setting `textContent` do?"
  back: "It replaces all children with one `Text` node (none for `\"\"`), so markup is never parsed. It's the safe, cheap way to write text."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-innertext-getter
  front: "What does the `innerText` getter return, and who defines it?"
  back: "The HTML Standard defines it on `HTMLElement`. It returns the text as rendered: `display: none` and non-visible `visibility` are skipped, `text-transform` is applied, and block boundaries and `<br>` become line breaks."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-innertext-layout-cost
  front: "Why can reading `innerText` be expensive?"
  back: "It needs up-to-date styles and layout, so reading it after DOM changes forces a synchronous layout. Read `textContent` unless you need the rendered text."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-innertext-hidden-fallback
  front: "What does `innerText` return on an element that is itself `display: none`?"
  back: "Its descendant text content, as `textContent` would, because the \"not being rendered\" case falls back to it. A hidden child of a rendered element is skipped instead."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-innertext-setter
  front: "What does the `innerText` setter do with `\\n`?"
  back: "It turns `\\n` into `<br>`."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-menu-example
  front: "For a `<ul>` with Home, a `display: none` Admin item and About, what do `textContent` and `innerText` return?"
  back: "`textContent` is `\"HomeAdminAbout\"`, ignoring CSS. `innerText` is `\"Home\\nAbout\"`: it skips the hidden `<li>` and breaks between block items. Chrome 156 and Firefox 159 agreed."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-sethtml-default
  front: "What does `setHTML(html)` keep and drop with no sanitizer?"
  back: "It parses like `innerHTML`, then sanitises with the built-in safe default: only elements categorised Default (`<b>`, `<p>`, but not `<img>`) are kept; comments, `data-*` attributes and `javascript:` URLs are dropped."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-sethtml-custom-config
  front: "Can a custom sanitizer config let `setHTML()` keep `<script>` or `on*` handlers?"
  back: "No. It still removes everything unsafe, such as `<script>` and `on*` handlers, whatever the config allows. Use `setHTMLUnsafe()` only for trusted markup."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-sethtmlunsafe
  front: "How does `setHTMLUnsafe()` differ from `innerHTML`?"
  back: "It is the unsanitised counterpart of `setHTML()` and, unlike `innerHTML`, it parses declarative shadow roots."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-sethtml-support
  front: "Which browsers shipped `setHTML()` and the Sanitizer, and where is it specified?"
  back: "Chrome 146 and Firefox 148; not Safari. The Sanitizer API moved from its WICG draft into the HTML Standard."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: html-innerhtml-plus-equals
  front: "Does `el.innerHTML += '<li>x</li>'` just append?"
  back: "No. It serialises all children, concatenates, and re-parses: every existing child is replaced by a new node, losing listeners, form state and references. Use `insertAdjacentHTML('beforeend', …)` or `append()`."
  question: browser/the-dom/innerhtml-textcontent-innertext
- id: query-selector-methods
  front: "What do `querySelector()`, `querySelectorAll()`, `closest()` and `matches()` return?"
  back: "`querySelector()` the first matching descendant in tree order or `null`; `querySelectorAll()` a static `NodeList`; `closest()` the nearest matching ancestor, itself included, or `null`; `matches()` a boolean for this element."
  question: browser/the-dom/querying-and-traversal
- id: query-invalid-selector
  front: "What happens if you pass an invalid selector to `querySelector()`, `closest()` or `matches()`?"
  back: "They throw a `SyntaxError` `DOMException`."
  question: browser/the-dom/querying-and-traversal
- id: query-closest-includes-self
  front: "Does `closest()` check the element itself?"
  back: "Yes, it checks the element first, then each ancestor. `btn.closest('button')` returns `btn`."
  question: browser/the-dom/querying-and-traversal
- id: query-scope-trap
  front: "Does `el.querySelector('section p')` require the `section` to be inside `el`?"
  back: "No. The selector is matched against the whole tree and only the result must be inside `el`, so ancestors outside `el` count. Anchor it with `:scope`: `el.querySelector(':scope > p')`."
  question: browser/the-dom/querying-and-traversal
- id: query-scope-in-closest-matches
  front: "What does `:scope` mean in `closest()` and `matches()`?"
  back: "The element itself."
  question: browser/the-dom/querying-and-traversal
- id: query-shadow-boundary
  front: "Do selectors cross shadow roots?"
  back: "No. They match within one tree, so `document.querySelector()` doesn't find nodes inside a component's shadow root, and `closest()` doesn't climb out of one."
  question: browser/the-dom/querying-and-traversal
- id: query-delegation
  front: "How do `closest()` and `matches()` support event delegation?"
  back: "Put one listener on a container, then use `event.target.closest('.del')` to find the control that was clicked."
  question: browser/the-dom/querying-and-traversal
- id: query-css-escape
  front: "Why escape user input placed into a selector, and with what?"
  back: "A stray `\"` or `#1` throws `SyntaxError`. Escape it with `CSS.escape()`."
  question: browser/the-dom/querying-and-traversal
- id: query-getelementbyid-vs-qs
  front: "`getElementById()` or `querySelector('#id')`, for an ID such as `1a`?"
  back: "Both return the first element with that ID in tree order. `getElementById()` takes the raw ID; `querySelector()` needs `#\\31 a` (from `CSS.escape('1a')`). `getElementById()` exists only on `Document` and `DocumentFragment`."
  question: browser/the-dom/querying-and-traversal
- id: query-pseudo-elements
  front: "Can `querySelector()` match a pseudo-element like `p::before`?"
  back: "No. It returns `null` in Chrome 156 and Firefox 159 rather than throwing, because pseudo-elements aren't nodes."
  question: browser/the-dom/querying-and-traversal
- id: query-treewalker-purpose
  front: "What does a `TreeWalker` visit, and what is it for?"
  back: "Nodes of any type, chosen by `whatToShow` (`SHOW_TEXT`, `SHOW_COMMENT`, `SHOW_ELEMENT`…). Use it for things selectors can't express: collecting text nodes for highlighting, finding comments, or pruning whole subtrees."
  question: browser/the-dom/querying-and-traversal
- id: query-treewalker-filter
  front: "What do `FILTER_ACCEPT`, `FILTER_SKIP` and `FILTER_REJECT` mean in a `TreeWalker` filter?"
  back: "Accept visits the node. Skip omits the node but still visits its children. Reject omits the node and its subtree."
  question: browser/the-dom/querying-and-traversal
- id: query-treewalker-root
  front: "Where does a `TreeWalker` start, and does `nextNode()` return the root?"
  back: "`currentNode` starts at `root`, and `nextNode()` never returns it. Stepping uses `nextNode()`, `parentNode()`, `firstChild()` and friends."
  question: browser/the-dom/querying-and-traversal
- id: query-treewalker-mutation
  front: "How does a `TreeWalker` behave when the tree changes during the walk?"
  back: "It follows the tree as it is when you step, so it handles mutations during the walk."
  question: browser/the-dom/querying-and-traversal
- id: query-nodeiterator-reject
  front: "How does `FILTER_REJECT` differ between `NodeIterator` and `TreeWalker`?"
  back: "In a `NodeIterator`, a flat variant, `FILTER_REJECT` acts like `FILTER_SKIP`. Only `TreeWalker` treats reject as \"skip children too\"."
  question: browser/the-dom/querying-and-traversal
- id: query-treewalker-reject-example
  front: "Walking elements under a `div` that holds `p`, `a`, then `ul > li > button`, what does a filter that rejects `UL` yield versus one that skips it?"
  back: "Reject gives `P,A`; skip gives `P,A,LI,BUTTON`. Neither includes `DIV`, because the walker starts at the root. Chrome 156 and Firefox 159 agreed."
  question: browser/the-dom/querying-and-traversal
# 02 Events
- id: dispatch-event-path
  front: "What is the event path that dispatch builds, and when is it fixed?"
  back: "The target, each parent up to the root, then the `Document` and its `Window`. It is fixed before any listener runs, so moving or removing nodes mid-dispatch doesn't change who gets called."
  question: browser/events/event-dispatch-phases
- id: dispatch-three-phases
  front: "In what order does dispatch walk the path, and what is `eventPhase` in each phase?"
  back: "Capture from `Window` down to the target's parent (`eventPhase` 1), then the target (`AT_TARGET`, 2), then bubble from the target's parent back up to `Window` (`BUBBLING_PHASE`, 3)."
  question: browser/events/event-dispatch-phases
- id: dispatch-at-target-order
  front: "At the target, in what order do listeners run?"
  back: "Capture listeners first, then the rest, whatever order they were added in. Registration order does not decide it."
  question: browser/events/event-dispatch-phases
- id: dispatch-bubbles-false
  front: "What does `bubbles: false` remove from dispatch?"
  back: "Only the bubble phase (phase 3). The target's own listeners and every capture listener on ancestors still run."
  question: browser/events/event-dispatch-phases
- id: dispatch-target-vs-currenttarget
  front: "What are `event.target`, `event.currentTarget` and `composedPath()`?"
  back: "`target` is the node the event was dispatched at; `currentTarget` is the node whose listener is running now; `composedPath()` returns the path as an array, target first."
  question: browser/events/event-dispatch-phases
- id: dispatch-bubbling-events
  front: "Which common events bubble, and which don't?"
  back: "`click`, `input` and `keydown` bubble. `focus`, `blur`, `mouseenter`, `mouseleave` and `load` on an element don't, but a capture listener on an ancestor still sees them."
  question: browser/events/event-dispatch-phases
- id: dispatch-reset-after
  front: "What are `eventPhase`, `currentTarget` and `composedPath()` after dispatch ends?"
  back: "`eventPhase` is 0, `currentTarget` is `null` and `composedPath()` returns `[]`. Read them inside the listener, not after an `await` or in a `setTimeout`."
  question: browser/events/event-dispatch-phases
- id: dispatch-shadow-retarget
  front: "What do listeners outside a shadow root see for `target`, and which events leave the shadow tree?"
  back: "`target` is retargeted to the host, and only `composed: true` events leave the shadow tree at all."
  question: browser/events/event-dispatch-phases
- id: dispatch-default-bubble
  front: "Why does `addEventListener()` default to bubble rather than capture?"
  back: "Bubbling lets the most specific handler run first and ancestors react afterwards, which is what delegation needs. Capture is for seeing an event before the target's own handlers do."
  question: browser/events/event-dispatch-phases
- id: dispatch-load-not-window
  front: "Does `window` see every bubbling event, e.g. an `<img>`'s `load`?"
  back: "No. A `Document` returns no parent for `load` events, so an `<img>`'s `load` reaches `document` listeners but never `window` ones."
  question: browser/events/event-dispatch-phases
- id: dispatch-this-in-listener
  front: "What does `this` refer to in a listener?"
  back: "`currentTarget` for a regular function. An arrow function keeps the surrounding `this`, so use `event.currentTarget` there."
  question: browser/events/event-dispatch-phases
- id: dispatch-get-the-parent
  front: "How does dispatch use *get the parent* to build the path, and why does a standalone `EventTarget` never propagate?"
  back: "A node returns its assigned slot if it has one, otherwise its parent; a `Document` returns its `Window`; a shadow root returns its host. A `Window` and a plain `new EventTarget()` return null, so nothing propagates."
  question: browser/events/event-dispatch-phases
- id: dispatch-listener-list-clone
  front: "What happens to a listener added to the current node during dispatch, versus one added to a node not yet reached?"
  back: "Inner invoke clones the node's listener list before calling anything, so a listener added to the current node doesn't run for this event. One added to a node the walk hasn't reached yet does. A removed listener is skipped even if it's in the clone."
  question: browser/events/event-dispatch-phases
- id: dispatch-listener-throws
  front: "What happens when a listener throws during dispatch?"
  back: "The error is reported to `window`'s `error` event and dispatch moves on to the next listener; one broken handler doesn't stop the others."
  question: browser/events/event-dispatch-phases
- id: dispatch-detached-path
  front: "What is the event path for a node outside the document?"
  back: "Its ancestors only, with no `Document` or `Window`. A `span` inside a detached `div` gave `SPAN,DIV` in Chrome 156 and Firefox 159."
  question: browser/events/event-dispatch-phases
- id: dispatch-load-capture-document
  front: "How can you observe every image `load` event in one place?"
  back: "A capture listener on `document`. Resource `load` events stop at the `Document`, so a `window` capture listener never saw them in Chrome 156 and Firefox 159."
  question: browser/events/event-dispatch-phases
- id: dispatch-focusin-focusout
  front: "Which events bubble for the same focus changes as `focus` and `blur`?"
  back: "`focusin` and `focusout`. Delegated focus handling uses those, or a capture listener."
  question: browser/events/event-dispatch-phases
- id: dispatch-click-outside-capture
  front: "Why can a bubble-phase click-outside handler on `document` stop working, and what fixes it?"
  back: "Some component calls `stopPropagation()` on its clicks. Registering the handler with `capture: true` sees the click on the way down, before any target-side handler can stop it. Don't call `stopPropagation()` there."
  question: browser/events/event-dispatch-phases
- id: dispatch-capture-vs-bubble-tradeoff
  front: "When should a handler use capture versus bubble?"
  back: "Capture on `document` runs before every component's handlers: right for observation, wrong for behaviour a component should override. Bubble lets inner code run first and decide with `preventDefault()`, but `stopPropagation()` can skip it. Ask who gets the last word."
  question: browser/events/event-dispatch-phases
- id: dispatch-ping-example
  front: "A `new Event('ping')` is dispatched on a child. Which listeners run: parent capture, parent bubble, child?"
  back: "Parent capture and child. `new Event('ping')` has `bubbles: false`, which skips only the bubble phase. Chrome 156 and Firefox 159 agreed."
  question: browser/events/event-dispatch-phases
- id: delegation-definition
  front: "What is event delegation?"
  back: "Handling events for many elements with one listener on an ancestor. A `click` on any descendant bubbles up to it, and the handler works out which item was meant."
  question: browser/events/event-delegation
- id: delegation-closest-steps
  front: "What are the three steps of a delegated handler?"
  back: "Start from `event.target`, the innermost element hit; call `event.target.closest(selector)` for the nearest matching ancestor or the element itself; check `container.contains(match)`, because `closest()` keeps climbing past the container."
  question: browser/events/event-delegation
- id: delegation-why
  front: "Why use event delegation?"
  back: "Items rendered later work without wiring, there's one listener instead of thousands, and nothing needs removing when rows are deleted. `event.currentTarget` is still the container."
  question: browser/events/event-delegation
- id: delegation-non-bubbling
  front: "Which events never reach an ancestor's bubble listener, and what are the alternatives?"
  back: "`focus`, `blur`, `mouseenter`, `mouseleave`, `pointerenter`, `pointerleave`, element `scroll`, `invalid`, and `load`/`error` on an image. Use the bubbling twins (`focusin`/`focusout`, `pointerover`/`pointerout`) or a capture listener."
  question: browser/events/event-delegation
- id: delegation-stoppropagation-below
  front: "How can `stopPropagation()` break delegation?"
  back: "Any handler between the target and the container that stops propagation hides the event from the delegate."
  question: browser/events/event-delegation
- id: delegation-shadow-dom
  front: "Why can't `closest()` find an inner element from a delegate outside a shadow root, and what can?"
  back: "Outside a shadow root `event.target` is retargeted to the host. `composedPath()` can see the inner nodes for open shadow roots; a closed root's internals are left out."
  question: browser/events/event-delegation
- id: delegation-disabled-controls
  front: "Does a delegate hear a real click on a disabled `<button>` or on an element inside one?"
  back: "No. A real click fires no `click` at all. In Chrome 156 and Firefox 159 a trusted click dispatched `pointerdown` to the delegate but no `mousedown`, `mouseup` or `click`. Use `pointerdown`, or `aria-disabled` instead of `disabled`."
  question: browser/events/event-delegation
- id: delegation-matches-vs-closest
  front: "Why is `event.target.matches('button')` wrong for delegating clicks on a button?"
  back: "A click on the `<b>` inside the button fails the test. Use `closest()` to find the nearest matching ancestor."
  question: browser/events/event-delegation
- id: delegation-contains-check
  front: "Why keep the `container.contains(match)` check in a delegated handler?"
  back: "With nested lists, `closest()` can return an ancestor outside the container. A tag's `<li>` without `data-id` made `closest('li[data-id]')` climb to the outer post item (`7 false`)."
  question: browser/events/event-delegation
- id: delegation-divs-a11y
  front: "Why delegate clicks on real `<button>`s rather than `<div>`s?"
  back: "The handler works on divs, but keyboard and screen-reader users can't reach a div. Enter and Space on a focused `<button>` fire `click`, so keyboard support comes free."
  question: browser/events/event-delegation
- id: delegation-performance
  front: "Is delegation faster?"
  back: "It saves memory and setup when there are many items or they change often. Each event pays for a `closest()` walk, which matters only for high-frequency events like `pointermove`; there a direct listener is cheaper."
  question: browser/events/event-delegation
- id: delegation-mouseenter-per-item
  front: "How do you delegate `mouseenter` per item?"
  back: "Listen for `pointerover` (it bubbles), find the item with `closest()`, and ignore the event when `event.relatedTarget` is inside the same item, meaning the pointer moved between the item's own children."
  question: browser/events/event-delegation
- id: delegation-submit-vs-invalid
  front: "Why does a delegated `submit` listener on `document` work but `invalid` doesn't?"
  back: "`submit` bubbles; `invalid` is fired without `bubbles`. Register `invalid` with `capture: true` on the form or document."
  question: browser/events/event-delegation
- id: delegation-bubbles-observed
  front: "Which events had `bubbles: false` and which `true` seen from a `document` capture listener in Chrome 156 and Firefox 159?"
  back: "`false` for `focus`, `blur`, `mouseenter`, `mouseleave`, `pointerenter`, element `scroll`, `invalid`, and an image's `load` and `error`. `true` for `focusin`, `focusout`, `mouseover` and `pointerover`."
  question: browser/events/event-delegation
- id: delegation-closed-shadow
  front: "What should a component with a closed shadow root do to be delegated to?"
  back: "Dispatch its own composed event, because a closed shadow root's internals are left out of `composedPath()` for outside listeners."
  question: browser/events/event-delegation
- id: delegation-tradeoffs
  front: "What does delegation give up?"
  back: "Per-element control: one delegate can't easily be removed for one item, and its order relative to item-level handlers is fixed by the bubble phase. It also moves work from setup time to event time, including for events that match nothing."
  question: browser/events/event-delegation
- id: propagation-two-outcomes
  front: "What are the two independent outcomes of an event, and which method touches which?"
  back: "Which listeners hear it, and whether the browser then does its default action. The stop methods affect the first; `preventDefault()` the second."
  question: browser/events/default-actions-and-propagation
- id: propagation-preventdefault
  front: "What does `preventDefault()` do and when does it silently do nothing?"
  back: "It sets the canceled flag, so `defaultPrevented` is `true` and the default action (navigation, submit, key insertion) doesn't happen. It does nothing when `event.cancelable` is false or inside a `passive` listener. Propagation continues."
  question: browser/events/default-actions-and-propagation
- id: propagation-stoppropagation
  front: "What does `stopPropagation()` do?"
  back: "It sets the stop propagation flag. Remaining listeners on the current node still run, but the event goes no further along the path. In a capture listener on an ancestor it stops the event before it reaches the target."
  question: browser/events/default-actions-and-propagation
- id: propagation-stopimmediate
  front: "How does `stopImmediatePropagation()` differ from `stopPropagation()`?"
  back: "It also stops the remaining listeners on the current node."
  question: browser/events/default-actions-and-propagation
- id: propagation-stop-not-cancel
  front: "Does `stopPropagation()` stop a link from navigating?"
  back: "No. Neither stop method cancels the default action; only `preventDefault()` does."
  question: browser/events/default-actions-and-propagation
- id: propagation-activation-behaviour
  front: "When do defaults like links, buttons, checkboxes and form submission run, and who can cancel them?"
  back: "Activation behaviour runs after dispatch finishes, so any listener on the path can cancel it, and so can a `click()` or `dispatchEvent()` from script."
  question: browser/events/default-actions-and-propagation
- id: propagation-checkbox-toggle
  front: "Why does a click handler on a checkbox already see the new `checked` value?"
  back: "Its legacy-pre-activation behaviour toggles it before dispatch. If the event ends up canceled, legacy-canceled-activation behaviour restores the old value."
  question: browser/events/default-actions-and-propagation
- id: propagation-return-false
  front: "Does returning `false` cancel an event?"
  back: "From an `on*` handler property such as `onclick`, yes. From an `addEventListener()` callback, no, it does nothing."
  question: browser/events/default-actions-and-propagation
- id: propagation-legacy-aliases
  front: "What are the legacy aliases of `preventDefault()` and `stopPropagation()`?"
  back: "`event.returnValue = false` for `preventDefault()` and `cancelBubble = true` for `stopPropagation()`."
  question: browser/events/default-actions-and-propagation
- id: propagation-noncancelable
  front: "What happens calling `preventDefault()` on `new Event('x')`?"
  back: "Nothing. `new Event('x')` defaults to `cancelable: false`. Check `defaultPrevented`."
  question: browser/events/default-actions-and-propagation
- id: propagation-defaultprevented-dispatch
  front: "How can a later listener, or the dispatcher, know an event was canceled?"
  back: "`event.defaultPrevented` is `true`. `dispatchEvent()` returns `false` when a cancelable event was canceled."
  question: browser/events/default-actions-and-propagation
- id: propagation-stop-blinds-delegates
  front: "Why is `stopPropagation()` a poor way to keep a click to yourself?"
  back: "It also blinds delegates and document-level handlers such as analytics and click-outside. Prefer checking `defaultPrevented` there."
  question: browser/events/default-actions-and-propagation
- id: propagation-onerror-true
  front: "Does `return true` from `window.onerror` mean carry on?"
  back: "No, it's the inverted case: for `error` events on a global object returning `true` cancels the event, suppressing the default error report. `onbeforeunload` is the other exception."
  question: browser/events/default-actions-and-propagation
- id: propagation-checkbox-example
  front: "A checked box's click is canceled in an ancestor's capture listener. What does a box listener see for `checked`, and what is it afterwards?"
  back: "The listener sees `checked=false`, because the toggle happens before listeners run, and the box is `true` again afterwards because the cancelation restores it. A merely stopped click isn't canceled, so it stays toggled. Chrome 156 and Firefox 159 agreed."
  question: browser/events/default-actions-and-propagation
- id: options-arguments
  front: "What can the third argument of `addEventListener()` be?"
  back: "A boolean, meaning `capture`, or an options object with `capture`, `once`, `passive` and `signal`."
  question: browser/events/listener-options
- id: options-capture
  front: "What does the `capture` option do and what is its default?"
  back: "It registers the listener for the capture phase, so an ancestor hears the event before the target does. Default `false`."
  question: browser/events/listener-options
- id: options-once
  front: "When does `once` remove the listener?"
  back: "Just before its first call, even if the callback then throws."
  question: browser/events/listener-options
- id: options-passive
  front: "What does `passive: true` promise and what happens if the listener calls `preventDefault()`?"
  back: "That the listener won't call `preventDefault()`. If it does, the call is ignored and Chrome logs \"Unable to preventDefault inside passive event listener invocation.\""
  question: browser/events/listener-options
- id: options-passive-scroll
  front: "Why do non-passive `touchstart`, `touchmove` and `wheel` listeners cause scroll jank?"
  back: "For these types a passive listener lets the browser scroll without waiting for script, which is why non-passive listeners cause scroll jank."
  question: browser/events/listener-options
- id: options-passive-default
  front: "Which listeners are passive by default?"
  back: "When `passive` isn't given, `touchstart`, `touchmove` and `wheel` listeners on `window`, `document`, `<html>` or `<body>` default to passive."
  question: browser/events/listener-options
- id: options-passive-block-scroll
  front: "How do you block scrolling from a `wheel` or `touchmove` listener?"
  back: "Use `passive: false`, or CSS `touch-action` for touch. Marking it `passive` makes `preventDefault()` a no-op."
  question: browser/events/listener-options
- id: options-signal
  front: "What does the `signal` option do?"
  back: "Aborting the `AbortSignal` removes the listener. One `AbortController` can remove a whole component's listeners at once, with no function references kept. An already aborted signal means the listener is never added."
  question: browser/events/listener-options
- id: options-identity
  front: "What identifies a listener, and what happens adding the same one again?"
  back: "Type, callback and `capture`. Adding the same trio again is ignored, even with different `once` or `passive` values, and `removeEventListener()` looks only at those three."
  question: browser/events/listener-options
- id: options-remove-capture
  front: "How do you remove a listener added with `capture: true`?"
  back: "Pass `capture: true` to `removeEventListener()` too. Without it nothing matches and the listener stays."
  question: browser/events/listener-options
- id: options-remove-arrow
  front: "Why does `removeEventListener()` with a new arrow function not work?"
  back: "It's a different callback. Keep the reference or use `signal`."
  question: browser/events/listener-options
- id: options-handler-properties
  front: "How do event handler properties like `el.onclick` behave?"
  back: "One handler per event type: assigning replaces it, `null` removes it, and returning `false` cancels the event. The first non-null assignment adds a non-capture listener at that point in the list; later assignments keep that position."
  question: browser/events/listener-options
- id: options-support-versions
  front: "In which browser versions did `once` and `signal` arrive?"
  back: "`once` in Chrome 55, Firefox 50 and Safari 10; `signal` in Chrome 90, Firefox 86 and Safari 15."
  question: browser/events/listener-options
- id: options-passive-default-support
  front: "In which browsers are touch and `wheel` listeners passive by default?"
  back: "Touch listeners in Chrome 55, Firefox 61 and Safari 11.1; `wheel` listeners in Chrome 73 and Firefox 84, not Safari."
  question: browser/events/listener-options
- id: options-wheel-uncancelable
  front: "What happens to `cancelable` when every `wheel` listener is passive?"
  back: "The DOM Standard lets the browser dispatch it uncancelable so scrolling can start in parallel. In Chrome 156 and Firefox 159 a real wheel with only a default-passive `window` listener arrived with `cancelable: false` and the page scrolled."
  question: browser/events/listener-options
- id: options-event-target-when
  front: "What is `EventTarget.when(type)` and how widely does it ship?"
  back: "From the WICG Observable proposal, it returns an Observable of events. It shipped in Chrome 135 only; Firefox and Safari don't have it, so treat it as experimental."
  question: browser/events/listener-options
- id: options-once-remove
  front: "Does `removeEventListener()` remove a `once` listener before it fires?"
  back: "Yes, if type, callback and `capture` match. `once` doesn't change identity."
  question: browser/events/listener-options
- id: custom-customevent
  front: "How do you create a custom event that carries data?"
  back: "`new CustomEvent('cart:add', { detail })`. `detail` carries any value, by reference."
  question: browser/events/custom-events
- id: custom-flags
  front: "What do `bubbles`, `cancelable` and `composed` do on a custom event, and what do they default to?"
  back: "All default to `false`. `bubbles: true` lets ancestors and delegates hear it; `cancelable: true` lets a listener veto with `preventDefault()`; `composed: true` lets it cross shadow-root boundaries."
  question: browser/events/custom-events
- id: custom-subclass
  front: "How can you carry typed fields on a custom event instead of `detail`?"
  back: "Subclass `Event`, e.g. `class AddEvent extends Event`, and put the fields on it."
  question: browser/events/custom-events
- id: custom-dispatchevent-return
  front: "What does `dispatchEvent()` return and when is it synchronous?"
  back: "It runs the listeners synchronously and returns `false` if the event was cancelable and some listener canceled it. That is how a component asks permission before acting."
  question: browser/events/custom-events
- id: custom-redispatch-error
  front: "What happens dispatching an event that is already being dispatched?"
  back: "An `InvalidStateError`."
  question: browser/events/custom-events
- id: custom-eventtarget-objects
  front: "How do you give a non-DOM object `addEventListener()` and `dispatchEvent()`?"
  back: "Use `new EventTarget()` or a class that extends it. Such targets have no parent, so nothing propagates. The constructor arrived in Chrome 64, Firefox 59 and Safari 14."
  question: browser/events/custom-events
- id: custom-istrusted
  front: "What does `isTrusted` mean?"
  back: "`true` when the browser dispatched the event because of real input or its own algorithms; `false` for anything from `dispatchEvent()`, including `el.click()`."
  question: browser/events/custom-events
- id: custom-user-activation
  front: "Which events grant user activation, and does a dispatched one?"
  back: "Only trusted `keydown`, `mousedown`, `pointerdown`, `pointerup` and `touchend` events. Untrusted events grant none, so they can't unlock activation-gated APIs like `requestFullscreen()`."
  question: browser/events/custom-events
- id: custom-events-notify
  front: "Does a synthetic event cause the action it names, e.g. a `keydown` typing a character?"
  back: "No, events notify; they don't cause actions. The exception is activation behaviour: a `MouseEvent` named `click` follows a link or toggles a checkbox even when untrusted."
  question: browser/events/custom-events
- id: custom-event-click-checkbox
  front: "Does dispatching `new Event('click', { bubbles: true })` toggle a checkbox, and does a `MouseEvent` named `click`?"
  back: "The plain `Event` doesn't (`false`); the `MouseEvent` does (`true`). Activation behaviour runs only for a `MouseEvent` (or subclass) whose type is `click`, trusted or not."
  question: browser/events/custom-events
- id: custom-naming
  front: "How should you name custom events?"
  back: "So they can't clash with built-in ones, for example with a prefix like `cart:add`."
  question: browser/events/custom-events
- id: custom-istrusted-not-security
  front: "Is `isTrusted` a security boundary for your own code?"
  back: "No. It tells you the browser fired the event, nothing more; it doesn't authenticate data in `detail`."
  question: browser/events/custom-events
- id: custom-click-not-trusted
  front: "Is `el.click()` trusted, and does it give user activation?"
  back: "No. The DOM Standard calls it the legacy exception: it runs activation behaviour like a real click but `isTrusted` is `false`. `navigator.userActivation.isActive` stayed `false` in its listener and was `true` for a real click in Chrome 156 and Firefox 159."
  question: browser/events/custom-events
- id: custom-redispatch-canceled
  front: "Can the same event object be dispatched twice, and does cancelation persist?"
  back: "After the first dispatch finishes, yes. Dispatch resets the stop flags but not the canceled flag, so a canceled event stays `defaultPrevented` and `dispatchEvent()` returns `false` again."
  question: browser/events/custom-events
- id: custom-web-component-event
  front: "How does a web component announce a change to the page?"
  back: "Dispatch a bubbling `CustomEvent` on the host itself. An event dispatched inside the shadow root also needs `composed: true` to cross the boundary; outside listeners then see it retargeted to the host."
  question: browser/events/custom-events
- id: microtask-dispatch-sync
  front: "Is `dispatchEvent()` synchronous?"
  back: "Yes. It builds the path, calls every listener in order, runs any activation behaviour, and only then returns `true`, or `false` if canceled. A throwing listener is reported to `window`'s `error` event and the caller carries on."
  question: browser/events/dispatch-and-microtasks
- id: microtask-checkpoint
  front: "When does a microtask checkpoint run after a listener?"
  back: "The HTML Standard performs one in clean up after running script, whenever a callback returns and the JavaScript execution context stack is empty. Web IDL runs that cleanup after every listener call."
  question: browser/events/dispatch-and-microtasks
- id: microtask-real-click
  front: "In a real click, when do a listener's microtasks run?"
  back: "Before the next listener starts and before the default action. The browser dispatches from a task with no script running, so each listener returns to an empty stack. Trusted click logged `listener 1, microtask 1, listener 2, microtask 2` in Chrome 156 and Firefox 159."
  question: browser/events/dispatch-and-microtasks
- id: microtask-scripted-dispatch
  front: "When do microtasks run for `el.click()` or `dispatchEvent()` called from script?"
  back: "After the whole dispatch. The calling script is still on the stack, so it never empties between listeners; microtasks wait until the outermost script returns. Logged `listener 1, listener 2, after dispatchEvent(), microtask 1, microtask 2`."
  question: browser/events/dispatch-and-microtasks
- id: microtask-stack-not-istrusted
  front: "Is the microtask ordering difference about `isTrusted`?"
  back: "No, it's about who is on the stack. A trusted `focus` event fired synchronously by `el.focus()` behaves like the scripted case: the microtask runs after the script ends."
  question: browser/events/dispatch-and-microtasks
- id: microtask-await-preventdefault
  front: "Does `preventDefault()` after an `await` in a click listener work?"
  back: "For a real click, yes: dispatch is still in progress and `currentTarget` is set. For `el.click()` the code runs after dispatch ended, `currentTarget` is `null` and canceling is too late. Call it before the first `await`."
  question: browser/events/dispatch-and-microtasks
- id: microtask-test-pitfall
  front: "Why can tests using `el.click()` pass while real users see different behaviour?"
  back: "Microtask ordering and the state after an `await` differ between scripted and real dispatch. Use real input (WebDriver, Puppeteer, Playwright) when ordering matters."
  question: browser/events/dispatch-and-microtasks
- id: microtask-no-paint
  front: "Does a real click's microtask run before the browser paints?"
  back: "Yes. Microtasks run within the task that dispatched the click; rendering happens only between tasks, so neither listener nor microtask is separated by a paint."
  question: browser/events/dispatch-and-microtasks
- id: microtask-nested-dispatch
  front: "What if a listener dispatches another event?"
  back: "It runs synchronously inside the listener, and its listeners' microtasks wait because the outer listener is still on the stack. In a real click they run when that outer listener returns, before the next one."
  question: browser/events/dispatch-and-microtasks
- id: microtask-settimeout-between
  front: "Do tasks such as `setTimeout` queued in a listener run between listeners?"
  back: "No, never. A task runs only after the current task, including the whole dispatch and its default action, has finished."
  question: browser/events/dispatch-and-microtasks
- id: microtask-focus-example
  front: "In `field.focus()` with two `focus` listeners and a `queueMicrotask` in the first, what is the log order?"
  back: "`focus trusted=true, focus 2, after focus(), microtask`. The browser fires `focus` itself so it's trusted, but synchronously inside `field.focus()` while the script is on the stack. Chrome 156 and Firefox 159 agreed."
  question: browser/events/dispatch-and-microtasks
- id: input-pointer-events
  front: "Which events cover pointing for mouse, touch and pen, and how do you tell the device and simultaneous touches apart?"
  back: "`pointerdown`, `pointermove`, `pointerup` and `pointercancel`. `pointerType` says which device; `pointerId` separates simultaneous touches."
  question: browser/events/input-events
- id: input-pointer-capture
  front: "What does `el.setPointerCapture(event.pointerId)` do?"
  back: "It sends that pointer's later events to `el` even after the pointer leaves it, until `pointerup`. Without it a drag stops updating when the pointer leaves the element."
  question: browser/events/input-events
- id: input-touch-action
  front: "Why set CSS `touch-action: none` on a touch drag?"
  back: "It tells the browser which panning or zooming it may start itself. Without it the browser may take the gesture to pan or zoom, and fires `pointercancel` when it does."
  question: browser/events/input-events
- id: input-compat-mouse-events
  front: "What does canceling `pointerdown` suppress among the compatibility mouse events?"
  back: "The later `mousedown` and `mouseup`, but not `click`. Touch events are needed only for code that predates pointer events."
  question: browser/events/input-events
- id: input-click-activation
  front: "Which event means the user activated something?"
  back: "`click`. It fires for mouse, touch, and Enter or Space on a focused button."
  question: browser/events/input-events
- id: input-key-vs-code
  front: "What is the difference between `event.key` and `event.code`?"
  back: "`key` is the value produced, after layout and modifiers (`\"a\"`, `\"A\"`, `\"!\"`, `\"Enter\"`). `code` is the physical key (`\"KeyA\"`, `\"Digit1\"`), the same on every layout. Use `key` for character shortcuts and `code` for position-based controls like WASD."
  question: browser/events/input-events
- id: input-keypress-deprecated
  front: "What is the status of `keypress`?"
  back: "Deprecated."
  question: browser/events/input-events
- id: input-layout-code
  front: "On a French layout, what are `key` and `code` for the key in the \"2\" position?"
  back: "`key` is `\"é\"` but `code` is still `\"Digit2\"`. Matching shortcuts on `code` breaks when the user means a character."
  question: browser/events/input-events
- id: input-beforeinput-vs-input
  front: "How do `beforeinput` and `input` differ?"
  back: "`beforeinput` fires before the edit with `inputType` and `data`, and canceling it blocks the edit. `input` fires after and can't be canceled."
  question: browser/events/input-events
- id: input-no-keydown-filter
  front: "Why not filter text in `keydown`?"
  back: "Text arrives by typing, paste, drag, autocorrect, dictation and IMEs, which key events can't track. Use `beforeinput`."
  question: browser/events/input-events
- id: input-composition
  front: "What fires during IME composition and which of it can be canceled?"
  back: "Between `compositionstart` and `compositionend`, the steps fire `beforeinput`/`input` with `isComposing: true`, and that `beforeinput` can't be canceled. Validate or search on `compositionend`, not every step."
  question: browser/events/input-events
- id: input-beforeinput-cancelable
  front: "Is every `beforeinput` cancelable?"
  back: "Input Events Level 2 makes every one cancelable except those inside an IME composition. In Chrome 156 (the only browser checked, via CDP emulation) an emulated composition's `insertCompositionText` events had `cancelable: false` and canceling them changed nothing."
  question: browser/events/input-events
- id: input-dead-key
  front: "Which `key` does a dead key produce, and how should you read the resulting text?"
  back: "`\"Dead\"` on its `keydown`. In the UI Events example, a composition follows: the next `keydown` already reports `\"ê\"` and `compositionend` carries `\"ê\"`. Read text from input and composition events, not by reassembling keys."
  question: browser/events/input-events
- id: input-knob-example
  front: "A pointer is captured in `pointerdown` (default prevented), dragged off the element and released. Which events log?"
  back: "`pointerdown, pointerup, lostpointercapture, click`. Capture sends `pointerup` and `click` to the element; canceling `pointerdown` suppresses `mousedown` and `mouseup` but not `click`. Puppeteer `page.mouse` in Chrome 156 and Firefox 159."
  question: browser/events/input-events
# 03 The HTML event loop
- id: loop-cycle
  front: "What one cycle does the HTML event loop repeat, and is rendering part of it?"
  back: "Pick a runnable task, run it, then perform a microtask checkpoint that drains every promise reaction and `queueMicrotask()` callback. Rendering is not part of that cycle."
  question: browser/html-event-loop/rendering-steps
- id: loop-rendering-task
  front: "How does rendering get scheduled relative to the event loop?"
  back: "Whenever a document has a rendering opportunity, the browser queues a task on the rendering task source that runs *update the rendering*. Because it is a task, it competes with other task queues, and the spec doesn't fix its priority."
  question: browser/html-event-loop/rendering-steps
- id: loop-rendering-opportunity
  front: "What is a rendering opportunity?"
  back: "A moment when the browser can actually present a new frame. The spec leaves the model to the browser: usually the display's refresh rate (about 16.7 ms at 60 Hz), lower when the page can't keep up, and much lower or never for hidden documents."
  question: browser/html-event-loop/rendering-steps
- id: loop-rendering-order
  front: "In what order does update the rendering run its main steps?"
  back: "Resize and scroll steps; media query changes, then animation updates and events; `requestAnimationFrame` callbacks; style and layout, repeated while `ResizeObserver` callbacks change sizes; intersection observations, paint timing, then the actual screen update."
  question: browser/html-event-loop/rendering-steps
- id: loop-task-before-frame
  front: "If a task makes ten DOM writes, how many frames show them?"
  back: "One, showing the final state. A task always finishes before a frame; nothing in between is ever painted."
  question: browser/html-event-loop/rendering-steps
- id: loop-microtasks-block-rendering
  front: "Can microtasks block rendering?"
  back: "Yes. Microtasks finish before a frame, so a microtask that keeps queueing microtasks blocks rendering as surely as a `while` loop. Chaining microtasks to \"break up\" work doesn't help."
  question: browser/html-event-loop/rendering-steps
- id: loop-long-task
  front: "How does a long task affect rendering?"
  back: "It delays the next frame: the rendering task can't start until the current task and its microtasks are done."
  question: browser/html-event-loop/rendering-steps
- id: loop-rendering-skipped
  front: "When can the browser skip rendering a document?"
  back: "When it is hidden, render-blocked, or has nothing to repaint and no animation frame callbacks. Rendering happens only at rendering opportunities, not every loop iteration."
  question: browser/html-event-loop/rendering-steps
- id: loop-forced-layout-no-paint
  front: "Does reading `offsetWidth` inside a task paint?"
  back: "No. It runs style and layout early, but painting still waits for update the rendering. It also doesn't fire `resize` or `scroll` events or run animation frame callbacks."
  question: browser/html-event-loop/rendering-steps
- id: loop-loading-message
  front: "Why doesn't a \"Loading…\" message set before a long synchronous job appear?"
  back: "No rendering task can run until the current task ends, so it is never painted. Yield to the event loop first. In the exercise the frame showed `Saved`, never `Saving…`."
  question: browser/html-event-loop/rendering-steps
- id: loop-timeout-vs-raf-order
  front: "Does `setTimeout(fn, 0)` run before or after the next `requestAnimationFrame` callback?"
  back: "The spec doesn't order a timer task against the rendering task. In headless Chrome 156 the timeout ran first in 60 of 60 trials; in headless Firefox 159 the animation frame callback ran first in 60 of 60."
  question: browser/html-event-loop/rendering-steps
- id: loop-hidden-raf-spec
  front: "Do `requestAnimationFrame` callbacks run in a hidden tab, by the spec?"
  back: "No. Update the rendering filters out documents whose visibility state is `\"hidden\"`, so their callbacks wait until the page is visible again."
  question: browser/html-event-loop/rendering-steps
- id: loop-intersection-resize-delivery
  front: "Where do `IntersectionObserver` and `ResizeObserver` callbacks run?"
  back: "`ResizeObserver` callbacks run inside the style-and-layout step itself. `IntersectionObserver` observations are computed in update the rendering after layout, but callbacks are delivered in a separate task queued from there."
  question: browser/html-event-loop/rendering-steps
- id: loop-timers-back-to-back
  front: "Can two timer callbacks run with no frame between them?"
  back: "Yes. The spec lets the browser skip rendering, for example to coalesce timer callbacks so they run back to back with only microtask checkpoints between them."
  question: browser/html-event-loop/rendering-steps
- id: loop-example-order
  front: "In one task: `scrollTo`, a `ResizeObserver`, a rAF, a promise and a `scroll` listener. What is the order?"
  back: "`task ends, microtask, scroll event, rAF, ResizeObserver`. The scroll event waits for the next frame's scroll steps, before animation frame callbacks; `ResizeObserver` delivers after layout. Chrome 156 and Firefox 159 agreed in three runs each."
  question: browser/html-event-loop/rendering-steps
- id: loop-frame-timestamp
  front: "What is `frameTimestamp` in update the rendering?"
  back: "The last render opportunity time, recorded when the browser decided a navigable might have a rendering opportunity."
  question: browser/html-event-loop/rendering-steps
- id: loop-document-ordering
  front: "In what order are documents processed in update the rendering?"
  back: "The fully active documents on the event loop, with an iframe's document after its parent and siblings in tree order. Same-origin iframes share their parent's event loop, so a slow iframe callback delays the parent's paint."
  question: browser/html-event-loop/rendering-steps
- id: loop-document-filter
  front: "Which documents does update the rendering filter out?"
  back: "Non-renderable ones (render-blocked, hidden, suppressed for a view transition, or without a rendering opportunity now); unnecessary rendering (no visible effect expected and no animation frame callbacks); and any the browser prefers to skip."
  question: browser/html-event-loop/rendering-steps
- id: loop-empty-stack-per-callback
  front: "Is there a microtask checkpoint between callbacks inside update the rendering?"
  back: "Yes. Every callback is invoked from an empty stack, so a checkpoint runs after each one. A promise resolved in a scroll listener settles before the animation frame callbacks start."
  question: browser/html-event-loop/rendering-steps
- id: loop-throttled-opportunities
  front: "What is the spec's example of throttled rendering opportunities?"
  back: "A browser that can't sustain 60 Hz might drop a page to 30 opportunities per second, and a hidden page to 4 per second or fewer."
  question: browser/html-event-loop/rendering-steps
- id: loop-spinner-fix
  front: "How do you make feedback appear before a slow synchronous click job?"
  back: "End the task after the feedback: run the slow part after `await scheduler.yield()`, or in a `setTimeout` queued from a `requestAnimationFrame` callback. Better still, move the parsing to a worker."
  question: browser/html-event-loop/rendering-steps
- id: loop-batching-tradeoff
  front: "What does batching visual work into one step per frame cost?"
  back: "The page has no way to flush a paint: the only way to show an intermediate state is to end the task and let a rendering opportunity arrive. Progress must be written as several tasks, and layout reads between writes force extra synchronous layouts."
  question: browser/html-event-loop/rendering-steps
- id: raf-what-it-does
  front: "What does `requestAnimationFrame(callback)` do, and what does it return?"
  back: "It adds the callback to the document's map of animation frame callbacks and returns a handle for `cancelAnimationFrame()`. It doesn't schedule a task; the callbacks run as one step of update the rendering."
  question: browser/html-event-loop/request-animation-frame
- id: raf-position-in-frame
  front: "Where in a frame do `requestAnimationFrame` callbacks run?"
  back: "After resize and scroll events, media query changes and CSS animation events, and before style recalculation, layout and paint. DOM writes made in a callback appear in that same frame."
  question: browser/html-event-loop/request-animation-frame
- id: raf-one-shot
  front: "How does an animation loop with `requestAnimationFrame` continue?"
  back: "Each call registers one callback for one frame, so the loop calls `requestAnimationFrame` again from inside its callback."
  question: browser/html-event-loop/request-animation-frame
- id: raf-snapshot
  front: "What happens to callbacks requested or cancelled while a frame's callbacks run?"
  back: "The browser takes the list of handles before running them. A callback requested during the run waits for the next frame; one cancelled during the run doesn't run, even if cancelled from an earlier callback."
  question: browser/html-event-loop/request-animation-frame
- id: raf-timestamp
  front: "What timestamp do `requestAnimationFrame` callbacks receive?"
  back: "The same `DOMHighResTimeStamp` for every callback in a frame: the time of the frame's rendering opportunity on the `performance.now()` clock, not the time the callback was called."
  question: browser/html-event-loop/request-animation-frame
- id: raf-microtasks-between
  front: "What happens between `requestAnimationFrame` callbacks, and if one throws?"
  back: "Each callback is invoked from an empty stack, so its promise reactions run before the next callback. A callback that throws is reported, and the rest still run."
  question: browser/html-event-loop/request-animation-frame
- id: raf-frame-rate
  front: "How often do `requestAnimationFrame` callbacks run?"
  back: "As often as the browser renders: about every 16.7 ms at 60 Hz, possibly faster on high-refresh displays, slower when the page can't keep up. It is not a fixed rate."
  question: browser/html-event-loop/request-animation-frame
- id: raf-hidden-observed
  front: "How did hidden pages behave for `requestAnimationFrame` in the browsers tested?"
  back: "With a headless page behind another tab, Chrome 156 ran no callbacks in 6 seconds; Firefox 159 still ran one every 1–2 seconds. The spec runs none for hidden documents."
  question: browser/html-event-loop/request-animation-frame
- id: raf-use-cases
  front: "What is `requestAnimationFrame` for, and what needs no per-frame script?"
  back: "Script-driven visual updates: canvas drawing, positions computed from input, batched DOM writes. Declarative motion such as CSS animations and transitions needs no per-frame script."
  question: browser/html-event-loop/request-animation-frame
- id: raf-fixed-distance
  front: "Why is moving an object a fixed distance per `requestAnimationFrame` callback a bug?"
  back: "Speed then depends on the display's refresh rate. Scale movement by the time since the previous frame's timestamp."
  question: browser/html-event-loop/request-animation-frame
- id: raf-timestamp-vs-now
  front: "Is the `requestAnimationFrame` timestamp never later than `performance.now()`?"
  back: "Not always. In headless Firefox 159 it was ahead by up to 0.7 ms in 49 of 120 frames; Chrome 156 never was."
  question: browser/html-event-loop/request-animation-frame
- id: raf-background-polling
  front: "Why not use `requestAnimationFrame` to keep time or poll in the background?"
  back: "Hidden pages get few or no frames. Use timers or events for non-visual work."
  question: browser/html-event-loop/request-animation-frame
- id: raf-read-write
  front: "What goes wrong reading layout then writing styles for many elements in one rAF callback?"
  back: "Each read after a write forces a synchronous layout. Read everything first, then write."
  question: browser/html-event-loop/request-animation-frame
- id: raf-after-paint
  front: "How do you run code right after the next frame is painted?"
  back: "Queue a task from a `requestAnimationFrame` callback, such as `setTimeout(fn, 0)`. That task can only start after the rendering task, paint included, has finished."
  question: browser/html-event-loop/request-animation-frame
- id: raf-vs-setinterval
  front: "Why not animate with `setInterval(fn, 16)`?"
  back: "Timers aren't aligned with rendering opportunities. Some frames get two updates and some none, so motion stutters, and the timer keeps running in hidden pages where nothing is drawn."
  question: browser/html-event-loop/request-animation-frame
- id: raf-in-workers
  front: "Does `requestAnimationFrame` exist in workers?"
  back: "Yes, in dedicated workers, for drawing to an `OffscreenCanvas`: Chrome 69, Firefox 99 and Safari 16.4."
  question: browser/html-event-loop/request-animation-frame
- id: raf-idle-cost
  front: "Does a pending `requestAnimationFrame` callback cost anything when nothing changes?"
  back: "Yes. A document with animation frame callbacks is never dropped as \"unnecessary rendering\", so an idle animation loop keeps the browser rendering every frame."
  question: browser/html-event-loop/request-animation-frame
- id: raf-cancel-example
  front: "Callbacks A (cancelled before the frame), B (cancels C and requests another), C, D are registered. Which run?"
  back: "`B, D`. `A` is cancelled before the frame. `C` is still in the frame's snapshot, but the algorithm skips any handle no longer in the map, so cancelling it from `B` works. Chrome 156 and Firefox 159 agreed."
  question: browser/html-event-loop/request-animation-frame
- id: timer-queues-task
  front: "What does a timer actually do when its delay passes?"
  back: "It queues a task. *Run steps after a timeout* waits at least the delay, optionally longer, then queues the callback on the timer task source. It never runs code at an exact time."
  question: browser/html-event-loop/timer-accuracy
- id: timer-waits-for
  front: "What can delay a timer callback beyond its delay?"
  back: "The running task and its microtasks (a 10 ms timer set before 200 ms of synchronous work runs after 200 ms); other queued tasks and rendering, since timers aren't top priority; the nesting clamp; and power-saving padding."
  question: browser/html-event-loop/timer-accuracy
- id: timer-nesting-clamp
  front: "What is the timer nesting clamp?"
  back: "After five nested levels, delays under 4 ms become 4 ms."
  question: browser/html-event-loop/timer-accuracy
- id: timer-hidden-padding
  front: "How did timers behave in a hidden page in Chrome 156 and Firefox 159?"
  back: "With a headless page hidden behind another tab, both ran a 100 ms interval once per second. The spec lets browsers wait \"a further implementation-defined length of time\"."
  question: browser/html-event-loop/timer-accuracy
- id: timer-intensive-throttling
  front: "What is Chrome's intensive throttling?"
  back: "After a page has been hidden for 5 minutes, chained timers wake at most once a minute (since Chrome 88). Pages that played sound in the last 30 seconds are spared any background throttling, and pages with live WebRTC connections are spared intensive throttling."
  question: browser/html-event-loop/timer-accuracy
- id: timer-delay-overflow
  front: "What happens with a timer delay above 2,147,483,647 ms?"
  back: "The delay is a Web IDL `long`, converted modulo 2³², so it wraps around, usually to a negative number, which is treated as 0. A 30-day timeout fires immediately; `Infinity` becomes 0 too."
  question: browser/html-event-loop/timer-accuracy
- id: timer-far-future
  front: "How should you schedule work more than about 24.8 days away?"
  back: "Not with one timer, since the delay wraps. Store the target time and re-check with shorter timers."
  question: browser/html-event-loop/timer-accuracy
- id: timer-interval-no-catchup
  front: "If the main thread is blocked through several `setInterval` periods, how many times does the callback run?"
  back: "Once when the thread is free, not once per missed period. A 100 ms interval blocked for 1,000 ms had `runs` equal to `1` at about 1,050 ms in Chrome 156 and Firefox 159."
  question: browser/html-event-loop/timer-accuracy
- id: timer-interval-rearm
  front: "Do Chrome 156 and Firefox 159 follow the spec's interval re-arming exactly?"
  back: "Neither follows it exactly: a 50 ms callback on a 100 ms interval still started every 100 ms in both."
  question: browser/html-event-loop/timer-accuracy
- id: timer-interval-after-block
  front: "After a 100 ms interval is blocked for 1,050 ms, when is the next run in Chrome 156 versus Firefox 159?"
  back: "It runs once about 1,050 ms in. Chrome 156 then went back to its original 100 ms grid (next run at 1,201 ms); Firefox 159 re-based on the late run (1,250 ms). Neither replayed the missed runs."
  question: browser/html-event-loop/timer-accuracy
- id: timer-use-for
  front: "Are timers for \"not before\" or \"exactly at\", and what should you use instead for visuals and yielding?"
  back: "\"Not before\", never \"exactly at\". For visual updates use `requestAnimationFrame`; for yielding, `scheduler.yield()`."
  question: browser/html-event-loop/timer-accuracy
- id: timer-clock-pitfall
  front: "Why not build a clock by counting `setInterval` ticks?"
  back: "Ticks are late, skipped while the thread is busy, and throttled in hidden pages. Derive time from `performance.now()` or `Date.now()`."
  question: browser/html-event-loop/timer-accuracy
- id: timer-background-polling
  front: "Does a background tab keep polling at your interval?"
  back: "No. Hidden pages get once-per-second wake-ups in Chrome 156 and Firefox 159, and Chrome cuts chained timers to once a minute after 5 minutes."
  question: browser/html-event-loop/timer-accuracy
- id: timer-settimeout-yield
  front: "Why is `setTimeout(fn, 0)` a poor way to yield inside a long job?"
  back: "Each yield queues behind every other task and hits the 4 ms clamp once nested. `scheduler.yield()` avoids both."
  question: browser/html-event-loop/timer-accuracy
- id: timer-bfcache
  front: "Do timers count time while a page is in the back/forward cache?"
  back: "No. On a `Window`, the spec waits until the document has been fully active for the delay, so time in the bfcache doesn't count."
  question: browser/html-event-loop/timer-accuracy
- id: timer-zero-delay
  front: "Is `setTimeout(fn, 0)` ever 0 ms?"
  back: "For an un-nested call it can be: from a message task, Chrome 156 measured 0 ms at its 0.1 ms clock resolution, and Firefox 159 0–2 ms at 1 ms resolution, over five runs each."
  question: browser/html-event-loop/timer-accuracy
- id: sched-problem
  front: "What problem does the Prioritized Task Scheduling API solve?"
  back: "The event loop runs one task at a time and lets the browser choose which queue to serve, but a page had no way to say which of its own tasks matter more."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-posttask
  front: "What does `scheduler.postTask(callback, options)` return?"
  back: "A promise for the callback's return value, rejected if the callback throws or the task is aborted."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-priorities
  front: "What are the three `postTask()` priorities and the default?"
  back: "`\"user-blocking\"` (work the user is waiting on), `\"user-visible\"` (the default) and `\"background\"` (logging, prefetching)."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-signal-delay
  front: "What do the `signal` and `delay` options of `postTask()` do?"
  back: "`signal` is an `AbortSignal` to cancel, or a `TaskSignal` from a `TaskController`, whose `setPriority()` moves pending tasks to a new priority and fires `prioritychange`. `delay` is milliseconds to wait before queueing."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-ordering
  front: "How are scheduler tasks ordered among themselves, and against timers and rendering?"
  back: "The highest priority runs first and ties go to the oldest. How they interleave with timers, messages, input and rendering is up to the browser; the spec suggests running `background` only when nothing else is waiting."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-yield
  front: "What does `await scheduler.yield()` do?"
  back: "It splits a long task: the rest of the function becomes a continuation task, so input handling and rendering get a turn first."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-yield-vs-timeout
  front: "How is the `scheduler.yield()` continuation better than `setTimeout(fn, 0)`?"
  back: "It runs one step above tasks of the same priority, so work queued meanwhile doesn't jump ahead; it inherits the priority and abort signal of its `postTask()` task (`user-visible` otherwise); and it isn't a timer, so no nesting clamp or hidden-page throttling."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-yield-example
  front: "Task `other task` is queued at the same priority before a job's `yield()`. Which runs first?"
  back: "`job part 2`, the continuation, ran before `other task`. Chrome 156 and Firefox 159 printed `user-blocking, user-visible, job part 1, job part 2, other task, background` in three runs each."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-messagechannel
  front: "How did libraries yield before this API, and what does that lack?"
  back: "With a `MessageChannel` message: no nesting clamp, but no priority either, so the continuation waits its turn like any other task."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-support
  front: "Which browsers support the Scheduler API, and how do you feature-detect?"
  back: "Chrome 94 and Firefox 142; `yield()` since Chrome 129 and Firefox 142. Safari has neither. Feature-detect with `'scheduler' in globalThis` and fall back to `setTimeout`."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-worker
  front: "When does work belong in a worker rather than yielding?"
  back: "When it is CPU-bound rather than input-bound."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-microtask-yield
  front: "Does `await Promise.resolve()` or `queueMicrotask()` yield to input and rendering?"
  back: "No. Microtasks run before rendering and input, so nothing is yielded."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-yield-cost
  front: "How much slower was a loop of 100 awaited `setTimeout(0)` yields than `scheduler.yield()`?"
  back: "394–428 ms in Chrome 156 and Firefox 159 (three runs each) because of the nesting clamp, versus 0–3 ms for `scheduler.yield()` and `MessageChannel`."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-cross-source-order
  front: "Is the order of `postTask()` against timers and messages the same in every browser?"
  back: "No. With a 0 ms timer, a message and three `postTask()` priorities queued together, Chrome 156 ran the timer and message before `user-visible`; Firefox 159 ran the timer last."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-abort-own-signal
  front: "What happens aborting a task's own signal from inside its callback?"
  back: "The task's promise is still pending at that point, so it rejects with an `AbortError` even though the callback ran."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-idle-callback-priority
  front: "What priority does `scheduler.yield()` use inside a `requestIdleCallback` callback?"
  back: "`background`. The scheduling spec patches idle callbacks to run with a fixed `background` priority, and the continuation inherits it."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-priority-survives-await
  front: "Does the inherited priority survive other `await`s before the yield?"
  back: "Yes. The spec stores the scheduling state with promise jobs, so a `yield()` after an awaited timer or `fetch()` inside a `background` task still yielded at `background` priority in Chrome 156 and Firefox 159."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-hidden-tab
  front: "Does yielding slow down in a background tab like timers do?"
  back: "No. In a headless page hidden behind another tab, 100 chained `scheduler.yield()` calls took 3–5 ms, while just 10 chained `setTimeout(0)` calls took 3.7 s in Chrome 156 and 9 s in Firefox 159."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-how-often-yield
  front: "How often should a long job yield?"
  back: "Often enough that no chunk blocks input for long, for example after each batch or whenever `performance.now()` shows several milliseconds since the last yield."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: sched-priority-example
  front: "A `background` task A and its signal's `setPriority('user-blocking')`, a `user-visible` B, a `user-blocking` abort, then C on the same signal. What is the order?"
  back: "`A, C: AbortError, B`. `setPriority()` lifts `A` and `C` to `user-blocking`; the oldest runs first: `A`, then the abort, which rejects `C` before it runs. `B` comes last. Chrome 156 and Firefox 159 agreed."
  question: browser/html-event-loop/task-priority-and-scheduler
- id: idle-what-it-does
  front: "What does `requestIdleCallback(callback, { timeout })` do?"
  back: "It asks the browser to run `callback` when its event loop is idle, and returns a handle for `cancelIdleCallback()`."
  question: browser/html-event-loop/request-idle-callback
- id: idle-period-start
  front: "When does the event loop start an idle period?"
  back: "Only when no task is runnable."
  question: browser/html-event-loop/request-idle-callback
- id: idle-deadline
  front: "What is an idle period's deadline?"
  back: "The earliest of: 50 ms after the period started (so input arriving mid-callback is handled within 100 ms); the next timer's due time; and the next expected frame, when animation frame callbacks or other rendering updates are pending."
  question: browser/html-event-loop/request-idle-callback
- id: idle-callback-order
  front: "How do idle callbacks run within a period, and what about one registered during it?"
  back: "Callbacks registered before the period started run in order, each as its own task, until the deadline passes. One registered during the period waits for the next period, so a callback can safely re-register itself."
  question: browser/html-event-loop/request-idle-callback
- id: idle-deadline-object
  front: "What do `IdleDeadline.timeRemaining()` and `didTimeout` report?"
  back: "`timeRemaining()` returns the milliseconds left, never negative; check it between small units of work. `didTimeout` is `true` when the callback ran because its `timeout` expired."
  question: browser/html-event-loop/request-idle-callback
- id: idle-no-guarantee-run
  front: "Is an idle callback guaranteed to run, and what does `timeout` change?"
  back: "No: a page that always has a task queued may never be idle, and the spec accepts postponing \"for a potentially unbounded amount of time\". Once `timeout` expires, a task runs it with `didTimeout` `true` and `timeRemaining()` `0`."
  question: browser/html-event-loop/request-idle-callback
- id: idle-hidden-throttle
  front: "How often may idle periods occur for hidden pages?"
  back: "The spec suggests browsers throttle them to one every 10 seconds. Observed with a headless hidden page, Chrome 156 ran a self-re-registering callback about 20 times a second and Firefox 159 about once a second."
  question: browser/html-event-loop/request-idle-callback
- id: idle-budget-observed
  front: "How much time budget did idle callbacks get in the browsers tested?"
  back: "In three headless runs, Chrome 156 gave 50 ms on an idle page and about 16 ms with an animation running; Firefox 159 never gave more than 8.6 ms."
  question: browser/html-event-loop/request-idle-callback
- id: idle-use-cases
  front: "What is `requestIdleCallback` for, and what should you avoid in it?"
  back: "Work that can wait: analytics, prefetching, cache warming. Avoid DOM changes: their style and layout cost is hard to predict, so prepare the change there and apply it in a `requestAnimationFrame` callback."
  question: browser/html-event-loop/request-idle-callback
- id: idle-safari
  front: "Is `requestIdleCallback` available in Safari?"
  back: "Only in Technology Preview, behind a flag. Feature-detect and fall back to `setTimeout`."
  question: browser/html-event-loop/request-idle-callback
- id: idle-must-happen-work
  front: "Why not use idle callbacks for work that must happen, like saving before the user leaves?"
  back: "Without `timeout` they may never run. Flush on `visibilitychange` instead."
  question: browser/html-event-loop/request-idle-callback
- id: idle-deadline-advisory
  front: "What happens if an idle callback ignores `timeRemaining()` and runs a 200 ms job?"
  back: "The deadline is advisory, so the job blocks input exactly like any other long task. Split it and re-register."
  question: browser/html-event-loop/request-idle-callback
- id: idle-timeout-callback
  front: "What should a callback do when `didTimeout` is `true`?"
  back: "`timeRemaining()` is 0, so do the minimum and re-register the rest."
  question: browser/html-event-loop/request-idle-callback
- id: idle-timeout-example
  front: "With a task always queued for 500 ms, in what order do a plain idle callback and one with `{ timeout: 100 }` run?"
  back: "The `timeout` callback was forced to run first, with `didTimeout=true` and `timeRemaining=0`; the plain one waited until the message tasks stopped. Chrome 156 and Firefox 159 agreed in three runs each."
  question: browser/html-event-loop/request-idle-callback
- id: idle-vs-posttask
  front: "How does `requestIdleCallback` compare with `scheduler.postTask(fn, { priority: 'background' })`?"
  back: "`postTask` gives a promise, abort signals and priority changes, and doesn't wait for an idle period, but gives no deadline. It's unavailable in Safari too."
  question: browser/html-event-loop/request-idle-callback
- id: idle-heavy-computation
  front: "Is a heavy computation a good fit for an idle callback?"
  back: "Only if it can be cut into small slices. A computation that can't be split belongs in a worker, which leaves the main thread free."
  question: browser/html-event-loop/request-idle-callback
- id: idle-order-example
  front: "With an idle callback, `setTimeout` 20, `setTimeout` 0 and a promise, what is the order, and what caps `timeRemaining()`?"
  back: "`microtask, timeout 0, idle (true), timeout 20`. The idle period starts only once no task is runnable, so the 0 ms timer goes first. Its deadline is capped by the pending 20 ms timer, so `timeRemaining()` is at most 20. Chrome 156 and Firefox 159 agreed."
  question: browser/html-event-loop/request-idle-callback
# 04 The rendering pipeline
- id: pixel-five-stages
  front: "What are the five stages from HTML and CSS to pixels, and when do they run?"
  back: "Parse, style, layout, paint, composite. Parsing runs as the document arrives; the rest run when the event loop reaches \"update the rendering\", at most once per frame."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-parse-stage
  front: "What does the parse stage produce, and what can pause it?"
  back: "The HTML tokenizer and tree builder turn bytes into the DOM incrementally, and CSS from `<style>` and `<link>` is parsed into style sheets (the CSSOM). Classic scripts can pause the parser."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-box-tree
  front: "What is the CSS box tree, and what does layout do with it?"
  back: "Elements generate boxes, forming the box tree. Layout then gives each box a size and position. One element can generate several boxes or none, and `::before` gets a box with no DOM node."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-render-tree-names
  front: "What do engines call the \"render tree\", and does any spec use that term?"
  back: "It is an old engine name for the box tree. Chromium calls it the layout tree and Gecko the frame tree. No spec uses the term \"render tree\"."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-display-none-vs-visibility
  front: "How do `display: none` and `visibility: hidden` differ in box generation?"
  back: "`display: none` generates no boxes for the element or its descendants. `visibility: hidden` keeps the box, and its space, but makes it invisible, so it is still laid out on every pass."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-paint-records-commands
  front: "What does the paint stage actually produce?"
  back: "A display list of drawing commands recorded in paint order (backgrounds, borders, text, stacking contexts by `z-index`), not pixels. Rasterization and compositing produce the pixels, in Chromium on other threads."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-composite-stage
  front: "What happens in the composite stage, and which thread does it use in Chromium?"
  back: "The display list is split into layers, rasterized into tiles, and the GPU draws them into the frame. In Chromium, raster and compositing run off the main thread; Firefox hands its display list to WebRender."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-change-reruns-from-dirtied-stage
  front: "Which stages do `color`, `width`, and changing an existing `transform` re-run?"
  back: "`color` needs style and paint. `width` needs style, layout and paint. Changing an existing `transform` can skip layout and paint. A change re-runs from the first stage it dirties."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-writes-batched
  front: "Does each DOM write trigger a repaint?"
  back: "No. Writes only mark things dirty, so ten writes in one task cost one style and layout pass at the next frame, unless script reads geometry in between and forces it early."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-first-paint-vs-fcp
  front: "How do first paint and first contentful paint differ?"
  back: "First paint is the first frame showing anything other than the default background. First contentful paint is the first frame showing text, an image or a canvas."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-get-client-rects-example
  front: "`getClientRects().length` for a `display: none` element, a `visibility: hidden` one, and an empty span with `::before` content?"
  back: "`0`, `1`, `1`. The hidden paragraph keeps its box and space; the span is wide only because of its generated content, and its `childNodes.length` is `0`. Chrome 156 and Firefox 159 printed the same."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-content-visibility-auto
  front: "What does `content-visibility: auto` change in the pipeline?"
  back: "While the element isn't relevant to the user (off-screen, not focused or selected) it skips its contents: they aren't painted and mostly aren't restyled, and size containment lets `contain-intrinsic-size` stand in for their size. Chrome 85, Firefox 125, Safari 18."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-incremental-render
  front: "Does the browser wait for the whole HTML before rendering?"
  back: "No. Parsing is incremental and a partly parsed document can render. HTML treats it as render-blocked only until `<body>` starts and render-blocking resources from `<head>` arrive, with an implementation-defined timeout."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-paint-holding
  front: "What is paint holding?"
  back: "A Chrome behaviour, not a spec rule: on same-origin navigations Chrome keeps showing the old page and defers compositor commits for the new one until first contentful paint or a timeout, to avoid a white flash."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-content-visibility-hidden-geometry
  front: "What happens if you read geometry inside `content-visibility: hidden` content?"
  back: "It still works: the browser styles and lays the content out on demand (Chrome 156 logs a console warning), which throws the saving away."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-paint-order
  front: "In what order does paint draw the contents of a stacking context (CSS 2 Appendix E)?"
  back: "Its background, children with negative `z-index`, block backgrounds, floats, inline content, then positioned descendants and positive `z-index` children."
  question: browser/rendering-pipeline/pixel-pipeline
- id: pixel-chromium-firefox-composite
  front: "How do Chromium and Firefox hand a display list to the GPU?"
  back: "Chromium commits property trees and the display list to the compositor thread, which layerizes the list; tiles are rasterized on raster threads and the GPU, and the Viz process draws the frames. In Firefox, the content process sends a WebRender display list to the GPU process."
  question: browser/rendering-pipeline/pixel-pipeline
- id: script-plain-parser-blocking
  front: "What does a plain classic `<script src>` with no attributes do to the parser?"
  back: "It is parser-blocking: the parser stops, the script is fetched and run, then parsing resumes."
  question: browser/rendering-pipeline/script-loading
- id: script-defer-behaviour
  front: "When does a `defer` script fetch and run, and which scripts honour it?"
  back: "Only external classic scripts honour it. It is fetched in parallel with parsing and runs after parsing finishes, in document order, before `DOMContentLoaded`. An inline script with `defer` runs immediately."
  question: browser/rendering-pipeline/script-loading
- id: script-async-behaviour
  front: "When does an `async` script run relative to parsing, `DOMContentLoaded` and `load`?"
  back: "As soon as it arrives, possibly mid-parse, in arrival order. It can run before or after `DOMContentLoaded`, but always before `load`."
  question: browser/rendering-pipeline/script-loading
- id: script-module-default
  front: "When do `type=\"module\"` scripts run, and what does `async` change?"
  back: "Deferred by default: the module and its imports are fetched in parallel, and it runs after parsing, in document order alongside `defer` scripts. `async` makes it run as soon as its graph is ready, even for inline modules."
  question: browser/rendering-pipeline/script-loading
- id: script-inline-classic-ignores
  front: "Do `defer` and `async` affect inline classic scripts?"
  back: "No. Inline classic scripts ignore both attributes and run when the parser reaches them."
  question: browser/rendering-pipeline/script-loading
- id: script-inserted-async-default
  front: "How do scripts created with `document.createElement('script')` behave by default?"
  back: "They never block the parser and are async: `script.async` reads `true`. Setting `script.async = false` makes several run in insertion order."
  question: browser/rendering-pipeline/script-loading
- id: script-document-write
  front: "When is `document.write()` ignored, and what does it do after load?"
  back: "While parsing it only inserts markup from a parser-blocking classic script. From an external `async` or `defer` script, or any module, it is ignored (Chrome logs a warning, Firefox stays silent). After the document has loaded, it opens a new document and wipes the page."
  question: browser/rendering-pipeline/script-loading
- id: script-order-example
  front: "Which scripts ran before `DOMContentLoaded` in the example mixing `defer`, `async`, modules and classic scripts?"
  back: "Order: inline defer, classic, inline async module, defer-slow, defer-fast, inline module, `DOMContentLoaded`, async-slow. `defer-fast` waited for `defer-slow`. Chrome 156 and Firefox 159 matched in three loads each, served locally."
  question: browser/rendering-pipeline/script-loading
- id: script-async-dependency-pitfall
  front: "Why is loading a library and its plugin both with `async` a bug?"
  back: "Arrival order decides which runs first, so the plugin can run before the library and throw, only on some loads and networks. Use `defer`, or a module graph with `import`; keep `async` for independent scripts like analytics."
  question: browser/rendering-pipeline/script-loading
- id: script-defer-waits-for-css
  front: "Do `defer` scripts wait for style sheets?"
  back: "Yes. Before each deferred script, the HTML Standard waits until no style sheet is blocking scripts, so a slow `<link rel=\"stylesheet\">` in `<head>` delays them, and `DOMContentLoaded` with them."
  question: browser/rendering-pipeline/script-loading
- id: script-async-and-defer-together
  front: "What happens if a script has both `async` and `defer`?"
  back: "`async` wins, because preparing the script checks it first. `defer` was the legacy fallback for browsers that didn't support `async`."
  question: browser/rendering-pipeline/script-loading
- id: script-nomodule
  front: "What does `nomodule` do?"
  back: "A classic script with `nomodule` is skipped by browsers that support modules, so sites can ship a fallback bundle next to a `type=\"module\"` one. On a module script it has no effect."
  question: browser/rendering-pipeline/script-loading
- id: script-four-places
  front: "Where does prepare-the-script-element file an external classic or module script?"
  back: "In one of four places: the set of scripts that run as soon as possible (async), the list that run in order as soon as possible (script-inserted, non-async), the list that run when parsing finishes (parser-inserted defer and non-async modules), or the pending parsing-blocking script."
  question: browser/rendering-pipeline/script-loading
- id: script-force-async
  front: "Why are script-inserted scripts async, in terms of the spec's flags?"
  back: "The force async flag starts true for script-created elements and false for parser-created ones. The `async` getter returns `true` if either it or the attribute is set; the setter clears it, moving the element from the async set to the in-order list."
  question: browser/rendering-pipeline/script-loading
- id: script-the-end-sequence
  front: "What does the HTML Standard's \"the end\" step do when parsing stops?"
  back: "It sets `readyState` to `\"interactive\"`, runs the deferred list in order, queues `DOMContentLoaded`, then waits for the async set and in-order list to empty and everything delaying load before firing `load`."
  question: browser/rendering-pipeline/script-loading
- id: script-modules-run-once
  front: "If two `<script type=\"module\">` elements import the same URL, how many times does its top-level code run?"
  back: "Once. They share one module instance from the module map."
  question: browser/rendering-pipeline/script-loading
- id: script-ignore-destructive-writes
  front: "How does the ignore-destructive-writes counter drop a `document.write()` call?"
  back: "Executing an external script or any module increments the document's counter. `document.write()` with no parser insertion point returns early when it is above zero; otherwise it would call `document.open()` and replace the document. Chrome 156 warned for the module case too."
  question: browser/rendering-pipeline/script-loading
- id: prb-what-blocks-what
  front: "What does the HTML parser actually stop for?"
  back: "One thing only: a parser-created classic `<script>` without `async`, `defer` or `type=\"module\"`. It waits until the script is fetched and run, because the script could call `document.write()` and change what comes next."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-script-blocking-sheets
  front: "What does a parser-created stylesheet with matching `media` block?"
  back: "Scripts, not the parser. An inline or parser-blocking script after it waits until the sheet loads, so `getComputedStyle()` sees its rules; deferred scripts wait too. Since such a script blocks the parser, CSS then script stalls parsing indirectly."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-render-blocked-definition
  front: "When does HTML treat a document as render-blocked?"
  back: "While `<body>` hasn't started or any render-blocking element is pending, up to an implementation-defined timeout. By default, parser-created style sheets with matching media and parser-blocking scripts in `<head>` are render-blocking."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-blocking-render-attribute
  front: "What does `blocking=\"render\"` do, and which browsers support it?"
  back: "It makes other elements, such as an `async` script, render-blocking, but only while the parser is still in `<head>`. Chrome 105+ and Safari 18.2+ support it; Firefox doesn't, and paints without waiting."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-media-print
  front: "Does a stylesheet with a non-matching `media`, like `media=\"print\"` on screen, block anything?"
  back: "It is neither script- nor render-blocking, though it still downloads."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-preload-scanner
  front: "What is the preload scanner, and what does HTML require of it?"
  back: "While the parser waits, browsers scan the markup ahead and start fetching later style sheets, scripts and images. HTML permits this as speculative HTML parsing but doesn't require it. It only speeds downloads; execution order is unchanged."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-rule-of-thumb
  front: "Rule of thumb: what do CSS in `<head>`, classic scripts, and `defer`/`async`/modules each delay?"
  back: "CSS in `<head>` delays the first paint; classic scripts delay the parser; `defer`, `async` and modules delay neither."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-script-end-of-body
  front: "Does putting `<script>` at the end of `<body>` substitute for `defer`?"
  back: "No. It still blocks the parser and waits for style sheets; it just has less left to block."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-body-stylesheet
  front: "Does a `<link rel=\"stylesheet\">` inside `<body>` block rendering?"
  back: "Not under HTML: render-blocking elements can only be added before `<body>` starts. Browsers differ: Chrome 156 painted content above the sheet but stopped parsing at it until it loaded; Firefox 159 parsed and painted past it at once."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-inserted-stylesheet
  front: "Is a style sheet inserted by script render-blocking?"
  back: "Not by default; only parser-created sheets are implicitly render-blocking. With `blocking=\"render\"`, inserted while the document is still in `<head>`, it is, where supported."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-never-loads
  front: "What if a render-blocking resource never loads?"
  back: "The document stays render-blocked only until an implementation-defined timeout passes; then it renders anyway."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-fcp-stylesheet-timing
  front: "With an 800 ms delayed stylesheet in `<head>`, what was first contentful paint, and with `media=\"print\"`?"
  back: "In Chrome 156, 828–832 ms, and 32–44 ms with `media=\"print\"`. In Firefox 159, 827–836 ms and 20 ms. Three loads per browser, local server."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-fcp-script-timing
  front: "How did an 800 ms classic `<script src>` affect first contentful paint before body content versus after a paragraph?"
  back: "Before any body content: 824–832 ms in Chrome 156, 828–861 ms in Firefox 159. After a paragraph in `<body>`: 24–40 ms and 19–20 ms. Parser-blocking scripts in `<body>` block the parser but aren't render-blocking."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-async-blocking-render-timing
  front: "How did `<script async blocking=\"render\">` in `<head>` compare to plain `<script async>` for first contentful paint at an 800 ms delay?"
  back: "Chrome 156: 824–832 ms with `blocking=\"render\"`, 24–40 ms without. Firefox 159: 20 ms for both, since it ignores `blocking=\"render\"`."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-chrome-in-body-sheet
  front: "In the in-body stylesheet test, what did Chrome 156 and Firefox 159 show 600 ms into a 1,500 ms CSS delay?"
  back: "Firefox showed both coloured blocks, above and below the `<link>`; Chrome only the upper one, as its parser hadn't created the lower block and `DOMContentLoaded` fired after the sheet loaded. That is Chrome behaviour, not the spec's."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-preload-scanner-differs
  front: "Behind a 1,000 ms parser-blocking script, which later resources did Chrome 156 and Firefox 159 request early?"
  back: "Chrome requested the later style sheet, script and `<img>` at once. Firefox requested the style sheet and script at once, but the `<img>` only after the blocking script ran (two loads each)."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: prb-analytics-after-css
  front: "Why is placing an analytics `<script>` right after a large stylesheet a mistake?"
  back: "It now waits for the CSS and holds up parsing, though it never reads styles."
  question: browser/rendering-pipeline/parser-and-render-blocking
- id: fsl-what-is-it
  front: "What is a forced synchronous layout, and why does it happen?"
  back: "Browsers compute style and layout lazily, but geometry APIs are defined in terms of boxes. Reading one after a write makes the browser run style and layout right then, mid-script. Also called forced reflow; no spec uses the term."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-which-reads
  front: "Which kinds of reads need current layout?"
  back: "`offset*` and `client*` sizes and positions, `scrollTop`/`scrollLeft`/`scrollWidth`/`scrollHeight`, `scrollTo()` and `scrollIntoView()`, `getBoundingClientRect()`, `getClientRects()`, `document.elementFromPoint()`, `innerText`, and `getComputedStyle()` values that resolve to used values like `width`."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-get-computed-style-lazy
  front: "Does calling `getComputedStyle(el)` force layout?"
  back: "No. It returns a live object and computes nothing. Reading `color` from it needs style only; reading `width` needs layout. `textContent` and attributes need neither."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-layout-thrashing
  front: "What is layout thrashing and how do you fix it?"
  back: "Writes and reads alternating in a loop, so every read pays for a full layout. Batch every read before every write, read at the start of a `requestAnimationFrame` callback before writing, or let `ResizeObserver` deliver sizes."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-counts-example
  front: "In Chrome 156, what were the style and layout count changes for the interleaved versus batched 1,000-item width example?"
  back: "Interleaved: style +1000, layout +1000. Batched: style +1, layout +1. Chrome only, from `Performance.getMetrics`, identical in three runs."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-thrash-timings
  front: "How long did the interleaved versus batched 1,000-item example take?"
  back: "Chrome 156: 140–157 ms interleaved, 1.7–2.3 ms batched. Firefox 159: 35–40 ms against 2–3 ms. 15 measurements per browser, 3 page loads."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-raf-not-a-fix
  front: "Does `requestAnimationFrame` prevent forced layout?"
  back: "No. Writing and then reading inside the callback still forces it; order matters, not timing. Read first, then write."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-hidden-read-helper
  front: "How can a helper function cause layout thrashing?"
  back: "A utility that measures, such as `isVisible()` or reading `innerText`, called between writes thrashes just the same."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-why-lazy
  front: "Why doesn't the browser keep layout up to date after every write?"
  back: "Most writes come in groups. Laying out after each would repeat work the next write throws away; deferring it lets ten writes cost one layout at the next frame."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-does-it-paint
  front: "Does a forced layout also paint?"
  back: "No. It runs style and layout so the value is correct; paint and compositing still wait for the frame's rendering update."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-finding-them
  front: "How do you find forced layouts in the lab and in the field?"
  back: "In the lab, Chrome DevTools' Performance panel has a Forced Reflow insight. In the field, Long Animation Frames script attribution reports `forcedStyleAndLayoutDuration`, in Chrome 123+ only."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-chrome-flush-by-read
  front: "In Chrome 156, what did `getComputedStyle(box)`, `.color`, `.width` and `box.textContent` flush after a width change?"
  back: "`getComputedStyle(box)` alone: nothing. `.color`: style only. `.width`: style and layout, as did `offsetWidth`, `offsetHeight` and `getBoundingClientRect()`. `box.textContent`: nothing. Chrome only."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-consecutive-reads
  front: "Do several consecutive geometry reads with no write between them each force layout?"
  back: "No. They share one layout; only the first pays."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-chrome-shortcuts
  front: "In Chrome 156, did reading `getComputedStyle(box).width` force layout when `width` was set to `100px`, and `marginLeft`?"
  back: "`width` forced layout even though it was set to `100px`, while `marginLeft` (a fixed `0px`) needed style only. Which values Chrome can answer without layout is an engine detail, not something to rely on."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: fsl-inner-width
  front: "Did reading `innerWidth` force layout in Chrome 156?"
  back: "No, nothing was forced. Not every geometry-looking global is a layout read."
  question: browser/rendering-pipeline/forced-synchronous-layout
- id: comp-what-is-compositing
  front: "What is compositing, and who does it in Chromium and Firefox?"
  back: "The last stage: the browser keeps separately rasterized layers (GPU textures) and combines them each frame, applying transform, opacity and clip. In Chromium a compositor thread does this from committed property trees and display lists; in Firefox, WebRender, in a separate GPU process on platforms that use one."
  question: browser/rendering-pipeline/compositing
- id: comp-layers-engine-detail
  front: "Does any spec define compositing layers?"
  back: "No. When an element gets a layer is engine behaviour."
  question: browser/rendering-pipeline/compositing
- id: comp-why-cheap
  front: "Why are `transform` and `opacity` cheap to animate?"
  back: "Neither changes layout or the element's painted content. A transform moves the painted result, not the box, so nothing reflows. On its own layer a new frame is the same texture at a new position or alpha, so the compositor can run declarative animations even while the main thread is busy."
  question: browser/rendering-pipeline/compositing
- id: comp-expensive-properties
  front: "Why are `width`, `margin-left`, `left` and `top` expensive to animate, and `background-color`?"
  back: "They rerun layout and paint every frame, needing the main thread each frame, so a long task freezes them. `background-color` usually repaints."
  question: browser/rendering-pipeline/compositing
- id: comp-chrome-promotion
  front: "When does Chrome promote an element to its own layer?"
  back: "While a `transform` or `opacity` animation is running, and ahead of time for `will-change: transform` or `opacity`. In Chrome 156, `translateZ(0)` also did; `translateX(10px)`, `opacity: 0.5`, `z-index: 1`, `isolation: isolate`, `will-change: left` and a running `left` animation didn't."
  question: browser/rendering-pipeline/compositing
- id: comp-stacking-context-not-layer
  front: "Is a stacking context a compositing layer?"
  back: "No. Stacking contexts group paint order and are defined by CSS; layers are how an engine caches and moves pixels. In Chrome 156, `opacity: 0.5` and `z-index: 1` each created a stacking context but no composited layer."
  question: browser/rendering-pipeline/compositing
- id: comp-will-change-cost
  front: "Why isn't `will-change` or `translateZ(0)` a free speed-up?"
  back: "Every promoted element is another texture in GPU memory. Add `will-change` shortly before an animation and remove it afterwards."
  question: browser/rendering-pipeline/compositing
- id: comp-js-animations
  front: "Do JavaScript-driven animations get compositor benefits?"
  back: "No. Setting `style.transform` from `requestAnimationFrame` needs the main thread every frame; only declarative animations (CSS, transitions, `element.animate()`) can run on the compositor."
  question: browser/rendering-pipeline/compositing
- id: comp-will-change-stacking
  front: "Does `will-change: transform` change how the page looks?"
  back: "It can. The spec requires `will-change` on a property to create a stacking context, and a containing block for positioned descendants, whenever a real value of that property would. Layer promotion is only a hint the browser may take."
  question: browser/rendering-pipeline/compositing
- id: comp-scrolling
  front: "Does compositing help scrolling?"
  back: "Yes. Chromium can scroll on the compositor thread by updating a scroll offset in the property trees, and Firefox's Asynchronous Panning and Zooming shifts already-rasterized content, without waiting for the main thread in the common case."
  question: browser/rendering-pipeline/compositing
- id: comp-transition-promotion
  front: "Do `transform` transitions get promoted like keyframe animations?"
  back: "In Chrome 156, a running `transform` transition promoted the element with the reason \"Has an active accelerated transform animation or transition\", the same as a keyframe animation."
  question: browser/rendering-pipeline/compositing
- id: comp-trace-counts
  front: "In a 1 s Chrome 156 trace, which animated properties caused main-thread layout and paint events?"
  back: "`transform` and `opacity`: 0 layout, 0 paint. `left`, `margin-left`, `width`: 60–61 layout, 120–122 paint. `background-color` with only a `to` keyframe: 0 layout, 120–122 paint. Three runs; counts varied by one."
  question: browser/rendering-pipeline/compositing
- id: comp-background-color-chrome
  front: "Does animating `background-color` always repaint in Chrome 156?"
  back: "With both `from` and `to` keyframes it produced no paint events, so Chrome can sometimes run it without repainting. With only `to`, it repainted every frame. Don't count on it."
  question: browser/rendering-pipeline/compositing
- id: comp-blocked-main-thread-demo
  front: "What happened to a `transform` box and a `left` box animated during a 1 s main-thread block in Chrome 156?"
  back: "Over 59 frames, the `transform` box moved from about 70 px to 215 px, while the `left` box stayed at 65–68 px, then jumped to 215–218 px after. Checked in Chrome only; headless Firefox can't capture frames while blocked."
  question: browser/rendering-pipeline/compositing
# 05 Network APIs
- id: fetch-fulfills-on-404
  front: "Does `fetch()` reject on a 404 or 500?"
  back: "No. A 404 or 500 is a complete HTTP response, so the promise fulfills with a `Response`. Success is yours to check: `response.ok` is `true` only for statuses 200–299, and `response.status` holds the code."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-when-rejects
  front: "When does the `fetch()` promise reject?"
  back: "Only when there is no response: a network error or invalid input rejects with a `TypeError`, and an abort rejects with the signal's reason (a `DOMException`, usually `AbortError`)."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-network-error-causes
  front: "What causes `fetch()` to reject with a network-error `TypeError`, and can the page tell them apart?"
  back: "DNS failure, a refused or reset connection, a failed CORS check, a CSP block, mixed content, a bad port, or `redirect: 'error'` meeting a redirect. All become one network error (type `\"error\"`, status 0), so the page can't tell them apart; details show only in DevTools."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-network-error-message
  front: "What does the network-error message look like in Chrome 156 and Firefox 159?"
  back: "Chrome prints `Failed to fetch`; Firefox prints `NetworkError when attempting to fetch resource.` The message is browser-specific, so branch on `error.name`, not the message."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-invalid-input
  front: "What kind of invalid input makes `fetch()` reject with a `TypeError`?"
  back: "Input that fails while building the `Request`: an unparsable URL, or a body on a `GET`."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-abort-reasons
  front: "What does `fetch()` reject with for `controller.abort()` versus `AbortSignal.timeout()`?"
  back: "A `DOMException` named `AbortError` for `controller.abort()`, and `TimeoutError` for `AbortSignal.timeout()`. Neither is a `TypeError`, so `error.name` or `signal.aborted` tells an abort from a network failure."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-body-errors-later
  front: "Which errors can surface after `fetch()` has fulfilled?"
  back: "The promise fulfills once status and headers arrive, so errors come when you read the body. A connection dropping mid-body makes `response.text()` reject with a `TypeError`; `.json()` rejects with a `SyntaxError` when the body isn't JSON, such as an HTML error page or an empty body."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-body-read-once
  front: "What happens on a second `response.json()`, and how do you read a body twice?"
  back: "Any reading method sets `bodyUsed` to `true`, and the second read rejects with a `TypeError`. Call `response.clone()` before the first read; `clone()` itself throws if the body is already unusable."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-204-body
  front: "What do `.text()` and `.json()` give for a response with no body, such as a 204?"
  back: "`.text()` gives an empty string and `.json()` rejects with a `SyntaxError`."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-redirect-default
  front: "What happens by default on a redirect, and with `redirect: 'error'`?"
  back: "`fetch()` follows it and fulfills with the final response: `res.redirected` is `true` and `res.url` is the final URL. `redirect: 'error'` turns the redirect into a network error."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-ok-false-opaque
  front: "Is `res.ok === false` always an HTTP error?"
  back: "No. An opaque response from `mode: 'no-cors'` has status 0 and `ok` `false` even when the server answered 200, because the page may not see the status."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-json-before-ok
  front: "Why is calling `res.json()` before checking `res.ok` a mistake?"
  back: "An HTML error page then rejects with a `SyntaxError` and the real status is lost. Check `!res.ok` first, throw with the status and the error body, then parse."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-spec-steps
  front: "In the `fetch()` method steps, where do a bad URL, an early abort, and a network error each reject?"
  back: "Building the `Request` throws first (a bad URL or `GET` with a body becomes a `TypeError`). Then an already-aborted signal rejects with its abort reason. Finally, when the response is ready, a network error rejects with a new `TypeError`; anything else fulfills."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-consume-body-unusable
  front: "When is a body \"unusable\" in the Fetch Standard?"
  back: "When its stream is disturbed (read from) or locked to a reader. Consuming it then returns a promise rejected with a `TypeError`."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-error-http-client-pattern
  front: "In the real-world API client, why is the error body read with `.text()`, and why the 204 check?"
  back: "Error pages are often HTML, so reading text avoids a `SyntaxError`. The 204 check avoids the `SyntaxError` that `.json()` gives an empty body. Network errors and aborts propagate as-is, keeping offline, HTTP error and cancellation separate."
  question: browser/network-apis/fetch-resolves-on-errors
- id: fetch-mode-default
  front: "What do `mode: 'cors'` (default), `'same-origin'` and `'no-cors'` do?"
  back: "`'cors'`: a cross-origin response is readable only if the server opts in with CORS headers, otherwise the promise rejects with a `TypeError`. `'same-origin'` rejects any cross-origin URL. `'no-cors'` sends the request anyway but returns an opaque response."
  question: browser/network-apis/fetch-request-options
- id: fetch-no-cors-limits
  front: "What are the limits of `mode: 'no-cors'`?"
  back: "Only `GET`, `HEAD` or `POST` (a `PUT` throws) and safelisted headers (others are silently dropped). In Chrome 156 and Firefox 159, a `POST` with `X-Custom` and a JSON `Content-Type` sent neither; the string body went as `text/plain;charset=UTF-8`."
  question: browser/network-apis/fetch-request-options
- id: fetch-opaque-response
  front: "What does an opaque response look like?"
  back: "`type` `\"opaque\"`, `status` 0, `ok` `false`, no headers and an empty body. Script can't read it, only hand it on, for example to a service worker's cache."
  question: browser/network-apis/fetch-request-options
- id: fetch-no-cors-not-a-fix
  front: "Does `mode: 'no-cors'` fix a CORS error?"
  back: "No. The request goes out, but the response is opaque: no status, headers or body. It is not a security hole either: it only sends what a form or an `<img>` could already send."
  question: browser/network-apis/fetch-request-options
- id: fetch-credentials-modes
  front: "What do `credentials: 'same-origin'`, `'include'` and `'omit'` do?"
  back: "`'same-origin'` (default) sends cookies, HTTP auth and client certificates only to your own origin. `'include'` sends them cross-origin too, but the response is usable only if the server explicitly allows credentials. `'omit'` never sends them and ignores any `Set-Cookie`."
  question: browser/network-apis/fetch-request-options
- id: fetch-include-without-allow
  front: "In Chrome 156 and Firefox 159, what happened with `credentials: 'include'` and no `Access-Control-Allow-Credentials`?"
  back: "The cookie was sent but the promise rejected with a `TypeError`. A failed CORS check withholds the response, not the request."
  question: browser/network-apis/fetch-request-options
- id: fetch-cache-modes
  front: "What do the `cache` modes `'default'`, `'no-store'`, `'reload'` and `'no-cache'` do?"
  back: "`'default'` follows the response's caching headers. `'no-store'` skips the cache both ways. `'reload'` goes to the network, then stores the result. `'no-cache'` always revalidates; a 304 serves the cached body."
  question: browser/network-apis/fetch-request-options
- id: fetch-cache-force-only
  front: "What do `cache: 'force-cache'` and `'only-if-cached'` do?"
  back: "`'force-cache'` uses any cached copy, even stale. `'only-if-cached'` never touches the network and requires `mode: 'same-origin'`, otherwise the call throws a `TypeError` before any request."
  question: browser/network-apis/fetch-request-options
- id: fetch-no-cache-vs-no-store
  front: "Is `cache: 'no-cache'` the same as \"don't cache\"?"
  back: "No. It still uses the cache after revalidating. `'no-store'` is the one that skips it. This is the HTTP cache only, not the Cache API a service worker manages."
  question: browser/network-apis/fetch-request-options
- id: fetch-cache-example
  front: "With a cacheable `/counted` (`max-age=60` plus ETag), what sequence of hits did default, `no-store`, default, `reload`, `no-cache` give?"
  back: "`hit 1` (first fetch), `hit 1` (fresh cache copy), `hit 2` (`no-store`, cache untouched), `hit 1` (default, still the old copy), `hit 3` (`reload` updated the cache), `hit 3` (`no-cache`, server sent 304). Chrome 156 and Firefox 159 agreed."
  question: browser/network-apis/fetch-request-options
- id: fetch-cache-request-headers
  front: "Which request headers do the cache modes add (per the spec's HTTP-network-or-cache fetch steps)?"
  back: "`'no-store'` and `'reload'`: `Pragma: no-cache` and `Cache-Control: no-cache`. `'no-cache'` with a cached copy: `If-None-Match` (the stored ETag) and `Cache-Control: max-age=0`. `'default'` with a fresh copy: no request at all."
  question: browser/network-apis/fetch-request-options
- id: fetch-redirect-modes
  front: "What are the `redirect` modes, and what does `'manual'` return?"
  back: "`'follow'` (default), `'error'` (a redirect becomes a network error) and `'manual'`, which returns an `\"opaqueredirect\"` response with status 0 and `url` the original URL."
  question: browser/network-apis/fetch-request-options
- id: fetch-redirect-manual-why
  front: "What is `redirect: 'manual'` for, if script can't read the `Location`?"
  back: "The spec's reason: a service worker can return the opaque-redirect response to a navigation, so the browser replays the redirect offline. To the page it is nearly indistinguishable from a network error, apart from `type` `\"opaqueredirect\"`."
  question: browser/network-apis/fetch-request-options
- id: fetch-referrer-policy-default
  front: "What does the default referrer policy send?"
  back: "`strict-origin-when-cross-origin`: only your origin to other origins. In Chrome 156 and Firefox 159, a cross-origin fetch sent `Referer: http://localhost:8051/`; same origin or `referrerPolicy: 'unsafe-url'` sent the full URL; `'no-referrer'` or `referrer: ''` sent none."
  question: browser/network-apis/fetch-request-options
- id: fetch-request-defaults
  front: "What defaults does `new Request('/x')` report in Chrome 156 and Firefox 159?"
  back: "`mode` `'cors'`, `credentials` `'same-origin'`, `cache` `'default'`, `redirect` `'follow'`, `referrer` `'about:client'`."
  question: browser/network-apis/fetch-request-options
- id: fetch-request-constructor-throws
  front: "Which option combinations make the `Request` constructor throw a `TypeError` before sending?"
  back: "`mode: 'navigate'`, `cache: 'only-if-cached'` without `mode: 'same-origin'`, and a method other than `GET`, `HEAD` or `POST` in `no-cors` mode. In `no-cors` mode appending a non-safelisted header does nothing."
  question: browser/network-apis/fetch-request-options
- id: stream-body-is-readablestream
  front: "What is `response.body`, and when is it available?"
  back: "A `ReadableStream` of `Uint8Array` chunks, available as soon as `fetch()` fulfills, before the body has arrived. `res.json()` and `res.text()` wait for all of it; reading the stream lets you handle bytes as they land."
  question: browser/network-apis/streaming-bodies
- id: stream-read-loop
  front: "How do you read a response stream, and what does `reader.read()` resolve to?"
  back: "Call `res.body.getReader()` and loop on `await reader.read()`, which resolves to `{ value, done }`. Or use `for await (const chunk of res.body)`, supported since Chrome 124, Firefox 110 and Safari 27."
  question: browser/network-apis/streaming-bodies
- id: stream-locked
  front: "What happens to `res.json()` after `getReader()`?"
  back: "The stream is locked, so `res.json()` rejects with a `TypeError`. Getting a reader locks the stream without reading it (`res.body.locked` is `true`, `bodyUsed` still `false`)."
  question: browser/network-apis/streaming-bodies
- id: stream-cancel
  front: "How do you stop a streaming download halfway?"
  back: "`reader.cancel()` (later reads resolve `{ done: true }`) or break out of `for await`. Aborting the fetch's `AbortSignal` also works, erroring the stream and making the pending `read()` reject with an `AbortError`."
  question: browser/network-apis/streaming-bodies
- id: stream-text-decoding
  front: "Why must you not decode each chunk with a fresh `TextDecoder`?"
  back: "Chunks can split inside a multi-byte UTF-8 character, so a split `é` becomes two `�`. Pipe through `new TextDecoderStream()`, or reuse one `TextDecoder` with `decode(chunk, { stream: true })`. For NDJSON, also buffer the unfinished last line."
  question: browser/network-apis/streaming-bodies
- id: stream-split-char-example
  front: "With a server writing `caf` plus the first byte of `é`, what do a fresh decoder per chunk and `TextDecoderStream` log?"
  back: "A fresh `TextDecoder` per chunk logs `[\"caf�\",\"�\"]`. `TextDecoderStream` holds the incomplete byte back and emits `[\"caf\",\"é\"]`. A reused decoder with `{ stream: true }` gives `café`. Chrome 156 and Firefox 159 agreed."
  question: browser/network-apis/streaming-bodies
- id: stream-progress
  front: "How do you compute download progress, and what are the two catches?"
  back: "Sum `chunk.byteLength` and divide by `Content-Length`. With chunked transfer encoding there is no `Content-Length`, so show indeterminate progress. With `gzip` or `br` the header is the compressed size while chunks arrive decompressed."
  question: browser/network-apis/streaming-bodies
- id: stream-gzip-example
  front: "What did progress report for a 100,000-byte body sent gzipped?"
  back: "`100000 of 132`: `Content-Length` was 132, the compressed size, while chunks arrived decompressed. Have the server send the uncompressed size in its own header, or show bytes rather than percent."
  question: browser/network-apis/streaming-bodies
- id: stream-missing-length
  front: "What does `received / total` show when `Content-Length` is missing?"
  back: "`Number(null)` is `0`, so the bar shows `Infinity%`."
  question: browser/network-apis/streaming-bodies
- id: stream-upload-duplex
  front: "What does a `ReadableStream` request body need, and who supports it?"
  back: "`duplex: 'half'`. Only Chrome supports it (105 and later); in Chrome 156 it also needed HTTP/2. Firefox and Safari have none."
  question: browser/network-apis/streaming-bodies
- id: stream-upload-firefox
  front: "What did Firefox 159 do when given a `ReadableStream` request body?"
  back: "It doesn't throw: it sent the string `[object ReadableStream]` (23 bytes) as `text/plain`."
  question: browser/network-apis/streaming-bodies
- id: stream-chrome-http1-upload
  front: "What happened to a stream upload over HTTP/1.1 in Chrome 156?"
  back: "To `http://localhost` it rejected with `TypeError: Failed to fetch` and the console showed `net::ERR_ALPN_NEGOTIATION_FAILED`. The same upload to an HTTP/2 server over TLS arrived in pieces, 300 ms apart."
  question: browser/network-apis/streaming-bodies
- id: stream-request-rules
  front: "What does the Fetch Standard require of streaming request bodies?"
  back: "`duplex: 'half'` (the whole request is sent before the response is processed). It is forbidden in `no-cors` mode and with `keepalive`, and always preflighted cross-origin."
  question: browser/network-apis/streaming-bodies
- id: stream-read-twice
  front: "How do you read a body twice, say for progress and for `.json()`?"
  back: "`res.clone()` before reading, or `res.body.tee()`, which splits one stream into two. Both branches get every chunk, so chunks the slower branch hasn't read yet wait in its queue."
  question: browser/network-apis/streaming-bodies
- id: stream-transfer-to-worker
  front: "Can a worker parse a response stream, and how?"
  back: "Yes. `ReadableStream` is transferable: `worker.postMessage(stream, [stream])` hands it over (Chrome 87, Firefox 103, Safari 27)."
  question: browser/network-apis/streaming-bodies
- id: stream-duplex-feature-test
  front: "How does the `duplex` getter feature test work, and what did it print in Chrome 156 and Firefox 159?"
  back: "It builds a `Request` with a stream body and a `duplex` getter; unsupporting browsers ignore `duplex` and stringify the body, giving it a `Content-Type`. It prints `true` in Chrome 156 and `false` in Firefox 159."
  question: browser/network-apis/streaming-bodies
- id: exit-keepalive-termination
  front: "What happens to in-flight fetches when a document goes away?"
  back: "The Fetch Standard terminates them unless they are keepalive. In Firefox 159, closing the tab lost a plain `fetch()` started on the way out every time. Chrome 156 delivered plain fetches in the same test, but the spec lets the browser terminate them."
  question: browser/network-apis/sending-data-on-exit
- id: exit-sendbeacon
  front: "What does `navigator.sendBeacon(url, data)` do and return?"
  back: "It queues a `POST` and returns `true` if queued, `false` if the data is over quota. No response, no custom headers, always cookies. A string goes as `text/plain;charset=UTF-8`; `URLSearchParams`, `FormData` and a `Blob` bring their own type."
  question: browser/network-apis/sending-data-on-exit
- id: exit-beacon-blob-preflight
  front: "What happens when a cross-origin beacon sends a `Blob` typed `application/json`?"
  back: "It waits for a CORS preflight the server must answer. A plain string avoids it, and the server parses `text/plain`."
  question: browser/network-apis/sending-data-on-exit
- id: exit-keepalive-fetch
  front: "What is `fetch(url, { keepalive: true })` compared to `sendBeacon()`?"
  back: "The same mechanism with the whole `fetch()` API (method, headers, `credentials`). Stream bodies aren't allowed. A keepalive `fetch()` resolves with a response if the page is still alive to receive it."
  question: browser/network-apis/sending-data-on-exit
- id: exit-fetchlater
  front: "What does `fetchLater(url, init)` do, and who supports it?"
  back: "It registers a request now; the browser sends it when the document is destroyed, or after `activateAfter` milliseconds. Abort it and register again to update the data. Chromium 135+ only; not in Firefox or Safari."
  question: browser/network-apis/sending-data-on-exit
- id: exit-quota
  front: "What is the keepalive quota, and what happens past it?"
  back: "Keepalive requests from one page share 64 KiB of in-flight body. Past it, `sendBeacon()` returns `false` and a keepalive `fetch()` rejects with a `TypeError`. The budget counts every keepalive request still in flight."
  question: browser/network-apis/sending-data-on-exit
- id: exit-quota-firefox
  front: "How did Chrome 156 and Firefox 159 apply the 64 KiB quota?"
  back: "Chrome counted beacons and keepalive fetches together: a 40 KiB keepalive `fetch()` in flight made a 40 KiB beacon return `false`, and vice versa. Firefox limited keepalive fetches the same way, but sent a 16 MiB beacon."
  question: browser/network-apis/sending-data-on-exit
- id: exit-when-to-send
  front: "Which event should trigger the exit send, and which should you avoid?"
  back: "Flush on `visibilitychange` when `visibilityState === 'hidden'`, plus `pagehide` for navigations. Avoid `unload` and `beforeunload`: they can be skipped, wherever `unload` runs it keeps the page out of the back/forward cache, and since Chrome 155 Chrome doesn't run it by default."
  question: browser/network-apis/sending-data-on-exit
- id: exit-visibilitychange-why
  front: "Why is `visibilitychange` the right event on mobile?"
  back: "The Beacon spec calls it the only event guaranteed to fire when the user switches apps, after which the OS may kill the page without `unload`."
  question: browser/network-apis/sending-data-on-exit
- id: exit-repeatable-flush
  front: "Why must an exit flush be repeatable and clear what it sent?"
  back: "The page can come back after `\"hidden\"`, and `pagehide` may follow `visibilitychange`. Send what's new and clear it, otherwise you double-count the session. Keep data if `sendBeacon()` returns `false`."
  question: browser/network-apis/sending-data-on-exit
- id: exit-batching
  front: "How should you reduce what the exit send has to carry?"
  back: "Batch data while the user is active, so the exit send carries only the tail."
  question: browser/network-apis/sending-data-on-exit
- id: exit-beacon-cookies
  front: "Do beacons carry cookies to another origin?"
  back: "Yes. The Beacon spec sets credentials mode `include`; a beacon from `localhost:8051` to `localhost:8052` carried the cookie in Chrome 156 and Firefox 159."
  question: browser/network-apis/sending-data-on-exit
- id: exit-fetchlater-activated
  front: "What does `fetchLater()`'s `result.activated` tell you?"
  back: "It turns `true` once the request has been sent. With `activateAfter: 1000` it read `false` immediately and `true` 1.5 s later in Chrome 156."
  question: browser/network-apis/sending-data-on-exit
- id: exit-delivery-table
  front: "After closing the tab, what reached the server in Chrome 156 versus Firefox 159?"
  back: "Chrome: everything. Firefox: beacon and keepalive fetch only; both plain fetches were lost. On navigating away, Firefox delivered everything except `fetchLater()`, which doesn't exist there. Puppeteer, 3 runs each."
  question: browser/network-apis/sending-data-on-exit
- id: exit-fetchlater-limits
  front: "What limits did `fetchLater()` hit in Chrome 156?"
  back: "Its own quota of 64 KiB per destination origin, counting URL, referrer, headers and body: a 65,537-byte body threw `QuotaExceededError`. A `ReadableStream` body threw a `TypeError`, and a negative `activateAfter` a `RangeError`."
  question: browser/network-apis/sending-data-on-exit
- id: exit-fetchlater-bfcache
  front: "What happened to a pending `fetchLater()` when the page navigated into the back/forward cache in Chrome 156?"
  back: "It had already been sent, and on return `result.activated` was `true`. Aborting its signal before it was sent cancelled it."
  question: browser/network-apis/sending-data-on-exit
# 06 Storage
- id: choose-how-to-pick
  front: "What two questions decide which browser storage to use?"
  back: "Does the server need it on every request, and what shape and size is the data? Cookies for server-needed state, Web Storage for small strings, IndexedDB for structured or large data, the Cache API for responses."
  question: browser/storage/choosing-browser-storage
- id: choose-cookie-limits
  front: "What does a cookie hold, how big can it be, and how long does it live?"
  back: "One string of name plus value, at most 4,096 bytes. It lives for the session, or up to 400 days. Scope is domain plus path, and it is sent to the server."
  question: browser/storage/choosing-browser-storage
- id: choose-cookies-use
  front: "When are cookies the right storage choice?"
  back: "Only for state the server needs on every request, like a session id, ideally `HttpOnly` so script can't read it. Every byte goes up with each matching request, so keep them small."
  question: browser/storage/choosing-browser-storage
- id: choose-local-session
  front: "What are `localStorage` and `sessionStorage` suited to, and what is their cap?"
  back: "`localStorage` suits small client-only settings like a theme; it stores strings and blocks the main thread on every call. `sessionStorage` is the same API scoped to one tab. Chrome 156 and Firefox 159 cap storage at 5 MiB of characters per origin."
  question: browser/storage/choosing-browser-storage
- id: choose-indexeddb-cache
  front: "What are IndexedDB and the Cache API for?"
  back: "IndexedDB is the client database for large or structured data, indexes, and anything a worker needs; it is async and transactional. The Cache API stores `Request`→`Response` pairs, usually for a service worker."
  question: browser/storage/choosing-browser-storage
- id: choose-not-guaranteed
  front: "Is browser storage guaranteed to persist?"
  back: "No. Users clear it, browsers may evict it, and Safari deletes script-written storage after seven days of Safari use without the user interacting with the site. Keep a server copy of anything you can't lose."
  question: browser/storage/choosing-browser-storage
- id: choose-web-storage-strings
  front: "What do `localStorage.setItem('draft', obj)` and a JSON round trip do to a `Date` and a `Set`?"
  back: "`setItem()` stringifies, so an object becomes `\"[object Object]\"` and numbers come back as strings. JSON turns the `Date` into a string and the `Set` into `{}`. IndexedDB stores a structured clone and returns a real `Date` and `Set`."
  question: browser/storage/choosing-browser-storage
- id: choose-token-localstorage
  front: "Why shouldn't a session token live in `localStorage`?"
  back: "Any script running on the origin, injected ones included, can read it; an `HttpOnly` cookie is out of script's reach. The full trade-off belongs to authentication and XSS defence."
  question: browser/storage/choosing-browser-storage
- id: choose-cookie-over-4096
  front: "What happens to a cookie over 4,096 bytes of name plus value?"
  back: "It is silently dropped. Chrome 156 and Firefox 159 dropped a 4,097-byte one whether it came from script or a header. The cookie spec also asks browsers to keep at least 50 cookies per domain."
  question: browser/storage/choosing-browser-storage
- id: choose-workers
  front: "Which storage APIs are available in workers?"
  back: "IndexedDB and the Cache API are; `localStorage` and `sessionStorage` are not (`typeof localStorage` is `\"undefined\"` in a dedicated worker in Chrome 156 and Firefox 159). Service workers get `cookieStore`."
  question: browser/storage/choosing-browser-storage
- id: choose-sw-cookies
  front: "Can a service worker read cookies?"
  back: "Not through `document.cookie`. Service workers get the asynchronous Cookie Store API (`cookieStore.get()`, `set()`, `change` events): Chrome 87+, Firefox 140+, Safari 18.4+. Dedicated workers have neither."
  question: browser/storage/choosing-browser-storage
- id: choose-binary-files
  front: "Where do large binary files go?"
  back: "IndexedDB stores `Blob`s, and the Origin Private File System (`navigator.storage.getDirectory()`, Chrome 86+, Firefox 111+, Safari 15.2+) gives file handles, with fast synchronous access in workers. Both count against the origin's quota."
  question: browser/storage/choosing-browser-storage
- id: choose-secure-context
  front: "Which storage APIs need a secure context?"
  back: "The Cache API and Cookie Store API exist only over HTTPS or on `localhost` (`typeof caches` is `\"undefined\"` on `http://example.test`). Cookies, Web Storage and IndexedDB work over plain HTTP."
  question: browser/storage/choosing-browser-storage
- id: choose-quota-registration
  front: "What quotas does the Storage Standard register for each storage type?"
  back: "`localStorage` and `sessionStorage` get 5 MiB each. IndexedDB, the Cache API and service worker registrations get no fixed one: they share the origin's disk quota."
  question: browser/storage/choosing-browser-storage
- id: choose-sync-tradeoff
  front: "When is synchronous storage a feature, and when a cost?"
  back: "A feature when you need a value before first paint: reading a theme from `localStorage` in an inline `<script>` avoids a flash, and IndexedDB can't answer that early. A cost when data is large or written often, since each write blocks rendering and input."
  question: browser/storage/choosing-browser-storage
- id: choose-setitem-example
  front: "What does `localStorage.setItem('list', [1, 2])` plus `setItem('flag', false)` give back?"
  back: "`getItem('list')` is `\"1,2\"` and `getItem('flag') === false` is `false`, since both values were converted to strings and `\"false\"` isn't `=== false`."
  question: browser/storage/choosing-browser-storage
- id: cookie-what-is-it
  front: "What is a cookie and how is it created?"
  back: "A `name=value` pair the browser stores and attaches to later requests in a `Cookie` header. A `Set-Cookie` response header or an assignment to `document.cookie` creates it, and its attributes decide where it goes and for how long."
  question: browser/storage/how-cookies-work
- id: cookie-domain
  front: "How does the `Domain` attribute scope a cookie?"
  back: "Without `Domain` it is host-only: sent only to the exact host that set it. `Domain=example.com` sends it to `example.com` and every subdomain. A host may name itself or a parent, never another site or a public suffix like `co.uk`."
  question: browser/storage/how-cookies-work
- id: cookie-path
  front: "How does `Path` match, and what is its default?"
  back: "By prefix: `Path=/admin` matches `/admin` and `/admin/users`, not `/administrator`. The default is the directory of the URL that set it. Several matches are listed longest path first, and ports don't count."
  question: browser/storage/how-cookies-work
- id: cookie-secure
  front: "What does the `Secure` attribute restrict?"
  back: "The cookie is sent over HTTPS only, though browsers also treat `http://localhost` as secure."
  question: browser/storage/how-cookies-work
- id: cookie-samesite
  front: "What do `SameSite` `Strict`, `Lax` and `None` do on cross-site requests?"
  back: "`Strict` never sends the cookie. `Lax` sends it on top-level navigations with safe methods, like following a link. `None` (which requires `Secure`) always does. Chrome treats a missing `SameSite` as `Lax`; Firefox 159 doesn't."
  question: browser/storage/how-cookies-work
- id: cookie-lifetime
  front: "How long does a cookie live without, and with, `Expires` and `Max-Age`?"
  back: "With neither it's a session cookie, kept until the browser decides the session is over. With both, `Max-Age` (seconds) wins over `Expires` (a date). Browsers cap either at 400 days."
  question: browser/storage/how-cookies-work
- id: cookie-delete
  front: "How do you delete a cookie?"
  back: "Set it again with the same name, domain and path and `Max-Age=0`. A different `Path` or `Domain` addresses a different cookie, and the original stays."
  question: browser/storage/how-cookies-work
- id: cookie-document-cookie
  front: "What does `document.cookie` return and how does assignment work?"
  back: "Only `name=value` pairs, never attributes and never `HttpOnly` cookies. Each assignment sets one cookie, so assigning `'a=1; b=2'` reads `b=2` as an attribute and ignores it."
  question: browser/storage/how-cookies-work
- id: cookie-chips
  front: "What are partitioned cookies (CHIPS)?"
  back: "A third-party cookie set with `Partitioned` and `Secure` is stored per top-level site, so an embedded widget gets a separate jar on each embedding site. Chrome 114+, Firefox 141+, Safari 26.2+."
  question: browser/storage/how-cookies-work
- id: cookie-partitioned-draft
  front: "What standard defines the `Partitioned` attribute?"
  back: "Only an expired individual Internet-Draft (CHIPS); browsers ship it anyway. A `Partitioned` cookie set in an iframe under `example.test` came back under same-site `app.example.test` and was absent at the widget's own top level in both browsers."
  question: browser/storage/how-cookies-work
- id: cookie-domain-widens
  front: "Does adding `Domain=example.com` restrict a cookie?"
  back: "No, it widens it to every subdomain. Leaving `Domain` out is the narrowest scope."
  question: browser/storage/how-cookies-work
- id: cookie-path-not-security
  front: "Is `Path` a security boundary?"
  back: "No. Any same-origin page can read another path's cookies, for example through an iframe's `contentDocument.cookie`."
  question: browser/storage/how-cookies-work
- id: cookie-prefixes
  front: "What do the `__Host-` and `__Secure-` prefixes enforce?"
  back: "A `__Secure-` cookie must be set with `Secure`. A `__Host-` cookie also needs `Path=/` and no `Domain`, pinning it to one host. Chrome 156 and Firefox 159 rejected each violation, including on `localhost`."
  question: browser/storage/how-cookies-work
- id: cookie-third-party-embed
  front: "Why can an embedded widget see its cookie in Chrome but not Firefox?"
  back: "Firefox partitions every third-party cookie by top-level site by default. A `SameSite=None; Secure` cookie set in an iframe under one site was visible at the widget's own top-level site in Chrome 156, not in Firefox 159."
  question: browser/storage/how-cookies-work
- id: cookie-store-api
  front: "What does the Cookie Store API offer?"
  back: "An asynchronous cookie API: `cookieStore.get()` returns attributes like `expires` and `path`, and it works in service workers. Chrome 87+, Firefox 140+, Safari 18.4+."
  question: browser/storage/how-cookies-work
- id: cookie-cross-site-matrix
  front: "From a page on `other.test`, which cookies reached `example.test` on a link click versus `fetch` with `credentials: 'include'`?"
  back: "Link click (top-level `GET`): `lax`, `none` and no-`SameSite` cookies in both Chrome 156 and Firefox 159. The `fetch`: only `none` in Chrome, nothing in Firefox, which uses only the third-party context's partitioned cookies."
  question: browser/storage/how-cookies-work
- id: cookie-samesite-none-no-secure
  front: "What happens to a `SameSite=None` cookie without `Secure`?"
  back: "It was rejected in both Chrome 156 and Firefox 159."
  question: browser/storage/how-cookies-work
- id: ws-scope
  front: "What are the scopes of `localStorage` and `sessionStorage`?"
  back: "`localStorage` belongs to the origin (scheme, host and port): every tab and same-origin iframe shares one map until cleared. `sessionStorage` belongs to the origin and one tab: it survives reloads and same-tab navigation, a second tab starts empty, and it is deleted when the tab closes."
  question: browser/storage/web-storage-scope
- id: ws-origin-ports
  front: "Do `localhost:8061` and `localhost:8062` share `localStorage`?"
  back: "No. The origin includes the port, so they can't see each other's."
  question: browser/storage/web-storage-scope
- id: ws-window-open-copy
  front: "What does `window.open()` do with the opener's `sessionStorage`?"
  back: "It copies it into the new tab as a snapshot, after which the two drift apart. After `setItem('step','1')`, `window.open()` and then `'2'` in the opener, the new tab read `1` in Chrome 156 and Firefox 159."
  question: browser/storage/web-storage-scope
- id: ws-noopener
  front: "How do you keep a new tab from inheriting `sessionStorage`?"
  back: "Open it with `noopener` in the features string or a `target=\"_blank\"` link. Both open the tab with no opener, so the copy step doesn't run; `rel=\"opener\"` brought the copy back in Chrome 156 and Firefox 159."
  question: browser/storage/web-storage-scope
- id: ws-storage-event
  front: "Which documents receive the `storage` event, and what does it carry?"
  back: "Every other same-origin `Window` sharing the changed storage, never the one that wrote it. It carries `key`, `oldValue`, `newValue`, `url` and `storageArea`; `clear()` sends `key: null`."
  question: browser/storage/web-storage-scope
- id: ws-no-event-cases
  front: "When does a `storage` event not fire at all?"
  back: "Setting a key to the value it already has (`setItem('k', 1)` after `'1'`), `clear()` on an empty store, and `removeItem()` of a missing key."
  question: browser/storage/web-storage-scope
- id: ws-session-event-reach
  front: "Where does a `sessionStorage` `storage` event reach?"
  back: "Only same-origin iframes in the same tab, since other tabs have their own copy. A same-origin iframe in the writing tab got it in Chrome 156 and Firefox 159. For `localStorage` the event reaches other tabs."
  question: browser/storage/web-storage-scope
- id: ws-event-use
  front: "What is the `storage` event good for, and what is `BroadcastChannel` for?"
  back: "A cheap way to sync small state such as a logout or theme change across tabs. `BroadcastChannel` is the general tool for messages that aren't stored."
  question: browser/storage/web-storage-scope
- id: ws-quota
  front: "What is the Web Storage quota and what happens past it?"
  back: "5 MiB per origin per the Storage Standard. Chrome 156 and Firefox 159 threw `QuotaExceededError` once keys plus values passed 5,242,880 UTF-16 code units, counting `é` as one unit; the write is lost."
  question: browser/storage/web-storage-scope
- id: ws-own-event-pitfall
  front: "Why can't you wait for your own `storage` event to update the UI?"
  back: "The writing document never receives it. Update locally, and use the event only for other tabs."
  question: browser/storage/web-storage-scope
- id: ws-try-catch
  front: "Why wrap `setItem()` in `try`/`catch`?"
  back: "Past the quota it throws `QuotaExceededError` and the write is lost."
  question: browser/storage/web-storage-scope
- id: ws-hot-loop
  front: "Why shouldn't you read storage in a hot loop or on every render?"
  back: "Each call is synchronous. Read once into memory and write back when the value changes."
  question: browser/storage/web-storage-scope
- id: ws-partitioned-iframe
  front: "Why might an embedded iframe see different `localStorage` on two sites?"
  back: "Browsers partition third-party storage by the top-level site, so the same origin embedded in two sites gets two separate maps."
  question: browser/storage/web-storage-scope
- id: ws-navigation-kept
  front: "Is `sessionStorage` kept when navigating away and back in the same tab, or via `<a target=\"_blank\">`?"
  back: "Kept on reload and when navigating to another page and back in the same tab. A `<a target=\"_blank\">` tab starts with empty `sessionStorage` and `window.opener` is `null`."
  question: browser/storage/web-storage-scope
- id: idb-what-it-is
  front: "What is IndexedDB and what creates its stores and indexes?"
  back: "The browser's asynchronous, transactional object database, one set of databases per origin. A higher version in `indexedDB.open(name, version)` fires `upgradeneeded` inside a `versionchange` transaction, the only place to create or delete object stores and indexes."
  question: browser/storage/indexeddb-transactions
- id: idb-stores-indexes
  front: "What do IndexedDB object stores hold, and what are indexes for?"
  back: "Structured clones (objects, `Date`, `Map`, `Blob`…), keyed by a `keyPath` property, a key generator or an explicit key. Indexes query by another property, e.g. `store.index('byPrice').getAll(IDBKeyRange.upperBound(8))`."
  question: browser/storage/indexeddb-transactions
- id: idb-transaction-modes
  front: "How do IndexedDB transactions behave across modes, and on a failed request?"
  back: "Each is `readonly` or `readwrite` over named stores. Read-write transactions over the same store run one at a time. A failed request you don't handle aborts the transaction and rolls back its writes."
  question: browser/storage/indexeddb-transactions
- id: idb-active-rule
  front: "When is an IndexedDB transaction active, and when does it commit?"
  back: "While the task that created it runs, and again while each of its requests' `success` or `error` events is dispatched. Requests can only be placed while it's active. When every request has finished and no new one was placed, the browser commits; there's no keep-alive."
  question: browser/storage/indexeddb-transactions
- id: idb-fetch-breaks
  front: "What happens if you `await fetch()` or a timer mid-transaction?"
  back: "When your code resumes, the transaction is inactive or already committed, and the next request throws `TransactionInactiveError`. Fix the ordering: fetch first, then open the transaction and write."
  question: browser/storage/indexeddb-transactions
- id: idb-await-wrapped-ok
  front: "Why is awaiting a promise-wrapped IndexedDB request fine mid-transaction?"
  back: "The success handler resolves the promise, and the code after `await` runs in the microtask checkpoint inside that dispatch, while the transaction is still active."
  question: browser/storage/indexeddb-transactions
- id: idb-commit-method
  front: "What does `tx.commit()` do, and what does `durability: 'relaxed'` trade?"
  back: "`commit()` commits as soon as the placed requests finish, without waiting for their handlers; any later request throws `TransactionInactiveError`. Chrome 76+, Firefox 74+, Safari 15+. `durability: 'relaxed'` trades crash safety for speed."
  question: browser/storage/indexeddb-transactions
- id: idb-create-store-outside
  front: "What happens if you call `createObjectStore()` outside `upgradeneeded`?"
  back: "It throws `InvalidStateError`. Bump the version instead."
  question: browser/storage/indexeddb-transactions
- id: idb-versionchange-blocked
  front: "What happens when two tabs need different IndexedDB versions?"
  back: "The newer tab's `open()` fires `versionchange` on every old connection. If one stays open, the request gets `blocked` and `upgradeneeded` waits until it closes. Handle it with `db.onversionchange = () => db.close()` and prompt a reload."
  question: browser/storage/indexeddb-transactions
- id: idb-constraint-error
  front: "What happens when `add()` of an existing key fails in a transaction?"
  back: "It fails with `ConstraintError` and, if unhandled, aborts the transaction, rolling back the `put()` placed before it."
  question: browser/storage/indexeddb-transactions
- id: idb-cant-store
  front: "What can't IndexedDB store?"
  back: "Anything structured clone rejects: functions and DOM nodes threw `DataCloneError` from `put()` in both browsers. Class instances come back as plain objects, the same rules as `postMessage()`."
  question: browser/storage/indexeddb-transactions
- id: idb-transaction-states
  front: "What states does a transaction have, and how does the spec make one go inactive?"
  back: "Active, inactive, committing or finished. Creating one marks it active and registers it for cleanup; at the end of the current microtask checkpoint, HTML's cleanup sets it inactive. It survives `await Promise.resolve()` right after creation, but not a new task."
  question: browser/storage/indexeddb-transactions
- id: idb-success-event-commit
  front: "What happens when a request's `success` event fires?"
  back: "The transaction is set active, the event dispatches, then it's set inactive again. If its request list is then empty, it commits right there. Microtasks queued by a listener run inside the dispatch, which is why promise wrappers work."
  question: browser/storage/indexeddb-transactions
- id: idb-wait-table
  front: "Which waits keep an IndexedDB transaction usable in Chrome 156 and Firefox 159?"
  back: "Awaiting a promise-wrapped request, `await Promise.resolve()` right after creating the transaction, and `queueMicrotask()` in a `success` handler work. `setTimeout` (even inside a handler), awaiting a timer promise, and `await fetch()` give `TransactionInactiveError`."
  question: browser/storage/indexeddb-transactions
- id: quota-shared-bucket
  front: "What shares one quota in an origin's storage bucket?"
  back: "IndexedDB, the Cache API, the Origin Private File System and service worker registrations. The Storage Standard leaves the size to the browser. `localStorage`, `sessionStorage` and cookies have their own limits."
  question: browser/storage/quotas-and-eviction
- id: quota-chrome-policy
  front: "What is Chrome's storage quota policy?"
  back: "Chrome's policy: an origin may use up to 60% of the disk, all origins 80%."
  question: browser/storage/quotas-and-eviction
- id: quota-firefox-safari-policy
  front: "What are Firefox's and Safari 17+'s quota policies?"
  back: "Firefox: best-effort data gets the smaller of 10% of the disk or 10 GiB per site (all origins under one registrable domain); persistent data up to 50% of the disk. Safari 17+: about 60% of the disk per origin in Safari, 15% in other apps embedding web views."
  question: browser/storage/quotas-and-eviction
- id: quota-estimate
  front: "What does `navigator.storage.estimate()` return, and how reliable is it?"
  back: "`{ usage, quota }`, both deliberately approximate: browsers compress, deduplicate and pad. Writing past the quota rejects with `QuotaExceededError`."
  question: browser/storage/quotas-and-eviction
- id: quota-chrome-133
  front: "How does Chrome 133+ report `quota` from `estimate()`?"
  back: "As usage + 10 GiB rather than the real limit, to resist fingerprinting. On a 460 GiB disk both Chrome 156 and Firefox 159 reported 10,737,418,240 bytes (Firefox's per-site cap)."
  question: browser/storage/quotas-and-eviction
- id: quota-opaque
  front: "How are opaque responses counted in the Cache API?"
  back: "At far more than their size. Each 1 KiB opaque response added 0.3–14.8 MB to `usage` in Chrome 156 and 0.3–1.1 MB in Firefox 159 (15 responses each). Request with CORS where the server allows it."
  question: browser/storage/quotas-and-eviction
- id: quota-eviction
  front: "How does eviction work for best-effort storage?"
  back: "When the disk runs low or the browser's total limit is hit, it deletes data one whole origin at a time, least recently used first, not old records. The app must cope with starting empty and re-syncing."
  question: browser/storage/quotas-and-eviction
- id: quota-persist
  front: "What does `navigator.storage.persist()` do, and how do browsers decide?"
  back: "It asks to make the bucket persistent, which only the user can then clear. Chrome grants or denies silently based on engagement, installation, bookmarks and notification permission; Firefox asks the user; Safari uses heuristics such as being a Home Screen web app."
  question: browser/storage/quotas-and-eviction
- id: quota-safari-7-days
  front: "What does Safari do to a site's script-written storage?"
  back: "Safari deletes it after seven days of Safari use without user interaction, except for Home Screen web apps."
  question: browser/storage/quotas-and-eviction
- id: quota-partitioning
  front: "How is third-party iframe storage keyed, and which browsers do it?"
  back: "Chrome 115+ and Firefox 103+ key storage by top-level site as well as origin, so an embed gets separate data and quota on every site. The key is the site, so a same-site subdomain shares the partition. Browser policy: the Storage Standard still keys by origin alone."
  question: browser/storage/quotas-and-eviction
- id: quota-safari-frames
  front: "How does Safari give cross-origin frames quota?"
  back: "MDN reports a separate quota of roughly a tenth of their parent's."
  question: browser/storage/quotas-and-eviction
- id: quota-free-space-pitfall
  front: "Why isn't `quota - usage` free space?"
  back: "Chrome reports a made-up quota, and the spec forbids basing quota on free disk space. A write can still fail, so catch `QuotaExceededError`."
  question: browser/storage/quotas-and-eviction
- id: quota-persist-headless
  front: "What did `persist()` do in a headless browser?"
  back: "Chrome 156 resolved `false` at once. Firefox 159's promise was still pending after 3 seconds, waiting on a prompt nobody could see. Call it from a clear user action such as \"Keep offline\"."
  question: browser/storage/quotas-and-eviction
- id: quota-localstorage-estimate
  front: "Does `localStorage` count toward `estimate()`?"
  back: "It depends on the browser. A 4-million-character value added nothing to `usage` in Chrome 156 and 4.00 MB in Firefox 159. Either way it keeps its own 5 MiB limit."
  question: browser/storage/quotas-and-eviction
- id: quota-storage-buckets
  front: "What is the Storage Buckets API?"
  back: "`navigator.storageBuckets.open('drafts', { persisted: true })` creates a named bucket with its own IndexedDB and caches and its own eviction fate, so one origin can protect some data. Chrome 122+ only."
  question: browser/storage/quotas-and-eviction
- id: quota-compress-example
  front: "Why did the quota example use random bytes, and what did 10,000,000 of them report?"
  back: "Browsers may compress what they store; a repeating pattern counted about 0.5 MB. Random bytes reported about 10 MB in `usage` with `persisted()` `false`, in Chrome 156 and Firefox 159 on a fresh profile."
  question: browser/storage/quotas-and-eviction
# 07 Workers
- id: ww-what-new-worker-starts
  front: "What does `new Worker(url)` start, and what does the page's main thread gain?"
  back: "A script in a new agent with its own thread, global object (`DedicatedWorkerGlobalScope`, reached as `self`), heap and event loop. The main thread keeps handling input and rendering while the worker computes."
  question: browser/workers/web-workers
- id: ww-how-sides-communicate
  front: "How do a page and its dedicated worker exchange data, and what do they share?"
  back: "They share no objects. They send messages with `postMessage(data)`, received as `message` events. Data is copied by structured clone or transferred for buffers. Shared memory exists only through `SharedArrayBuffer`."
  question: browser/workers/web-workers
- id: ww-cannot-touch-dom
  front: "What can a dedicated worker not access?"
  back: "The DOM: no `window`, `document`, `alert()` or `localStorage`. Anything that reads or changes the page must be messaged to the main thread."
  question: browser/workers/web-workers
- id: ww-apis-available
  front: "Which APIs can a dedicated worker use?"
  back: "`fetch` and `XMLHttpRequest`, IndexedDB, the Cache API, `WebSocket`, timers, `crypto`, `BroadcastChannel`, `OffscreenCanvas` and nested workers."
  question: browser/workers/web-workers
- id: ww-typeof-output
  front: "In a worker, what do `typeof document`, `typeof localStorage`, `typeof fetch` and `typeof indexedDB` give?"
  back: "`undefined undefined function object`. Same output in Chrome 156 and Firefox 159, served from `http://localhost`."
  question: browser/workers/web-workers
- id: ww-absent-globals
  front: "In Chrome 156 and Firefox 159, which names were absent from a classic worker's global?"
  back: "`window`, `document`, `localStorage`, `sessionStorage`, `alert`, `DOMParser` and `SharedWorker`. Both browsers gave the same answer for every name checked."
  question: browser/workers/web-workers
- id: ww-module-worker
  front: "What does `{ type: 'module' }` give a worker, and since which browser versions?"
  back: "A module worker: static `import` and strict mode, but no `importScripts()`. Supported since Chrome 80, Firefox 114 and Safari 15."
  question: browser/workers/web-workers
- id: ww-same-origin-script
  front: "What origin must a worker script have, and what happens otherwise?"
  back: "Same origin as the page; a `blob:` URL works. Classic worker scripts are fetched with mode `\"same-origin\"`. For a cross-origin URL, Chrome 156 throws `SecurityError` from the constructor; Firefox 159 fires an `error` event later."
  question: browser/workers/web-workers
- id: ww-uncaught-exception
  front: "What happens when a worker throws an uncaught exception, and how do you stop the page reporting it again?"
  back: "An `ErrorEvent` fires at the `Worker` object in the page and the worker keeps running. Call `preventDefault()` on it, or the page reports the error a second time as its own."
  question: browser/workers/web-workers
- id: ww-terminate-vs-close
  front: "What is the difference between `worker.terminate()` and `close()` inside the worker?"
  back: "`terminate()` stops the worker at once. `close()` called inside the worker stops it after the current task."
  question: browser/workers/web-workers
- id: ww-queued-early-message
  front: "Why was a `postMessage` sent before the worker script had loaded not lost?"
  back: "Messages wait in the worker-side port's message queue, which is enabled only after the script has run. In the example the early `postMessage(1e8)` was queued, not lost."
  question: browser/workers/web-workers
- id: ww-when-workers-help
  front: "When do workers help, and when do they not?"
  back: "They suit CPU-heavy work on data you can send cheaply: parsing, compression, image processing, search indexes. They don't help work that must touch the DOM, and each worker costs start-up time and a separate heap."
  question: browser/workers/web-workers
- id: ww-large-message-cost
  front: "Why can returning a huge parsed object from a worker cost the main thread what it saved?"
  back: "Each `postMessage` clones the data on the sending thread, and cloning is linear in the data's size and runs on both threads. Transfer `ArrayBuffer`s or use `SharedArrayBuffer` instead."
  question: browser/workers/web-workers
- id: ww-importscripts-module
  front: "What happens when you call `importScripts()` in a module worker?"
  back: "It throws a `TypeError`; use `import` instead. Both Chrome 156 and Firefox 159 threw. `import()` in a classic worker works in both."
  question: browser/workers/web-workers
- id: ww-async-not-faster
  front: "Does moving `async` code into a worker make it faster?"
  back: "No. `fetch` and timers already run off the main thread. A worker helps only when your own JavaScript keeps the main thread busy, such as a long loop or a heavy parse."
  question: browser/workers/web-workers
- id: ww-dom-work-alternative
  front: "What is the alternative to a worker when the work must touch the DOM?"
  back: "Break it into chunks and yield between them, for example with `scheduler.yield()`, so input and rendering run in between. The work stays on the main thread but stops blocking it."
  question: browser/workers/web-workers
- id: ww-offscreen-canvas
  front: "How can a worker draw, and which browsers support it?"
  back: "Through `OffscreenCanvas`: `canvas.transferControlToOffscreen()` hands the canvas to the worker. Supported in Chrome 69, Firefox 105 and Safari 16.4."
  question: browser/workers/web-workers
- id: ww-error-event-order
  front: "Per the spec's report-an-exception steps, in what order do error handlers run for an uncaught worker exception?"
  back: "The worker's own `onerror` runs first, then the page gets a cancelable `ErrorEvent` at the `Worker` object with `message`, `filename`, `lineno` and `colno`, but not the exception itself. Unless cancelled, the page's `window` `error` handler fires too."
  question: browser/workers/web-workers
- id: ww-error-edge-cases
  front: "In Chrome 156 and Firefox 159, what happened on an unhandled promise rejection in a worker, and on a 404 for the script?"
  back: "An unhandled rejection fired no event at the `Worker`. A 404 script fired a plain `Event` with no message. Both browsers behaved the same."
  question: browser/workers/web-workers
- id: ww-syntax-error-differs
  front: "How did Chrome 156 and Firefox 159 differ on a syntax error in a worker script?"
  back: "Chrome fired an `ErrorEvent` with the message; Firefox fired a plain `Event`. Firefox matches the spec here, which says a failed fetch or parse error should fire a plain `error` event."
  question: browser/workers/web-workers
- id: ww-post-after-terminate
  front: "In Chrome 156 and Firefox 159, what happens to `postMessage()` after `terminate()`?"
  back: "It is dropped silently, with no error, in both browsers."
  question: browser/workers/web-workers
- id: ww-request-response-id
  front: "Why does a request/response layer over `postMessage` need an id per call?"
  back: "`postMessage` has no replies, and replies can come back in any order, so the id, not arrival order, matches them to calls. An `Error` such as `SyntaxError` crossing the boundary stays a real `SyntaxError`, since `Error` objects are cloneable."
  question: browser/workers/web-workers
- id: ww-startup-cost
  front: "How long did a worker take to send its first message in Chrome 156 and Firefox 159?"
  back: "From `new Worker()` to first message: 2.6–3.8 ms (median of 20) in Chrome 156 and 4–9 ms in Firefox 159, 3 runs each on localhost. The first worker in each run took 14–22 ms. A network download adds to that."
  question: browser/workers/web-workers
- id: ww-pool-size
  front: "How do you size a worker pool, and why not make a worker per task?"
  back: "`navigator.hardwareConcurrency` gives the number of logical cores; more busy workers than that just time-share. Per-task workers pay start-up each time and each has its own heap, so keep one or a small pool alive."
  question: browser/workers/web-workers
- id: ww-sharedarraybuffer-isolation
  front: "What does sharing memory with `SharedArrayBuffer` require?"
  back: "Cross-origin isolation."
  question: browser/workers/web-workers
- id: ww-caches-secure-context
  front: "What does `caches` need in a worker, and does `http://localhost` meet it?"
  back: "It needs a secure context, and `http://localhost` counts as one."
  question: browser/workers/web-workers
- id: sc-algorithm-name
  front: "What does `postMessage(message, transfer)` do to `message`, and which function exposes the same algorithm?"
  back: "It serializes `message` on the sending side and deserializes a fresh copy on the receiving side, using structured clone (`StructuredSerializeWithTransfer`). `structuredClone()` exposes the same algorithm."
  question: browser/workers/structured-clone-and-transfer
- id: sc-what-copies
  front: "Which values does structured clone copy?"
  back: "Primitives except `Symbol` (including `BigInt`, `NaN`, `-0`), plain objects and arrays, `Date`, `RegExp`, `Map`, `Set`, `ArrayBuffer` and typed arrays, boxed primitives, `Blob`, `File`, `ImageData` and `Error` objects."
  question: browser/workers/structured-clone-and-transfer
- id: sc-cycles-shared-refs
  front: "How does structured clone treat cycles and an array referenced twice?"
  back: "It keeps both. Cycles survive, and an array referenced twice arrives as one array referenced twice."
  question: browser/workers/structured-clone-and-transfer
- id: sc-class-instance
  front: "What does a class instance look like after structured clone?"
  back: "A plain `Object` with its own enumerable string-keyed properties. Methods and prototype getters are gone; an own getter is called and its value copied; symbol keys and non-enumerable properties are dropped."
  question: browser/workers/structured-clone-and-transfer
- id: sc-error-subclass
  front: "How is an `Error` cloned, and what happens to a subclass?"
  back: "It keeps its type only for the built-in names (`TypeError`, `RangeError`…). A subclass arrives as `Error`, without extra properties. Extra own properties such as `code` were dropped in Chrome 156 and Firefox 159."
  question: browser/workers/structured-clone-and-transfer
- id: sc-dataclone-error
  front: "Which values make `postMessage()` throw a `DataCloneError`, and is anything sent?"
  back: "Functions (including methods on a plain object), `Symbol` values, DOM nodes, `WeakMap`, promises and proxies. The `DOMException` is thrown from `postMessage()` itself and nothing is sent."
  question: browser/workers/structured-clone-and-transfer
- id: sc-transfer-detaches
  front: "What happens to a sender's `ArrayBuffer` after it is transferred?"
  back: "It is detached: `byteLength` becomes 0 and views over it become empty. Reads give `undefined` and writes are ignored without an error."
  question: browser/workers/structured-clone-and-transfer
- id: sc-transfer-cost
  front: "How much faster was transferring a 64 MiB `ArrayBuffer` than copying it in Chrome 156?"
  back: "Copying blocked the sender for 5.9–10.2 ms (15 runs); transferring took under 0.2 ms."
  question: browser/workers/structured-clone-and-transfer
- id: sc-transferable-types
  front: "Name some transferable types, and the rule for `MessagePort` and streams."
  back: "`ArrayBuffer`, `MessagePort`, `ReadableStream`, `ImageBitmap` and `OffscreenCanvas`. A `MessagePort` or stream must be transferred; putting one in the message without the transfer list throws."
  question: browser/workers/structured-clone-and-transfer
- id: sc-transfer-list-detaches-unreferenced
  front: "If the transfer list holds buffers `a` and `b` but the message only references `a`, which are detached?"
  back: "Both, so `a.byteLength` and `b.byteLength` print `0 0`. Every listed buffer is detached, even one the message never references. Chrome 156 and Firefox 159 agree."
  question: browser/workers/structured-clone-and-transfer
- id: sc-transfer-typed-array
  front: "What happens if you list a `Uint8Array` in the transfer list?"
  back: "It throws `DataCloneError`. List its `.buffer` instead; the receiver gets a new view over the moved memory, and every view over it in the sender drops to length 0."
  question: browser/workers/structured-clone-and-transfer
- id: sc-messageerror
  front: "What does the receiver get if deserializing fails, and is the sender told?"
  back: "A `messageerror` event instead of `message`. The sender isn't told, since serializing already succeeded."
  question: browser/workers/structured-clone-and-transfer
- id: sc-regexp-lastindex
  front: "What is a cloned `RegExp`'s `lastIndex`?"
  back: "0. The algorithm copies only the pattern and flags."
  question: browser/workers/structured-clone-and-transfer
- id: sc-error-cause-stack
  front: "What does the spec carry for an `Error`'s stack and `cause`, and what did the browsers do?"
  back: "The spec carries `name`, `message` and an implementation-defined stack. Chrome 156 and Firefox 159 also kept `cause`, which the spec leaves to user agents."
  question: browser/workers/structured-clone-and-transfer
- id: sc-rebuild-instance
  front: "How do you get a class instance's methods back after sending it through `postMessage`?"
  back: "Send plain data and rebuild the instance on the other side, for example `Object.assign(new Point(), data)`."
  question: browser/workers/structured-clone-and-transfer
- id: sc-clone-runs-on-sender
  front: "On which thread does the structured-clone copy run for a large buffer?"
  back: "On the sending thread, so cloning large buffers on every message blocks the sender. Transfer them, or keep the data in the worker."
  question: browser/workers/structured-clone-and-transfer
- id: sc-sharing-memory
  front: "How do you share memory instead of copying or moving it between threads?"
  back: "Use `SharedArrayBuffer`."
  question: browser/workers/structured-clone-and-transfer
- id: sw-what-is-service-worker
  front: "What is a service worker's registration, and what does it require?"
  back: "The browser keeps one per registration: an origin plus a URL scope. It sits between pages in that scope and the network and runs only when an event needs it. It requires a secure context; `http://localhost` counts."
  question: browser/workers/service-worker-lifecycle
- id: sw-first-install-steps
  front: "What are the steps of a service worker's first install?"
  back: "`register()` fetches the script and runs it; `install` fires, kept open by `event.waitUntil()`. With no older version it activates at once and `activate` fires, the place to delete old caches. A rejected `waitUntil` promise discards the worker."
  question: browser/workers/service-worker-lifecycle
- id: sw-first-load-uncontrolled
  front: "Does the page that registers a service worker get controlled by it?"
  back: "No. It controls pages that load after activation; the registering page stays uncontrolled (`navigator.serviceWorker.controller` is `null`) until it's reloaded, unless the worker calls `clients.claim()`."
  question: browser/workers/service-worker-lifecycle
- id: sw-update-triggers
  front: "When does the browser check for a new service worker script?"
  back: "On every navigation into the scope, on `registration.update()`, and on other events when the last check is more than 24 hours old."
  question: browser/workers/service-worker-lifecycle
- id: sw-update-is-byte-diff
  front: "What counts as an update, and what if the script is byte-identical?"
  back: "A byte-different script. By default (`updateViaCache: 'imports'`) the main script bypasses the HTTP cache. If it's identical, nothing happens: the script is fetched but no `install` fires."
  question: browser/workers/service-worker-lifecycle
- id: sw-new-version-waits
  front: "What does a new service worker version do after it installs while old-version tabs are open?"
  back: "It waits. It activates only after every tab controlled by the old one has closed or navigated elsewhere."
  question: browser/workers/service-worker-lifecycle
- id: sw-reload-does-not-update
  front: "Does reloading the only open tab activate a waiting service worker?"
  back: "No. The old page is still a client when the reloaded one is requested, so v2 keeps waiting. Navigating the tab elsewhere and back activated v2 in Chrome 156 and Firefox 159."
  question: browser/workers/service-worker-lifecycle
- id: sw-skipwaiting
  front: "What does `skipWaiting()` do, and what is the risk?"
  back: "It activates the new worker immediately, and every open tab fires `controllerchange`. A page built for v1 is then served by v2, which may have deleted caches that v1's lazy-loaded chunks need."
  question: browser/workers/service-worker-lifecycle
- id: sw-prompt-then-skip
  front: "What is the usual compromise for shipping service worker updates?"
  back: "The waiting worker skips only when the user accepts an \"Update available\" prompt, after which the page reloads. The page posts a message such as `SKIP_WAITING` and reloads on `controllerchange`."
  question: browser/workers/service-worker-lifecycle
- id: sw-claim-first-visit
  front: "What does `clients.claim()` in `activate` do on a first visit, and why use it?"
  back: "`controllerchange` fires and the page becomes controlled. It helps when the worker should control the first visit, for example to cache its requests; without it, the first page's requests bypass the worker."
  question: browser/workers/service-worker-lifecycle
- id: sw-changing-sw-url
  front: "Why shouldn't `sw.js` be served from a per-build URL like `sw.3f9a.js`?"
  back: "A new URL is a different worker, and the old page still registers the old one."
  question: browser/workers/service-worker-lifecycle
- id: sw-install-fails
  front: "What happens if a `waitUntil()` promise rejects during `install`?"
  back: "The new worker becomes `redundant` and the current one keeps control. The browser tries again at the next update check."
  question: browser/workers/service-worker-lifecycle
- id: sw-three-slots-states
  front: "What are a registration's `installing`, `waiting` and `active` slots, and a worker's `state` values?"
  back: "`installing` runs `install`, `waiting` holds an installed version blocked by open clients, `active` controls pages. A worker's `state` is `installing`, `installed`, `activating`, `activated` or `redundant`."
  question: browser/workers/service-worker-lifecycle
- id: sw-updateviacache
  front: "How does `updateViaCache` affect a cached `sw.js` with `max-age`?"
  back: "With the default `'imports'` the main script is always revalidated. With `'all'` a `max-age` is honoured, but a registration last checked over 24 hours ago bypasses the cache anyway."
  question: browser/workers/service-worker-lifecycle
- id: sw-update-fetch-details
  front: "What header and cache mode does the spec's Update algorithm use to fetch the script?"
  back: "A `Service-Worker: script` header. Unless `updateViaCache` is `'all'` the cache mode is `no-cache`; a registration is stale after 86,400 seconds since its last check, and a stale one also gets `no-cache`."
  question: browser/workers/service-worker-lifecycle
- id: sw-importscripts-compare
  front: "Per the spec, how are `importScripts()` files handled during an update check?"
  back: "If the main script is unchanged, the imported scripts are fetched and compared too. They may come from the HTTP cache unless `updateViaCache` is `'none'`. No difference, no new worker."
  question: browser/workers/service-worker-lifecycle
- id: sw-try-activate
  front: "When does Try Activate activate a waiting worker?"
  back: "When there's no active worker, or the active one has no pending events and either no client uses the registration or the waiting one set its skip waiting flag. It runs again when the last client unloads and when `skipWaiting()` is called."
  question: browser/workers/service-worker-lifecycle
- id: sw-controller-chosen-once
  front: "When is a client's controller chosen?"
  back: "Once, when the client is created: the navigation that loads a page picks the registration's active worker. Activation then also makes the new worker the controller of clients the old one controlled, firing `controllerchange`."
  question: browser/workers/service-worker-lifecycle
- id: sw-waituntil-active-event
  front: "In Chrome 156 and Firefox 159, when does `waitUntil()` throw `InvalidStateError`?"
  back: "When called after the event finished dispatching, such as after `await new Promise(r => setTimeout(r, 0))`. An `await` on an already-settled promise still counts as synchronous because microtasks run first; `await fetch(...)` doesn't. `respondWith()` behaved the same."
  question: browser/workers/service-worker-lifecycle
- id: sw-delete-old-caches
  front: "When should a versioned precache delete old caches, and why not in `install`?"
  back: "In `activate`. While v2 waits, both `static-v1` and `static-v2` exist so v1 pages keep working. Deleting in `install` would break v1 pages that are still open."
  question: browser/workers/service-worker-lifecycle
- id: sw-wait-tradeoff
  front: "What are the trade-offs of waiting versus `skipWaiting()` on every install?"
  back: "Waiting is always safe (one tab never runs two versions) but a user with a tab open for days stays on the old version. `skipWaiting()` gets fixes out immediately but open pages run against a worker they weren't built for."
  question: browser/workers/service-worker-lifecycle
- id: sw-tab-closing-two-tabs
  front: "With two tabs open and v2 waiting, what happens when you close one?"
  back: "v2 is still waiting, because the other tab is still on v1. This held in Chrome 156 and Firefox 159."
  question: browser/workers/service-worker-lifecycle
- id: sc2-fetch-event
  front: "What does a service worker see, and how does it answer a request?"
  back: "Every request its controlled pages make: navigations into its scope and every subresource request, cross-origin included. Each fires `fetch`. `event.respondWith(promise)` during dispatch supplies the `Response`; otherwise the request goes to the network."
  question: browser/workers/service-worker-caching
- id: sc2-cache-api
  front: "What is the Cache API, and how does it relate to the HTTP cache?"
  back: "A store of request/response pairs (`caches.open(name)`, then `match`, `put`, `add`, `addAll`, `delete`, `keys`) that only your code reads and writes. It is unrelated to the HTTP cache that `fetch`'s `cache` option controls."
  question: browser/workers/service-worker-caching
- id: sc2-cache-keys-get-only
  front: "How are Cache API entries keyed, and which requests can be stored?"
  back: "By URL, query included; only `GET` requests can be stored. Entries stay until deleted or until the origin is evicted, and count against the origin's storage quota."
  question: browser/workers/service-worker-caching
- id: sc2-cache-first
  front: "What is the cache-first strategy and what is it for?"
  back: "Return the cached copy and go to the network only on a miss. Use it for versioned static files like `app.3f9a.js` that never change at the same URL."
  question: browser/workers/service-worker-caching
- id: sc2-network-first
  front: "What is the network-first strategy and what is it for?"
  back: "Try the network, update the cache, and fall back to the cache when offline. Use it for HTML and data that must be current when possible."
  question: browser/workers/service-worker-caching
- id: sc2-swr
  front: "What is stale-while-revalidate and what is it for?"
  back: "Answer from the cache immediately and refresh the cache in the background, so the next visit sees the update. Use it for avatars and data that may lag one load behind."
  question: browser/workers/service-worker-caching
- id: sc2-cache-only-network-only
  front: "When use cache-only or network-only?"
  back: "Cache-only for precached assets; network-only for requests that must never be cached, like analytics or `POST`."
  question: browser/workers/service-worker-caching
- id: sc2-navigation-preload
  front: "What problem does navigation preload solve, and how is it used?"
  back: "A navigation to a stopped service worker waits for it to boot before the request starts. `registration.navigationPreload.enable()` sends the request in parallel with a `Service-Worker-Navigation-Preload` header; the worker reads it via `event.preloadResponse`."
  question: browser/workers/service-worker-caching
- id: sc2-preload-double-fetch
  front: "What happens if navigation preload is enabled but the handler calls `fetch(event.request)` itself?"
  back: "The preload request goes out anyway, so the server is hit twice per navigation, as it did in Chrome 156 and Firefox 159. Use `event.preloadResponse`."
  question: browser/workers/service-worker-caching
- id: sc2-swr-output
  front: "In the stale-while-revalidate example with a server counting 1, 2, 3…, what do three page requests print?"
  back: "`1`, `1`, `2`. Each answer is the value cached one request earlier. With the server unreachable, a fourth request answered `3` from the cache. Same in Chrome 156 and Firefox 159."
  question: browser/workers/service-worker-caching
- id: sc2-network-first-fourth
  front: "With network-first and a counting server, what does the fourth request print when the server is unreachable?"
  back: "`3`. The first three reach the network (`1 2 3`) and each replaces the cached copy; the fourth `fetch()` rejects, so the `catch` serves the last cached response. Chrome 156 and Firefox 159 printed `1 2 3 3`."
  question: browser/workers/service-worker-caching
- id: sc2-check-response-ok
  front: "Why check `response.ok` before `cache.put()` under cache-first?"
  back: "A 404, a 500 or a redirect would be cached and served forever."
  question: browser/workers/service-worker-caching
- id: sc2-opaque-responses
  front: "What is the problem with caching opaque `no-cors` responses?"
  back: "`cache.put()` accepts them, but their status is hidden and browsers pad their quota cost. Chrome 156 counted one tiny response as about 7 MB."
  question: browser/workers/service-worker-caching
- id: sc2-clone-body
  front: "Why `clone()` a response before caching it in a fetch handler?"
  back: "A body can be read once. `put()` a `clone()` and return the original."
  question: browser/workers/service-worker-caching
- id: sc2-addall-atomic
  front: "Is `cache.addAll()` atomic?"
  back: "Yes. If any request fails or returns a non-2xx status, it rejects with a `TypeError` and stores nothing. Chrome 156 and Firefox 159 left the cache empty after one 404 in the list."
  question: browser/workers/service-worker-caching
- id: sc2-add-opaque
  front: "Why can't `cache.add()` store a `no-cors` response, and what can?"
  back: "`add()` rejects any response that isn't 2xx, and an opaque response's status reads as 0. Both browsers threw `TypeError`; `put()` stores it."
  question: browser/workers/service-worker-caching
- id: sc2-stream-response
  front: "How do you stream a response from a service worker?"
  back: "Pass a `Response` built on a `ReadableStream` to `respondWith()`. The page reads chunks as the worker enqueues them: in Chrome 156 and Firefox 159 a chunk enqueued 500 ms after the first arrived 500 ms later."
  question: browser/workers/service-worker-caching
- id: sc2-match-query
  front: "Does the query string matter for `cache.match()`?"
  back: "Yes: `/q?a=1` doesn't match `/q?a=2`. Pass `{ ignoreSearch: true }` to match on the path alone."
  question: browser/workers/service-worker-caching
- id: sc2-waituntil-refresh
  front: "Why call `event.waitUntil()` for the background refresh in stale-while-revalidate?"
  back: "To keep the worker alive until the cache refresh finishes, since the response has already been returned."
  question: browser/workers/service-worker-caching
- id: ct-broadcastchannel
  front: "How does `BroadcastChannel` work, and who receives the message?"
  back: "A named pub/sub bus; data is structured-cloned. It reaches every other channel object with that name in the same origin, including workers and a second channel object in the sending tab. Only the sending object itself is skipped."
  question: browser/workers/cross-tab-communication
- id: ct-broadcast-storage-key
  front: "How does `BroadcastChannel` match a third-party iframe?"
  back: "By storage key, so a third-party iframe only reaches copies of itself embedded under the same top-level site."
  question: browser/workers/cross-tab-communication
- id: ct-broadcast-origin
  front: "Does a tab on `http://127.0.0.1:8070` receive a `BroadcastChannel` message from `http://localhost:8070`?"
  back: "No, it's another origin. Same in Chrome 156 and Firefox 159, driven with Puppeteer."
  question: browser/workers/cross-tab-communication
- id: ct-sender-no-receive
  front: "Does the sending tab receive its own `BroadcastChannel` message?"
  back: "No. Update the sending tab directly; the channel is for the others."
  question: browser/workers/cross-tab-communication
- id: ct-sharedworker
  front: "What is a `SharedWorker`, and how do pages talk to it?"
  back: "One worker shared by every same-origin page that creates it with the same URL and name. Each page uses its own `MessagePort` (`worker.port`), and the worker gets a `connect` event per page. It runs while any page is connected."
  question: browser/workers/cross-tab-communication
- id: ct-sharedworker-support
  front: "What is the `SharedWorker` support caveat?"
  back: "Chrome Android shipped it only in Chrome 148. Safari dropped it after version 7 and restored it in 16."
  question: browser/workers/cross-tab-communication
- id: ct-web-locks
  front: "What do Web Locks do, and when is the lock released?"
  back: "`navigator.locks.request('sync', async (lock) => {…})` runs the callback once no other tab or worker of the origin holds `'sync'`. The lock is released when the returned promise settles or the tab closes."
  question: browser/workers/cross-tab-communication
- id: ct-lock-options
  front: "What do the `ifAvailable`, `steal` and `mode: 'shared'` lock options do?"
  back: "`ifAvailable: true` gives `null` instead of waiting. `steal: true` takes the lock and rejects the holder's request with `AbortError`. `mode: 'shared'` allows several readers."
  question: browser/workers/cross-tab-communication
- id: ct-steal-callback-continues
  front: "Does `steal: true` stop the old lock holder's work?"
  back: "No. Its request rejects with `AbortError`, but its callback keeps running; code inside must check whether it still owns the work."
  question: browser/workers/cross-tab-communication
- id: ct-iflavailable-exercise
  front: "Tab A holds lock `'sync'` for a second; 100 ms later tab B requests it with `ifAvailable: true`. What does `lock === null` print?"
  back: "`true`. B's callback runs at once with `null` instead of queuing. After A's lock was released, the same request printed `false`. Chrome 156 and Firefox 159 agree."
  question: browser/workers/cross-tab-communication
- id: ct-other-channels
  front: "What other ways can same-origin contexts communicate besides channels, workers and locks?"
  back: "The `storage` event fires in other tabs when `localStorage` changes; `window.opener` and iframes can `postMessage` each other directly; a service worker can message every client with `clients.matchAll()`."
  question: browser/workers/cross-tab-communication
- id: ct-pick-by-need
  front: "How do you choose between `BroadcastChannel`, locks and `SharedWorker`?"
  back: "Notifications: `BroadcastChannel`. One owner of a resource: a lock, or a `SharedWorker` where supported."
  question: browser/workers/cross-tab-communication
- id: ct-leader-election
  front: "How do you elect one leader tab?"
  back: "Every tab calls `navigator.locks.request('leader', () => new Promise(() => {}))`. The first holds the lock forever; the rest queue. When the leader's tab closes, the browser releases its lock and the next callback runs, as Chrome 156 and Firefox 159 did."
  question: browser/workers/cross-tab-communication
- id: ct-broadcast-vs-storage
  front: "`BroadcastChannel` or the `storage` event?"
  back: "The `storage` event only reports `localStorage` writes, as strings, and only when the value changes. `BroadcastChannel` sends any cloneable value without storing it. Use storage when the state must also survive a reload."
  question: browser/workers/cross-tab-communication
- id: ct-bfcache-spec
  front: "Per the spec, do `BroadcastChannel` messages reach a page in the back-forward cache?"
  back: "No. The spec delivers only to documents that are fully active. Only Chrome was checked, since headless Firefox under Puppeteer didn't restore pages from the cache."
  question: browser/workers/cross-tab-communication
- id: ct-bfcache-chrome
  front: "In Chrome 156, what happens to a page with an open `BroadcastChannel` that is back-forward cached?"
  back: "Chrome 156 cached the page, but a message sent while it was cached evicted it."
  question: browser/workers/cross-tab-communication
# 08 Observers
- id: io-vs-scroll-listener
  front: "Why prefer `IntersectionObserver` over a scroll listener that checks visibility?"
  back: "A scroll listener runs on every scroll event and measures the element itself, often with `getBoundingClientRect()`, which can force a synchronous layout. `IntersectionObserver` hands the job to the browser, which calls you only on changes."
  question: browser/observers/intersection-observer
- id: io-scroll-vs-callback-count
  front: "With 20 real wheel steps of 60 px past a target, how many `scroll` events and observer callbacks did the page get?"
  back: "20 `scroll` events and 1 observer callback, in Chrome 156 and Firefox 159, three runs each."
  question: browser/observers/intersection-observer
- id: io-root
  front: "What is `IntersectionObserver`'s `root` option?"
  back: "The box targets are tested against. `null` (the default) means the top-level viewport; otherwise an element or document that contains the targets."
  question: browser/observers/intersection-observer
- id: io-rootmargin
  front: "What does `rootMargin` do?"
  back: "CSS-margin-style offsets that grow or shrink the root's box. `'0px 0px 300px 0px'` treats anything within 300 px below the viewport as intersecting. The getter returns the normalised four-value form, `'0px 0px 0px 0px'` by default."
  question: browser/observers/intersection-observer
- id: io-threshold
  front: "What does `threshold` mean, and what is the default?"
  back: "One ratio or a list, as fractions of the target's area. The default `0` means any overlap, even edges touching. Values outside 0–1 throw a `RangeError`."
  question: browser/observers/intersection-observer
- id: io-when-entry-queued
  front: "When does an `IntersectionObserver` queue an entry?"
  back: "Only when the target moved into a different threshold band or flipped `isIntersecting`. It computes after layout in each rendering update and calls the callback in a later task with all of that observer's queued entries."
  question: browser/observers/intersection-observer
- id: io-entry-fields
  front: "Which fields does an `IntersectionObserverEntry` have?"
  back: "`isIntersecting`, `intersectionRatio`, `intersectionRect`, `boundingClientRect`, `rootBounds`, `target` and `time`."
  question: browser/observers/intersection-observer
- id: io-initial-entry
  front: "How many entries does `observe()` give initially, and why?"
  back: "One per target, even for an element far off-screen (`isIntersecting: false`). The stored previous threshold index starts at -1, so the first computation always differs. The starting state then goes through the same code as later changes."
  question: browser/observers/intersection-observer
- id: io-loading-lazy
  front: "How does native `loading=\"lazy\"` relate to `IntersectionObserver`?"
  back: "It is specified as an `IntersectionObserver` the browser owns. Use the attribute for plain images and iframes, and the API when you need a callback."
  question: browser/observers/intersection-observer
- id: io-unobserve-disconnect
  front: "What do `unobserve(target)` and `disconnect()` do?"
  back: "`unobserve(target)` stops watching one target, for example once a one-shot target is handled. `disconnect()` stops watching everything."
  question: browser/observers/intersection-observer
- id: io-lazy-example-output
  front: "In the lazy-image example (ten 300px images, `rootMargin` 300px bottom, viewport 1024×768), what do the two callbacks log?"
  back: "First: 10 entries, loaded photo-0 to photo-3. After scrolling 1000 px: 3 entries, loaded photo-4 to photo-6. Images 7–9 were still outside the margin, and 0–3 were no longer observed. Same in Chrome 156 and Firefox 159."
  question: browser/observers/intersection-observer
- id: io-not-always-visible
  front: "Why check `isIntersecting` on every entry?"
  back: "The initial entry and exit entries arrive too, so not every entry means \"became visible\"."
  question: browser/observers/intersection-observer
- id: io-isintersecting-threshold-differs
  front: "What does the spec say about `isIntersecting` with thresholds above 0, and what do Chrome 156 and Firefox 159 do?"
  back: "The spec says it's true for any overlap. In Chrome 156 and Firefox 159 it stays `false` until the ratio reaches the lowest threshold: with `threshold: [0.5]`, a target 1% in view logged `false`. Compare `intersectionRatio` instead."
  question: browser/observers/intersection-observer
- id: io-cross-origin-rootmargin
  front: "What happens to `rootMargin` for a cross-origin iframe target with the implicit root?"
  back: "The spec ignores it and gives the target `rootBounds: null`. Chrome 156 and Firefox 159 both did exactly that."
  question: browser/observers/intersection-observer
- id: io-scrollmargin
  front: "Why doesn't `rootMargin` reach past a nested scroller, and what does?"
  back: "`rootMargin` grows only the root's box, so a target clipped by an inner `overflow: auto` container stays clipped. `scrollMargin` grows every scrollport on the way. It shipped in Chrome 120, Firefox 141 and Safari 26."
  question: browser/observers/intersection-observer
- id: io-target-not-in-root
  front: "What happens if the target isn't inside `root`?"
  back: "No error. The spec skips the geometry, so the entry has `isIntersecting: false`, ratio 0 and an all-zero `boundingClientRect`. Chrome 156 and Firefox 159 reported exactly that."
  question: browser/observers/intersection-observer
- id: io-v2-trackvisibility
  front: "What does IntersectionObserver v2 add, and who ships it?"
  back: "`trackVisibility: true` with `delay` adds `isVisible`, false when the target is covered, transformed, filtered or not fully opaque. Only Chrome ships it, since 74."
  question: browser/observers/intersection-observer
- id: io-delay-100
  front: "What minimum `delay` does `trackVisibility` need, and how do spec and Chrome 156 differ?"
  back: "100. The spec raises a smaller `delay` to 100; Chrome 156 throws `NotSupportedError` instead when it's below 100."
  question: browser/observers/intersection-observer
- id: io-callback-timing
  front: "When does the `IntersectionObserver` callback run relative to scrolling?"
  back: "Intersections are computed in the rendering update after layout; the callback runs in a separate task queued from there, so it's never synchronous with the scroll."
  question: browser/observers/intersection-observer
- id: io-algorithm-steps
  front: "What are the steps of the update intersection observations algorithm?"
  back: "Clip the target's box by every scrolling ancestor and the root rectangle (root box plus `rootMargin`); `intersectionRatio` is intersection area over target area (1 or 0 for a zero-area target); `thresholdIndex` is the first threshold greater than the ratio; queue an entry if the index or `isIntersecting` changed."
  question: browser/observers/intersection-observer
- id: io-edge-touching
  front: "In Chrome 156 and Firefox 159, what do a target touching the viewport bottom edge give with default options, and with `threshold: [0.25, 0.5, 1]`?"
  back: "Default: `isIntersecting` `true`, ratio 0. With `threshold: [0.25, 0.5, 1]`: `false`, ratio 0."
  question: browser/observers/intersection-observer
- id: io-edge-half-zero-height
  front: "In Chrome 156 and Firefox 159, what do a half-below-the-fold target and a zero-height on-screen target report by default?"
  back: "Half below the fold: `true`, ratio 0.5. Zero-height, on screen: `true`, ratio 1."
  question: browser/observers/intersection-observer
- id: io-rootmargin-vs-scrollmargin-measured
  front: "A target is 50 px below an inner scroller's visible area. What does `rootMargin: '100px'` versus `scrollMargin: '100px'` report in Chrome 156 and Firefox 159?"
  back: "`rootMargin: '100px'`: `isIntersecting` `false`. `scrollMargin: '100px'`: `true`."
  question: browser/observers/intersection-observer
- id: io-invalid-options
  front: "What do invalid `threshold` and `rootMargin` values throw?"
  back: "A `threshold` outside 0–1 throws a `RangeError`; an invalid `rootMargin` throws a `SyntaxError`."
  question: browser/observers/intersection-observer
- id: ro-what-it-is
  front: "What is `ResizeObserver`, and which boxes can `observe(el, { box })` watch?"
  back: "The per-element counterpart of `window`'s `resize` event. `box` is `'content-box'` (the default), `'border-box'` or `'device-pixel-content-box'`. An entry arrives when that box's size differs from the last size reported."
  question: browser/observers/resize-observer
- id: ro-initial-entry
  front: "Does `ResizeObserver` fire an initial entry, even for a hidden element?"
  back: "Yes. The first check always differs, so every `observe()` produces an initial entry, even for a `display: none` element (0 × 0)."
  question: browser/observers/resize-observer
- id: ro-entry-fields
  front: "What do `contentBoxSize`, `borderBoxSize` and `devicePixelContentBoxSize` contain, and why arrays?"
  back: "Frozen arrays of `{ inlineSize, blockSize }`, logical sizes that follow `writing-mode`. They're arrays so that fragmented elements (multi-column) can someday report each fragment; today they hold one item."
  question: browser/observers/resize-observer
- id: ro-contentrect
  front: "What is `ResizeObserverEntry.contentRect`?"
  back: "The legacy physical rectangle, kept for compatibility. It's always the content box in physical width and height, whatever `box` you chose; for a `vertical-rl` element `contentBoxSize[0].inlineSize` is its height."
  question: browser/observers/resize-observer
- id: ro-timing
  front: "When do `ResizeObserver` callbacks run?"
  back: "Inside the rendering update, after style and layout and before paint, so reading sizes there is cheap and changes made there show in the same frame."
  question: browser/observers/resize-observer
- id: ro-layout-size-only
  front: "Which changes do not trigger a `ResizeObserver` callback?"
  back: "Only layout size counts. `transform` never triggers one, and changing padding doesn't trigger a `content-box` observation."
  question: browser/observers/resize-observer
- id: ro-loop-error
  front: "What causes the \"ResizeObserver loop completed with undelivered notifications\" error?"
  back: "Resizing elements inside the callback forces another layout. The browser re-delivers only to elements deeper than the shallowest one just delivered; the rest wait for the next frame, and an `ErrorEvent` is reported at `window`."
  question: browser/observers/resize-observer
- id: ro-loop-error-not-thrown
  front: "Can `try`/`catch` catch the `ResizeObserver` loop error?"
  back: "No. It isn't thrown, but `window.onerror` and error-monitoring tools see it."
  question: browser/observers/resize-observer
- id: ro-depth-rule
  front: "Why does the depth rule matter, and what is the fix for the loop error?"
  back: "Each pass can only deliver deeper elements, which guarantees the loop ends. The fix is to not resize what you observe from its own callback, or to make the change converge. For pure styling, CSS container queries need no script."
  question: browser/observers/resize-observer
- id: ro-example-output
  front: "In the example that grows an observed box by 50 px per callback, what is logged for the first run?"
  back: "`content 200, border 230`, then the loop error message, then `content 250, border 280`, the error again, and `content 300, border 330`. Each resize lands one frame later. Same in Chrome 156 and Firefox 159, three runs each."
  question: browser/observers/resize-observer
- id: ro-raf-silencing
  front: "Does deferring the resize with `requestAnimationFrame` fix a resize loop?"
  back: "It stops the error message (verified in Chrome 156 and Firefox 159), but a callback that keeps resizing its own target still runs every frame."
  question: browser/observers/resize-observer
- id: ro-container-queries
  front: "When should you use container queries instead of `ResizeObserver`?"
  back: "When toggling classes by a container's width. That is what container queries are for."
  question: browser/observers/resize-observer
- id: ro-error-event-shape
  front: "How does the loop `ErrorEvent` differ between Chrome 156 and Firefox 159?"
  back: "Both: `lineno` 0, no `error` object. Chrome sets `filename` to the page URL and makes it cancelable; Firefox leaves `filename` empty and it isn't cancelable. Chrome 156 doesn't print it to the console."
  question: browser/observers/resize-observer
- id: ro-device-pixel
  front: "Why use `device-pixel-content-box`, and which browsers support it?"
  back: "For pixel-exact canvas sizing: it reports the content box in whole device pixels as the browser snapped it, which multiplying by `devicePixelRatio` can't reproduce. A 100.6 px-wide canvas reported 101 at DPR 1. Chrome 84 and Firefox 108 support it; Safari doesn't."
  question: browser/observers/resize-observer
- id: ro-removed-element
  front: "Does removing an observed element, or hiding it with `display: none`, produce an entry?"
  back: "Yes. Its size becomes 0 × 0, which differs from the last report. In Chrome 156 and Firefox 159 the box reported `0` after being hidden."
  question: browser/observers/resize-observer
- id: ro-deeper-exercise
  front: "With `outer` (height 100px) and a deeper `inner` both observed, and the callback setting `inner`'s height to 50px, what happens?"
  back: "`outer 100, inner 0`, then `inner 50`, with no error: `inner` is deeper than `outer`, so it is re-delivered in the same frame. Without `outer`'s fixed height, the loop error occurs and `outer 50` arrives a frame later. Chrome 156 and Firefox 159 agree."
  question: browser/observers/resize-observer
- id: mo-observe-options
  front: "What options does `MutationObserver.observe()` take, and what if none of the types is set?"
  back: "`childList`, `attributes` (narrowed by `attributeFilter`), `characterData`, `subtree`, `attributeOldValue` and `characterDataOldValue`. At least one type is required or `observe()` throws a `TypeError`; the old-value options and `attributeFilter` imply their type."
  question: browser/observers/mutation-observer
- id: mo-batching
  front: "How does `MutationObserver` batch changes?"
  back: "Each mutation appends a `MutationRecord` to each matching observer's queue; the first one queues a single microtask. At the next checkpoint, each observer is called once with all its records, so 100 `append()` calls give one callback with 100 records."
  question: browser/observers/mutation-observer
- id: mo-not-mid-code
  front: "Can a `MutationObserver` callback run in the middle of your code?"
  back: "No. It runs at the next microtask checkpoint, after the current script returns, in observer creation order."
  question: browser/observers/mutation-observer
- id: mo-dom-operations-only
  front: "Does setting `input.value` or `input.checked` produce a mutation record?"
  back: "No. Records describe DOM operations, not values; a property that doesn't reflect an attribute changes no DOM. Setting an attribute to the value it already has still produces a record."
  question: browser/observers/mutation-observer
- id: mo-movebefore
  front: "What records does `moveBefore()` produce?"
  back: "Two `childList` records, a removal and an insertion. `moveBefore()` shipped in Chrome 133 and Firefox 144, not Safari."
  question: browser/observers/mutation-observer
- id: mo-takerecords-disconnect
  front: "What do `takeRecords()` and `disconnect()` do to pending records?"
  back: "`takeRecords()` returns and empties the queue; `disconnect()` stops observing and discards pending records. Call `takeRecords()` first if you need them."
  question: browser/observers/mutation-observer
- id: mo-attributechangedcallback
  front: "How does `attributeChangedCallback` differ from a `MutationObserver`?"
  back: "Custom elements that only care about their own attributes use `attributeChangedCallback`, which runs synchronously before `setAttribute()` returns."
  question: browser/observers/mutation-observer
- id: mo-mutation-events-removed
  front: "What happened to legacy mutation events like `DOMNodeInserted`?"
  back: "They fired synchronously for every change. They were removed in Chrome 127, Firefox 140 and Safari 26."
  question: browser/observers/mutation-observer
- id: mo-example-output
  front: "In the example with 100 `append()` calls, `list.id`, `input.value` and `setAttribute('value')`, what does the callback log?"
  back: "`sync code done` first, then `102 records, attributes: id (was null), value (was null)`, then the later-queued microtask. The `input.value` assignment made no record. Same in Chrome 156 and Firefox 159."
  question: browser/observers/mutation-observer
- id: mo-callback-reentry
  front: "What happens if a `MutationObserver` callback mutates observed nodes without a guard?"
  back: "Each change queues another microtask in the same checkpoint, so the callback re-enters before any timer or rendering; unbounded, it freezes the page. With a guard of five changes, all five callbacks ran before a `setTimeout(fn, 0)` in both browsers."
  question: browser/observers/mutation-observer
- id: mo-characterdata-subtree
  front: "Why does `characterData: true` on an element not see its text change?"
  back: "The data belongs to the child `Text` node, so you also need `subtree: true`."
  question: browser/observers/mutation-observer
- id: mo-heavy-subtree
  front: "What is the risk of observing `document` with `subtree: true`?"
  back: "Rendering a long list produces one record per inserted node, so heavy per-record work is costly. Filter by `type` and `target` early."
  question: browser/observers/mutation-observer
- id: mo-why-not-per-mutation
  front: "Why batch mutations instead of one callback per mutation?"
  back: "Mutation events were synchronous and fired mid-operation, so handlers saw half-updated DOM and slowed every change. Batching into a microtask gives a consistent tree and one call per script."
  question: browser/observers/mutation-observer
- id: mo-textcontent-one-record
  front: "What does `el.textContent = 'flat'` record on an element with 101 children?"
  back: "One `childList` record with 101 `removedNodes` and one added text node. `innerHTML` likewise gives one record for the whole replacement."
  question: browser/observers/mutation-observer
- id: mo-observer-order
  front: "In what order do two `MutationObserver`s run?"
  back: "Creation order, not `observe()` order: an observer created first was called first even though it called `observe()` second, in Chrome 156 and Firefox 159."
  question: browser/observers/mutation-observer
- id: mo-agent-shared
  front: "What do same-origin iframes share regarding mutation observer delivery?"
  back: "The flag, the set of pending observers and a creation counter live on the similar-origin window agent, so same-origin iframes share one mutation observer microtask."
  question: browser/observers/mutation-observer
- id: mo-transient-observers
  front: "How are changes inside a removed subtree still reported?"
  back: "Removing a node from an observed subtree adds a transient registered observer to it, which lasts until the next notification. In Chrome 156 and Firefox 159 an attribute change in the same task produced a record; in a later task it produced none."
  question: browser/observers/mutation-observer
- id: mo-edge-records
  front: "In Chrome 156 and Firefox 159, how many records do `el.className = 'x'` twice, and `el.dataset.k = '1'` with `el.style.color = 'red'`, produce?"
  back: "`className` twice: two `attributes` records (old values `null`, `'x'`). `dataset.k` and `style.color` give `data-k` and `style` attribute records."
  question: browser/observers/mutation-observer
- id: mo-attributes-false-oldvalue
  front: "What does `observe(node, { attributes: false, attributeOldValue: true })` do?"
  back: "It throws a `TypeError`, as does `{}` or `{ subtree: true }` alone. Both Chrome 156 and Firefox 159 agree."
  question: browser/observers/mutation-observer
- id: mo-append-last-child
  front: "What records does `b.append(n)` produce when `n` is already `b`'s last child?"
  back: "A removal and an insertion, both on `b` (Chrome 156 and Firefox 159)."
  question: browser/observers/mutation-observer
- id: mo-takerecords-exercise
  front: "After `append('a')`, `takeRecords()`, `append('b')`, `disconnect()`, `append('c')`, what is logged?"
  back: "Only `taken 1`. `takeRecords()` emptied the queue after `'a'`; `disconnect()` discarded the record for `'b'`; `'c'` came after disconnecting. The microtask ran, but an observer with no records isn't called."
  question: browser/observers/mutation-observer
- id: ot-three-places
  front: "Where in the event loop does each observer deliver?"
  back: "`MutationObserver` is a microtask, run right after the script returns. `ResizeObserver` runs inside the rendering update, after layout and before paint. `IntersectionObserver` entries are computed in that update but the callback is a separate task after the frame."
  question: browser/observers/observer-timing
- id: ot-mo-microtask
  front: "When does a `MutationObserver` callback run, and does rendering matter?"
  back: "At the next microtask checkpoint, when the current script, listener or callback returns to an empty stack. Rendering isn't involved, so it runs in hidden pages too."
  question: browser/observers/observer-timing
- id: ot-mo-click
  front: "How does `MutationObserver` timing differ for a real click versus `el.click()`?"
  back: "In a real click it runs between listeners (`listener 1, MO, listener 2, MO`). After `el.click()` it waits until the whole dispatch returns (`listener 1, listener 2, click() returned, MO`). Chrome 156 and Firefox 159 agree."
  question: browser/observers/observer-timing
- id: ot-ro-in-update
  front: "What is the order inside the rendering update for `ResizeObserver`?"
  back: "After animation frame callbacks, the browser runs style and layout, delivers resize observations, then repeats layout for deeper elements those callbacks resized. All before paint, so changes appear in the same frame."
  question: browser/observers/observer-timing
- id: ot-ro-checkpoint
  front: "What runs between two `ResizeObserver` callbacks if one triggers a mutation?"
  back: "A microtask checkpoint follows each callback, so a mutation observer triggered there runs before the next resize observer. Two resize observers logged `RO 1, MO, RO 2, IO` in Chrome 156 and Firefox 159."
  question: browser/observers/observer-timing
- id: ot-io-after-paint
  front: "When does an `IntersectionObserver` callback run relative to paint?"
  back: "Intersections are computed after the resize loop, then one *notify intersection observers* task is queued. It runs after the update finishes, so after that frame is painted, and other tasks can run first. Changes made there show in the next frame."
  question: browser/observers/observer-timing
- id: ot-initial-notifications
  front: "When do `ResizeObserver` and `IntersectionObserver` deliver their first entries?"
  back: "In the first rendering update after `observe()`. The IntersectionObserver spec stops the browser from skipping that update while a target still awaits its first entry. `MutationObserver` has no initial call."
  question: browser/observers/observer-timing
- id: ot-hidden-chrome
  front: "In Chrome 156, what happened to observer callbacks for a background tab?"
  back: "A size change and an intersection change produced no `ResizeObserver` or `IntersectionObserver` callback for 3 s; both arrived within 0.5 s of the tab becoming visible. The `MutationObserver` callback ran immediately."
  question: browser/observers/observer-timing
- id: ot-hidden-firefox
  front: "In Firefox 159, how did a background tab differ from Chrome 156 for observers?"
  back: "Firefox still ran 2 animation frames in 3 s and delivered the `ResizeObserver` and `IntersectionObserver` callbacks in them. The `MutationObserver` callback ran immediately in both."
  question: browser/observers/observer-timing
- id: ot-combined-order
  front: "In the example with a mutation, promise, rAF, resize and intersection observer, what order is logged?"
  back: "`script end, MutationObserver, promise, rAF, ResizeObserver, timer, IntersectionObserver`. Same in Chrome 156 and Firefox 159, 15 runs each. The mutation microtask was queued before the promise reaction."
  question: browser/observers/observer-timing
- id: ot-timer-before-io
  front: "Is a timer queued in a `ResizeObserver` callback guaranteed to run before the `IntersectionObserver` callback?"
  back: "No. It did in every run in Chrome 156 and Firefox 159, but no spec guarantees the order between those two tasks; it is implementation order."
  question: browser/observers/observer-timing
- id: ot-io-same-frame
  front: "Why not toggle visible content from an `IntersectionObserver` callback to affect the current frame?"
  back: "The callback runs after that frame's paint. For same-frame adjustments, use `ResizeObserver` or `requestAnimationFrame`."
  question: browser/observers/observer-timing
- id: ot-io-background-impressions
  front: "Why check `document.visibilityState` when counting impressions with `IntersectionObserver`?"
  back: "Chrome delays the entries in background tabs until the tab is visible."
  question: browser/observers/observer-timing
- id: ot-raf-before-observers
  front: "Do changes made in `requestAnimationFrame` show up in that frame's observer entries?"
  back: "Yes. Animation frame callbacks run before the style and layout loop, so sizes and intersections are computed from the DOM they left."
  question: browser/observers/observer-timing
- id: ot-canvas-backing-store
  front: "Which observer sizes a canvas's backing store, and why?"
  back: "`ResizeObserver` with `box: 'device-pixel-content-box'`: it runs after layout and before paint, so you can resize and redraw without a stretched frame."
  question: browser/observers/observer-timing
- id: ot-mo-flag-checkpoints
  front: "Where do microtask checkpoints run in the browser's observer delivery?"
  back: "After every callback the browser invokes from an empty stack: each event listener during a user-dispatched event, each animation frame callback, each observer callback, and after every task. Any number of mutations before the next checkpoint share one mutation microtask."
  question: browser/observers/observer-timing
- id: ot-ro-loop-leftovers
  front: "What happens to resize observations left over after the depth loop?"
  back: "Each pass can only deliver elements deeper than the last, so the loop ends. Leftover observations make the browser report the loop error and wait for the next frame."
  question: browser/observers/observer-timing
- id: ot-io-task-source
  front: "How is the intersection observer task queued?"
  back: "Queuing the first entry for a document queues an intersection observer task on the IntersectionObserver task source, guarded by a per-document flag. Painting happens at the end of the update; the task can only run once the update is done."
  question: browser/observers/observer-timing
- id: ot-io-update-position
  front: "Where in the rendering update do intersections get computed?"
  back: "Later in the same update, after focus fix-up and view transition steps, *run the update intersection observations steps* computes every target and queues entries."
  question: browser/observers/observer-timing
- id: ot-mo-in-ro-edge
  front: "In a `ResizeObserver` callback that mutates an observed attribute, when does the `MutationObserver` run?"
  back: "Before the next resize observer. In a background tab in Chrome 156, MO runs immediately while RO and IO wait until the tab is visible; in Firefox 159 they run in the next throttled frame."
  question: browser/observers/observer-timing
- id: ot-mo-expect-next-line
  front: "Should you expect a `MutationObserver` callback to have run by the next line?"
  back: "No. It's a microtask: it runs after the current script returns, never in the middle of it."
  question: browser/observers/observer-timing
