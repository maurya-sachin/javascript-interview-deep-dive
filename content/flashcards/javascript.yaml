# 01 How JavaScript runs
- id: ecmascript-vs-host-apis
  front: "Which layer defines `setTimeout`, `console` and `fetch`: the ECMAScript spec or the host?"
  back: "The host. ECMA-262 defines none of them. Hosts (browsers, Node.js, Deno, Bun) embed an engine and supply timers, `console`, the DOM, `fetch` and the event loop."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: bare-engine-test
  front: "What quick test tells you whether a feature is ECMAScript or a host API?"
  back: "Ask whether it would exist in a bare engine shell with no host. `Array.prototype.map` would; `setTimeout` would not."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: host-hook-definition
  front: "What is a host hook in the ECMAScript spec?"
  back: "An abstract operation whose behaviour the host supplies, marking where the spec is deliberately incomplete. Example: `HostEnqueuePromiseJob` decides how a promise reaction becomes a queued Job."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: event-loop-not-ecmascript
  front: "Is the event loop part of ECMAScript?"
  back: "No. The spec defines Jobs and the hooks that enqueue them. The event loop, task queues and timer-versus-I/O ordering are defined by the host (HTML Standard, or libuv-based code in Node.js)."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: node-is-not-v8
  front: "Why is 'Node.js' not a synonym for 'V8'?"
  back: "V8 is the engine. Node.js is a host built on V8 that adds libuv-backed I/O, `require` and its own module loader."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: tc39-stage-3-meaning
  front: "What happens at TC39 Stage 3, and is the proposal final?"
  back: "Stage 3 is implementation and feedback: engines implement and may ship, sometimes behind a flag. It is not final; feedback can still change or stall the proposal."
  question: javascript/how-javascript-runs/tc39-process
- id: tc39-stage-4-bar
  front: "What does a proposal need to reach TC39 Stage 4?"
  back: "Two compatible implementations passing test262, real shipping experience, and editor approval. It is then merged into the spec draft."
  question: javascript/how-javascript-runs/tc39-process
- id: tc39-stage-2-7
  front: "What is TC39 Stage 2.7?"
  back: "Testing and validation. The spec text is complete and signed off by reviewers and editors, the design is frozen apart from changes found through testing, and tests are written."
  question: javascript/how-javascript-runs/tc39-process
- id: stage-4-not-available
  front: "Does a Stage 4 feature mean it works in your users' browsers?"
  back: "No. Stage 4 means the spec is settled. Each engine and host ships on its own schedule, so check real support (MDN compatibility data, `caniuse`) for your targets."
  question: javascript/how-javascript-runs/tc39-process
- id: v8-pipeline-stages
  front: "What is V8's execution pipeline for JavaScript, from source to optimized code?"
  back: "Parse to an AST, compile to bytecode run by the Ignition interpreter, then tier up hot functions through Sparkplug (baseline), Maglev (mid-tier) and TurboFan (top-tier optimizer)."
  question: javascript/how-javascript-runs/compiled-or-interpreted
- id: deoptimization-meaning
  front: "What is deoptimization in a JIT engine?"
  back: "Optimized machine code rests on assumptions from collected type feedback. When one breaks, for example a function receives a different type, the engine discards that code and falls back to a lower tier."
  question: javascript/how-javascript-runs/compiled-or-interpreted
- id: early-errors-at-parse
  front: "When are syntax errors and early errors, such as duplicate `let`, reported?"
  back: "At parse time, before any code runs, even inside a function that is never called."
  question: javascript/how-javascript-runs/compiled-or-interpreted
- id: why-not-optimize-everything
  front: "Why do engines start in an interpreter instead of optimizing everything up front?"
  back: "Optimizing is slow and costs memory, and most code runs once. Interpreting first keeps startup fast; only hot code earns the expensive tiers."
  question: javascript/how-javascript-runs/compiled-or-interpreted
- id: script-module-top-level-this
  front: "What is top-level `this` in a classic script versus an ES module?"
  back: "In a script it is the global object. In a module it is `undefined`."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: module-top-level-var-scope
  front: "Does a top-level `var` in a module become a property of `globalThis`?"
  back: "No. A module has its own scope. In a classic script, top-level `var` and function declarations become global object properties."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: module-evaluated-once
  front: "How many times is a module evaluated if it is imported from several places?"
  back: "Once per resolved URL. Later imports reuse the same module instance. A script is evaluated every time it is run or included."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: live-bindings-definition
  front: "What is a live binding in ES modules?"
  back: "An imported name is a read-only view of the exporting module's variable, not a copy. If the exporter reassigns an exported `let`, importers see the new value; they cannot assign to it."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: script-can-use-dynamic-import
  front: "Can a classic script load an ES module, and how?"
  back: "Yes, through dynamic `import()`, which returns a promise and is allowed in both goals. Static `import` declarations are a syntax error in a script."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: strict-undeclared-assignment
  front: "What does assigning to an undeclared name do in strict mode versus sloppy mode?"
  back: "Strict mode throws `ReferenceError`. Sloppy mode silently creates a global variable."
  question: javascript/how-javascript-runs/strict-mode
- id: strict-this-plain-call
  front: "What is `this` in a plain function call in strict mode?"
  back: "`undefined`, and a primitive `this` stays a primitive. Sloppy mode substitutes `globalThis` or a wrapper object."
  question: javascript/how-javascript-runs/strict-mode
- id: strict-automatic-contexts
  front: "Which code is strict automatically, without a `'use strict'` directive?"
  back: "Module code, class bodies (all methods, accessors, fields and static blocks), and code nested inside strict code."
  question: javascript/how-javascript-runs/strict-mode
- id: use-strict-directive-position
  front: "Where must `'use strict'` appear for it to take effect?"
  back: "As the first statement of a script or function body (comments are fine). After another statement it is just an expression statement and does nothing."
  question: javascript/how-javascript-runs/strict-mode
- id: strict-arguments-unmapped
  front: "What does it mean that `arguments` is unmapped in strict mode?"
  back: "It no longer aliases the named parameters, so writing one does not change the other. In sloppy functions with simple parameters they share storage. `arguments.callee` throws in strict mode."
  question: javascript/how-javascript-runs/strict-mode
- id: polyfill-vs-transpiler-split
  front: "What is the rule of thumb for polyfills versus transpilers?"
  back: "New syntax is transpiled at build time; new built-ins (APIs) are polyfilled at run time."
  question: javascript/how-javascript-runs/polyfill-vs-transpiler
- id: polyfill-cannot-fix-syntax
  front: "Why can a polyfill not fix a `SyntaxError` from new syntax like `??`?"
  back: "An engine that cannot parse the syntax throws for the whole file, so no run-time code gets to execute. A transpiler must rewrite the syntax before shipping."
  question: javascript/how-javascript-runs/polyfill-vs-transpiler
- id: ponyfill-definition
  front: "What is a ponyfill?"
  back: "A module that exports a feature as a function instead of modifying globals, so it never changes the environment. Callers must import and use it explicitly."
  question: javascript/how-javascript-runs/polyfill-vs-transpiler
- id: browserslist-targets-purpose
  front: "What do target environments (Browserslist, esbuild `target`) control?"
  back: "Which transforms and polyfills are applied: only those the listed engines lack. A wider target means larger, slower output."
  question: javascript/how-javascript-runs/polyfill-vs-transpiler

# 02 Values and types
- id: eight-language-types
  front: "Name the eight ECMAScript language types."
  back: "Undefined, Null, Boolean, String, Symbol, Number, BigInt and Object. The first seven are primitives. Functions, arrays and dates are all Object."
  question: javascript/values-and-types/language-types
- id: primitives-compare-by-value
  front: "How do primitives and objects differ in comparison and mutability?"
  back: "Primitives are immutable and compare by value. Objects compare by identity: `{} === {}` is `false`, because each literal creates a new object."
  question: javascript/values-and-types/language-types
- id: typeof-null-historical
  front: "Why is `typeof null` equal to `'object'`?"
  back: "A historical mistake. In the first implementation values had a type tag, the object tag was 0 and `null` was the NULL pointer. A fix was proposed and rejected, so the spec now states the result explicitly."
  question: javascript/values-and-types/typeof-null
- id: null-is-primitive
  front: "Is `null` an object despite `typeof null`?"
  back: "No. It is a primitive with exactly one value. Reading a property throws `TypeError`, `null instanceof Object` is `false`, and it has no wrapper."
  question: javascript/values-and-types/typeof-null
- id: non-null-object-check
  front: "How do you test for a non-null object-like value with `typeof`?"
  back: "`value !== null && typeof value === 'object'`. Functions report `'function'`, so add `|| typeof value === 'function'` if they should count."
  question: javascript/values-and-types/typeof-null
- id: document-all-typeof
  front: "What is the surprising `typeof` of `document.all`?"
  back: "`'undefined'`, although it is an object. Once a willful violation of the original ECMAScript standard, it is now allowed by the spec through the `[[IsHTMLDDA]]` internal slot."
  question: javascript/values-and-types/typeof-null
- id: undefined-vs-null-origin
  front: "Who produces `undefined` and who produces `null`?"
  back: "The language produces `undefined` (unassigned variable, missing argument or property, no `return`). `null` mostly comes from program code, JSON and host APIs such as `querySelector`; the language yields it in few places, such as the end of the prototype chain."
  question: javascript/values-and-types/null-vs-undefined
- id: default-parameter-null
  front: "Does a default parameter value apply when the argument is `null`?"
  back: "No. Defaults apply only to `undefined`. `greet(null)` keeps `null`."
  question: javascript/values-and-types/null-vs-undefined
- id: null-undefined-number-conversion
  front: "What do `Number(null)` and `Number(undefined)` return?"
  back: "`Number(null)` is `0` and `Number(undefined)` is `NaN`."
  question: javascript/values-and-types/null-vs-undefined
- id: null-undefined-json
  front: "How does `JSON.stringify` treat `null` and `undefined`?"
  back: "It keeps `null`, drops an `undefined` object property, and turns an `undefined` array element into `null`."
  question: javascript/values-and-types/null-vs-undefined
- id: missing-vs-undefined-property
  front: "How do you tell a missing property from one explicitly set to `undefined`?"
  back: "Use `'key' in obj` or `Object.hasOwn(obj, 'key')`. `obj.key === undefined` cannot tell them apart."
  question: javascript/values-and-types/null-vs-undefined
- id: null-relational-inconsistency
  front: "Why are `null == 0` false but `null >= 0` true?"
  back: "`==` has a dedicated rule: `null` equals only `undefined`. Relational operators use `ToNumber`, which makes `null` into `0`, so `null >= 0` is `true` while `null > 0` is `false`."
  question: javascript/values-and-types/null-vs-undefined
- id: auto-boxing-mechanism
  front: "How does `'abc'.toUpperCase()` work if primitives have no properties?"
  back: "Property access calls `ToObject` on the primitive, creating a temporary String wrapper. The lookup finds the method on `String.prototype`, calls it with the primitive as `this`, and the wrapper is discarded."
  question: javascript/values-and-types/primitive-wrappers
- id: primitive-property-write-lost
  front: "What happens when you write `str.foo = 1` on a string primitive?"
  back: "Nothing is stored. The `[[Set]]` receiver is the primitive, not a wrapper, and ordinary `[[Set]]` won't create a property on a non-object. Strict mode throws `TypeError`; sloppy mode silently ignores it."
  question: javascript/values-and-types/primitive-wrappers
- id: null-undefined-no-wrapper
  front: "Why does `undefined.x` throw?"
  back: "`ToObject` throws `TypeError` for `null` and `undefined`; they have no wrapper type."
  question: javascript/values-and-types/primitive-wrappers
- id: new-boolean-false-truthy
  front: "Why is `new Boolean(false)` truthy, and what do `String(x)` and `new String(x)` return?"
  back: "`new Boolean(false)` is an object, and every object is truthy. Without `new`, `String(x)` is a plain conversion returning a primitive; `new String(x)` returns an object."
  question: javascript/values-and-types/primitive-wrappers
- id: sloppy-this-primitive-boxed
  front: "What does `this` hold when a function is called on a primitive in sloppy versus strict mode?"
  back: "A sloppy function receives a wrapper object (`typeof this` is `'object'`). A strict function receives the primitive unchanged."
  question: javascript/values-and-types/primitive-wrappers
- id: js-pass-by-value
  front: "Is JavaScript pass-by-reference for objects?"
  back: "No. Everything is passed by value. An object value is a reference, so the callee gets a copy of that reference (pass by sharing)."
  question: javascript/values-and-types/pass-by-sharing
- id: mutate-vs-reassign-parameter
  front: "Why does mutating an object parameter affect the caller but reassigning it does not?"
  back: "Mutation follows the shared reference to the same object. Reassigning only repoints the callee's local binding; the caller's variable is untouched."
  question: javascript/values-and-types/pass-by-sharing
- id: swap-impossible
  front: "Why can a `swap(a, b)` function not exchange the caller's variables in JavaScript?"
  back: "The callee never receives the caller's bindings, only the values they held. True pass-by-reference would be required."
  question: javascript/values-and-types/pass-by-sharing
- id: spread-shallow-copy
  front: "Is a spread or `Object.assign` copy independent of the original?"
  back: "Only at the top level. It copies the references held by the properties, so nested objects and arrays are shared. Use `structuredClone` for a deep copy."
  question: javascript/values-and-types/pass-by-sharing
- id: symbol-uniqueness
  front: "What is the purpose of a Symbol, and is `Symbol('id') === Symbol('id')`?"
  back: "A Symbol is a unique, immutable primitive used as a collision-free property key. The comparison is `false`; the description is only a label."
  question: javascript/values-and-types/symbols
- id: symbol-keys-not-private
  front: "Are symbol-keyed properties private?"
  back: "No. They are hidden from `Object.keys`, `for...in` and `JSON.stringify`, but `Object.getOwnPropertySymbols` and `Reflect.ownKeys` reveal them. Use `#private` fields for real encapsulation."
  question: javascript/values-and-types/symbols
- id: symbol-for-registry
  front: "How do `Symbol('x')`, `Symbol.for('x')` and `Symbol.keyFor` differ?"
  back: "`Symbol('x')` always makes a new symbol. `Symbol.for('x')` returns the shared registry symbol, creating it if needed. `Symbol.keyFor` returns `undefined` for an unregistered symbol."
  question: javascript/values-and-types/symbols
- id: symbol-string-conversion
  front: "What happens when a Symbol is implicitly converted to a string, as in a template literal?"
  back: "It throws `TypeError`. Use `String(sym)` or `sym.description` instead. `new Symbol()` also throws."
  question: javascript/values-and-types/symbols
- id: well-known-symbols
  front: "What are well-known symbols such as `Symbol.iterator` and `Symbol.toPrimitive` for?"
  back: "They are keys the engine looks up to customise language behaviour: `for...of`, `instanceof`, type conversion and `Object.prototype.toString`."
  question: javascript/values-and-types/symbols
- id: array-isarray-branded
  front: "Why prefer `Array.isArray` over `instanceof Array`?"
  back: "`Array.isArray` checks the internal array slot, so it works across realms (iframes, `vm`) and is not fooled by `{ __proto__: Array.prototype }`. `instanceof` checks the prototype chain and breaks across realms."
  question: javascript/values-and-types/type-checking
- id: instanceof-primitives-false
  front: "What does `'s' instanceof String` return, and what can customise `instanceof`?"
  back: "`false`, since primitives are never instances. A `Symbol.hasInstance` method on the right-hand side overrides the default prototype-chain check."
  question: javascript/values-and-types/type-checking
- id: tostring-tag-unreliable
  front: "Why is `Object.prototype.toString.call(v)` not a reliable type check for your own classes?"
  back: "For non-built-in objects it returns the value of `Symbol.toStringTag` if it is a string, and any class can set that to anything."
  question: javascript/values-and-types/type-checking
- id: global-isnan-coerces
  front: "Why prefer `Number.isNaN` over the global `isNaN`?"
  back: "Global `isNaN` coerces its argument first, so `isNaN('x')` is `true`. `Number.isNaN` does not coerce."
  question: javascript/values-and-types/type-checking

# 03 Numbers and BigInt
- id: number-is-binary64
  front: "What format is every JavaScript `Number`?"
  back: "An IEEE 754 binary64 double: 64 bits with a 52-bit fraction, giving 53 significant bits (about 15 to 17 decimal digits)."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: point-one-not-representable
  front: "Why is `0.1 + 0.2 !== 0.3`?"
  back: "`0.1` is a repeating fraction in binary, so each literal is rounded to the nearest double. The exact sum rounds to `0.30000000000000004`, one step above the double for `0.3`."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: epsilon-meaning
  front: "What is `Number.EPSILON`, and when is it a sensible tolerance?"
  back: "The gap between `1` and the next double (`2 ** -52`). It suits only values near `1`; for other magnitudes scale it by the operands."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: shortest-roundtrip-printing
  front: "Why does `console.log(0.1)` print `0.1` if the stored value is not exactly `0.1`?"
  back: "Number-to-string conversion prints the shortest decimal that round-trips to the same double, not the exact stored value."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: float-addition-not-associative
  front: "Is floating-point addition associative? Give an example."
  back: "No. It is commutative but not associative: `0.1 + 0.2 + 0.3` is `0.6000000000000001`, while `0.3 + 0.2 + 0.1` is `0.6`."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: tofixed-uses-stored-value
  front: "Why is `(1.005).toFixed(2)` equal to `'1.00'`?"
  back: "`toFixed` works on the stored value, and the closest double to `1.005` is slightly below it."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: nan-self-inequality
  front: "Why can `x === NaN` never work, and what should you use?"
  back: "Every comparison with `NaN` is `false`; it is the only value where `x !== x`. Use `Number.isNaN(x)`."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: sources-of-nan
  front: "Which operations produce `NaN`?"
  back: "Invalid operations such as `0 / 0`, `Math.sqrt(-1)`, `Infinity - Infinity` and `Number('abc')`."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: negative-zero-detection
  front: "How can you detect `-0`, given that `0 === -0` is true?"
  back: "`Object.is(x, -0)`, or `x === 0 && 1 / x === -Infinity`. Dividing by `-0` gives `-Infinity`."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: negative-zero-serialization
  front: "What do `String(-0)` and `JSON.stringify(-0)` return?"
  back: "Both give `0`; the sign is lost on serialization. `console.log` and `Object.is` still show it."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: division-by-zero-results
  front: "What do `1 / 0` and `1 / -0` give?"
  back: "`Infinity` and `-Infinity`. Infinities also result from overflow. `Number.isFinite` is `false` for `NaN` and both infinities."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: max-safe-integer-range
  front: "What is the safe integer range, and why does it end there?"
  back: "`-(2 ** 53 - 1)` to `2 ** 53 - 1`. A Number has a 53-bit significand; `2 ** 53 + 1` rounds to `2 ** 53`, so the two are indistinguishable."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: bigint-number-mixing
  front: "What happens on `1n + 1`, and how do `==`, `===` and `<` treat BigInt and Number?"
  back: "Arithmetic throws `TypeError`; convert explicitly. Comparisons may mix: `1n == 1` and `1n < 1.5` are `true`, but `1n === 1` is `false` because the types differ."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: bigint-division-truncates
  front: "What does BigInt division do with remainders?"
  back: "It truncates toward zero: `5n / 2n` is `2n` and `-5n / 2n` is `-2n`."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: bigint-unsupported-operations
  front: "Which operations throw on a BigInt?"
  back: "`Math.*` methods, unary `+`, `>>>`, and `JSON.stringify`. `BigInt(1.5)` throws `RangeError`."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: json-parse-large-id
  front: "What happens to `JSON.parse('{\"id\":9007199254740993}').id`?"
  back: "It is read as a Number and silently rounds to `9007199254740992`. Have APIs send big IDs as strings and convert with `BigInt(string)`."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: bigint-asintn
  front: "What does `BigInt.asIntN(64, x)` do?"
  back: "Keeps the low 64 bits of `x` and reads them as a two's-complement signed integer, so `2n ** 63n` wraps to `-(2n ** 63n)`. `asUintN` reads them as unsigned."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: number-empty-string-zero
  front: "What do `Number('')` and `Number('   ')` return?"
  back: "`0`, not `NaN`. This is the classic trap with empty form fields; check for empty input first."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: number-vs-parseint-trailing
  front: "How do `Number('42px')` and `parseInt('42px', 10)` differ?"
  back: "`Number` converts the whole string and returns `NaN` on trailing junk. `parseInt` reads the longest valid prefix and returns `42`."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: map-parseint-pitfall
  front: "Why does `['1', '2', '3'].map(parseInt)` return `[1, NaN, NaN]`?"
  back: "`map` passes the index as the second argument, which `parseInt` reads as the radix. `parseInt('2', 1)` is `NaN`. Use `map(Number)`."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: parseint-radix-default
  front: "What radix does `parseInt` use when you omit it?"
  back: "A `0x` prefix means hexadecimal; everything else is decimal. Always pass a radix: `parseInt(s, 10)`."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: parseint-stringifies-number
  front: "Why does `parseInt(0.0000005)` return `5`?"
  back: "The argument is converted to a string first, giving `'5e-7'`, and the parser reads the prefix `5`. Use `Math.trunc` for numbers."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: number-vs-unary-plus-bigint
  front: "How do `Number(1n)` and `+1n` differ?"
  back: "`Number(1n)` returns `1`; unary `+1n` throws `TypeError`."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: naive-sum-absorption
  front: "Why does `[1e20, 0.1, -1e20]` sum to `0` with a plain loop?"
  back: "`1e20 + 0.1` rounds back to `1e20` because doubles near `1e20` are spaced far wider than `0.1`, so the small term is lost before the large ones cancel."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-single-rounding
  front: "How does `Math.sumPrecise` differ from a naive sum?"
  back: "It sums as if with exact mathematical values, then rounds once to the nearest double, instead of rounding after every addition."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-signature
  front: "What input does `Math.sumPrecise` accept, and what does an empty input return?"
  back: "One iterable of Numbers (not variadic arguments); other types throw `TypeError`. An empty iterable gives `-0`, the floating-point additive identity."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-availability
  front: "Can you call `Math.sumPrecise` unguarded in portable code?"
  back: "No. It is Stage 3 and not available in Node 24 (`typeof` is `'undefined'`). Feature-detect it and fall back, for example to Neumaier compensated summation."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-input-error
  front: "Does `Math.sumPrecise([0.1, 0.2])` return `0.3`?"
  back: "No, it returns `0.30000000000000004`. It removes accumulated rounding error, not the representation error already in the inputs."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-empty-negative-zero
  front: "Why is `-0` the additive identity for floating-point addition?"
  back: "`-0 + x` is `x` for every `x`, including `-0`, whereas `0 + -0` is `0`."
  question: javascript/numbers-and-bigint/math-sumprecise

# 04 Strings and Unicode
- id: string-is-utf16-code-units
  front: "What does a JavaScript string's `length` count?"
  back: "UTF-16 code units (16-bit elements), not characters or code points. `'😀'.length` is `2`."
  question: javascript/strings-and-unicode/utf16-string-length
- id: surrogate-pair-ranges
  front: "What are the surrogate ranges that form a surrogate pair?"
  back: "A leading (high) surrogate `0xD800` to `0xDBFF` followed by a trailing (low) surrogate `0xDC00` to `0xDFFF`. Code points above U+FFFF are stored this way."
  question: javascript/strings-and-unicode/utf16-string-length
- id: units-vs-code-points-apis
  front: "Which string APIs work on code units and which on code points?"
  back: "Units: `length`, indexing, `at`, `charAt`, `charCodeAt`, `slice`, `split('')`. Code points: the string iterator (`for...of`, spread, `Array.from`) and `codePointAt`."
  question: javascript/strings-and-unicode/utf16-string-length
- id: codepointat-lone-trailing
  front: "What does `codePointAt(i)` return when `i` points at a trailing surrogate?"
  back: "The lone trailing surrogate unit itself, not the full code point. It reads from the index you give it."
  question: javascript/strings-and-unicode/utf16-string-length
- id: utf16-length-vs-utf8-bytes
  front: "Does `length` equal a string's byte size?"
  back: "No. UTF-8 size differs: `new TextEncoder().encode('😀').length` is `4` while `'😀'.length` is `2`."
  question: javascript/strings-and-unicode/utf16-string-length
- id: three-text-levels
  front: "Name the three levels of text in JavaScript and the tool for each."
  back: "UTF-16 code unit (index loop), code point (`for...of`, spread, `codePointAt`), grapheme cluster (`Intl.Segmenter`)."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: grapheme-cluster-definition
  front: "What is a grapheme cluster?"
  back: "Unicode UAX #29's approximation of a user-perceived character. It can span several code points: `e` plus a combining accent, a flag (two regional indicators), or a family emoji joined by U+200D."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: spread-length-not-characters
  front: "Why is `[...s].length` not a count of user-visible characters?"
  back: "It counts code points. A family emoji is 5, a flag is 2 and a decomposed `é` is 2, each of which is one grapheme."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: segmenter-result-shape
  front: "What does `Intl.Segmenter.segment(text)` return, and what does each item contain?"
  back: "A lazy iterable `Segments` object, not an array. Each item is `{ segment, index, input }`, with `index` a UTF-16 offset. Construct the segmenter once and reuse it."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: segmenter-word-granularity
  front: "What does `Intl.Segmenter` with `granularity: 'word'` add?"
  back: "Each segment gets `isWordLike`, `true` for words and numbers and `false` for spaces and punctuation. It also handles languages written without spaces."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: lone-surrogate-definition
  front: "What is a lone surrogate, and is such a string valid?"
  back: "A leading surrogate not followed by a trailing one, or a trailing surrogate not preceded by a leading one. The string is legal in JavaScript but ill-formed UTF-16."
  question: javascript/strings-and-unicode/well-formed-strings
- id: towellformed-replacement
  front: "What does `toWellFormed()` do to a lone surrogate?"
  back: "Replaces it with U+FFFD and returns a new string (a copy even when nothing needed fixing). The fix is lossy and does not rejoin broken pairs."
  question: javascript/strings-and-unicode/well-formed-strings
- id: encodeuri-lone-surrogate
  front: "What does `encodeURIComponent` do with a lone surrogate?"
  back: "It throws `URIError`. By contrast `TextEncoder` substitutes U+FFFD and `JSON.stringify` escapes it, so those can silently pass the data through."
  question: javascript/strings-and-unicode/well-formed-strings
- id: reversed-pair-ill-formed
  front: "Is a trailing surrogate followed by a leading surrogate a valid pair?"
  back: "No. The order is wrong, so they are two lone surrogates and `isWellFormed()` returns `false`."
  question: javascript/strings-and-unicode/well-formed-strings
- id: tagged-template-call-shape
  front: "What arguments does a tag function receive for tag`a${x}b${y}c`?"
  back: "A frozen `strings` array of literal pieces (one more element than substitutions, with a frozen `strings.raw`), then the substitution values, not converted to strings."
  question: javascript/strings-and-unicode/tagged-templates
- id: tagged-template-site-caching
  front: "How often is the `strings` array of a tagged template created?"
  back: "Once per source location per realm, then cached. The same call site always passes the identical array; two textually identical templates at different sites get different arrays."
  question: javascript/strings-and-unicode/tagged-templates
- id: tagged-template-invalid-escape
  front: "How are invalid escapes like `\\unicode` handled in tagged versus untagged templates?"
  back: "An untagged template is a syntax error. In a tagged template the cooked piece is `undefined` and the raw text stays available in `strings.raw`."
  question: javascript/strings-and-unicode/tagged-templates
- id: string-raw-purpose
  front: "What does `String.raw` do?"
  back: "It is a built-in tag that joins the raw pieces (backslash sequences left as typed) with the substitutions converted to strings. Handy for Windows paths and regex source."
  question: javascript/strings-and-unicode/tagged-templates
- id: tagged-template-safety-benefit
  front: "Why do tagged templates enable safe-by-construction APIs?"
  back: "The tag sees the fixed text and the dynamic values separately, so it can escape or parameterize the values (HTML escaping, SQL placeholders). A plain template hands over only the merged string."
  question: javascript/strings-and-unicode/tagged-templates
- id: default-sort-code-unit-order
  front: "How do `<`, `===` and `sort()` without a comparator order strings?"
  back: "By code unit values, so uppercase ASCII sorts before lowercase and accented letters land after `z`. Use `Intl.Collator` for language-aware order."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: collator-compare-bound
  front: "Why can you pass `collator.compare` directly to `sort`?"
  back: "ECMA-402 defines `compare` as a getter returning a function already bound to the collator. Create the collator once and reuse it instead of calling `localeCompare` repeatedly."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: collator-numeric-option
  front: "What does `numeric: true` do in `Intl.Collator` options?"
  back: "It compares digit runs as numbers, so `file2` sorts before `file10`."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: collator-sensitivity-base
  front: "What does `sensitivity: 'base'` ignore?"
  back: "Case and accents: `a`, `A` and `á` compare as equal, which suits search."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: composed-vs-decomposed
  front: "Why is `'é'` (U+00E9) not `===` to `'e'` plus U+0301, and how do you fix the comparison?"
  back: "They are different code point sequences that render the same. Call `normalize()` on both sides (NFC by default) before comparing. `Intl.Collator` also treats them as equal."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: nfkc-lossy
  front: "When should you use NFKC or NFKD instead of NFC?"
  back: "Compatibility forms are lossy (`①` becomes `1`, `ﬁ` becomes `fi`). Use NFC for storage and equality, and compatibility forms only for search keys."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: compare-result-sign-only
  front: "What does `compare` guarantee about its return value?"
  back: "Only the sign. Do not assume exactly `-1`, `0` or `1`; engines may return other magnitudes."
  question: javascript/strings-and-unicode/locale-comparison-normalization

# 05 Coercion and equality
- id: loose-equality-null-undefined
  front: "What does `==` do with `null` and `undefined`?"
  back: "They are equal to each other and to nothing else, so `null == 0` is `false`. No rule converts `null` to a number, so that comparison falls through to `false`."
  question: javascript/coercion-and-equality/loose-equality
- id: loose-equality-boolean-first
  front: "How does `==` handle a Boolean operand?"
  back: "It converts the Boolean to a Number (`true` to `1`, `false` to `0`) and compares again. This happens before object conversion, so `[] == false` becomes `[] == 0`, then `'' == 0`."
  question: javascript/coercion-and-equality/loose-equality
- id: loose-equality-truthiness-never
  front: "Why is `'true' == true` false?"
  back: "`true` becomes `1` and `'true'` becomes `NaN`, so the comparison is `NaN == 1`. Truthiness is never consulted."
  question: javascript/coercion-and-equality/loose-equality
- id: loose-equality-not-transitive
  front: "Is `==` transitive? Give an example."
  back: "No. `'0' == 0` and `0 == ''` are `true`, but `'0' == ''` is `false` because two strings compare strictly."
  question: javascript/coercion-and-equality/loose-equality
- id: eq-null-idiom
  front: "Why is `x == null` the accepted use of `==`?"
  back: "Only `null` and `undefined` satisfy it, so it reads as an 'is nullish' check with no coercion surprises."
  question: javascript/coercion-and-equality/loose-equality
- id: loose-equality-bigint-string
  front: "How does `==` compare a BigInt with a String?"
  back: "It parses the string as a BigInt (`StringToBigInt`); if it is not a valid integer string the result is `false`. So `1n == '1'` is `true` and `2n == '2.5'` is `false`."
  question: javascript/coercion-and-equality/loose-equality
- id: falsy-values-list
  front: "List the exact falsy values in JavaScript."
  back: "`false`, `0`, `-0`, `0n`, `''`, `null`, `undefined` and `NaN`. Everything else is truthy. Browsers add one legacy falsy object, `document.all`."
  question: javascript/coercion-and-equality/truthy-falsy
- id: all-objects-truthy
  front: "Why are `[]`, `{}` and `new Boolean(false)` all truthy?"
  back: "`ToBoolean` is a pure lookup on the value's type. It never calls `valueOf` or `toString`, so every object is truthy."
  question: javascript/coercion-and-equality/truthy-falsy
- id: falsy-not-loosely-false
  front: "Is falsy the same as `== false`?"
  back: "No. `ToBoolean` is a lookup; `==` uses `IsLooselyEqual`. `null` is falsy but `null == false` is `false`; `'0'` is truthy but `'0' == false` is `true`."
  question: javascript/coercion-and-equality/truthy-falsy
- id: or-vs-nullish-default
  front: "How do `count || 10` and `count ?? 10` differ?"
  back: "`||` replaces any falsy value, including `0` and `''`. `??` replaces only `null` and `undefined`."
  question: javascript/coercion-and-equality/truthy-falsy
- id: logical-operators-return-operands
  front: "What do `&&` and `||` return?"
  back: "One of their operands, not a Boolean. `ToBoolean` only decides which operand to return, so `0 || null` is `null`."
  question: javascript/coercion-and-equality/truthy-falsy
- id: logical-assignment-short-circuits
  front: "Does `a ||= b` always invoke a setter on `a`?"
  back: "No. If the current value of `a` already decides the result, the spec returns early without assigning, so no setter runs."
  question: javascript/coercion-and-equality/truthy-falsy
- id: toprimitive-hints
  front: "Which hint does `ToPrimitive` get for template literals, unary `+` and binary `+`?"
  back: "Template literals and property keys use `'string'`. Unary `+`, `Number(x)` and relational operators use `'number'`. Binary `+` and `==` use `'default'`."
  question: javascript/coercion-and-equality/object-to-primitive
- id: ordinary-to-primitive-order
  front: "In what order does `OrdinaryToPrimitive` call methods?"
  back: "Hint `'string'`: `toString()` then `valueOf()`. Hints `'number'` and `'default'`: `valueOf()` then `toString()`. The first non-object result wins; if none, `TypeError`."
  question: javascript/coercion-and-equality/object-to-primitive
- id: date-default-hint-string
  front: "Why does `new Date() + 1` concatenate while `new Date() - 1` is numeric?"
  back: "`Date`'s built-in `Symbol.toPrimitive` treats the `'default'` hint as `'string'`. Subtraction uses the `'number'` hint."
  question: javascript/coercion-and-equality/object-to-primitive
- id: symbol-toprimitive-overrides
  front: "What happens if an object defines `Symbol.toPrimitive`?"
  back: "It is called with the hint and overrides `valueOf` and `toString` entirely. If it returns an object, `TypeError` is thrown at once."
  question: javascript/coercion-and-equality/object-to-primitive
- id: object-string-conversions
  front: "Why does `String({})` give `'[object Object]'` and `[] + []` give `''`?"
  back: "`valueOf` returns the object itself (not a primitive), so `toString` is used. `Object.prototype.toString` gives `'[object Object]'`; an empty array's `toString` joins nothing and gives `''`."
  question: javascript/coercion-and-equality/object-to-primitive
- id: plus-operator-rule
  front: "What is the rule for binary `+`?"
  back: "Convert both operands with `ToPrimitive`. If either is a String, convert the other with `ToString` and concatenate. Otherwise convert both with `ToNumeric` and add."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: plus-left-associative
  front: "Why is `1 + 2 + '3'` equal to `'33'` but `'3' + 1 + 2` equal to `'312'`?"
  back: "`+` is left associative. `1 + 2` adds to `3` first, then concatenates. In the other case the leading string makes every step a concatenation."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: minus-always-numeric
  front: "Why does `'5' - 2` give `3` while `'5' + 2` gives `'52'`?"
  back: "Only `+` has a string-concatenation branch. `-`, `*` and `/` always convert operands with `ToNumeric`."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: empty-block-plus-array
  front: "Why does a console often show `0` for `{} + []` but `'[object Object]'` for `console.log({} + [])`?"
  back: "At the start of a statement, `{}` parses as an empty block, leaving the expression `+[]`, which is `0`. In expression position `{}` is an object."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: plus-bigint-number-throws
  front: "What does `1n + 1` do, and what does `1n + '1'` give?"
  back: "`1n + 1` throws `TypeError`. `1n + '1'` is `'11'`, because a String operand triggers concatenation."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: three-equality-differences
  front: "On which two inputs do IsStrictlyEqual, SameValue and SameValueZero differ?"
  back: "`NaN` vs `NaN` and `+0` vs `-0`. Strict: NaN not equal, zeros equal. SameValue: NaN equal, zeros not equal. SameValueZero: both equal."
  question: javascript/coercion-and-equality/equality-algorithms
- id: equality-algorithm-users
  front: "Which operations use IsStrictlyEqual, SameValue and SameValueZero?"
  back: "Strict: `===`, `switch`, `indexOf`. SameValue: `Object.is` and `Object.defineProperty` redefinition checks. SameValueZero: `includes`, `Map` keys, `Set` values."
  question: javascript/coercion-and-equality/equality-algorithms
- id: indexof-vs-includes-nan
  front: "What do `[NaN].indexOf(NaN)` and `[NaN].includes(NaN)` return?"
  back: "`-1` and `true`. `indexOf` uses strict equality; `includes` uses SameValueZero."
  question: javascript/coercion-and-equality/equality-algorithms
- id: map-negative-zero-key
  front: "How does a `Map` treat a `-0` key?"
  back: "It canonicalizes `-0` to `+0` before storing, so `0` and `-0` are the same key and `Object.is(k, -0)` is `false` for every stored key. `NaN` works as a single key."
  question: javascript/coercion-and-equality/equality-algorithms
- id: object-is-no-coercion
  front: "Does `Object.is` coerce its arguments?"
  back: "No. `Object.is('1', 1)` and `Object.is(1n, 1)` are both `false`. For non-Number types the three equality algorithms agree."
  question: javascript/coercion-and-equality/equality-algorithms
# 06 Operators and syntax
- id: destructuring-default-trigger
  front: "In destructuring, which values trigger a default: `undefined`, `null`, `0`, `''`?"
  back: "Only `undefined` (or a missing key). `null`, `0`, `''` and `false` are kept. The default expression is evaluated lazily, left to right, and may use earlier bindings."
  question: javascript/operators-and-syntax/destructuring
- id: destructuring-object-pattern-throws
  front: "When does an object destructuring pattern throw a `TypeError`?"
  back: "When the right-hand side is `null` or `undefined`, because `RequireObjectCoercible` fails. This includes the empty pattern `const {} = null`. Primitives are boxed instead, so `const { length } = 'abc'` works."
  question: javascript/operators-and-syntax/destructuring
- id: destructuring-array-pattern-iterator
  front: "Does an array destructuring pattern read by index or by iteration protocol?"
  back: "By the iteration protocol, so it works on any iterable (strings, `Set`, generators). It pulls only as many values as it has elements, then calls `return()` on the iterator if unfinished."
  question: javascript/operators-and-syntax/destructuring
- id: destructuring-nested-missing-parent
  front: "Why does `const { a: { b } } = {}` throw, and how do you prevent it?"
  back: "It reads `b` from `undefined`. Give the parent a default: `{ a: { b } = {} }`. That still throws if `a` is `null`, since defaults only fire for `undefined`."
  question: javascript/operators-and-syntax/destructuring
- id: spread-vs-rest-position
  front: "What decides whether `...` is spread or rest?"
  back: "Position. Spread is an expression that expands a value into items (calls, array and object literals). Rest is a binding that collects the remainder (parameters, patterns) and must be last."
  question: javascript/operators-and-syntax/spread-vs-rest
- id: spread-object-copy-semantics
  front: "Which properties does `{ ...src }` copy, and how does it read them?"
  back: "Own enumerable properties, string and symbol keys, via `Get`, so getters run and the copy gets plain data properties. Inherited and non-enumerable properties are skipped, and `null` or `undefined` are ignored."
  question: javascript/operators-and-syntax/spread-vs-rest
- id: spread-array-needs-iterable
  front: "Why does `[...{ a: 1 }]` throw while `({ ...{ a: 1 } })` works?"
  back: "Array and call spread use the iteration protocol, and plain objects are not iterable (`TypeError`). Object-literal spread uses `CopyDataProperties`, which accepts any object."
  question: javascript/operators-and-syntax/spread-vs-rest
- id: spread-assign-vs-spread-define
  front: "How does `{ ...a }` differ from `Object.assign({}, a)` when the target has setters?"
  back: "Spread defines new properties with `CreateDataPropertyOrThrow`, so setters cannot intercept. `Object.assign` uses `Set`, which calls setters, including inherited ones, on its target."
  question: javascript/operators-and-syntax/spread-vs-rest
- id: nullish-vs-or-fallback
  front: "Which left-hand values make `a ?? b` return `b`, versus `a || b`?"
  back: "`??` falls back only for `null` and `undefined`. `||` falls back for any falsy value: `0`, `''`, `false`, `NaN`. So `0 ?? 3` is `0` and `0 || 3` is `3`."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: nullish-mixing-syntax-error
  front: "Why is `a ?? b || c` a `SyntaxError`, and what fixes it?"
  back: "The grammar refuses to guess precedence: `CoalesceExpression` does not accept bare `||` or `&&` operands. Parenthesise explicitly: `(a ?? b) || c`."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: optional-chain-short-circuit-scope
  front: "How far does `a?.b.c.d()` short-circuit when `a` is nullish, and what ends the chain?"
  back: "The whole chain to the right yields `undefined` without touching `.c` or `.d`. Parentheses end the chain: `(a?.b).c` still reads `.c` from `undefined` and throws."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: optional-chain-guard-limits
  front: "What does `?.` guard against, and what does it not?"
  back: "Only a nullish base at the exact spot written. `a?.b.c` still throws if `a.b` is `undefined`. `a.fn?.()` throws if `fn` is a non-function like `5`. An undeclared variable still throws `ReferenceError`."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: logical-assignment-no-write
  front: "How does `a ||= b` differ from `a = a || b` when `a` is truthy?"
  back: "No assignment happens at all: `b` is not evaluated, no setter runs, and no write is attempted on a frozen property. `a = a || b` still performs the write."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: for-in-keys-and-order
  front: "What does `for…in` enumerate, and in what order?"
  back: "Enumerable string keys, own and inherited, as strings; symbols and non-enumerable keys are skipped. Each object's own keys come integer-like ascending, then insertion order, then its prototype's. The spec drops that guarantee when a Proxy, TypedArray or other listed exotic object is on the chain."
  question: javascript/operators-and-syntax/loop-statements
- id: for-of-iterator-return
  front: "What does `break` inside `for…of` do to the iterable?"
  back: "It calls `iterator.return()` if the iterator has one, so a generator's `finally` block runs. An array iterator has no `return`, so nothing happens."
  question: javascript/operators-and-syntax/loop-statements
- id: foreach-async-callback
  front: "Why does `await` inside a `forEach` callback not pause the loop?"
  back: "`forEach` is synchronous and discards the callback's return value. An `async` callback returns a promise that nothing waits for, and its rejection goes unhandled. Use `for…of` with `await`, or `Promise.all(items.map(…))`."
  question: javascript/operators-and-syntax/loop-statements
- id: foreach-range-fixed
  front: "If you push to an array inside `forEach`, is the new element visited?"
  back: "No. `forEach` fixes its range to the original length before the first callback. A `for…of` loop over the same array would visit the pushed element."
  question: javascript/operators-and-syntax/loop-statements
- id: asi-three-cases
  front: "In which three cases does automatic semicolon insertion add a `;`?"
  back: "At an offending token that follows a line terminator or is `}`, at the end of input, and where a newline breaks a restricted production (`return`, `throw`, `break`, `continue`, `yield`, postfix `++`/`--`, arrow `=>`)."
  question: javascript/operators-and-syntax/automatic-semicolon-insertion
- id: asi-no-insertion-before-paren
  front: "Why does a line starting with `(` or `[` join the previous line, even after a newline?"
  back: "ASI inserts a `;` only when the next token is illegal. `(`, `[`, a template literal, `+`, `-` and `/` are legal continuations, so no `;` is added and the lines merge into a call or access."
  question: javascript/operators-and-syntax/automatic-semicolon-insertion
- id: asi-return-newline
  front: "What does `return` followed by a newline and `{ ok: true }` return, and why?"
  back: "`undefined`. `return` is a restricted production, so a newline after it makes the parser insert `;`. The value on the next line is dead code. A multi-line comment containing a newline counts too."
  question: javascript/operators-and-syntax/automatic-semicolon-insertion
- id: asi-override-limits
  front: "Which semicolon insertions does ASI refuse to make?"
  back: "One that would become an empty statement, and one that would become either semicolon in a `for(;;)` header. So `for (let i = 0⏎i < 3⏎i++)` is a `SyntaxError`; ASI cannot repair real syntax errors."
  question: javascript/operators-and-syntax/automatic-semicolon-insertion
# 07 Scope and execution contexts
- id: var-let-const-scope-redeclare
  front: "How do `var`, `let` and `const` differ in scope and redeclaration?"
  back: "`var` is function-scoped (or script/module) and may be redeclared. `let` and `const` are block-scoped, and redeclaring them in the same scope is an early `SyntaxError`."
  question: javascript/scope-and-execution-contexts/var-let-const
- id: const-binding-not-value
  front: "What does `const` make immutable: the binding or the value?"
  back: "The binding only. Reassigning throws `TypeError`, but a `const` object or array can still be mutated. `Object.freeze` gives shallow immutability of the value."
  question: javascript/scope-and-execution-contexts/var-let-const
- id: var-global-property-classic-script
  front: "Which top-level declarations become global object properties in a classic script?"
  back: "`var` and function declarations (non-configurable). `let`, `const` and `class` become global bindings but not properties. Module code has no such link."
  question: javascript/scope-and-execution-contexts/var-let-const
- id: const-for-loop-increment
  front: "What happens with `for (const i = 0; i < 2; i++) {}`, and why does `for (const x of list)` work?"
  back: "The first throws `TypeError` at the increment: `const` gets no per-iteration copy in a classic `for`. `for…of` creates a fresh binding each pass, so `const` is fine."
  question: javascript/scope-and-execution-contexts/var-let-const
- id: hoisting-spec-term
  front: "What does the spec say about 'hoisting'?"
  back: "Nothing; it moves no code. When a scope is entered, declaration instantiation creates all its bindings first, then the code runs top to bottom. 'Hoisting' names the visible effect."
  question: javascript/scope-and-execution-contexts/hoisting
- id: hoisting-initial-state-by-declaration
  front: "What is each declaration's state at scope entry: `var`, function declaration, `let`/`const`/`class`?"
  back: "`var`: initialized to `undefined`. Function declaration: initialized with the function object. `let`, `const`, `class`: created but uninitialized (temporal dead zone)."
  question: javascript/scope-and-execution-contexts/hoisting
- id: hoisting-function-beats-var
  front: "Given `var item = 1; function item() {}` in one scope, what is `typeof item` before the `var` line runs?"
  back: "`'function'`. The function declaration is initialized at instantiation, and `var item` without an initializer does not overwrite it. After `item = 1` runs it is `'number'`."
  question: javascript/scope-and-execution-contexts/hoisting
- id: hoisting-function-expression
  front: "Why can you call a function declaration early but not `var f = function () {}`?"
  back: "The declaration is created with its function object at scope entry. For `var f`, only the binding is hoisted, as `undefined`; the function is created when the assignment runs. With `let` or `const` it is a TDZ error."
  question: javascript/scope-and-execution-contexts/hoisting
- id: tdz-definition
  front: "What is the temporal dead zone?"
  back: "The time between entering a scope and evaluating a `let`, `const` or `class` declaration. The binding exists but is uninitialized, so reading or writing it throws `ReferenceError`. It is defined by execution time, not source position."
  question: javascript/scope-and-execution-contexts/temporal-dead-zone
- id: tdz-typeof-throws
  front: "Does `typeof` avoid the TDZ error, and how does it differ for undeclared names?"
  back: "No. `typeof undeclared` returns `'undefined'` because the name is unresolvable. `typeof tdzName` throws `ReferenceError`, because the name resolves to an uninitialized binding."
  question: javascript/scope-and-execution-contexts/temporal-dead-zone
- id: tdz-proves-hoisting
  front: "How does the TDZ show that `let` is hoisted?"
  back: "An inner `let x` makes an earlier read of `x` in the same block throw instead of falling through to an outer `x`. The inner binding already exists from block entry."
  question: javascript/scope-and-execution-contexts/temporal-dead-zone
- id: tdz-default-parameter-order
  front: "Why does `function f(a = b, b = 1) {}` throw when called as `f()`?"
  back: "Parameters are initialized left to right. Evaluating `a`'s default reads `b` before it is initialized, which is a TDZ `ReferenceError`."
  question: javascript/scope-and-execution-contexts/temporal-dead-zone
- id: lexical-scope-definition
  front: "What does 'lexical scope' mean, and what is the contrast case?"
  back: "Variable visibility is fixed by the nesting of the source text, not by the call stack. Dynamic scope, where a function sees its caller's variables, does not exist for identifiers; `this` is the main thing the call site chooses."
  question: javascript/scope-and-execution-contexts/lexical-scope-chain
- id: scope-chain-outerenv-lookup
  front: "How is a function's scope chain built and walked in spec terms?"
  back: "Creation stores the current environment in `[[Environment]]`. Each call makes a record whose `[[OuterEnv]]` is that stored environment, never the caller's. Lookup follows `[[OuterEnv]]` until a binding is found or `null` (`ReferenceError`)."
  question: javascript/scope-and-execution-contexts/lexical-scope-chain
- id: named-function-expression-scope
  front: "Where is the name of a named function expression visible?"
  back: "Only inside the function itself. The name lives in a private scope between the function and its surroundings, so `typeof inner` outside is `'undefined'`."
  question: javascript/scope-and-execution-contexts/lexical-scope-chain
- id: scope-chain-vs-call-stack
  front: "How does the scope chain differ from the call stack?"
  back: "The call stack records who called whom. The scope chain records where each function was written. They line up only for a function defined inside the function that calls it."
  question: javascript/scope-and-execution-contexts/lexical-scope-chain
- id: execution-context-contents
  front: "What does an execution context carry?"
  back: "The function being run, its realm, the script or module, a LexicalEnvironment, a VariableEnvironment, and enough state to suspend and resume. The running context is the top of the stack."
  question: javascript/scope-and-execution-contexts/execution-context-call-stack
- id: lexical-vs-variable-environment
  front: "What is the difference between LexicalEnvironment and VariableEnvironment?"
  back: "`var` bindings live in the VariableEnvironment, which blocks never swap. LexicalEnvironment is where lookups start and is swapped for a new record when execution enters a block."
  question: javascript/scope-and-execution-contexts/execution-context-call-stack
- id: execution-context-per-call
  front: "Does a function have one execution context, or one per call?"
  back: "One per call, so recursion creates many. Contexts pop on return, but Environment Records they referenced survive if a closure captured them."
  question: javascript/scope-and-execution-contexts/execution-context-call-stack
- id: await-suspends-context
  front: "What happens to an async function's execution context at `await`?"
  back: "It is suspended and removed from the stack, so other code runs. The continuation later resumes from the job queue on an almost empty stack, which is why async stack traces look shorter."
  question: javascript/scope-and-execution-contexts/execution-context-call-stack
- id: environment-record-kinds
  front: "What kinds of Environment Record does the spec define?"
  back: "Declarative, Function (adds `this`, function object, `new.target`), Module (adds indirect import bindings), Object (`with` and the global object), and Global (an Object record plus a Declarative record)."
  question: javascript/scope-and-execution-contexts/environment-records
- id: environment-record-spec-only
  front: "Can JavaScript code access an Environment Record?"
  back: "No. They are a specification device; engines may keep bindings in registers, stack slots or heap objects. `globalThis` is only one part of the global record."
  question: javascript/scope-and-execution-contexts/environment-records
- id: module-import-indirect-binding
  front: "What is an immutable indirect binding in a Module Environment Record?"
  back: "An import binding. It is read-only for the importer, and reads go to the exporting module's own binding, which is why imports are live and cannot be reassigned."
  question: javascript/scope-and-execution-contexts/environment-records
- id: global-record-composite
  front: "Why is the Global Environment Record a composite of two records?"
  back: "Historical `var` and function declarations must become global object properties (Object record), while later `let`, `const` and `class` must not (Declarative record). The Declarative part is searched first."
  question: javascript/scope-and-execution-contexts/environment-records
- id: globalthis-purpose
  front: "Why was `globalThis` added?"
  back: "There was no portable way to reach the global object: `window` fails in workers and Node, `global` fails in browsers. `globalThis` is the same everywhere."
  question: javascript/scope-and-execution-contexts/global-object-globalthis
- id: top-level-this-by-host
  front: "What is top-level `this` in a classic script, an ES module and a Node CommonJS file?"
  back: "Classic script: `globalThis`. ES module: `undefined`. CommonJS file: `module.exports`, because the file is wrapped in a function."
  question: javascript/scope-and-execution-contexts/global-object-globalthis
- id: global-let-redeclare-across-scripts
  front: "Why do two classic scripts both declaring a top-level `let x` collide?"
  back: "The global Declarative record is shared by all scripts in the realm, so the second declaration is a `SyntaxError`. Top-level `var` would not collide."
  question: javascript/scope-and-execution-contexts/global-object-globalthis
- id: global-var-delete
  front: "Can you `delete` a top-level `var` in a classic script, versus an implicit global?"
  back: "No for `var` and function declarations: they are non-configurable. Implicit globals created by sloppy assignment are configurable and can be deleted."
  question: javascript/scope-and-execution-contexts/global-object-globalthis
- id: stack-overflow-cause
  front: "What causes 'Maximum call stack size exceeded', and does the spec define the limit?"
  back: "Each call pushes an execution context onto a fixed-size stack set by the engine or host. Too-deep or endless recursion throws `RangeError` in V8 and JavaScriptCore. The spec defines neither the limit nor the error type."
  question: javascript/scope-and-execution-contexts/stack-overflow-tail-calls
- id: proper-tail-calls-support
  front: "Does the spec require proper tail calls, and which engines implement them?"
  back: "ES2015 requires them in strict code, but only JavaScriptCore (Safari) implements them. V8 does not, so a tail-recursive function still overflows in Node and Chrome."
  question: javascript/scope-and-execution-contexts/stack-overflow-tail-calls
- id: tail-position-definition
  front: "Which calls are in tail position?"
  back: "In strict code, a call that is the value of a `return`, a concise arrow body, a `?:` branch, or the right of `&&`, `||`, `??`, with nothing left to do. `return 1 + f(n)`, `return await f()` and calls inside `try` are not."
  question: javascript/scope-and-execution-contexts/stack-overflow-tail-calls
- id: realm-definition
  front: "What is a realm, and what creates a new one?"
  back: "A set of intrinsic objects plus a global environment. A same-origin iframe or popup and a Node `vm` context each get new intrinsics, so `iframe.contentWindow.Array` is a different function from `Array`."
  question: javascript/scope-and-execution-contexts/realms
- id: instanceof-fails-across-realms
  front: "Why does `foreignArray instanceof Array` return `false`?"
  back: "`instanceof` checks whether `Array.prototype` is in the prototype chain. A foreign array inherits from its own realm's `Array.prototype`, a different object. `Array.isArray` checks the internal exotic kind and works."
  question: javascript/scope-and-execution-contexts/realms
- id: realm-shared-values
  front: "Which values are the same across realms?"
  back: "Well-known symbols (`Symbol.iterator`) and registered symbols (`Symbol.for('k')`). Primitives have no realm at all."
  question: javascript/scope-and-execution-contexts/realms
- id: realm-not-security-boundary
  front: "Is a `node:vm` context a security boundary?"
  back: "No. It shares the process, and its objects can reach back into yours. Node's docs say not to use it as a sandbox for untrusted code."
  question: javascript/scope-and-execution-contexts/realms
# 08 Functions
- id: function-forms-creation-time
  front: "When does the function object exist for a declaration versus an expression?"
  back: "A declaration's function is created at scope entry, before any line runs. An expression's function is created when evaluation reaches it, so the binding follows `var`/`let`/`const` rules."
  question: javascript/functions/function-forms
- id: function-forms-constructors
  front: "Which function forms have `[[Construct]]` so that `new` works?"
  back: "Declarations and `function` expressions. Arrows, methods, getters/setters and async functions do not. Generators have a `prototype` property but no `[[Construct]]`."
  question: javascript/functions/function-forms
- id: arrow-no-own-bindings
  front: "Which bindings does an arrow function lack?"
  back: "`this`, `arguments`, `super` and `new.target`: it reads them from the enclosing environment. It also has no `prototype` and no `[[Construct]]`, so `new` throws `TypeError`."
  question: javascript/functions/function-forms
- id: function-name-inference
  front: "What determines the `name` of an anonymous function?"
  back: "The assignment syntax, not the function form: `const f = () => {}` gives `'f'`. The function takes its name from the binding or property it is assigned to."
  question: javascript/functions/function-forms
- id: default-param-evaluated-per-call
  front: "When is a default parameter expression evaluated?"
  back: "On each call where the argument is missing or `undefined`, not at definition time. So `list = []` gives every call a fresh array. `null` does not trigger it."
  question: javascript/functions/default-and-rest-parameters
- id: function-length-stops-at-default
  front: "What does `fn.length` count when a function has defaults or rest?"
  back: "Only the parameters before the first default or rest parameter. `function f(a, b = 1, c)` has `length` 1."
  question: javascript/functions/default-and-rest-parameters
- id: non-simple-params-use-strict
  front: "Why is `'use strict'` in the body a `SyntaxError` for `function f(a = 1)`?"
  back: "The parameter list is non-simple (defaults, rest or destructuring), and the spec makes the directive an early error there. Put it in an enclosing function or module instead."
  question: javascript/functions/default-and-rest-parameters
- id: param-scope-split
  front: "When parameters contain expressions, can a default see body-level `var` declarations?"
  back: "No. The parameters get their own Environment Record and the body's `var`s go in a separate one, so closures in the parameter list cannot see body declarations."
  question: javascript/functions/default-and-rest-parameters
- id: arguments-array-like
  front: "What is `arguments` and what does it lack?"
  back: "An array-like object with `length`, index keys and `Symbol.iterator`. It inherits from `Object.prototype`, so `map` and `slice` are missing and `Array.isArray` is `false`. Spread or `Array.from` converts it."
  question: javascript/functions/arguments-object
- id: arguments-mapped-sloppy
  front: "When is `arguments[i]` aliased to the named parameter?"
  back: "Only in sloppy functions with a simple parameter list, and only for indices below the number of arguments passed. Strict code, defaults, rest or destructuring give an unmapped copy."
  question: javascript/functions/arguments-object
- id: arguments-in-arrow
  front: "What does `arguments` refer to inside an arrow function?"
  back: "The enclosing function's `arguments`, since arrows have none of their own. Use rest parameters instead."
  question: javascript/functions/arguments-object
- id: arguments-callee-strict
  front: "What happens when you read `arguments.callee` in strict code?"
  back: "It throws `TypeError`. Unmapped `arguments` objects have a poison-pill accessor there; only sloppy mapped objects expose the running function."
  question: javascript/functions/arguments-object
- id: hof-definition
  front: "What makes a function higher-order, and why does JavaScript allow it?"
  back: "It accepts a function, returns a function, or both. Functions are first-class: objects with `[[Call]]` that can be assigned, passed and returned like any value."
  question: javascript/functions/higher-order-functions
- id: map-parseint-radix
  front: "Why does `['10','10','10'].map(parseInt)` misbehave?"
  back: "`map` calls the callback with `(element, index, array)`, so `index` is passed to `parseInt` as the radix. Wrap it or use a single-purpose function."
  question: javascript/functions/higher-order-functions
- id: callbacks-not-always-async
  front: "Are callbacks always asynchronous?"
  back: "No. Callbacks of `map`, `filter` and `sort` run synchronously before the method returns. Callbacks to `setTimeout` or `then` run later."
  question: javascript/functions/higher-order-functions
- id: wrapper-forwarding
  front: "What must a function wrapper forward to behave like the original?"
  back: "The arguments (`...args`), the return value, and `this` via `fn.apply(this, args)`. An arrow wrapper loses the receiver, and a `...args` wrapper has its own `name` and a `length` of 0."
  question: javascript/functions/higher-order-functions
- id: iife-why-parentheses
  front: "Why does `function () {}()` fail as a statement, and what fixes it?"
  back: "A statement cannot start with `function`; the grammar treats it as a declaration, which needs a name and cannot be called. Parentheses or an operator like `!` or `void` force expression context."
  question: javascript/functions/iife
- id: iife-modern-replacements
  front: "What replaced the IIFE module pattern for private scope?"
  back: "ES modules, which give each file its own scope with explicit exports, plus `{ let x }` blocks and per-iteration `let`. Private state uses module variables, factories or `#private` fields."
  question: javascript/functions/iife
- id: iife-async-use
  front: "When is an IIFE still useful?"
  back: "An `async` IIFE to use `await` where top-level `await` is unavailable (CommonJS, older scripts), and one-off initialisation that needs statements but yields a `const` value."
  question: javascript/functions/iife
- id: iife-this-value
  front: "What is `this` inside a non-arrow IIFE?"
  back: "A plain call passes `undefined`: that is `this` in strict code, and `globalThis` in sloppy code. It is not the outer `this`."
  question: javascript/functions/iife
- id: currying-vs-partial
  front: "How do currying and partial application differ?"
  back: "Partial application fixes some arguments of an existing function once (`fn.bind(null, a)`). Currying reshapes the function into a sequence of calls, so every partial application is available afterwards."
  question: javascript/functions/currying-partial-application
- id: curry-arity-from-length
  front: "How does a typical `curry` decide when to call the original, and when does it fail?"
  back: "It collects arguments in a closure and calls once `args.length >= fn.length`. Defaults and rest are not counted in `length`, so it fires too early or never waits; variadic functions have no fixed arity."
  question: javascript/functions/currying-partial-application
- id: bind-length-adjustment
  front: "What does `bind` do to the bound function's `length`?"
  back: "It is the target's `length` minus the number of preset arguments, floored at 0. So `add3.bind(null, 1).length` is 2."
  question: javascript/functions/currying-partial-application
- id: pipe-vs-compose-direction
  front: "In what order do `pipe(f, g, h)` and `compose(f, g, h)` run their functions?"
  back: "`pipe` runs left to right: `h(g(f(x)))`, using `reduce`. `compose` runs right to left: `f(g(h(x)))`, using `reduceRight`."
  question: javascript/functions/compose-and-pipe
- id: compose-empty-identity
  front: "Why does passing the input as the `reduce` initial value make an empty `pipe` the identity function?"
  back: "With no functions, `reduce` returns the initial value untouched, so the result is the input, with no special-case code."
  question: javascript/functions/compose-and-pipe
- id: compose-single-value
  front: "What happens to a second argument passed to a composed function?"
  back: "It is dropped. Only one value flows through the chain, so `pipe(parseInt)('10', 2)` uses the default radix. Adapt other shapes with currying or partial application."
  question: javascript/functions/compose-and-pipe
# 09 Closures
- id: closure-spec-mechanism
  front: "In spec terms, how does a function become a closure?"
  back: "At creation, `OrdinaryFunctionCreate` stores the current Environment Record in `[[Environment]]`. Each call makes a new record whose `[[OuterEnv]]` is that stored environment, and lookup walks outward."
  question: javascript/closures/what-is-a-closure
- id: closure-binding-not-value
  front: "Does a closure capture a value or a binding?"
  back: "The binding. It holds a reference to the environment, so it sees later assignments and can assign too. Nothing is copied."
  question: javascript/closures/what-is-a-closure
- id: closure-one-env-per-call
  front: "Do two calls of an outer function share the closure state they create?"
  back: "No. Each call creates its own record, so returned functions have independent state. Functions created during the same call share one record."
  question: javascript/closures/what-is-a-closure
- id: react-stale-closure
  front: "What is a React 'stale closure' in terms of bindings?"
  back: "Not a snapshot. Each render is a new call with its own `count`, and a callback registered once keeps pointing at the first render's environment."
  question: javascript/closures/what-is-a-closure
- id: new-function-global-env
  front: "Can `new Function('...')` see local variables of the surrounding function?"
  back: "No. `CreateDynamicFunction` uses the realm's global environment as `[[Environment]]`, so it cannot see function or module scope."
  question: javascript/closures/what-is-a-closure
- id: var-loop-shared-binding
  front: "Why does `for (var i = 0; i < 3; i++) setTimeout(() => console.log(i))` log `3` three times?"
  back: "`var` gives one binding for the whole loop, and the callbacks run after the loop exits. The loop stops when `i < 3` fails, so `i` is `3`, not `2`."
  question: javascript/closures/closures-in-loops
- id: let-loop-per-iteration
  front: "What makes `for (let i …)` give each closure its own `i`?"
  back: "`CreatePerIterationEnvironment` copies the bindings into a new Declarative record before the first test and after each body, before the increment. Plain block scoping alone would give one `i`."
  question: javascript/closures/closures-in-loops
- id: loop-increment-new-record
  front: "In a `let` loop, why does `i++` not change the previous iteration's closure?"
  back: "The increment runs in the new record created by the per-iteration copy. The previous record keeps the value it had at the end of its body."
  question: javascript/closures/closures-in-loops
- id: for-of-fresh-binding
  front: "Which loop heads create a fresh binding per iteration?"
  back: "`for…of` and `for…in` with `let` or `const`, and `for (let …)` via the per-iteration copy. A classic `for (const …)` makes no copy, and a `var` head is always one binding."
  question: javascript/closures/closures-in-loops
- id: v8-context-allocation
  front: "In V8, which variables does a closure keep alive?"
  back: "Only variables some inner function references; they are context-allocated on the heap. Unreferenced locals are not retained. This is an engine optimisation; the spec only defines reachability through Environment Records."
  question: javascript/closures/closure-memory
- id: closure-sibling-sharing
  front: "Why can a tiny callback keep a large object alive in V8?"
  back: "Closures created in one scope share a single `Context`. If any sibling closure references `big`, every closure from that call keeps it alive."
  question: javascript/closures/closure-memory
- id: closure-direct-eval-retention
  front: "How does a direct `eval` in a closure affect retention?"
  back: "It can name any binding at run time, so nothing in the enclosing scopes can be dropped. Indirect eval runs in global scope and does not have this effect."
  question: javascript/closures/closure-memory
- id: closure-leak-cause
  front: "What actually causes a closure-related memory leak?"
  back: "A long-lived reference to the closure: an unremoved listener, uncleared interval, subscription or cached callback. The closure is the retainer path; the missing cleanup is the bug."
  question: javascript/closures/closure-memory
- id: closure-private-state-why
  front: "Why can only code inside a factory touch a closure's private variable?"
  back: "Environment Records cannot be accessed or manipulated by programs, and there is no reflection API for them. Only code written lexically inside the function can reach the binding."
  question: javascript/closures/private-state
- id: closure-privacy-escape
  front: "How can a closure-private array still leak mutable access?"
  back: "The binding is private, but returning the array itself (`getItems: () => items`) hands out a mutable reference. Return copies or read-only views."
  question: javascript/closures/private-state
- id: closure-vs-private-fields
  front: "What is the main cost of closure privacy versus `#private` class fields?"
  back: "Each factory call creates new function objects per instance, while class methods are shared on the prototype. Both give hard privacy."
  question: javascript/closures/private-state
- id: debounce-vs-throttle
  front: "How do `debounce` and `throttle` differ in when `fn` runs?"
  back: "Debounce restarts a timer on each call and runs `fn` after calls stop for `wait` ms. Throttle runs `fn` at most once per `wait` window while calls continue."
  question: javascript/closures/debounce-throttle-once
- id: debounce-this-arrow-timer
  front: "How should a debounce wrapper preserve `this` and arguments?"
  back: "Make the wrapper a regular `function` taking `...args`, and call `fn.apply(this, args)` from an arrow inside `setTimeout`. The arrow has no `this`, so it uses the wrapper's."
  question: javascript/closures/debounce-throttle-once
- id: debounce-wrapper-created-once
  front: "Why must a debounced function be created once, not inside the handler or render?"
  back: "Each creation makes a new closure with its own timer, so nothing is ever debounced. Create it once and reuse it."
  question: javascript/closures/debounce-throttle-once
- id: once-mark-before-call
  front: "Why should `once` mark itself called before invoking `fn`?"
  back: "So a re-entrant call cannot run `fn` twice. Dropping the reference to `fn` also lets it and its captured closure be collected."
  question: javascript/closures/debounce-throttle-once
- id: debounce-not-out-of-order
  front: "Why does debouncing alone not prevent stale search results?"
  back: "It only limits when requests start. Two requests can still be in flight and resolve out of order. Abort the previous one with an `AbortController` as well."
  question: javascript/closures/debounce-throttle-once
# 10 this
- id: this-binding-order
  front: "In what order are the `this` binding rules checked for a non-arrow function?"
  back: "`new`, then bound function, then explicit `call`/`apply`, then implicit `obj.method()`, then default. The default passes `undefined`: that stays in strict code, and becomes `globalThis` in sloppy code."
  question: javascript/this/this-binding-rules
- id: this-strictness-of-callee
  front: "Whose strict mode decides whether `undefined` `this` becomes `globalThis`: the caller's or the callee's?"
  back: "The called function's own mode. A sloppy function called from a module still sees `globalThis`. Class bodies and modules are always strict."
  question: javascript/this/this-binding-rules
- id: comma-operator-loses-this
  front: "Why does `(0, obj.fn)()` lose `this` while `(obj.fn)()` keeps it?"
  back: "Parentheses return the Reference Record unchanged, so the call still sees the base object. The comma operator applies `GetValue`, producing a plain function value with no base."
  question: javascript/this/this-binding-rules
- id: this-before-super
  front: "Why does reading `this` before `super()` in a derived constructor throw?"
  back: "The derived constructor's `this` binding starts uninitialised; only `super()` creates the object and binds it. Reading `this` earlier throws `ReferenceError`."
  question: javascript/this/this-binding-rules
- id: arrow-this-thismode-lexical
  front: "How does the spec make an arrow function's `this` lexical?"
  back: "`[[ThisMode]]` is lexical, so `OrdinaryCallBindThis` binds nothing and the Function Environment Record is flagged lexical. The `this` lookup passes over it to the nearest scope that has a binding."
  question: javascript/this/arrow-functions-this
- id: arrow-ignores-call-apply-bind
  front: "What do `call`, `apply` and `bind` do to an arrow's `this`?"
  back: "The `thisArg` is silently ignored; the other arguments are still applied. `new` on an arrow throws `TypeError`."
  question: javascript/this/arrow-functions-this
- id: arrow-object-method-this
  front: "What is `this` in an arrow used as an object-literal property?"
  back: "The surrounding scope's `this`, not the object. At module level that is `undefined`."
  question: javascript/this/arrow-functions-this
- id: class-field-arrow-per-instance
  front: "What does a class-field arrow `handler = () => {}` do, and what is its cost?"
  back: "The initialiser runs with `this` set to the new instance, so each instance gets a function bound to itself. It is created per instance and is not on the prototype."
  question: javascript/this/arrow-functions-this
- id: call-apply-bind-differences
  front: "How do `call`, `apply` and `bind` differ?"
  back: "`call` invokes now with arguments listed. `apply` invokes now with one array or array-like. `bind` does not invoke; it returns a new function with `this` and leading arguments fixed."
  question: javascript/this/call-apply-bind
- id: bound-this-immutable
  front: "Can `call`, `apply` or a second `bind` change a bound function's `this`?"
  back: "No. Its `[[Call]]` uses the saved `[[BoundThis]]`. Extra `bind` arguments still accumulate in order, but only the first `thisArg` counts."
  question: javascript/this/call-apply-bind
- id: bound-function-new
  front: "What happens when you call `new` on a bound function?"
  back: "The bound `this` is ignored, but bound arguments are prepended and the target is constructed. If `new.target` is the bound function, it becomes the target, so `instanceof` works against either."
  question: javascript/this/call-apply-bind
- id: bound-function-name-length
  front: "What are a bound function's `name`, `length` and `prototype`?"
  back: "`name` is `'bound ' + target.name`, `length` is the target's minus bound arguments (never below 0), and it has no `prototype`."
  question: javascript/this/call-apply-bind
- id: call-null-this-sloppy
  front: "What does passing `null` as `thisArg` do for a sloppy versus a strict target?"
  back: "A sloppy target turns `null`/`undefined` into `globalThis` and boxes primitives, hiding bugs. A strict target receives `null` as given and throws on property access."
  question: javascript/this/call-apply-bind
- id: lost-this-reference-record
  front: "Why does `const f = counter.increment; f()` lose `this`?"
  back: "`counter.increment` evaluates to a Reference Record with base `counter`. `GetValue` discards the reference when the function is read into a value, so the call has no receiver."
  question: javascript/this/lost-this-callbacks
- id: lost-this-failure-mode
  front: "What does a method with a lost `this` do in strict versus sloppy code?"
  back: "Strict: `this` is `undefined`, so `this.count` throws. Sloppy: `this` is `globalThis`, so it silently reads or writes globals, which is worse."
  question: javascript/this/lost-this-callbacks
- id: lost-this-destructuring
  front: "Does `const { method } = obj` keep `obj` as `this`?"
  back: "No. Only a call made on the reference carries the receiver; destructuring reads the function into a plain value."
  question: javascript/this/lost-this-callbacks
- id: remove-listener-bound-identity
  front: "Why does `el.removeEventListener('click', fn.bind(x))` remove nothing?"
  back: "`bind` creates a new function each time, so identity does not match. Store the bound function once and pass the same reference to both calls."
  question: javascript/this/lost-this-callbacks
- id: dom-listener-this
  front: "What is `this` in a regular-function DOM event listener, and who decides?"
  back: "The element the listener was registered on (`currentTarget`). It is host-defined by the DOM spec, not language semantics. An arrow ignores it and keeps its lexical `this`."
  question: javascript/this/lost-this-callbacks
- id: bound-function-internal-methods
  front: "What do a bound function's `[[Call]]` and `[[Construct]]` do?"
  back: "`[[Call]]` calls the target with `[[BoundThis]]` and bound arguments first, ignoring the call's `this`. `[[Construct]]` constructs the target with bound arguments prepended, ignoring `[[BoundThis]]`."
  question: javascript/this/implement-bind
- id: implement-bind-new-target
  front: "How can a userland `bind` tell a plain call from a `new` call?"
  back: "Through `new.target`, which is `undefined` for a plain call. Use `Reflect.apply` for calls and `Reflect.construct` with an explicit `new.target` so the object gets the right prototype."
  question: javascript/this/implement-bind
- id: implement-bind-limits
  front: "What can a userland `bind` not replicate?"
  back: "It has an own non-configurable `prototype`, so `new bound() instanceof bound` is `false`. Its `[[Prototype]]` is `Function.prototype`, `toString` shows source, and `name` and `length` must be defined by hand."
  question: javascript/this/implement-bind
- id: implement-bind-arrow-pitfall
  front: "Why can a userland `bind` not be written as an arrow function?"
  back: "Arrows have no `new.target` and cannot be constructed, so the `new` path is unreachable. `new bound()` would throw `TypeError`, where a native bound function constructs the target."
  question: javascript/this/implement-bind
# 11 Objects and properties
- id: property-key-types
  front: "What can a property key be, and how are other values converted?"
  back: "A String or a Symbol. Other values go through `ToPropertyKey`: `ToPrimitive` with string preference, then `ToString`. So `obj[1]` and `obj['1']` are one property, and objects collide as `'[object Object]'`."
  question: javascript/objects-and-properties/property-keys-and-order
- id: own-property-key-order
  front: "In what order does an ordinary object list its own keys?"
  back: "Array indices (`'0'` to `'4294967294'`) in ascending order, then other strings in creation order, then symbols in creation order. `{ b: 1, 10: 1, 9: 1 }` lists `'9'`, `'10'`, `'b'`."
  question: javascript/objects-and-properties/property-keys-and-order
- id: symbol-keys-visibility
  front: "Which APIs skip symbol keys, and which show them?"
  back: "`for…in`, `Object.keys`, `Object.entries` and `JSON.stringify` skip them. `Object.getOwnPropertySymbols` and `Reflect.ownKeys` list them. Symbols are not private."
  question: javascript/objects-and-properties/property-keys-and-order
- id: proto-literal-key
  front: "How do `{ __proto__: x }`, `{ ['__proto__']: x }` and `JSON.parse('{\"__proto__\":1}')` differ?"
  back: "The plain literal sets the prototype. The computed key and the parsed JSON create an own property named `__proto__`."
  question: javascript/objects-and-properties/property-keys-and-order
- id: map-vs-object-keys
  front: "How does `Map` key handling differ from plain objects?"
  back: "A `Map` keeps pure insertion order and uses SameValueZero, so `1` and `'1'` are different keys and any value, including an object, can be a key."
  question: javascript/objects-and-properties/property-keys-and-order
- id: descriptor-kinds
  front: "Which fields make up a data descriptor versus an accessor descriptor?"
  back: "Data: `value`, `writable`. Accessor: `get`, `set`. Both have `enumerable` and `configurable`. Mixing `get`/`set` with `value`/`writable` throws `TypeError`."
  question: javascript/objects-and-properties/property-descriptors
- id: define-property-defaults
  front: "What attribute defaults does `Object.defineProperty` use for a new property?"
  back: "Every omitted flag is `false`, and `value` or `get`/`set` is `undefined`. Literals and assignment give all three flags `true`. For an existing property, omitted fields are left unchanged."
  question: javascript/objects-and-properties/property-descriptors
- id: non-writable-failure-mode
  front: "What happens when you assign to a `writable: false` property?"
  back: "A silent no-op in sloppy mode, a `TypeError` in strict and module code."
  question: javascript/objects-and-properties/property-descriptors
- id: inherited-readonly-blocks-set
  front: "Does a read-only property on the prototype stop assignment on the child?"
  back: "Yes. `[[Set]]` finds the inherited non-writable data property and fails instead of creating an own property. Use `defineProperty` on the child to shadow it."
  question: javascript/objects-and-properties/property-descriptors
- id: copy-with-descriptors
  front: "How do you copy an object keeping its getters and attributes?"
  back: "`Object.defineProperties({}, Object.getOwnPropertyDescriptors(src))`. Spread and `Object.assign` create plain data properties instead, running getters once and resetting flags."
  question: javascript/objects-and-properties/property-descriptors
- id: integrity-levels-table
  front: "How do `preventExtensions`, `seal` and `freeze` differ?"
  back: "`preventExtensions`: no adding. `seal`: also no deleting or reconfiguring (`configurable: false`). `freeze`: also `writable: false` on data properties. Each includes the previous level."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: freeze-shallow
  front: "Is `Object.freeze` deep?"
  back: "No. Only own properties change. Nested objects stay mutable, as do the internal slots of a `Map`, `Set` or `Date`. There is no unfreeze."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: freeze-accessors-still-run
  front: "Do accessors on a frozen object stop working?"
  back: "No. Getters and setters still run; freeze only locks the property's configuration. It sets `writable: false` on data properties alone."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: frozen-write-failure
  front: "How do rejected writes on a frozen object behave across modes?"
  back: "Strict code (modules, classes) throws `TypeError`; sloppy code silently ignores. Built-in methods like `push` throw even in sloppy code."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: freeze-vs-const
  front: "How do `Object.freeze` and `const` differ?"
  back: "`const` stops re-binding the variable. `freeze` stops changing the object's properties. Use both for a true constant object."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: accessor-property-definition
  front: "What is an accessor property, and where does its data live?"
  back: "A property with `get`, `set`, `enumerable` and `configurable` instead of `value` and `writable`. It holds functions, not data; the value lives in another property, a closure or a private field."
  question: javascript/objects-and-properties/getters-and-setters
- id: getter-receiver-this
  front: "What is `this` in an inherited getter or setter?"
  back: "The receiver: the object you read from or assigned to. So `child.balance = 10` runs the inherited setter with `this === child`, and the data lands on `child`."
  question: javascript/objects-and-properties/getters-and-setters
- id: getter-only-assignment
  front: "What happens when you assign to a getter-only property?"
  back: "The write fails: silently in sloppy code, with a `TypeError` in strict code. Modules and classes reveal the bug while scripts hide it."
  question: javascript/objects-and-properties/getters-and-setters
- id: class-accessor-enumerability
  front: "Do class accessors appear in `Object.keys` or `JSON.stringify` of an instance?"
  back: "No. They live on the prototype and are non-enumerable. Accessors in an object literal are own, enumerable and configurable, and `Object.entries` calls their getters."
  question: javascript/objects-and-properties/getters-and-setters
- id: accessor-self-recursion
  front: "Why does `set balance(v) { this.balance = v }` never finish?"
  back: "It calls the same setter forever, ending in `RangeError`. A getter that reads its own name recurses the same way. Use a differently named backing field."
  question: javascript/objects-and-properties/getters-and-setters
- id: enumeration-api-matrix
  front: "How do `Object.keys`, `getOwnPropertyNames` and `Reflect.ownKeys` differ?"
  back: "`Object.keys`: own enumerable string keys. `getOwnPropertyNames`: own strings including non-enumerable. `Reflect.ownKeys`: own strings and symbols, enumerable or not. None include inherited keys."
  question: javascript/objects-and-properties/enumerating-properties
- id: for-in-shadowing
  front: "Does `for…in` visit an inherited enumerable key when the object has a non-enumerable own key of the same name?"
  back: "No. The spec tracks visited names regardless of enumerability, so the own non-enumerable property shadows the inherited one."
  question: javascript/objects-and-properties/enumerating-properties
- id: object-hasown
  front: "Why prefer `Object.hasOwn(obj, key)` over `obj.hasOwnProperty(key)`?"
  back: "It works on `Object.create(null)` objects and on objects that define their own `hasOwnProperty`, where the method call fails with `TypeError`. `'k' in obj` also searches the prototype chain."
  question: javascript/objects-and-properties/enumerating-properties
- id: object-keys-primitive-null
  front: "What do `Object.keys('ab')` and `Object.keys(null)` do, versus `for…in` over `null`?"
  back: "`Object.keys('ab')` coerces with `ToObject` and returns `['0','1']`. `null` and `undefined` throw `TypeError`, while `for…in` over them does nothing."
  question: javascript/objects-and-properties/enumerating-properties
- id: shallow-copy-shares-nested
  front: "What does a shallow copy share with the original?"
  back: "Nested objects, by reference. Only the top level is new, so `{ ...state }` followed by `next.user.name = 'x'` also changes `state.user.name`."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: structured-clone-cycles
  front: "How does `structuredClone` handle cycles and shared references?"
  back: "It records each seen object in a memory map, so cycles and shared references are preserved: two properties pointing at one object still point at one object in the clone."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: structured-clone-throws
  front: "What does `structuredClone` throw `DataCloneError` for?"
  back: "Functions (including methods), symbol values, `Promise`, `WeakMap`/`WeakSet`, `Proxy`, and non-serializable platform objects such as DOM nodes."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: structured-clone-class-instance
  front: "What does `structuredClone` return for a class instance?"
  back: "A plain `Object` with its data and no methods or prototype chain. Symbol keys and non-enumerable properties are dropped, and a frozen object comes back unfrozen."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: json-clone-losses
  front: "What does `JSON.parse(JSON.stringify(x))` lose or break on?"
  back: "It drops `undefined` and functions, turns `Date` into a string, `Map` into `{}` and `NaN` into `null`, and throws on cycles and `BigInt`."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: assign-proto-pollution
  front: "Why is `Object.assign` riskier than spread for untrusted parsed JSON?"
  back: "A parsed own `__proto__` key reaches `[[Set]]` and changes the target's prototype. Spread defines it as an ordinary property."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: object-identity-equality
  front: "Are `{} === {}` and `Object.is({}, {})` true?"
  back: "Both are `false`. Objects compare by reference. Deep equality must compare structure, and each step is a policy decision such as whether `-0` equals `0`."
  question: javascript/objects-and-properties/deep-equality
- id: deep-equal-cycle-guard
  front: "How does a deep-equality function avoid infinite recursion on cycles?"
  back: "It remembers the `(a, b)` pairs currently being compared and assumes equal when a pair repeats. Without the guard, self-referencing data overflows the stack with `RangeError`."
  question: javascript/objects-and-properties/deep-equality
- id: json-stringify-equality-trap
  front: "Why is `JSON.stringify(a) === JSON.stringify(b)` unreliable for equality?"
  back: "It depends on key order, turns `NaN` into `null`, drops `undefined` and functions, and throws on cycles and `BigInt`. Unequal values can stringify identically."
  question: javascript/objects-and-properties/deep-equality
- id: deep-equal-prototype-check
  front: "Why should a deep-equality function compare prototypes?"
  back: "Otherwise instances of different classes with the same fields compare equal. It is a policy choice; `util.isDeepStrictEqual` treats them as different."
  question: javascript/objects-and-properties/deep-equality
# 12 Prototypes
- id: prototype-write-shadows
  front: "After `dog.kind = 'dog'` where `kind` is inherited from a prototype, which object changed?"
  back: "Only `dog`. The write creates a new own property that shadows the inherited one. The prototype is untouched, unless an inherited setter or non-writable property intercepts the write."
  question: javascript/prototypes/prototype-chain
- id: prototype-inherited-setter-this
  front: "When an inherited setter runs on `obj.key = value`, what is `this`?"
  back: "`obj`, the object the assignment started from, not the prototype where the setter was found. Inherited getters behave the same way: they are called with the original object as `this`."
  question: javascript/prototypes/prototype-chain
- id: prototype-nonwritable-blocks-write
  front: "What happens when you assign to a property whose inherited data property is non-writable?"
  back: "The write is blocked. Sloppy mode ignores it silently; strict mode (modules, classes) throws `TypeError`. No own property is created."
  question: javascript/prototypes/prototype-chain
- id: prototype-shared-mutable-state
  front: "Why does `dog.tags.push('x')` change `base.tags` when `tags` lives on the prototype?"
  back: "Reading `dog.tags` finds the shared array on the prototype, and `push` mutates it. Only assignment creates an own property; mutating an inherited object reaches the shared value."
  question: javascript/prototypes/prototype-chain
- id: proto-slot-vs-prototype-property
  front: "Is `F.prototype` the prototype of `F`?"
  back: "No. `F.prototype` is the object `new F()` uses as the `[[Prototype]]` of new instances. `F`'s own prototype is `Function.prototype`, as `Object.getPrototypeOf(F)` shows."
  question: javascript/prototypes/proto-vs-prototype
- id: dunder-proto-legacy-accessor
  front: "What is `obj.__proto__`, and why does `Object.create(null)` have no such property?"
  back: "A legacy accessor property on `Object.prototype` that calls `[[GetPrototypeOf]]` / `[[SetPrototypeOf]]` on `this`. Objects without `Object.prototype` in their chain do not inherit it."
  question: javascript/prototypes/proto-vs-prototype
- id: constructor-lost-on-prototype-replace
  front: "What happens to `constructor` if you assign a new object to `F.prototype`?"
  back: "It is lost. Only the default `prototype` object has a non-enumerable `constructor` pointing back at `F`. A replacement object inherits `constructor` from `Object.prototype`, so `obj.constructor` returns `Object`."
  question: javascript/prototypes/proto-vs-prototype
- id: prototype-replace-existing-instances
  front: "After `F.prototype` is reassigned, which instances use the new prototype?"
  back: "Only instances created afterwards. Existing instances keep their old `[[Prototype]]` link. Because `instanceof` compares against the current `F.prototype`, old instances then fail `instanceof F`."
  question: javascript/prototypes/proto-vs-prototype
- id: new-object-return-rule
  front: "What does `new F()` return if the constructor returns a primitive, and if it returns an object?"
  back: "A primitive return value is ignored and the new instance is the result. An object return value (including a function or array) replaces the instance, and the original is discarded."
  question: javascript/prototypes/new-operator
- id: new-four-steps
  front: "What four things does `new F(...args)` do for an ordinary function?"
  back: "Creates an ordinary object, links its `[[Prototype]]` to `newTarget.prototype`, calls `F` with `this` bound to it, then returns the object unless `F` returned an object."
  question: javascript/prototypes/new-operator
- id: new-target-meaning
  front: "What is `new.target` inside a function?"
  back: "The constructor `new` was applied to, or `undefined` in a plain call. In a subclass it is the subclass even inside the parent's constructor, so the right prototype gets linked."
  question: javascript/prototypes/new-operator
- id: new-derived-constructor-return
  front: "What may a derived class constructor return, and when does it get `this`?"
  back: "Only an object or `undefined`; anything else throws `TypeError`. `this` is not created until `super()` returns."
  question: javascript/prototypes/new-operator
- id: instanceof-algorithm
  front: "What does `value instanceof Target` actually test?"
  back: "Whether `Target.prototype` is in `value`'s prototype chain right now. It does not check who constructed `value`. Before that walk, `Target[Symbol.hasInstance]` is consulted, and a primitive `value` gives `false`."
  question: javascript/prototypes/instanceof
- id: instanceof-cross-realm
  front: "Why can `otherArray instanceof Array` be `false` for an array from an iframe?"
  back: "Each realm has its own `Array.prototype`, so the iframe's array chain does not contain this realm's one. Use `Array.isArray` instead."
  question: javascript/prototypes/instanceof
- id: instanceof-bound-function
  front: "How does `x instanceof BoundFn` work when bound functions have no `prototype`?"
  back: "`OrdinaryHasInstance` forwards the check to the bound target function and tests against that function's `prototype`."
  question: javascript/prototypes/instanceof
- id: is-prototype-of-vs-instanceof
  front: "How does `proto.isPrototypeOf(obj)` differ from `obj instanceof Ctor`?"
  back: "Same chain walk, different input. `isPrototypeOf` takes the prototype object directly and returns `false` for primitives; `instanceof` takes a constructor and reads its `prototype`."
  question: javascript/prototypes/instanceof
- id: null-proto-dictionary-collisions
  front: "Why is a plain `{}` risky as a counter keyed by user input?"
  back: "Keys such as `constructor`, `toString` and `__proto__` collide with inherited members. `'toString' in table` is truthy unprompted, and assigning `__proto__` changes the prototype instead of storing a key."
  question: javascript/prototypes/object-create-null
- id: null-proto-missing-methods
  front: "What breaks on an `Object.create(null)` object?"
  back: "It has no `toString`, `valueOf` or `hasOwnProperty`: string conversion throws `TypeError`, and `dict.hasOwnProperty(key)` fails. Use `Object.hasOwn(dict, key)`. Also `dict instanceof Object` is `false`."
  question: javascript/prototypes/object-create-null
- id: null-proto-spread-loses
  front: "Does `{ ...dict }` keep a null prototype?"
  back: "No. Spread and `Object.assign({}, dict)` return ordinary objects with `Object.prototype`, so the null prototype is lost."
  question: javascript/prototypes/object-create-null
- id: json-parse-proto-key
  front: "What does `JSON.parse('{\"__proto__\": 1}')` produce?"
  back: "An object with an own data property named `__proto__` and an unchanged prototype. The danger comes later, when code copies or merges keys with assignment."
  question: javascript/prototypes/object-create-null
- id: monkey-patch-enumerable-leak
  front: "Why does `Array.prototype.last = fn` break `for...in` over arrays?"
  back: "Plain assignment creates an enumerable property, so every array's `for...in` now yields `last`. Built-in methods are non-enumerable."
  question: javascript/prototypes/extending-native-prototypes
- id: smooshgate-flatten-rename
  front: "Why was `Array.prototype.flatten` renamed `flat`?"
  back: "MooTools defined its own enumerable `flatten` and copied `Array.prototype` keys with `for...in`. A native non-enumerable `flatten` was skipped by that copy, breaking sites. Making it enumerable would leak into every `for...in`."
  question: javascript/prototypes/extending-native-prototypes
- id: safe-polyfill-shape
  front: "What makes a polyfill acceptable when extending a built-in prototype?"
  back: "It feature-tests first (`if (!Array.prototype.at)`), follows the spec's behaviour, and uses `Object.defineProperty` so the property is non-enumerable like built-ins."
  question: javascript/prototypes/extending-native-prototypes
# 13 Classes
- id: class-not-pure-sugar-call
  front: "Why is `class` not pure sugar over constructor functions?"
  back: "Class constructors throw `TypeError` without `new`, methods are non-enumerable and not constructors, the body is strict, the binding has a TDZ, and derived constructors have no `this` before `super()`."
  question: javascript/classes/classes-vs-prototypes
- id: class-methods-location-attributes
  front: "Where do class instance methods live, and with what attributes?"
  back: "On `Class.prototype`, as writable, configurable, non-enumerable properties. Static methods live on the constructor itself."
  question: javascript/classes/classes-vs-prototypes
- id: class-declaration-tdz
  front: "Is a class declaration hoisted like a function declaration?"
  back: "No. It is hoisted like `let`: using it before its line throws `ReferenceError` because the binding is in the TDZ."
  question: javascript/classes/classes-vs-prototypes
- id: private-name-not-property
  front: "Why does `obj['#x']` not reach the private field `#x`?"
  back: "A `#x` is a Private Name stored in the object's `[[PrivateElements]]`, not a property. `obj['#x']` is an unrelated ordinary string key, and `obj.#x` outside the class is a `SyntaxError`."
  question: javascript/classes/private-fields
- id: private-freeze-proxy
  front: "What do `Object.freeze` and `Proxy` do to private fields?"
  back: "Neither affects them. Freezing does not stop writes to private fields, and a proxy cannot intercept them: accessing `#x` through a proxy throws `TypeError` because the proxy has no such private element."
  question: javascript/classes/private-fields
- id: private-brand-check
  front: "How do you safely test whether an object has a private field, without throwing?"
  back: "Use `#x in obj`, which returns a boolean. Reading a missing private element throws `TypeError`. The `in` form itself throws only for non-objects."
  question: javascript/classes/private-fields
- id: private-names-per-class-evaluation
  front: "Do two evaluations of the same class expression share their private names?"
  back: "No. Each evaluation creates fresh Private Names, so instances from different evaluations fail `#x in obj` for each other's `#x`."
  question: javascript/classes/private-fields
- id: field-define-semantics
  front: "Does a class field call an inherited setter?"
  back: "No. Fields use define semantics (`CreateDataPropertyOrThrow`), so they shadow inherited setters and read-only properties. A `this.x = ...` assignment in the constructor does call the setter."
  question: javascript/classes/fields-vs-methods
- id: field-init-timing-derived
  front: "When are fields defined in a base class versus a derived class?"
  back: "Base class: just before the constructor body runs. Derived class: right after `super()` returns, so a base constructor cannot see the subclass's fields (they read as `undefined`)."
  question: javascript/classes/fields-vs-methods
- id: arrow-field-tradeoff
  front: "What does an arrow-function class field gain and cost compared with a method?"
  back: "It captures the instance as `this`, so it survives being passed as a callback. It costs a new closure per instance and shadows the prototype, so subclasses cannot override it with `super.method()`."
  question: javascript/classes/fields-vs-methods
- id: field-declaration-without-value
  front: "Is declaring `x;` in a class the same as not declaring it?"
  back: "No. It defines an own property `x` with value `undefined`, so `'x' in obj` is `true` and it appears in `Object.keys`."
  question: javascript/classes/fields-vs-methods
- id: static-inheritance-mechanism
  front: "How does a subclass inherit static members?"
  back: "`class B extends A` sets `B.[[Prototype]]` to `A`, so `B.method` is found by lookup. Statics are shared by lookup, not copied."
  question: javascript/classes/static-members-and-blocks
- id: static-block-semantics
  front: "When do static blocks run, and what scope do they have?"
  back: "Once, during class evaluation, in source order interleaved with static fields. `this` is the class, and the block has its own function-like scope. `await`, `arguments` and `return` are syntax errors."
  question: javascript/classes/static-members-and-blocks
- id: static-this-inherited-write
  front: "Why can `++this.count` in an inherited static method leave the parent's `count` unchanged?"
  back: "The read finds the parent's `count` through the chain, but the write creates an own `count` on the subclass. Reference the class by name for one shared value."
  question: javascript/classes/static-members-and-blocks
- id: static-private-subclass
  front: "Why does `this.#items` in a static method throw when called on a subclass?"
  back: "Static private members are not inherited. The subclass has no such private element, so the lookup throws `TypeError`. Use the class name, such as `Store.#items`."
  question: javascript/classes/static-members-and-blocks
- id: super-call-steps
  front: "What does `super(...args)` do in a derived constructor?"
  back: "Constructs the parent (the constructor's `[[GetPrototypeOf]]`) with the original `new.target`, binds the result as `this`, then initialises this class's fields and private methods."
  question: javascript/classes/super-keyword
- id: super-property-home-object
  front: "How is `super.x` resolved in a method?"
  back: "From the method's `[[HomeObject]]`: take its prototype and look up `x` there. Getters and methods run with the current `this` as receiver. `super.x = v` sets on `this`, not on the parent."
  question: javascript/classes/super-keyword
- id: super-this-before-call
  front: "What happens if a derived constructor reads `this` before calling `super()`?"
  back: "`ReferenceError`, not `undefined`. `this` is uninitialised until `super()` returns. Calling `super()` twice also throws `ReferenceError`."
  question: javascript/classes/super-keyword
- id: super-parent-fields-undefined
  front: "Why is `super.x` `undefined` when the parent declares `x` as a field?"
  back: "Fields are own properties of instances, not members of the parent's prototype, and `super.x` looks up from the home object's prototype."
  question: javascript/classes/super-keyword
- id: extends-array-new-target
  front: "Why does `class Stack extends Array` produce a real array, while ES5 `Array.call(this)` does not?"
  back: "`super(...)` passes `new.target` to `Array`, which allocates the exotic array with the subclass prototype. `Array.call(this)` cannot forward `new.target`, so it creates and discards an exotic array."
  question: javascript/classes/extending-built-ins
- id: symbol-species-effect
  front: "What does `Symbol.species` control on an `Array` subclass?"
  back: "The constructor that `map`, `filter`, `slice`, `concat`, `flat` and `flatMap` use for their results. The default returns the subclass, called with a length. Returning `Array` yields plain arrays."
  question: javascript/classes/extending-built-ins
- id: error-subclass-name-default
  front: "What is `new E('m').name` for `class E extends Error {}`?"
  back: "`'Error'`. `name` is inherited unless you set it, so logs and `String(err)` show `Error`. Call `super(message, options)` so `cause` works."
  question: javascript/classes/extending-built-ins
- id: composition-vs-extends-rule
  front: "When is `extends` appropriate rather than composition?"
  back: "When the child is a substitutable kind of the parent, the hierarchy is shallow, and the parent was written to be extended. Otherwise hold a collaborator, preferably in a private field, and delegate."
  question: javascript/classes/composition-vs-inheritance
- id: mixin-subclass-factory
  front: "What is the subclass-factory mixin pattern, and why does `instanceof` fail on it?"
  back: "`const M = (Base) => class extends Base { ... }` keeps the chain linear and `super` working. Each call returns a distinct class, so `instanceof M` is unreliable."
  question: javascript/classes/composition-vs-inheritance
- id: object-assign-mixin-flaw
  front: "Why is `Object.assign(Target.prototype, mixin)` a flawed mixin?"
  back: "It copies only own enumerable properties, invokes getters instead of copying them, and a method using `super` keeps its original home object. It is a snapshot with no live chain."
  question: javascript/classes/composition-vs-inheritance
# 14 Arrays
- id: array-mutators-return-values
  front: "Which array mutators return the same array, and which do not?"
  back: "`sort`, `reverse`, `fill` and `copyWithin` return the same array, so `const sorted = arr.sort()` aliases `arr`. `push` returns the new length and `splice` returns the removed items."
  question: javascript/arrays/mutating-vs-copying-methods
- id: es2023-copying-counterparts
  front: "What are the ES2023 copying counterparts of `reverse`, `sort`, `splice` and `arr[i] = v`?"
  back: "`toReversed()`, `toSorted(cmp)`, `toSpliced(start, n, ...items)` and `with(i, v)`. They never touch `this`, so they work on frozen arrays."
  question: javascript/arrays/mutating-vs-copying-methods
- id: copying-methods-shallow-plain-array
  front: "What kind of array do `toSorted` and `with` return, and how deep is the copy?"
  back: "Always a plain `Array` (`ArrayCreate`), ignoring `constructor` and `Symbol.species`, unlike `slice`, `map` or `filter`. The copy is shallow: elements keep the same object references."
  question: javascript/arrays/mutating-vs-copying-methods
- id: with-out-of-bounds
  front: "How does `arr.with(i, v)` differ from `arr[i] = v` for an out-of-bounds index?"
  back: "`with` throws `RangeError` for an out-of-bounds index (negative indices count from the end). `arr[10] = v` extends the array."
  question: javascript/arrays/mutating-vs-copying-methods
- id: sort-default-string-order
  front: "Why does `[10, 9, 1, 100].sort()` give `[1, 10, 100, 9]`?"
  back: "With no comparator, elements are converted with `ToString` and compared by UTF-16 code units, so numbers sort as text."
  question: javascript/arrays/array-sort
- id: sort-boolean-comparator
  front: "Why is `(a, b) => a > b` a wrong sort comparator?"
  back: "It returns `true` or `false`, which become `1` and `0`, so it can never say \"less than\". The comparator must return negative, positive or zero. Results are implementation-defined."
  question: javascript/arrays/array-sort
- id: sort-stability-es2019
  front: "What does the spec guarantee about `sort` stability?"
  back: "Since ES2019 the sort must be stable: elements the comparator calls equal keep their original relative order."
  question: javascript/arrays/array-sort
- id: sort-undefined-and-holes
  front: "Where do `undefined` values and holes go in `sort`, and does the comparator see them?"
  back: "`undefined` values are never passed to the comparator. They move to the end, followed by holes. `toSorted` reads holes as `undefined` instead."
  question: javascript/arrays/array-sort
- id: sort-random-comparator-shuffle
  front: "Why is `sort(() => Math.random() - 0.5)` not a correct shuffle?"
  back: "An inconsistent comparator (not the same answer for the same pair, not transitive) makes the resulting order implementation-defined."
  question: javascript/arrays/array-sort
- id: sort-subtraction-comparator-nan
  front: "When does the comparator `(a, b) => a - b` fail?"
  back: "When values can be `NaN` or `Infinity`: `Infinity - Infinity` is `NaN`, which the spec treats as `0` (equal). It is safe only for finite numbers."
  question: javascript/arrays/array-sort
- id: parseint-map-radix
  front: "Why does `['1', '2', '3'].map(parseInt)` return `[1, NaN, NaN]`?"
  back: "`map` passes the index as the second argument, and `parseInt` reads it as the radix."
  question: javascript/arrays/implement-map-filter-reduce
- id: reduce-initial-value-detection
  front: "Why does a `reduce` implementation check the argument count rather than `initialValue === undefined`?"
  back: "`reduce(fn, undefined)` is a legitimate initial value. Only the number of arguments tells \"no initial value\" apart from an explicit `undefined`."
  question: javascript/arrays/implement-map-filter-reduce
- id: reduce-empty-no-initial
  front: "What does `reduce` do on an empty array with no initial value, and what is the accumulator otherwise?"
  back: "It throws `TypeError`. With no initial value on a non-empty array, the first element becomes the accumulator and the loop starts at index 1."
  question: javascript/arrays/implement-map-filter-reduce
- id: map-hole-preserved
  front: "What does native `map` do with a hole in `[1, , 3]`?"
  back: "It skips the hole and leaves a hole at the same index in the result, giving `[2, <1 empty item>, 6]`."
  question: javascript/arrays/implement-map-filter-reduce
- id: array-length-semantics
  front: "How does `length` react to writes?"
  back: "Setting an index at or beyond `length` raises it to `index + 1`. Setting `length` lower deletes elements at or above it. Raising it creates no properties."
  question: javascript/arrays/sparse-arrays
- id: hole-vs-undefined
  front: "How does a hole differ from a stored `undefined`?"
  back: "A hole is an index below `length` with no own property, so `i in arr` is `false`. A stored `undefined` has the property, so `i in arr` is `true`."
  question: javascript/arrays/sparse-arrays
- id: hole-skipping-methods
  front: "Which iteration methods skip holes and which read them as `undefined`?"
  back: "Skip: `forEach`, `map`, `filter`, `reduce`, `some`, `every`, `indexOf`. Read as `undefined`: `includes`, `find`, `join`, spread, `for...of`, `Array.from`."
  question: javascript/arrays/sparse-arrays
- id: new-array-map-noop
  front: "Why does `new Array(3).map(fn)` do nothing?"
  back: "Every index is a hole and `map` skips holes. Use `Array.from({ length: 3 }, fn)` or `new Array(3).fill().map(fn)`."
  question: javascript/arrays/sparse-arrays
- id: array-max-index
  front: "What is the largest array index, and what happens to `arr[2**32 - 1] = x`?"
  back: "The largest index is 2³²−2. The key 2³²−1 is not an array index, so it becomes an ordinary property and `length` does not change."
  question: javascript/arrays/sparse-arrays
- id: delete-array-element-length
  front: "Why does `delete arr[i]` leave `length` unchanged?"
  back: "`delete` only removes the property, creating a hole. `length` changes only when a property is added at or above it or when you assign it. Use `splice` to remove and shift."
  question: javascript/arrays/sparse-arrays
- id: iterable-vs-array-like
  front: "What is the difference between an iterable and an array-like, and which works with spread?"
  back: "An iterable implements `[Symbol.iterator]()`; an array-like has `length` and indexed properties. Spread and `for...of` need an iterable, so `[...{ length: 2 }]` throws `TypeError`. `Array.from` accepts both."
  question: javascript/arrays/array-from-and-fromasync
- id: array-from-source-order
  front: "In what order does `Array.from(items)` decide how to read `items`?"
  back: "If `items` has `Symbol.iterator`, it steps the iterator. Otherwise it treats `items` as an array-like, reading `length` and indices, with missing indices becoming `undefined`. `null` or `undefined` throw `TypeError`."
  question: javascript/arrays/array-from-and-fromasync
- id: array-from-mapper-args
  front: "What arguments does the `Array.from` mapper receive?"
  back: "Only `(value, index)`, and it runs as values are produced, so there is no intermediate array."
  question: javascript/arrays/array-from-and-fromasync
- id: array-of-vs-array-ctor
  front: "How does `Array.of(7)` differ from `Array(7)`?"
  back: "`Array.of(7)` builds `[7]` from its arguments. `Array(7)` creates length 7 with seven holes."
  question: javascript/arrays/array-from-and-fromasync
- id: from-async-sequential
  front: "Does `Array.fromAsync` process items concurrently?"
  back: "No. It requests the next item, awaits it, and only then asks for the following one; the mapper's result is awaited too. For parallel work, start the promises first and use `Promise.all`."
  question: javascript/arrays/array-from-and-fromasync
- id: includes-vs-indexof-nan
  front: "Why is `[NaN].includes(NaN)` true but `[NaN].indexOf(NaN)` is `-1`?"
  back: "`includes` uses SameValueZero, which treats `NaN` as equal to itself. `indexOf` uses strict equality, where `NaN !== NaN`."
  question: javascript/arrays/searching-arrays
- id: includes-indexof-holes
  front: "How do `includes` and `indexOf` treat holes?"
  back: "`indexOf` skips holes (it checks `HasProperty`), while `includes` reads them as `undefined`, so `[ , ].includes(undefined)` is `true`."
  question: javascript/arrays/searching-arrays
- id: find-undefined-ambiguity
  front: "Why can `find` be ambiguous, and what do you use instead?"
  back: "It returns `undefined` for no match, which is also a valid element, and a found `0`, `''` or `false` looks like a miss when tested for truthiness. Use `findIndex`, or `some` for a boolean."
  question: javascript/arrays/searching-arrays
- id: at-negative-index
  front: "Why does `arr.at(-1)` work when `arr[-1]` gives `undefined`?"
  back: "`at` counts negative integers from the end. `arr[-1]` is just a lookup of the property `\"-1\"`, which does not exist."
  question: javascript/arrays/searching-arrays
- id: find-last-es2023
  front: "What do `findLast` and `findLastIndex` add?"
  back: "They scan from the end (ES2023), avoiding `arr.slice().reverse().find(...)`. No match returns `undefined` or `-1`."
  question: javascript/arrays/searching-arrays
- id: flat-default-depth
  front: "What is the default depth of `flat`, and what does `flat(Infinity)` do?"
  back: "The default is `1`, so `[1, [2, [3]]].flat()` is `[1, 2, [3]]`. `flat(Infinity)` flattens every level. The depth goes through `ToIntegerOrInfinity`, so `NaN` is `0`."
  question: javascript/arrays/flat-and-flatmap
- id: flatmap-one-level
  front: "How many levels does `flatMap` flatten, and what is it equivalent to?"
  back: "Exactly one level, equivalent to `map(fn).flat(1)` but with one array allocation. Returning `[]` drops an element, so `[1].flatMap(() => [[2]])` gives `[[2]]`."
  question: javascript/arrays/flat-and-flatmap
- id: flat-only-real-arrays
  front: "Which values does `flat` flatten, and what happens to holes?"
  back: "Only values where `Array.isArray` is true. Array-likes, `Set`s, strings and typed arrays stay as single elements. Holes are skipped, so `flat` removes them."
  question: javascript/arrays/flat-and-flatmap
# 15 Keyed collections
- id: map-key-types-and-equality
  front: "How does a `Map` compare keys, and how does that differ from object keys?"
  back: "SameValueZero: any key type, `NaN` usable, `-0` normalised to `+0`, objects by identity. Object keys are strings or symbols, so `obj[user]` stores under `\"[object Object]\"`."
  question: javascript/keyed-collections/map-vs-object
- id: map-vs-object-order
  front: "How does key iteration order differ between a `Map` and an object?"
  back: "A `Map` iterates strictly in insertion order. An object lists integer-like keys first in ascending order, then strings in creation order."
  question: javascript/keyed-collections/map-vs-object
- id: map-property-assignment-trap
  front: "What does `map.foo = 1` do on a `Map`?"
  back: "It adds an ordinary property to the `Map` object, not an entry. `size` stays `0` and `has('foo')` is `false`. Use `set`, `get`, `has` and `delete`."
  question: javascript/keyed-collections/map-vs-object
- id: map-json-stringify-empty
  front: "What does `JSON.stringify(new Map([[1, 2]]))` return?"
  back: "`'{}'`, since entries are not properties. Serialise with `[...map]` or `Object.fromEntries`, and rebuild with `new Map(entries)`."
  question: javascript/keyed-collections/map-vs-object
- id: map-update-keeps-position
  front: "Does updating an existing `Map` key move it in iteration order?"
  back: "No, updating keeps its position. Deleting and re-adding the key moves it to the end because the spec appends a new entry."
  question: javascript/keyed-collections/map-vs-object
- id: set-methods-set-like-arg
  front: "What argument types do `Set.prototype.union` and friends accept?"
  back: "A set-like object: one with `size`, `has` and `keys`. A `Map` qualifies, an array does not (no `size`), so `a.union([5])` throws `TypeError`. Wrap it with `new Set(array)`."
  question: javascript/keyed-collections/set-methods
- id: set-methods-non-mutating
  front: "Do `union`, `intersection`, `difference` and `symmetricDifference` mutate the receiver?"
  back: "No. Each returns a fresh plain `Set`, never a subclass instance, and the original is unchanged."
  question: javascript/keyed-collections/set-methods
- id: set-methods-predicates
  front: "What do `isSubsetOf`, `isSupersetOf` and `isDisjointFrom` return?"
  back: "Booleans. `a.isSubsetOf(b)`: every member of `a` is in `b`. `a.isSupersetOf(b)`: every member of `b` is in `a`. `a.isDisjointFrom(b)`: they share no member."
  question: javascript/keyed-collections/set-methods
- id: set-size-validation
  front: "How is the `size` of a set-like argument validated by the new `Set` methods?"
  back: "It must convert to a number that is not `NaN` (else `TypeError`) and not negative (else `RangeError`). `has` and `keys` must be callable."
  question: javascript/keyed-collections/set-methods
- id: weakmap-key-types
  front: "What can be a `WeakMap` key or `WeakSet` member?"
  back: "Objects and symbols not in the global registry (`CanBeHeldWeakly`). Strings and numbers throw `TypeError` on `set` or `add`. `Symbol.for` symbols are rejected because they can be recreated from the string."
  question: javascript/keyed-collections/weakmap-weakset
- id: weakmap-not-iterable-why
  front: "Why do `WeakMap` and `WeakSet` have no `size`, iteration or `clear`?"
  back: "The engine may drop entries some time after a key becomes unreachable, so listing them or reading `size` would depend on when garbage collection ran. Only operations where you hold the key are allowed."
  question: javascript/keyed-collections/weakmap-weakset
- id: map-cache-leak
  front: "Why is a `Map` a leak risk as a per-object cache?"
  back: "It holds keys strongly, so every key object and its value stay reachable until you delete the entry. A `WeakMap` does not keep the key alive."
  question: javascript/keyed-collections/weakmap-weakset
- id: weakmap-value-key-cycle
  front: "Does a `WeakMap` value that references its own key keep the key alive?"
  back: "No. The value is reachable only through the key, and the liveness rule says a non-live key does not make its value live."
  question: javascript/keyed-collections/weakmap-weakset
- id: groupby-key-handling
  front: "How do `Object.groupBy` and `Map.groupBy` treat keys differently?"
  back: "`Object.groupBy` applies `ToPropertyKey` (string or symbol) and returns a null-prototype object. `Map.groupBy` keeps keys as is, using SameValueZero, and returns a `Map` in first-seen order."
  question: javascript/keyed-collections/groupby
- id: groupby-object-key-merge
  front: "What goes wrong using object keys with `Object.groupBy`?"
  back: "Keys are coerced with `ToPropertyKey`, so every object becomes `\"[object Object]\"` (unless it defines `toString`) and the groups merge. Use `Map.groupBy`."
  question: javascript/keyed-collections/groupby
- id: groupby-integer-key-order
  front: "What order are `Object.groupBy` result keys in?"
  back: "Integer-like keys ascending first, then other keys in creation order. `Object.keys(Object.groupBy(['b', '10', '2'], (x) => x))` is `['2', '10', 'b']`."
  question: javascript/keyed-collections/groupby
- id: groupby-input-and-callback
  front: "What must `groupBy` receive, and what does the callback get?"
  back: "An iterable (else `TypeError`) and a callable. The callback receives `(value, index)` once per element in order, and groups hold the original element references, not copies."
  question: javascript/keyed-collections/groupby
- id: get-or-insert-eager-argument
  front: "Why prefer `getOrInsertComputed(key, () => [])` over `getOrInsert(key, [])`?"
  back: "The argument to `getOrInsert` is evaluated on every call, so a new array is allocated even when the key exists. The callback runs only on a miss."
  question: javascript/keyed-collections/map-upsert
- id: get-or-insert-no-overwrite
  front: "Does `getOrInsert` overwrite an existing key's value?"
  back: "No. It returns the existing value if the key is present, even a stored `undefined`, and otherwise stores and returns the new value. Use `set` to overwrite."
  question: javascript/keyed-collections/map-upsert
- id: get-or-insert-availability
  front: "Is `Map.prototype.getOrInsert` safe to call without a feature check?"
  back: "No. It is a newly available feature (MDN: Baseline 2026), and it was absent in the Node 24.19 runs in this repo. Feature-detect it or use a helper."
  question: javascript/keyed-collections/map-upsert
- id: get-or-insert-computed-callback
  front: "What does `getOrInsertComputed` pass to its callback?"
  back: "The key, as `callback(key)`, called with `undefined` as `this`, and only when the key is missing. A non-callable callback throws `TypeError`."
  question: javascript/keyed-collections/map-upsert
# 16 Iterators and generators
- id: iterable-vs-iterator-contract
  front: "What is the difference between an iterable and an iterator?"
  back: "An iterable has a `[Symbol.iterator]()` method that returns an iterator. An iterator has a `next()` method returning `{ value, done }`. A missing `done` counts as `false`."
  question: javascript/iterators-and-generators/iteration-protocols
- id: array-is-iterable-not-iterator
  front: "Is an array an iterator?"
  back: "No, it is an iterable. `array[Symbol.iterator]()` returns a separate Array Iterator with `next()`, which is why you can loop over the same array twice."
  question: javascript/iterators-and-generators/iteration-protocols
- id: iterator-return-early-exit
  front: "When do consumers call `iterator.return()`?"
  back: "On early exit: `break`, `return`, or a `throw` in a `for...of` body, and array destructuring that finishes before the iterator is done. Normal exhaustion does not call it."
  question: javascript/iterators-and-generators/iteration-protocols
- id: builtin-iterator-self-iterable
  front: "Why can you pass a built-in iterator to `for...of`, but not a hand-written `{ next() {} }`?"
  back: "Built-in iterators inherit `Iterator.prototype[Symbol.iterator]`, which returns `this`. A hand-written iterator throws `TypeError` unless it defines `[Symbol.iterator]`."
  question: javascript/iterators-and-generators/iteration-protocols
- id: iterable-fresh-iterator-per-call
  front: "Why should `[Symbol.iterator]()` return a fresh iterator each call?"
  back: "If it returns the same object, a second `for...of` continues where the first stopped or sees nothing. Generators are deliberately single-use."
  question: javascript/iterators-and-generators/iteration-protocols
- id: generator-call-runs-nothing
  front: "What does calling a generator function run?"
  back: "Only argument and default-parameter evaluation. It returns a generator object in the suspended-start state; the body runs on the first `next()`."
  question: javascript/iterators-and-generators/generators
- id: generator-first-next-arg-dropped
  front: "What happens to the argument of the first `next(x)` on a generator?"
  back: "It is ignored, because no `yield` is waiting to receive it. Later `next(arg)` calls make `arg` the value of the suspended `yield` expression."
  question: javascript/iterators-and-generators/generators
- id: generator-return-throw
  front: "What do `gen.return(v)` and `gen.throw(e)` do at a suspended `yield`?"
  back: "They resume with an abrupt completion: `return v` or `throw e` at that point. `finally` blocks run, and a surrounding `try...catch` can handle the throw."
  question: javascript/iterators-and-generators/generators
- id: generator-return-value-hidden
  front: "Why does `for...of` over a generator not see its `return 2` value?"
  back: "`for...of`, spread and `Array.from` ignore the `value` of the `done: true` result. `yield*` gives you the inner iterator's return value."
  question: javascript/iterators-and-generators/generators
- id: generator-return-finally-yield
  front: "Can `gen.return()` always finish a generator immediately?"
  back: "No. A `yield` inside `finally` suspends it again and `return()` gives `done: false`."
  question: javascript/iterators-and-generators/generators
- id: generator-stackless-coroutine
  front: "What kind of coroutine is a generator?"
  back: "A stackless one. It suspends only at its own `yield` expressions, not from nested calls, and runs on the one thread. Delegating to another generator needs `yield*`."
  question: javascript/iterators-and-generators/generators
- id: iterator-helpers-lazy-pull
  front: "Why do chained iterator helpers create no intermediate arrays?"
  back: "Lazy helpers do nothing until `next()` is called. Each pull sends one element through `filter`, `map` and `take` before the next is read, so infinite sources work."
  question: javascript/iterators-and-generators/iterator-helpers
- id: iterator-helper-lazy-vs-eager
  front: "Which iterator helpers are lazy and which consume the iterator?"
  back: "Lazy, returning iterators: `map`, `filter`, `take`, `drop`, `flatMap`. Eager: `reduce`, `toArray`, `forEach`, `some`, `every`, `find`."
  question: javascript/iterators-and-generators/iterator-helpers
- id: iterator-helpers-not-on-arrays
  front: "Why is `[1, 2].take(1)` not a function, and how do you fix it?"
  back: "Arrays do not inherit from `Iterator.prototype`. Use `array.values()`. A hand-written `{ next() {} }` object also needs wrapping with `Iterator.from`."
  question: javascript/iterators-and-generators/iterator-helpers
- id: iterator-take-closes-source
  front: "When does `take(n)` close its source?"
  back: "On the call after the n-th value is delivered. It checks its remaining count before pulling, so it never fetches an n+1-th element, then calls the source's `return()` so `finally` runs."
  question: javascript/iterators-and-generators/iterator-helpers
- id: iterator-helper-single-use
  front: "What happens if you call `toArray()` twice on the same helper chain?"
  back: "The second call gives `[]`: helpers are single-use and the source is already exhausted."
  question: javascript/iterators-and-generators/iterator-helpers
- id: iterator-zip-modes
  front: "What are the `mode` options of `Iterator.zip`, and which is the default?"
  back: "`\"shortest\"` (default; extra items are silently dropped), `\"longest\"` (with optional `padding`) and `\"strict\"` (throws if lengths differ)."
  question: javascript/iterators-and-generators/new-iterator-methods
- id: iterator-concat-inputs
  front: "What inputs does `Iterator.concat` accept?"
  back: "Iterables only. Strings and bare iterators throw `TypeError`; wrap an iterator with `Iterator.from`."
  question: javascript/iterators-and-generators/new-iterator-methods
- id: iterator-chunks-windows
  front: "How do `chunks(n)` and `windows(n)` differ on a short final group?"
  back: "`chunks` yields a shorter final group. `windows` yields only full windows unless you pass `\"allow-partial\"`."
  question: javascript/iterators-and-generators/new-iterator-methods
- id: for-await-sync-fallback
  front: "How does `for await` handle an object with only `Symbol.iterator`?"
  back: "It falls back to the sync iterator and wraps it in an `AsyncFromSyncIterator`, which awaits each value. So `for await (const v of arrayOfPromises)` yields resolved values."
  question: javascript/iterators-and-generators/async-iteration
- id: for-await-sequential
  front: "Is `for await` iteration parallel?"
  back: "No. It calls `next()`, awaits it, runs the body, and only then asks for the next item, giving natural backpressure. For concurrency, start the work first and use `Promise.all`."
  question: javascript/iterators-and-generators/async-iteration
- id: async-generator-request-queue
  front: "What happens if you call `next()` on an async generator three times without awaiting?"
  back: "The requests are queued and the body runs one step at a time. The three promises settle in call order."
  question: javascript/iterators-and-generators/async-iteration
- id: for-of-async-iterable-error
  front: "What happens when `for...of` is used on an async iterable?"
  back: "`TypeError`, because it has no `[Symbol.iterator]`. Use `for await`, which is allowed only in async functions and at module top level."
  question: javascript/iterators-and-generators/async-iteration
# 17 Promises
- id: promise-executor-synchronous
  front: "When does the `new Promise` executor run, and what if it throws?"
  back: "Synchronously, before `new Promise` returns. If it throws, the promise is rejected with that error, unless `resolve` or `reject` was already called, in which case the throw is ignored."
  question: javascript/promises/what-is-a-promise
- id: promise-resolved-vs-settled
  front: "What is the difference between a promise being resolved and being settled?"
  back: "Settled means fulfilled or rejected. Resolved means its fate is fixed, including being locked in to follow another thenable. A resolved promise can still be pending."
  question: javascript/promises/what-is-a-promise
- id: resolve-with-thenable
  front: "What does `resolve(x)` do when `x` is a thenable?"
  back: "The promise adopts the thenable's outcome. It is locked in but stays pending until the thenable settles, so it may even reject. Resolving a promise with itself rejects it with `TypeError`."
  question: javascript/promises/what-is-a-promise
- id: then-handlers-microtask
  front: "When do `then` handlers run on an already settled promise?"
  back: "Never synchronously. Each handler runs as a separate microtask, after the current synchronous code but before the next macrotask, so timing is the same for settled and pending promises."
  question: javascript/promises/what-is-a-promise
- id: promise-resolve-identity
  front: "When does `Promise.resolve(x)` return `x` itself?"
  back: "When `x` is a native promise whose `constructor` is the same as the receiver. A thenable or plain value gets wrapped in a new promise."
  question: javascript/promises/what-is-a-promise
- id: then-returns-new-promise-outcomes
  front: "How does a `then` handler's outcome decide the promise `then` returned?"
  back: "A returned value fulfills it, a throw rejects it, and a returned promise or thenable is adopted. A missing handler passes the result through to the next one."
  question: javascript/promises/promise-chaining
- id: then-missing-return
  front: "What happens if a `then` handler starts async work but does not `return` the promise?"
  back: "The returned promise fulfills with `undefined` immediately, so the next step does not wait, and the inner promise's rejection is not part of the chain."
  question: javascript/promises/promise-chaining
- id: catch-recovers-chain
  front: "Does `.catch` end a promise chain?"
  back: "No. It returns a promise that fulfills with the handler's return value, so later `then` handlers run unless the handler rethrows."
  question: javascript/promises/promise-chaining
- id: chain-vs-branch
  front: "How do `p.then(a).then(b)` and `p.then(a); p.then(b)` differ?"
  back: "The first runs `b` after `a`. The second runs both from `p` independently, in registration order, and a failure in one does not affect the other."
  question: javascript/promises/promise-chaining
- id: then-self-return-typeerror
  front: "What happens if a handler returns the promise that `then` itself returned?"
  back: "That promise would wait for itself, so the resolution procedure rejects it with `TypeError`."
  question: javascript/promises/promise-chaining
- id: combinator-outcomes-table
  front: "When does each of `all`, `allSettled`, `race` and `any` reject?"
  back: "`all`: on the first rejection. `allSettled`: never (only on bad input). `race`: if the first to settle rejects. `any`: when all reject, with an `AggregateError`."
  question: javascript/promises/promise-combinators
- id: combinator-empty-iterable
  front: "What does each combinator do with an empty iterable?"
  back: "`all([])` and `allSettled([])` fulfill with `[]`. `any([])` rejects with an `AggregateError` with empty `errors`. `race([])` stays pending forever."
  question: javascript/promises/promise-combinators
- id: promise-all-no-cancel
  front: "What happens to the other promises when `Promise.all` rejects?"
  back: "They keep running, because nothing can cancel them. Their later rejections are handled by the combinator, so they do not become unhandled rejections. Use `AbortController` to cancel real work."
  question: javascript/promises/promise-combinators
- id: race-vs-any
  front: "How do `Promise.race` and `Promise.any` differ?"
  back: "`race` takes the first promise to settle, including a rejection. `any` ignores rejections until none are left, then rejects with an `AggregateError`."
  question: javascript/promises/promise-combinators
- id: promise-all-order
  front: "In what order are `Promise.all` results returned?"
  back: "Input order, not completion order. `allSettled` and the `errors` of `AggregateError` also follow input order."
  question: javascript/promises/promise-combinators
- id: promise-all-sync-throw-map
  front: "Why does a throw inside `Promise.all(items.map(fn))` not become a rejection?"
  back: "The throw happens in `map`, before `all` is called, so it escapes as a normal exception."
  question: javascript/promises/promise-combinators
- id: catch-is-then-undefined
  front: "What is `catch(f)` equivalent to, and what does it return?"
  back: "`then(undefined, f)`. It returns a promise that fulfills with whatever `f` returns, so the chain recovers. To keep failing, throw again."
  question: javascript/promises/promise-error-handling
- id: then-two-args-not-protected
  front: "Does `then(a, b)` handle errors thrown by `a`?"
  back: "No. `b` covers only the earlier promise, so if `a` throws, `b` is skipped. A `catch` after the `then` sees both."
  question: javascript/promises/promise-error-handling
- id: finally-semantics
  front: "What does `finally(f)` receive, and how can it change the outcome?"
  back: "No arguments, and its return value is ignored, so the original value or reason passes through. It changes the outcome only by throwing or returning a rejected promise."
  question: javascript/promises/promise-error-handling
- id: unhandled-rejection-host-hook
  front: "Who decides what happens on an unhandled rejection: ECMAScript or the host?"
  back: "The host. The spec defines only the `HostPromiseRejectionTracker` hook, called with \"reject\" and later \"handle\". Browsers fire `unhandledrejection`; Node emits `unhandledRejection` and by default throws."
  question: javascript/promises/promise-error-handling
- id: try-catch-needs-await
  front: "Why does `try { promise } catch {}` not catch a rejection?"
  back: "Without `await`, the `try` block finishes first and the rejection arrives later. A throw in a `setTimeout` or event callback also cannot reject a promise."
  question: javascript/promises/promise-error-handling
- id: with-resolvers-shape
  front: "What does `Promise.withResolvers()` return, and when is it useful?"
  back: "A plain object `{ promise, resolve, reject }`. Use it when the code that settles the promise is not the code that creates it, such as event handlers or request/response matching."
  question: javascript/promises/withresolvers-and-try
- id: with-resolvers-no-executor-throw
  front: "What does `Promise.withResolvers` lose compared with `new Promise(executor)`?"
  back: "There is no executor, so no automatic conversion of a throw into a rejection. Setup code you write next to it throws normally."
  question: javascript/promises/withresolvers-and-try
- id: promise-try-sync-call
  front: "When does `Promise.try(fn, ...args)` call `fn`, and what does it do with a throw?"
  back: "Immediately and synchronously. A returned value or promise resolves the result, and a throw rejects it, so a function that is sometimes sync and sometimes async can be `.catch`ed uniformly."
  question: javascript/promises/withresolvers-and-try
- id: promise-static-detached-this
  front: "Why does `const { try: t } = Promise; t(fn)` throw?"
  back: "`Promise.try` and `withResolvers` read `this` as the constructor. Detached, `this` is no longer `Promise`, so they throw `TypeError`."
  question: javascript/promises/withresolvers-and-try
- id: promise-try-vs-resolve-then
  front: "How does `Promise.resolve().then(fn)` differ from `Promise.try(fn)`?"
  back: "Both convert a throw into a rejection, but `then` delays `fn` by a microtask while `Promise.try` runs it synchronously."
  question: javascript/promises/withresolvers-and-try
- id: implement-all-index-results
  front: "Why does a `Promise.all` implementation write `results[index]` instead of `push`?"
  back: "Values arrive in completion order. Writing at each item's own index keeps input order."
  question: javascript/promises/implement-promise-all
- id: implement-all-counter-empty
  front: "Why does a `Promise.all` implementation count completions and check an empty input?"
  back: "An iterable has no length, and a sparse array's length can be reached early, so a pending counter decides when to resolve. With empty input no callback ever fires, so resolve after the loop if it is zero."
  question: javascript/promises/implement-promise-all
- id: implement-all-sync-throw
  front: "How does a `Promise.all` implementation turn a non-iterable into a rejection?"
  back: "The loop runs inside the `new Promise` executor, which converts a synchronous throw (for example `for...of` on a non-iterable) into a rejection."
  question: javascript/promises/implement-promise-all
- id: implement-all-wrap-resolve
  front: "Why wrap each item with `Promise.resolve(item)` in a `Promise.all` implementation?"
  back: "Plain values have no `then`, and thenables need adoption. Wrapping makes all items uniform."
  question: javascript/promises/implement-promise-all
- id: promise-impl-five-pieces
  front: "What five pieces does a custom `Promise` implementation need?"
  back: "State, stored reactions, asynchronous handlers via `queueMicrotask`, a `then` that returns a new promise, and the resolution procedure for thenables."
  question: javascript/promises/implement-a-promise
- id: resolve-not-fulfill
  front: "Why is `resolve(x)` not the same as \"fulfill with x\" in a promise implementation?"
  back: "The resolution procedure rejects with `TypeError` if `x` is the promise itself, and adopts `x` if it has a callable `then`. Only otherwise does it fulfill with `x`."
  question: javascript/promises/implement-a-promise
- id: thenable-then-read-once
  front: "Why read `x.then` only once in the resolution procedure?"
  back: "A getter can return different values each time, so read it once, check it is callable, and call that same reference."
  question: javascript/promises/implement-a-promise
- id: promise-impl-queue-microtask
  front: "Why use `queueMicrotask` and not `setTimeout` for handlers in a custom promise?"
  back: "`setTimeout` makes handlers macrotasks, running after rendering and timers that should come later. Native promises use the microtask queue, which `queueMicrotask` matches."
  question: javascript/promises/implement-a-promise
- id: promisify-error-first
  front: "What callback convention does `util.promisify` assume?"
  back: "Error-first: `(error, value) => ...`. It rejects when the first argument is truthy, otherwise resolves with the value. A success-first callback would be treated as an error."
  question: javascript/promises/promisify
- id: promisify-receiver-lost
  front: "Why can `promisify(obj.method)` fail?"
  back: "The detached method is called with `this` as `undefined`. Use `promisify(obj.method.bind(obj))` or `.call(obj)`."
  question: javascript/promises/promisify
- id: promisify-multiple-callbacks
  front: "Why can't `setInterval` or event-stream callbacks be promisified?"
  back: "A promise settles once, and these callbacks fire many times. Use events, `events.once` or async iterators."
  question: javascript/promises/promisify
- id: promisify-custom-symbol
  front: "What does `util.promisify.custom` do?"
  back: "If `fn[util.promisify.custom]` is a function, `promisify(fn)` returns it instead of building a wrapper. It supports non-standard signatures, as Node does for `setTimeout`."
  question: javascript/promises/promisify
# 18 Async and the event loop
- id: event-loop-host-defined
  front: "What does ECMAScript define about scheduling, and what does the host add?"
  back: "The spec defines jobs that run to completion and the `HostEnqueuePromiseJob` hook. The host defines the event loop: task queues, the microtask checkpoint, timers and I/O. Node.js uses libuv phases."
  question: javascript/async-and-the-event-loop/event-loop
- id: event-loop-iteration-order
  front: "What does one browser event-loop iteration do?"
  back: "Runs one task, then a microtask checkpoint that drains the microtask queue (including microtasks queued by microtasks), then the browser may render, and the loop continues."
  question: javascript/async-and-the-event-loop/event-loop
- id: run-to-completion
  front: "What does run-to-completion mean for a running function?"
  back: "A timer, event handler or promise callback cannot interrupt it. A long synchronous loop blocks everything else in that agent, including browser rendering."
  question: javascript/async-and-the-event-loop/event-loop
- id: settimeout-zero-meaning
  front: "When does a `setTimeout(fn, 0)` callback run relative to a promise `.then`?"
  back: "After. The callback is a later task, running only after the current task and all of its microtasks. A `.then` runs before any earlier-queued timer."
  question: javascript/async-and-the-event-loop/event-loop
- id: workers-separate-event-loops
  front: "Do web workers share the main thread's event loop?"
  back: "No. Each worker is its own agent with its own event loop, stack, heap and global object."
  question: javascript/async-and-the-event-loop/event-loop
- id: ordering-three-steps
  front: "In what order does a script's sync code, promise callbacks and timers run?"
  back: "Synchronous code first (the script is one task), then the microtask queue drained fully, then the next task such as a timer callback. Each task gets its own microtask drain."
  question: javascript/async-and-the-event-loop/task-microtask-ordering
- id: then-queued-when-settles
  front: "Why do two chains `a.then(f).then(g)` advance interleaved?"
  back: "`g` is queued only after `f` has run, so each chain advances one step per round of the microtask queue."
  question: javascript/async-and-the-event-loop/task-microtask-ordering
- id: return-promise-extra-ticks
  front: "Why is returning a promise from a handler slower than returning a value?"
  back: "Adopting a promise needs a job to call its `then`, plus a further job for the reaction: two extra ticks for a native promise."
  question: javascript/async-and-the-event-loop/task-microtask-ordering
- id: microtask-starvation
  front: "What happens with a recursive `queueMicrotask` that never ends?"
  back: "Timers, I/O and rendering never get a turn, because the microtask drain stops only when the queue is empty."
  question: javascript/async-and-the-event-loop/task-microtask-ordering
- id: next-tick-before-promises
  front: "How does `process.nextTick` order against promise jobs in Node.js?"
  back: "In CommonJS, the `nextTick` queue drains before the microtask queue. In an ES module, promise jobs run first because the module already runs inside a microtask drain."
  question: javascript/async-and-the-event-loop/task-microtask-ordering
- id: queue-microtask-error-reporting
  front: "How does an error in a `queueMicrotask` callback differ from one in a `.then` handler?"
  back: "A throw in a promise handler rejects the derived promise. A throw in a `queueMicrotask` callback is reported as an uncaught exception."
  question: javascript/async-and-the-event-loop/task-microtask-ordering
- id: async-body-sync-until-await
  front: "Where does an `async` function body run before its first `await`?"
  back: "Synchronously, on the caller's stack. The call then returns the promise. Argument errors, such as a throwing default value, reject that promise instead of throwing."
  question: javascript/async-and-the-event-loop/async-await-mechanics
- id: await-three-steps
  front: "What does `await value` do?"
  back: "Converts `value` with `PromiseResolve` (a native promise is used as is, anything else is wrapped), attaches reactions that resume the function, and suspends, returning control to the caller."
  question: javascript/async-and-the-event-loop/async-await-mechanics
- id: await-non-promise-yields
  front: "Does `await 1` continue in the same tick?"
  back: "No. The resumption is a promise job running as a microtask, so even `await 1` yields at least one tick."
  question: javascript/async-and-the-event-loop/async-await-mechanics
- id: return-promise-in-try-catch
  front: "Why does `return promise` inside `try`/`catch` skip the `catch` on rejection?"
  back: "Without `await`, the function returns before the promise settles, so its rejection bypasses your `catch`. Use `return await promise` when the surrounding `try` should handle the error."
  question: javascript/async-and-the-event-loop/async-await-mechanics
- id: async-return-resolves
  front: "What does `return x` do in an async function?"
  back: "It calls the function's own promise's `resolve` with `x`. Returning a promise makes the function's promise adopt it, costing extra ticks. An uncaught `throw` rejects it."
  question: javascript/async-and-the-event-loop/async-await-mechanics
- id: await-in-loop-sequential
  front: "What determines whether awaited operations overlap?"
  back: "When each promise is created, because a promise represents work already started. `for (...) await work(x)` is sequential; creating all promises first, as in `Promise.all(xs.map(work))`, is parallel."
  question: javascript/async-and-the-event-loop/sequential-vs-parallel-await
- id: foreach-async-no-wait
  front: "Why does `async` callback in `forEach` not work as expected?"
  back: "`forEach` ignores the returned promises, so code after it runs before the callbacks finish and their errors become unhandled rejections. Use `for...of` or `Promise.all(xs.map(...))`."
  question: javascript/async-and-the-event-loop/sequential-vs-parallel-await
- id: early-promise-late-await-rejection
  front: "What is the risk of creating promises early and awaiting them late?"
  back: "A promise that rejects before you reach its `await` is unhandled until then, and Node.js by default raises that as an uncaught exception. Attach handlers right away or use `Promise.all`."
  question: javascript/async-and-the-event-loop/sequential-vs-parallel-await
- id: parallel-await-order-effects
  front: "What does a parallel `await` guarantee about order?"
  back: "Only the order of the result array. Parallel calls can finish, and be handled by a server, in any order, so order-dependent writes should be sequential."
  question: javascript/async-and-the-event-loop/sequential-vs-parallel-await
- id: single-threaded-agent
  front: "In what sense is JavaScript single-threaded?"
  back: "One agent runs one job at a time, with no preemption. The host does I/O off-thread, and workers are separate agents on other threads with their own globals, heap and event loop."
  question: javascript/async-and-the-event-loop/single-threaded
- id: worker-communication
  front: "How do workers exchange data?"
  back: "`postMessage` copies values (structured clone) or transfers ownership of some objects such as an `ArrayBuffer`. A `SharedArrayBuffer` shares memory, and `Atomics` gives race-free updates."
  question: javascript/async-and-the-event-loop/single-threaded
- id: atomics-wait-main-thread
  front: "Why is `Atomics.wait` not allowed on a browser's main thread?"
  back: "It blocks the thread."
  question: javascript/async-and-the-event-loop/single-threaded
- id: async-not-threads
  front: "Do `async`/`await` and promises use extra threads?"
  back: "No, they schedule work on one agent. A CPU-bound loop inside an `async` function still blocks the loop; move CPU-bound work to a worker."
  question: javascript/async-and-the-event-loop/single-threaded
- id: abort-controller-parts
  front: "What does `controller.abort(reason)` do?"
  back: "Sets `signal.aborted` to `true`, stores `signal.reason`, and fires an `abort` event once. With no reason it uses an `AbortError` `DOMException`. A signal aborts once and stays aborted."
  question: javascript/async-and-the-event-loop/cancelling-async-work
- id: abort-cooperative
  front: "Why is aborting called cooperative?"
  back: "If the work ignores the signal, it keeps running. Abort only changes work built to listen, such as `fetch` or code that checks `signal.throwIfAborted()`."
  question: javascript/async-and-the-event-loop/cancelling-async-work
- id: abort-signal-timeout-vs-race
  front: "Why is `AbortSignal.timeout(ms)` better than `Promise.race` with a timer?"
  back: "It cancels the work: the signal aborts with a `TimeoutError`. With `race`, the loser is ignored but keeps running."
  question: javascript/async-and-the-event-loop/cancelling-async-work
- id: abort-signal-any
  front: "What does `AbortSignal.any([a, b])` return?"
  back: "A signal that aborts when any input aborts, with that input's reason. Use it to combine a user cancel with a timeout."
  question: javascript/async-and-the-event-loop/cancelling-async-work
- id: throw-if-aborted
  front: "What does `signal.throwIfAborted()` do?"
  back: "Throws `signal.reason` if the signal is aborted, otherwise nothing. It is a one-line guard for the top of a function or loop body."
  question: javascript/async-and-the-event-loop/cancelling-async-work
- id: pool-takes-functions
  front: "Why must a concurrency-limit runner accept task functions, not promises?"
  back: "Promises start running when created, so a limit on already-created promises limits nothing. The runner decides when to call each function."
  question: javascript/async-and-the-event-loop/concurrency-limit-retry
- id: pool-worker-loop
  front: "How does a worker-loop pool bound concurrency and keep input order?"
  back: "It starts `limit` async loops that each claim the next index, run that task and store the result at the same index. `nextIndex++` needs no lock because one job runs at a time."
  question: javascript/async-and-the-event-loop/concurrency-limit-retry
- id: pool-batching-waste
  front: "Why is chunked `Promise.all` batching wasteful compared with a worker pool?"
  back: "Each batch waits for its slowest task while slots sit idle. Workers that pull the next task keep all slots busy."
  question: javascript/async-and-the-event-loop/concurrency-limit-retry
- id: retry-inside-worker
  front: "Why does the concurrency limit still hold during retry backoff?"
  back: "The retry happens inside the worker's `await`, so the worker does not claim another task until the current one finally succeeds or fails."
  question: javascript/async-and-the-event-loop/concurrency-limit-retry
- id: pool-fail-fast-flag
  front: "What does a fail-fast pool need so it stops after one failure?"
  back: "A `failed` flag that stops workers from claiming new tasks. Tasks already in flight cannot be cancelled and finish on their own."
  question: javascript/async-and-the-event-loop/concurrency-limit-retry
# 19 Errors and cleanup
- id: finally-return-operand-timing
  front: "In `try { return value; } finally { value = 2; }`, why does the function still return the old primitive value?"
  back: "The `return` operand is evaluated before `finally` runs. The value was already captured, so `finally` reassigning the variable changes nothing. An object return can still be mutated."
  question: javascript/errors-and-cleanup/try-catch-finally
- id: finally-abrupt-overrides
  front: "What happens to a pending `throw` or `return` when `finally` itself contains `return`, `break` or `continue`?"
  back: "The abrupt completion in `finally` replaces it. A `return` in `finally` silently swallows an error from `try`. If `finally` completes normally, the earlier outcome resumes."
  question: javascript/errors-and-cleanup/try-catch-finally
- id: try-completion-records
  front: "How does the spec model the result of a `try` block, so `catch` and `finally` know what to do?"
  back: "As a Completion Record with a type: normal, return, throw, break or continue. `catch` runs only for a throw completion. `finally` runs for every type."
  question: javascript/errors-and-cleanup/try-catch-finally
- id: throw-in-catch-replaces
  front: "What happens to the original error if `catch` or `finally` throws a new one?"
  back: "The new error replaces it with no trace. Nothing links them unless you do it yourself, for example with `new Error(message, { cause })`."
  question: javascript/errors-and-cleanup/try-catch-finally
- id: error-name-default
  front: "Why does `class A extends Error {}` print `Error: hi` for `new A('hi')`?"
  back: "`name` comes from `Error.prototype.name`, which is `\"Error\"`. The subclass's constructor name is not used, so set `name` yourself."
  question: javascript/errors-and-cleanup/custom-errors
- id: error-cause-presence-check
  front: "Does `new Error('x', { cause: undefined })` create a `cause` property?"
  back: "Yes. The constructor checks that the options object has a `cause` property, not that its value is defined. `new Error('x')` has no `cause`."
  question: javascript/errors-and-cleanup/custom-errors
- id: error-iserror-vs-instanceof
  front: "Why is `Error.isError(value)` more reliable than `value instanceof Error`?"
  back: "It checks for the internal `[[ErrorData]]` slot, so it is true for errors from another realm, where `instanceof` fails. It is false for `Object.create(Error.prototype)`, which has no slot."
  question: javascript/errors-and-cleanup/custom-errors
- id: error-name-own-enumerable
  front: "What side effect does setting `name` via a class field or `this.name = ...` on a custom error have?"
  back: "It creates an own enumerable property, so `name` shows in `Object.keys` and `JSON.stringify` output. Built-in errors keep `name` on the prototype."
  question: javascript/errors-and-cleanup/custom-errors
- id: error-stack-unspecified
  front: "Does the ECMAScript spec define `Error.prototype.stack`?"
  back: "No. Engines add a string `stack` with different formats. A Stage 3 proposal would standardize only that `stack` exists as an accessor, not its format."
  question: javascript/errors-and-cleanup/custom-errors
- id: aggregate-error-shape
  front: "What does `Promise.any` reject with when every input rejects?"
  back: "An `AggregateError`, which holds the individual rejection reasons in its `errors` array."
  question: javascript/errors-and-cleanup/custom-errors
- id: callback-try-lifetime
  front: "Why can't `try`/`catch` around `setTimeout(fn)` catch a throw inside `fn`?"
  back: "`setTimeout` only registers `fn`. The `try` block finishes normally, and the event loop later calls `fn` on an empty stack with no enclosing `try`."
  question: javascript/errors-and-cleanup/async-error-boundaries
- id: promise-throw-to-rejection
  front: "Name the three places where the spec converts a throw into a promise rejection."
  back: "The `Promise` constructor's executor, a `.then` reaction job (rejecting the derived promise), and an `async` function body via `AsyncBlockStart`."
  question: javascript/errors-and-cleanup/async-error-boundaries
- id: return-await-in-try
  front: "In an async function, how does `return promise` differ from `return await promise` inside `try`?"
  back: "`return promise` leaves the `try` at once, so `catch` never sees a later rejection. `return await promise` waits inside the `try`, so `catch` runs."
  question: javascript/errors-and-cleanup/async-error-boundaries
- id: callback-double-call-trap
  front: "What bug appears in `try { callback(null, JSON.parse(text)); } catch (e) { callback(e); }`?"
  back: "If the consumer's `callback` throws, the `catch` calls it a second time. Guard only the code that can fail and call `callback` outside the `try`."
  question: javascript/errors-and-cleanup/async-error-boundaries
- id: eventemitter-error-no-listener
  front: "What happens when a Node.js `EventEmitter` emits `'error'` and has no `'error'` listener?"
  back: "`emit` throws the error. Any other event with no listener is silently ignored."
  question: javascript/errors-and-cleanup/async-error-boundaries
- id: using-dispose-timing
  front: "When does `using x = value` call `x[Symbol.dispose]()`?"
  back: "When the enclosing block, function or module exits, however it exits: normal end, `return`, `break` or `throw`."
  question: javascript/errors-and-cleanup/explicit-resource-management
- id: using-reverse-order
  front: "In what order are multiple `using` resources in one block disposed?"
  back: "Reverse declaration order, last declared first, like a stack. That lets a later resource depend on an earlier one."
  question: javascript/errors-and-cleanup/explicit-resource-management
- id: using-suppressed-error
  front: "What is thrown when a `using` disposer throws while an error is already pending?"
  back: "A `SuppressedError`. Its `error` property is the new disposer error and its `suppressed` property is the earlier pending error."
  question: javascript/errors-and-cleanup/explicit-resource-management
- id: using-null-and-non-disposable
  front: "How does a `using` declaration treat `null`, `undefined`, and an object without `Symbol.dispose`?"
  back: "`null` and `undefined` are allowed and skipped. An object without the dispose method throws a `TypeError` at the declaration, not at block exit."
  question: javascript/errors-and-cleanup/explicit-resource-management
- id: await-using-fallback
  front: "Which method does `await using` call, and what is the fallback?"
  back: "It awaits `Symbol.asyncDispose`. If the object has only `Symbol.dispose`, that is used instead, wrapped so a sync throw becomes a rejection."
  question: javascript/errors-and-cleanup/explicit-resource-management
- id: using-dispose-method-captured
  front: "When is the dispose method looked up for a `using` resource?"
  back: "At declaration. Replacing `resource[Symbol.dispose]` afterwards does not change what runs at exit."
  question: javascript/errors-and-cleanup/explicit-resource-management
- id: disposable-stack-use-cases
  front: "What is `DisposableStack` for, and what does `move()` do?"
  back: "It collects cleanups at runtime when the number of resources is dynamic. `move()` returns a new stack holding the resources and marks the old one disposed, transferring ownership."
  question: javascript/errors-and-cleanup/explicit-resource-management
- id: using-not-gc
  front: "Does `using` free memory or make the garbage collector run?"
  back: "No. It runs your cleanup code at a known scope exit. `FinalizationRegistry` is no substitute, since whether and when its callbacks run is up to the engine."
  question: javascript/errors-and-cleanup/explicit-resource-management
- id: browser-error-event-shape
  front: "How does the browser report an uncaught exception, and what does `window.onerror` receive?"
  back: "It fires a cancelable `error` event (an `ErrorEvent`) on `window`. `onerror` gets `(message, source, lineno, colno, error)`, and returning `true` cancels the default console report."
  question: javascript/errors-and-cleanup/uncaught-errors
- id: unhandledrejection-event
  front: "What does the browser `unhandledrejection` event carry, and what does `preventDefault()` do?"
  back: "It carries `event.promise` and `event.reason`. `preventDefault()` cancels the event so the browser skips its default console report."
  question: javascript/errors-and-cleanup/uncaught-errors
- id: report-error-purpose
  front: "What does `reportError(error)` do, and is it available in Node.js?"
  back: "It reports an error as if it were uncaught, without throwing. It is a browser and worker API; `typeof reportError` is `\"undefined\"` in Node 24."
  question: javascript/errors-and-cleanup/uncaught-errors
- id: node-uncaught-exit-codes
  front: "What are Node.js's exit codes for an uncaught exception with no listener, with a listener, and with a throwing listener?"
  back: "1 with no listener (stack printed). 0 with a listener, unless `process.exitCode` is set. 7 if the `uncaughtException` handler itself throws."
  question: javascript/errors-and-cleanup/uncaught-errors
- id: node-unhandled-rejection-default
  front: "What does Node's default `--unhandled-rejections=throw` mode do, and what changes if you add a listener?"
  back: "It emits `unhandledRejection`; with no listener it raises the rejection as an uncaught exception. Adding any listener removes the default crash."
  question: javascript/errors-and-cleanup/uncaught-errors
- id: global-handler-purpose
  front: "What should a Node.js `uncaughtException` handler do, according to the Node.js docs?"
  back: "Log, clean up synchronously and exit so a supervisor restarts the process. The app is in an undefined state, so resuming normal operation is unsafe."
  question: javascript/errors-and-cleanup/uncaught-errors
- id: rejectionhandled-event
  front: "What is `rejectionhandled` for?"
  back: "It fires when a handler is attached to a promise already reported as unhandled, so tools can retract the earlier report."
  question: javascript/errors-and-cleanup/uncaught-errors
# 20 Modules
- id: esm-three-phases
  front: "What are the three phases an ES module graph goes through, and which run code?"
  back: "Construct (parse and fetch every import, no code runs), link (create environments and bind imports), evaluate (run each body once, dependencies first). Only evaluate runs module code."
  question: javascript/modules/es-module-loading
- id: esm-live-binding
  front: "What is an ES module import binding, and can the importer assign to it?"
  back: "An immutable indirect binding that points at the exporter's variable, not a copy. Reads see later changes. Assigning from the importer throws `TypeError`; only the exporter can change it."
  question: javascript/modules/es-module-loading
- id: esm-link-time-errors
  front: "When is a missing or ambiguous export reported, and what does that mean for module bodies?"
  back: "At link time, as a `SyntaxError`, before any module body in the graph has run."
  question: javascript/modules/es-module-loading
- id: esm-link-initialization
  front: "At link time, how are function, `let`/`const`/`class`, and `var` bindings in a module initialized?"
  back: "Function declarations are initialized. `let`, `const` and `class` exist but are uninitialized (TDZ). `var` bindings are `undefined`."
  question: javascript/modules/es-module-loading
- id: esm-namespace-object-shape
  front: "What kind of object is `import * as ns`?"
  back: "A module namespace exotic object: null prototype, non-extensible, one live property per export. Assigning to a property fails."
  question: javascript/modules/es-module-loading
- id: esm-export-default-not-live
  front: "Is `export default count` a live binding?"
  back: "No. `export default <expression>` stores the expression's value once. `export { count as default }` is a live binding."
  question: javascript/modules/es-module-loading
- id: esm-evaluation-order
  front: "In what order do ES module bodies evaluate, and how often?"
  back: "Depth-first post-order: dependencies before dependents, siblings in import order, each body once. Import declarations are hoisted, so a dependency runs before the importer's first statement."
  question: javascript/modules/es-module-loading
- id: cjs-require-mechanics
  front: "What does CommonJS `require('x')` do on first and later calls?"
  back: "First call: resolve the path, run the file synchronously, cache `module.exports` and return it. Later calls return the same cached object."
  question: javascript/modules/esm-vs-commonjs
- id: cjs-value-copy-vs-esm-live
  front: "Why does `exports.count = count` in CommonJS not track later changes, unlike an ESM `export let count`?"
  back: "CommonJS stores the primitive's value on the exports object at that moment. An ESM import is an alias for the exporter's binding."
  question: javascript/modules/esm-vs-commonjs
- id: node-module-system-detection
  front: "How does Node.js decide whether a file is ESM or CommonJS?"
  back: "`.mjs` is ESM, `.cjs` is CommonJS, and `.js` follows the nearest `package.json` `\"type\"`."
  question: javascript/modules/esm-vs-commonjs
- id: import-cjs-default
  front: "What does `import` give you from a CommonJS file in Node.js?"
  back: "`module.exports` as the `default` export. Named exports are guessed by a static syntax scan and are snapshots, not live bindings."
  question: javascript/modules/esm-vs-commonjs
- id: require-esm-node24
  front: "When can `require()` load an ES module in Node.js 24, and what does it return?"
  back: "When no module in the graph uses top-level `await`. It returns the namespace object. Otherwise it throws `ERR_REQUIRE_ASYNC_MODULE`."
  question: javascript/modules/esm-vs-commonjs
- id: dual-package-hazard
  front: "What is the dual package hazard?"
  back: "A package with separate ESM and CommonJS builds can be loaded as two module instances with separate state, when both are loaded together."
  question: javascript/modules/esm-vs-commonjs
- id: esm-no-cache-clearing
  front: "How does the module cache differ between CommonJS and ESM?"
  back: "CommonJS exposes `require.cache`, so entries can be deleted. ESM instances are keyed by resolved URL for the life of the process. A different query string is a different URL."
  question: javascript/modules/esm-vs-commonjs
- id: esm-cycle-evaluation-order
  front: "In an ES module cycle, which module's body runs first, and which runs last?"
  back: "The last module reached in the cycle runs first. The entry module runs last, because a module already `evaluating` is skipped rather than waited for."
  question: javascript/modules/circular-imports
- id: esm-cycle-binding-states
  front: "In an ES module cycle, what does reading an unrun partner's `function`, `const` and `var` exports give?"
  back: "A function declaration works. `const`, `let` and `class` throw `ReferenceError` (TDZ). `var` reads `undefined`."
  question: javascript/modules/circular-imports
- id: cjs-cycle-partial-exports
  front: "What does `require` return in a CommonJS cycle when the partner is still running?"
  back: "The partner's partial `module.exports` as it is at that moment. Destructuring it or a later `module.exports = ...` replacement keeps the early view."
  question: javascript/modules/circular-imports
- id: cycle-entry-dependence
  front: "Why can the same circular ESM code work from one entry point and throw from another?"
  back: "Which module hits an uninitialized binding depends on which file starts the program or is reached first. Evaluation order changes with the entry."
  question: javascript/modules/circular-imports
- id: dynamic-import-not-function
  front: "Is `import()` a function?"
  back: "No. It is its own syntax (`ImportCall`), so it cannot be passed around, used with `call`, or reassigned. `import.call(...)` is a `SyntaxError`."
  question: javascript/modules/dynamic-import
- id: dynamic-import-result
  front: "What does `import(specifier)` return, and where is a default export?"
  back: "A promise for the module namespace object. The default export is on its `default` property."
  question: javascript/modules/dynamic-import
- id: dynamic-import-errors-reject
  front: "How does `import()` report bad arguments, a missing file or an evaluation error?"
  back: "It rejects the returned promise and never throws synchronously. Evaluation errors are remembered, so a second `import()` rejects with the same error."
  question: javascript/modules/dynamic-import
- id: dynamic-import-cached
  front: "Does calling `import()` on the same module twice run its body twice?"
  back: "No. Loaded modules are keyed by resolved URL (and module type), so the body runs once and later calls get the same namespace object."
  question: javascript/modules/dynamic-import
- id: dynamic-import-scope
  front: "Where does `import()` work, and what do relative specifiers resolve against?"
  back: "In classic scripts, CommonJS and ES modules. Relative specifiers resolve against the module containing the call, not the working directory."
  question: javascript/modules/dynamic-import
- id: tla-propagation
  front: "What does top-level `await` in a module do to modules that import it?"
  back: "Every direct or transitive importer waits until its evaluation promise fulfills before running its body. A rejection fails all of them."
  question: javascript/modules/top-level-await
- id: tla-sibling-overlap
  front: "Two independent sibling modules each use top-level `await` on a timer. Do they run one after another?"
  back: "No. Evaluation starts each body and moves on at its first `await`, so they overlap. The total wait is the longest chain, not the sum."
  question: javascript/modules/top-level-await
- id: tla-require-limit
  front: "Why can't `require()` load a module graph containing top-level `await`?"
  back: "`require()` is synchronous and cannot wait. In Node.js 24 it throws `ERR_REQUIRE_ASYNC_MODULE`; use `import()` instead."
  question: javascript/modules/top-level-await
- id: tla-never-settles
  front: "What happens in Node.js if a top-level `await` never settles?"
  back: "The module graph never finishes. Node.js prints a warning and exits with code 13 once nothing else keeps the event loop alive."
  question: javascript/modules/top-level-await
- id: import-attributes-syntax
  front: "What is the syntax for import attributes on a static import and on `import()`?"
  back: "`import x from './x.json' with { type: 'json' }` and `import('./x.json', { with: { type: 'json' } })`. The old `assert` keyword has been replaced by `with`."
  question: javascript/modules/import-attributes-json-modules
- id: json-module-default-only
  front: "What exports does a JSON module have?"
  back: "Only `default`, the parsed JSON value. `import { name } from './x.json'` is a `SyntaxError`. Every importer shares the same object."
  question: javascript/modules/import-attributes-json-modules
- id: json-module-type-required
  front: "Why must a JSON import specify `type: 'json'`?"
  back: "So the author asserts the expected type: a response that turns into JavaScript fails instead of running as code. Without it Node.js throws `ERR_IMPORT_ATTRIBUTE_MISSING`."
  question: javascript/modules/import-attributes-json-modules
- id: import-attributes-unsupported
  front: "What happens when an import uses an unsupported attribute key?"
  back: "A static `import` fails during loading. Node.js 24 reports `TypeError [ERR_IMPORT_ATTRIBUTE_UNSUPPORTED]`. In `import()` the promise rejects with `TypeError`."
  question: javascript/modules/import-attributes-json-modules
- id: import-meta-spec-properties
  front: "Which properties of `import.meta` does ECMAScript define?"
  back: "None. The host fills it in. It is a null-prototype object created on first read per module and cached."
  question: javascript/modules/import-meta
- id: import-meta-per-module
  front: "Is there one `import.meta` object for the whole app?"
  back: "No. Each module has its own, so `import.meta.url` always names the file it is written in."
  question: javascript/modules/import-meta
- id: import-meta-url-type
  front: "Is `import.meta.url` a file path?"
  back: "No, it is a URL string (a `file:` URL in Node.js). Pass it to `new URL(...)` or `fileURLToPath` rather than concatenating paths."
  question: javascript/modules/import-meta
- id: import-meta-resolve
  front: "What does `import.meta.resolve(specifier)` do?"
  back: "It resolves the specifier as `import` would, relative to this module, and returns a URL string. It loads nothing. In Node.js it is synchronous."
  question: javascript/modules/import-meta
- id: import-meta-dirname-node
  front: "What do `import.meta.filename` and `import.meta.dirname` replace, and where do they exist?"
  back: "They replace CommonJS `__filename` and `__dirname`. They are Node.js-only conventions, defined for `file:` modules."
  question: javascript/modules/import-meta
# 21 Metaprogramming
- id: proxy-no-trap-forwards
  front: "What happens when a Proxy handler lacks the trap for an operation?"
  back: "The operation is forwarded to the target unchanged."
  question: javascript/metaprogramming/proxy-traps-invariants
- id: proxy-invariant-check
  front: "What happens after a Proxy trap returns a result that contradicts the target's non-configurable or non-extensible state?"
  back: "The engine checks the result against the target and throws `TypeError`. A `get` trap cannot report a different value for a non-writable, non-configurable data property."
  question: javascript/metaprogramming/proxy-traps-invariants
- id: proxy-ownkeys-invariant
  front: "What must a Proxy `ownKeys` trap include and exclude?"
  back: "It must include every non-configurable key of the target, with no duplicates. For a non-extensible target it must list exactly the target's keys."
  question: javascript/metaprogramming/proxy-traps-invariants
- id: proxy-construct-invariant
  front: "What must a Proxy `construct` trap return?"
  back: "An object. Returning a primitive makes `new proxy()` throw `TypeError`."
  question: javascript/metaprogramming/proxy-traps-invariants
- id: proxy-call-construct-fixed
  front: "Which Proxy traps exist only for some targets, and when is that decided?"
  back: "`apply` and `construct` apply only if the target is callable or a constructor. That is fixed at creation, so `typeof proxy` never changes."
  question: javascript/metaprogramming/proxy-traps-invariants
- id: proxy-internal-slots
  front: "Why does `new Proxy(new Map(), {}).set(1, 2)` throw?"
  back: "`Map.prototype.set` needs the `[[MapData]]` slot on `this`. The proxy has only `[[ProxyTarget]]` and `[[ProxyHandler]]`. Binding the method to the target fixes it."
  question: javascript/metaprogramming/proxy-traps-invariants
- id: proxy-revocable
  front: "What does `Proxy.revocable(target, handler)` return, and what happens after `revoke()`?"
  back: "It returns `{ proxy, revoke }`. After `revoke()` every operation on the proxy throws `TypeError`, so access can be handed out and taken back."
  question: javascript/metaprogramming/proxy-traps-invariants
- id: proxy-set-false-strict
  front: "What happens in strict code if a Proxy `set` trap returns `false`?"
  back: "The assignment throws `TypeError`. Return `true` after a successful write."
  question: javascript/metaprogramming/proxy-traps-invariants
- id: proxy-not-interceptable
  front: "Can a Proxy intercept `typeof` or `===`?"
  back: "No. They use no internal method with a trap. `typeof` depends only on whether the target was callable at creation."
  question: javascript/metaprogramming/proxy-traps-invariants
- id: reflect-purpose
  front: "What is `Reflect`, and how do its methods relate to Proxy traps?"
  back: "A plain namespace object with 13 static methods, one per essential internal method. Names and parameters match the Proxy traps, so a trap can forward with `Reflect.x(...args)`."
  question: javascript/metaprogramming/reflect-api
- id: reflect-receiver
  front: "What is the `receiver` argument of `Reflect.get` and `Reflect.set`?"
  back: "The `this` for a getter or setter, and where `set` creates a data property. `target[key]` always uses `target`."
  question: javascript/metaprogramming/reflect-api
- id: reflect-boolean-results
  front: "How do `Reflect.defineProperty` and `Reflect.set` differ from their `Object.*` or assignment counterparts on failure?"
  back: "`Reflect.defineProperty`, `deleteProperty`, `set`, `setPrototypeOf` and `preventExtensions` return `false` instead of throwing. That is the boolean a trap must return."
  question: javascript/metaprogramming/reflect-api
- id: reflect-no-coercion
  front: "How does `Reflect.getPrototypeOf(1)` differ from `Object.getPrototypeOf(1)`?"
  back: "`Reflect` throws `TypeError` for a non-object target. `Object.getPrototypeOf(1)` quietly boxes it and returns `Number.prototype`."
  question: javascript/metaprogramming/reflect-api
- id: reflect-construct-newtarget
  front: "What can `Reflect.construct(target, args, newTarget)` do that `new` cannot?"
  back: "Run a constructor with a different `new.target`, which also decides which prototype the instance gets."
  question: javascript/metaprogramming/reflect-api
- id: reflect-ownkeys-vs-object-keys
  front: "How does `Reflect.ownKeys` differ from `Object.keys`?"
  back: "`Reflect.ownKeys` returns every own key, strings and symbols, enumerable or not. `Object.keys` filters to enumerable strings."
  question: javascript/metaprogramming/reflect-api
- id: wks-hook-mechanism
  front: "How do well-known symbols act as extension points?"
  back: "The spec uses them as property keys that built-in algorithms look up on your object. Define the property and the built-in calls it. They are shared across realms but not in the global symbol registry."
  question: javascript/metaprogramming/well-known-symbols
- id: date-default-hint
  front: "How does `Date` treat the `\"default\"` ToPrimitive hint?"
  back: "As `\"string\"`, so `new Date(0) + 1` concatenates instead of adding."
  question: javascript/metaprogramming/well-known-symbols
- id: hasinstance-priority
  front: "In what order does `instanceof` consult `Symbol.hasInstance` and the prototype chain?"
  back: "It looks up `Symbol.hasInstance` first; if present, the result of calling it is used. Only if absent does it walk the prototype chain."
  question: javascript/metaprogramming/well-known-symbols
- id: tostringtag-scope
  front: "What does `Symbol.toStringTag` change?"
  back: "Only the tag in `Object.prototype.toString` output, `[object X]`. It does not change `typeof`, and the test is unreliable for program-defined objects."
  question: javascript/metaprogramming/well-known-symbols
- id: species-purpose
  front: "What does `Symbol.species` control?"
  back: "Which constructor methods like `map` and `filter` use to build a new instance. A subclass can set it to `Array` so results are plain arrays."
  question: javascript/metaprogramming/well-known-symbols
- id: symbol-match-isregexp
  front: "Why does `'a/'.startsWith(/a/)` throw, and how can a regex opt out?"
  back: "`IsRegExp` reads `Symbol.match`, and a regex is rejected as a pattern. Setting `re[Symbol.match] = false` makes it count as a plain string."
  question: javascript/metaprogramming/well-known-symbols
- id: symbol-unscopables
  front: "What is `Symbol.unscopables` for?"
  back: "It lists names a `with` statement must skip, so names added to a built-in later do not shadow outer variables. It only matters in sloppy-mode `with`."
  question: javascript/metaprogramming/well-known-symbols
- id: exotic-vs-ordinary
  front: "What makes an object exotic rather than ordinary?"
  back: "At least one essential internal method (`[[Get]]`, `[[DefineOwnProperty]]` and so on) behaves differently from the spec's default definition."
  question: javascript/metaprogramming/exotic-objects
- id: array-exotic-length
  front: "What does the Array exotic `[[DefineOwnProperty]]` do to `length`?"
  back: "Writing index `i >= length` sets `length` to `i + 1`. Lowering `length` deletes elements from the end. Only canonical array indices below 2^32 - 1 are special; `'02'` and `'-1'` are ordinary keys."
  question: javascript/metaprogramming/exotic-objects
- id: typedarray-numeric-keys
  front: "How do TypedArrays treat a canonical numeric key that is out of range, such as `bytes[5]` on a 2-element array?"
  back: "The write is silently ignored and the read is `undefined`. The prototype chain is never consulted for such keys. `Reflect.set` returns `true`."
  question: javascript/metaprogramming/exotic-objects
- id: namespace-exotic-write
  front: "Why can't you add a property to a module namespace or assign to an export through it?"
  back: "It is non-extensible and its keys mirror the exports. `[[Set]]` returns `false`, so strict-mode assignment throws `TypeError`, and `defineProperty` of a new key returns `false`."
  question: javascript/metaprogramming/exotic-objects
- id: bound-function-exotic
  front: "What do a bound function's `[[Call]]` and `[[Construct]]` do?"
  back: "`[[Call]]` ignores the caller's `this` and prepends the stored arguments. `[[Construct]]` ignores the bound `this`. Both forward to the target."
  question: javascript/metaprogramming/exotic-objects
- id: mapped-arguments
  front: "When does the `arguments` object alias parameter bindings?"
  back: "Only in sloppy-mode functions with simple parameter lists. A default value or `'use strict'` removes the aliasing."
  question: javascript/metaprogramming/exotic-objects
- id: immutable-prototype
  front: "What is special about `Object.prototype`'s `[[SetPrototypeOf]]`?"
  back: "It is an immutable prototype exotic object: it only accepts its current value. `Object.setPrototypeOf(Object.prototype, {})` throws `TypeError`."
  question: javascript/metaprogramming/exotic-objects
- id: isarray-through-proxy
  front: "Is `Array.isArray` true for a Proxy wrapping an array?"
  back: "Yes. `IsArray` looks through the proxy to its target, even though the proxy itself is a Proxy exotic object."
  question: javascript/metaprogramming/exotic-objects
- id: direct-eval-definition
  front: "When is an `eval` call direct?"
  back: "When the callee is the plain identifier `eval` and its value is the real `%eval%`. `(0, eval)(x)`, `eval?.(x)`, `o.eval(x)` and an aliased variable are all indirect."
  question: javascript/metaprogramming/eval-direct-indirect
- id: direct-eval-scope
  front: "How do scope and `this` differ between direct and indirect eval?"
  back: "Direct eval runs in the caller's scope and `this`. Indirect eval runs in the global environment with global `this`."
  question: javascript/metaprogramming/eval-direct-indirect
- id: eval-strictness
  front: "How does strictness differ between direct and indirect eval?"
  back: "Direct eval inherits the caller's strict mode, so its `var` stays local. Indirect eval is strict only if its code says `\"use strict\"`."
  question: javascript/metaprogramming/eval-direct-indirect
- id: eval-let-const-local
  front: "Do `let`, `const` and `class` declared in eval code leak into the surrounding scope?"
  back: "No. They are always local to that eval, whether it is direct or indirect."
  question: javascript/metaprogramming/eval-direct-indirect
- id: new-function-scope
  front: "In which scope does `new Function(args, body)` compile, and is its body strict?"
  back: "The global scope, like indirect eval, so it cannot see locals. Its body is sloppy unless it starts with `\"use strict\"`, even when called from a module."
  question: javascript/metaprogramming/eval-direct-indirect
- id: eval-csp
  front: "What does a CSP `script-src` without `'unsafe-eval'` do to `eval` and `new Function`?"
  back: "String compilation is blocked: the host throws `EvalError` and reports a violation. String arguments to `setTimeout` and `setInterval` are blocked too."
  question: javascript/metaprogramming/eval-direct-indirect
- id: eval-non-string
  front: "What does `eval` return for a non-string argument, and for a string?"
  back: "A non-string is returned as is. For a string, it returns the completion value of the last value-producing statement, or `undefined`."
  question: javascript/metaprogramming/eval-direct-indirect
# 22 Regular expressions
- id: regex-lastindex-g-y
  front: "Which regex flags make `lastIndex` matter, and what happens to it on a failed match?"
  back: "`g` and `y`. `exec` and `test` read and update `lastIndex`, and a failed match resets it to `0`. Without `g` or `y`, `lastIndex` is ignored."
  question: javascript/regular-expressions/regex-flags
- id: regex-g-reuse-alternating
  front: "Why can one `/…/g` regex reused with `test` on different strings give alternating results?"
  back: "`lastIndex` carries over from the previous match, so the next search starts mid-string. Create the regex per use, reset `lastIndex = 0`, or drop `g`."
  question: javascript/regular-expressions/regex-flags
- id: regex-sticky-vs-caret
  front: "How does the `y` flag differ from `g` and from a leading `^`?"
  back: "`y` matches only at exactly `lastIndex` with no scanning forward, and a miss resets it to `0`. `^` anchors to the start of input, which does not move, so `y` is what lets you lex token by token."
  question: javascript/regular-expressions/regex-flags
- id: regex-m-s-scope
  front: "What do the `m` and `s` flags each change?"
  back: "`m` changes only `^` and `$`, which also match at line breaks. `s` changes only `.`, which then also matches line terminators."
  question: javascript/regular-expressions/regex-flags
- id: regex-u-v-unit
  front: "What do the `u` and `v` flags change about matching?"
  back: "The unit becomes the code point instead of the UTF-16 code unit, so `.` matches an astral character as one unit. `u` also enables `\\u{…}` and `\\p{…}`."
  question: javascript/regular-expressions/regex-flags
- id: regex-v-vs-u
  front: "What does the `v` flag add over `u`, and can they be combined?"
  back: "Set subtraction `--`, intersection `&&`, nested classes, `\\q{…}` strings and properties of strings. Combining `u` and `v` is a `SyntaxError`."
  question: javascript/regular-expressions/regex-flags
- id: regex-d-flag
  front: "What does the `d` flag add to a match result?"
  back: "An `indices` array (and `indices.groups`) with start and end offsets. It costs extra work per match, so enable it only when you need group positions."
  question: javascript/regular-expressions/regex-flags
- id: regex-inline-modifiers
  front: "What are inline regex modifiers such as `(?i:…)`, and which flags do they cover?"
  back: "ES2025 syntax that applies `i`, `m` or `s` only inside the group; `(?-i:…)` turns it off. Other flags cannot be toggled."
  question: javascript/regular-expressions/regex-flags
- id: regex-flags-order
  front: "In what order does `re.flags` list the flags?"
  back: "Alphabetical: `dgimsuvy`."
  question: javascript/regular-expressions/regex-flags
- id: named-group-groups-object
  front: "What does the `groups` property of a match hold, and when is it `undefined`?"
  back: "A null-prototype object with one property per named group. It is `undefined` when the pattern has no named group, so reading `m.groups.year` then throws."
  question: javascript/regular-expressions/named-groups-lookbehind
- id: named-group-references
  front: "How do you reference a named group in a pattern, a replacement string and a replacer function?"
  back: "`\\k<name>` in the pattern, `$<name>` in the replacement string, and the last argument (the `groups` object) in a replacer function."
  question: javascript/regular-expressions/named-groups-lookbehind
- id: duplicate-named-groups
  front: "When may a regex reuse the same group name?"
  back: "Since ES2025, only when the two groups can never both participate, in practice in different alternatives. Two same-named groups in sequence is still a `SyntaxError`."
  question: javascript/regular-expressions/named-groups-lookbehind
- id: lookbehind-right-to-left
  front: "In which direction is a lookbehind body matched, and is variable length allowed?"
  back: "Right to left, so a greedy second group takes more than the first. JavaScript allows variable-length lookbehind."
  question: javascript/regular-expressions/named-groups-lookbehind
- id: lookaround-atomic
  front: "Why are regex lookarounds called atomic?"
  back: "Once the body matches, the engine never backtracks into it, so its captures are fixed. A negative lookaround never leaves captures set."
  question: javascript/regular-expressions/named-groups-lookbehind
- id: named-group-unknown-replacement
  front: "What does `$<name>` become in a replacement if the group does not exist?"
  back: "An empty string if the pattern has at least one named group. If it has none, `$<a>` is kept literally."
  question: javascript/regular-expressions/named-groups-lookbehind
- id: backtracking-definition
  front: "Why do nested quantifiers like `^(a+)+$` take exponential time on a failing input?"
  back: "The engine tries each way to split the same run among iterations, 2^(n-1) compositions, and each ends in a failed match. Each extra character roughly doubles the time."
  question: javascript/regular-expressions/catastrophic-backtracking
- id: backtracking-on-failure
  front: "Why must ReDoS tests use near-miss inputs rather than matching ones?"
  back: "Backtracking blows up when the overall match fails. A long valid prefix plus one bad character at the end triggers it."
  question: javascript/regular-expressions/catastrophic-backtracking
- id: no-atomic-groups-js
  front: "Does JavaScript have atomic groups or possessive quantifiers, and how is one emulated?"
  back: "No. Emulate with a lookahead and a backreference, `(?=(a+))\\1`, since lookarounds are atomic and the engine cannot re-split what the lookahead captured."
  question: javascript/regular-expressions/catastrophic-backtracking
- id: lazy-not-a-fix
  front: "Do lazy quantifiers such as `(a+?)+?` fix catastrophic backtracking?"
  back: "No. Lazy quantifiers and `*` change the order of attempts, not the number of ways to split the text."
  question: javascript/regular-expressions/catastrophic-backtracking
- id: anchor-quadratic-vs-exponential
  front: "Does anchoring a regex with `^` or using `y` prevent catastrophic backtracking?"
  back: "It removes the quadratic retry from every start position, but not the exponential case: `^(a+)+$` is anchored and still explodes."
  question: javascript/regular-expressions/catastrophic-backtracking
- id: re2-limits
  front: "Why are RE2-style linear-time engines not a drop-in replacement for JavaScript regexes?"
  back: "Their guarantee comes from dropping backreferences and lookarounds. JavaScript semantics are defined as a backtracking search, so a general fix would change which patterns are legal."
  question: javascript/regular-expressions/catastrophic-backtracking
- id: regex-vm-timeout
  front: "How can Node.js cap the damage of a regex you cannot rewrite, and what does it not do?"
  back: "Run it in a `vm` context with `timeout` (throws `ERR_SCRIPT_EXECUTION_TIMEOUT`) or a worker thread you terminate. It limits damage; it does not fix the pattern, and `vm` is not a security sandbox."
  question: javascript/regular-expressions/catastrophic-backtracking
- id: match-g-returns-strings
  front: "What does `s.match(re)` return with the `g` flag compared with without it?"
  back: "With `g`: an array of the matched strings only, or `null`. Without `g`: a detailed match array with `index`, `input` and `groups`."
  question: javascript/regular-expressions/regex-methods
- id: matchall-clone
  front: "Why does `matchAll` leave your regex's `lastIndex` untouched, and what does it need?"
  back: "It iterates on a clone of the regex. It requires the `g` flag and throws `TypeError` without it. `replaceAll` also requires `g` for a regex."
  question: javascript/regular-expressions/regex-methods
- id: exec-empty-match-loop
  front: "Why can a manual `while (re.exec(s))` loop never end for a pattern like `/x*/g`?"
  back: "`exec` does not advance `lastIndex` on an empty match. `matchAll`, `match` and `replace` advance one position for you."
  question: javascript/regular-expressions/regex-methods
- id: string-arg-literal-or-pattern
  front: "Which `String` methods treat a string argument as a pattern, and which as literal text?"
  back: "`match`, `matchAll` and `search` convert a string to a regex. `replace`, `replaceAll`, `split`, `includes` and `indexOf` treat it literally."
  question: javascript/regular-expressions/regex-methods
- id: replace-callback-args
  front: "What arguments does a `replace` callback receive?"
  back: "`(match, ...captures, offset, string, groups)`. `groups` is passed only when the pattern has named groups."
  question: javascript/regular-expressions/regex-methods
- id: replace-dollar-patterns
  front: "Why pass a function instead of user text as the `replace` replacement?"
  back: "A replacement string expands `$&`, `$1`, `$<name>` and similar patterns. A function such as `() => userText` is used verbatim."
  question: javascript/regular-expressions/regex-methods
- id: split-capture-groups
  front: "What does `split` do with a capturing group in the regex?"
  back: "The captured text is spliced into the result: `'a1b2'.split(/(\\d)/)` is `['a', '1', 'b', '2', '']`."
  question: javascript/regular-expressions/regex-methods
- id: regexp-escape-use
  front: "What does `RegExp.escape` do, and when should you use it?"
  back: "ES2025: it escapes every pattern-special character so user text matches literally in `new RegExp(...)`. Use it only when building a regex, not for `replaceAll` with a string."
  question: javascript/regular-expressions/regex-methods
# 23 Dates, Temporal and Intl
- id: date-time-value
  front: "What does a `Date` actually store?"
  back: "One time value: integer milliseconds since 1970-01-01T00:00:00Z (within about ±273,790 years), or `NaN` if invalid. It stores an instant, not a calendar date or time zone."
  question: javascript/dates-temporal-intl/date-pitfalls
- id: date-only-vs-datetime-parse
  front: "How are `new Date('2026-03-08')` and `new Date('2026-03-08T00:00')` parsed differently?"
  back: "A date-only ISO string with no offset is read as UTC. A date-time string with no offset is read as local time."
  question: javascript/dates-temporal-intl/date-pitfalls
- id: date-non-iso-parse
  front: "What does the spec guarantee about parsing non-ISO date strings like `'March 8, 2026'`?"
  back: "Nothing. Only the `YYYY-MM-DDTHH:mm:ss.sssZ` format is specified; other strings are implementation-defined and can differ between engines."
  question: javascript/dates-temporal-intl/date-pitfalls
- id: date-month-rollover
  front: "How do `Date` constructor months, days and out-of-range fields behave?"
  back: "Months are 0-based, days 1-based. Out-of-range fields roll over, so `new Date(2026, 1, 31)` is March 3. Two-digit years 0-99 map to 1900-1999."
  question: javascript/dates-temporal-intl/date-pitfalls
- id: date-invalid-handling
  front: "What does an invalid `Date` do, and which method throws on it?"
  back: "Its time value is `NaN` and it prints `Invalid Date`. Only `toISOString()` throws a `RangeError`; getters return `NaN`. Check with `Number.isNaN(d.getTime())`."
  question: javascript/dates-temporal-intl/date-pitfalls
- id: date-timezone-offset-sign
  front: "What sign does `getTimezoneOffset()` use, and does it identify a zone?"
  back: "The opposite of the usual notation: UTC-5 gives `300`. It describes only that instant's offset, not the zone or its rules."
  question: javascript/dates-temporal-intl/date-pitfalls
- id: date-call-without-new
  front: "What does calling `Date()` without `new` return?"
  back: "A string for the current time, not a `Date`. Any arguments are ignored."
  question: javascript/dates-temporal-intl/date-pitfalls
- id: date-json-roundtrip
  front: "How does `JSON.stringify` treat a `Date`, and does `JSON.parse` reverse it?"
  back: "It calls `toJSON()`, which returns `toISOString()` (or `null` if invalid). `JSON.parse` gives back a string; you must rebuild the `Date`."
  question: javascript/dates-temporal-intl/date-pitfalls
- id: temporal-type-choice-instant-zoned
  front: "When do you pick `Temporal.Instant` versus `Temporal.ZonedDateTime`?"
  back: "`Instant` is an exact moment with no zone: timestamps, logs, ordering. `ZonedDateTime` is a moment in a place, with zone and calendar: meetings, flights."
  question: javascript/dates-temporal-intl/temporal-types
- id: temporal-plain-types
  front: "What are `PlainDate`, `PlainTime` and `PlainDateTime` for?"
  back: "Wall-clock values with no time zone, so no DST: a calendar date, a clock time, or both. They suit birthdays, alarms and local times not yet tied to a place."
  question: javascript/dates-temporal-intl/temporal-types
- id: temporal-immutable
  front: "Are Temporal objects mutable?"
  back: "No. Every object is immutable; `add`, `with` and `round` return new objects."
  question: javascript/dates-temporal-intl/temporal-types
- id: temporal-days-vs-hours
  front: "On a `ZonedDateTime` across a DST change, how do `add({ days: 1 })` and `add({ hours: 24 })` differ?"
  back: "`days: 1` keeps the same wall-clock time. `hours: 24` adds elapsed time, so the clock time shifts by the DST change."
  question: javascript/dates-temporal-intl/temporal-types
- id: temporal-overflow
  front: "What does Temporal's `overflow` option control on month-end dates?"
  back: "`'constrain'` (default) clamps Jan 31 plus one month to Feb 28. `'reject'` throws a `RangeError`."
  question: javascript/dates-temporal-intl/temporal-types
- id: temporal-instant-no-calendar-units
  front: "Why does `instant.add({ days: 1 })` throw?"
  back: "A day is not a fixed length, and `Instant` has no calendar or zone. It throws `RangeError`; use hours, or convert to `ZonedDateTime`."
  question: javascript/dates-temporal-intl/temporal-types
- id: temporal-duration-relativeto
  front: "Why does `Duration.total()` in months or years need `relativeTo`?"
  back: "A month has no fixed length: one month totals 28 or 31 days depending on the reference date. Without `relativeTo` it throws `RangeError`."
  question: javascript/dates-temporal-intl/temporal-types
- id: temporal-removed-timezone-calendar
  front: "What happened to `Temporal.TimeZone` and `Temporal.Calendar`?"
  back: "They were removed before stage 4. Time zones and calendars are now plain string identifiers like `'Asia/Tokyo'` passed as arguments."
  question: javascript/dates-temporal-intl/temporal-types
- id: temporal-comparison
  front: "How do you compare Temporal objects, and what happens with `<` or `+`?"
  back: "Use `compare()` and `equals()`. `<` and `+` throw instead of coercing."
  question: javascript/dates-temporal-intl/temporal-types
- id: temporal-date-bridge
  front: "How do you convert a `Date` to Temporal and back?"
  back: "`date.toTemporalInstant()`, then `.toZonedDateTimeISO(zone)` for a wall-clock view. Back: `new Date(instant.epochMilliseconds)`, which truncates to milliseconds."
  question: javascript/dates-temporal-intl/temporal-types
- id: intl-timezone-separate
  front: "Which time zone does `Intl.DateTimeFormat` use if you pass only a locale?"
  back: "The host's zone. The locale sets wording and order, not the zone; pass an IANA `timeZone` for consistent output across machines."
  question: javascript/dates-temporal-intl/intl-formatting
- id: intl-datestyle-conflict
  front: "Can `dateStyle` and `timeStyle` be combined with field options like `hour`?"
  back: "No. V8 throws a `TypeError` at construction. `hour12` overrides `hourCycle`."
  question: javascript/dates-temporal-intl/intl-formatting
- id: intl-pluralrules-categories
  front: "Why select plural forms with `Intl.PluralRules` instead of `n === 1`?"
  back: "Languages have different plural categories: English `one`/`other`, Polish `one`/`few`/`many`/`other`, Arabic six. Select a category and map it to a message."
  question: javascript/dates-temporal-intl/intl-formatting
- id: intl-ordinal-english
  front: "What are the English ordinal categories for 1, 2, 3, 4, 11 and 21?"
  back: "`one`, `two`, `few`, `other`, `other`, `one`. Eleven is `other` because the rule excludes numbers ending in 11."
  question: javascript/dates-temporal-intl/intl-formatting
- id: intl-reuse-formatters
  front: "Why construct an `Intl` formatter once and reuse it?"
  back: "Construction loads locale data. `toLocaleString(locale, options)` builds a formatter each call; in one measurement it was about 395 ms against about 7 ms for 20,000 reused-formatter calls."
  question: javascript/dates-temporal-intl/intl-formatting
- id: intl-data-dependent
  front: "Why should you not parse or assert on `Intl`-formatted strings across environments?"
  back: "Output comes from the engine's ICU/CLDR data, so the same call can differ across engines and versions."
  question: javascript/dates-temporal-intl/intl-formatting
- id: intl-formattoparts
  front: "What does `formatToParts` return, and how should you use it?"
  back: "`{ type, value }` entries in locale order. Render or compare by `type` instead of splitting the formatted string."
  question: javascript/dates-temporal-intl/intl-formatting
- id: intl-relativetime-auto
  front: "What does `RelativeTimeFormat` with `numeric: 'auto'` do, and what is left to you?"
  back: "It uses idioms where the locale has them: `format(-1, 'day')` gives `yesterday`. You supply the number and unit; computing the difference is your job."
  question: javascript/dates-temporal-intl/intl-formatting
- id: tz-three-concepts
  front: "What is the difference between an instant, an offset and a time zone?"
  back: "An instant is a UTC moment, the same everywhere. An offset is a fixed difference at one moment (`-04:00`). A zone is an IANA id naming a history of offset rules, including DST."
  question: javascript/dates-temporal-intl/time-zones
- id: tz-future-events
  front: "How should you store a future local event such as a 09:00 meeting in London?"
  back: "Wall time plus the zone id. A UTC instant computed today is wrong if the government changes the zone's rules before the event."
  question: javascript/dates-temporal-intl/time-zones
- id: tz-store-utc-past
  front: "How should you store past events and when do you convert to a zone?"
  back: "Store UTC instants (ISO with `Z`, or epoch milliseconds). Convert to a zone only for display, with an explicit `timeZone`."
  question: javascript/dates-temporal-intl/time-zones
- id: tz-dst-gap-overlap
  front: "What are a DST gap and a DST overlap?"
  back: "A gap is a range of local times skipped when clocks go forward. An overlap is a range that happens twice when clocks go back. You must pick a policy."
  question: javascript/dates-temporal-intl/time-zones
- id: date-dst-resolution
  front: "How does `Date` resolve a skipped local time and a repeated local time?"
  back: "A skipped time is moved forward by the gap. A repeated time resolves to the earlier instant."
  question: javascript/dates-temporal-intl/time-zones
- id: temporal-disambiguation
  front: "What are Temporal's `disambiguation` options for gaps and overlaps?"
  back: "`'compatible'` (default), `'earlier'`, `'later'` and `'reject'`. `'reject'` throws `RangeError`, useful for user-entered times that must be valid."
  question: javascript/dates-temporal-intl/time-zones
- id: tz-abbreviation-ambiguity
  front: "Why avoid `EST` or `IST` as time zone identifiers?"
  back: "Abbreviations are ambiguous, and IANA says to prefer ids like `America/New_York`. Engines also format them only for some locale and zone combinations."
  question: javascript/dates-temporal-intl/time-zones
- id: tz-day-length
  front: "Can a calendar day be 23 or 25 hours long?"
  back: "Yes, on DST transition days. In `America/New_York`, 2026-03-08 has 23 hours and 2026-11-01 has 25. Never add `24 * 3600 * 1000` to mean tomorrow."
  question: javascript/dates-temporal-intl/time-zones
- id: tz-user-zone
  front: "How do you get the browser's IANA time zone?"
  back: "`Intl.DateTimeFormat().resolvedOptions().timeZone`."
  question: javascript/dates-temporal-intl/time-zones
# 24 JSON and binary data
- id: json-stringify-pipeline
  front: "In what order does `JSON.stringify` apply `toJSON`, the replacer function, and wrapper unwrapping for each value?"
  back: "First `toJSON(key)` if the value is an object or BigInt, then the replacer function with `this` as the holder, then unwrap `Number`, `String`, `Boolean` and `BigInt` wrappers, then serialize by type."
  question: javascript/json-and-binary-data/json-stringify-edge-cases
- id: json-stringify-undefined-function-symbol
  front: "How does `JSON.stringify` handle `undefined`, functions and symbols in an object, in an array, and at top level?"
  back: "Omitted from objects, `null` in arrays, and at top level `JSON.stringify` returns `undefined` (not a string)."
  question: javascript/json-and-binary-data/json-stringify-edge-cases
- id: json-stringify-nan-infinity
  front: "What does `JSON.stringify` write for `NaN`, `Infinity` and `-0`?"
  back: "`null` for `NaN` and `Infinity`/`-Infinity`. `-0` is written as `0`."
  question: javascript/json-and-binary-data/json-stringify-edge-cases
- id: json-stringify-bigint-throws
  front: "What does `JSON.stringify` do with a BigInt value, and why is there no default?"
  back: "It throws `TypeError`. Most consumers read JSON numbers as doubles, so you choose a format: a string, `BigInt.prototype.toJSON` or a replacer."
  question: javascript/json-and-binary-data/json-stringify-edge-cases
- id: json-stringify-own-enumerable
  front: "Which properties does `JSON.stringify` write for an object?"
  back: "Own enumerable string-keyed properties: integer keys first, then insertion order. Symbol keys, inherited, non-enumerable and `#private` fields are skipped, so `Map` and `Set` come out as `{}`."
  question: javascript/json-and-binary-data/json-stringify-edge-cases
- id: json-array-replacer
  front: "How does an array replacer in `JSON.stringify` behave?"
  back: "It is an allow-list of object keys applied at every depth. It does not filter array elements."
  question: javascript/json-and-binary-data/json-stringify-edge-cases
- id: json-cycle-vs-shared
  front: "Why does `JSON.stringify` throw on a cycle but not on a shared reference?"
  back: "The spec keeps a stack of objects currently being serialized. An object already on the stack is a cycle. Finishing an object pops it, so a sibling reference serializes again."
  question: javascript/json-and-binary-data/json-stringify-edge-cases
- id: json-clone-trap
  front: "Why is `JSON.parse(JSON.stringify(x))` a poor deep clone?"
  back: "It drops `undefined`, functions and symbols, turns `Date` into strings and `Map`/`Set` into `{}`, `NaN` into `null`, and throws on BigInt and cycles. Use `structuredClone`."
  question: javascript/json-and-binary-data/json-stringify-edge-cases
- id: json-invalid-date
  front: "What does `JSON.stringify({ d: new Date(NaN) })` produce?"
  back: "`{\"d\":null}`. `Date.prototype.toJSON` returns `null` for a non-finite time value, while `toISOString()` would throw `RangeError`."
  question: javascript/json-and-binary-data/json-stringify-edge-cases
- id: reviver-order
  front: "In what order does a `JSON.parse` reviver visit values, and what does `this` refer to?"
  back: "Post-order: children before parents, with the root last under key `\"\"`. `this` is the object holding the value."
  question: javascript/json-and-binary-data/json-parse-reviver
- id: reviver-undefined-deletes
  front: "What does returning `undefined` from a `JSON.parse` reviver do?"
  back: "It deletes the property; an array element becomes a hole. Returning `undefined` for the root makes `JSON.parse` return `undefined`."
  question: javascript/json-and-binary-data/json-parse-reviver
- id: reviver-precision-loss
  front: "Why can't a reviver restore a large integer from its `value` argument?"
  back: "The parser has already converted numbers to doubles, so `12345678901234567890` is `12345678901234567000`. Use `context.source` instead."
  question: javascript/json-and-binary-data/json-parse-reviver
- id: reviver-context-source
  front: "When is `context.source` available in a `JSON.parse` reviver?"
  back: "For unmodified primitives (string, number, boolean, `null`) it is the exact input text, such as `\"1E2\"`. Objects and arrays have no `source`, nor does a value an earlier reviver call replaced."
  question: javascript/json-and-binary-data/json-parse-reviver
- id: json-rawjson
  front: "What does `JSON.rawJSON(text)` do?"
  back: "It returns a frozen null-prototype object that `JSON.stringify` emits verbatim, so a BigInt can be written as a JSON number. It accepts only primitive text and throws `SyntaxError` on invalid text."
  question: javascript/json-and-binary-data/json-parse-reviver
- id: reviver-validation-first
  front: "Does the `JSON.parse` reviver run when the text is invalid?"
  back: "No. `JSON.parse` validates the whole text first and throws `SyntaxError` before any reviver call. Revival is a second pass over the finished value."
  question: javascript/json-and-binary-data/json-parse-reviver
- id: json-duplicate-keys
  front: "What happens with duplicate keys like `{\"a\":1,\"a\":2}` in `JSON.parse`?"
  back: "The last one wins, with no error reported. The reviver sees only `a: 2`."
  question: javascript/json-and-binary-data/json-parse-reviver
- id: arraybuffer-no-indexing
  front: "What is an `ArrayBuffer`, and how do you read it?"
  back: "A fixed block of zero-filled raw bytes with a `byteLength` and no indexing. You read and write through a view: a typed array or a `DataView`."
  question: javascript/json-and-binary-data/arraybuffer-typed-arrays
- id: typedarray-slice-subarray
  front: "How do `slice()` and `subarray()` differ on a typed array?"
  back: "`slice()` copies into a new buffer. `subarray()` returns a new view on the same buffer, so writes through one are visible in the other."
  question: javascript/json-and-binary-data/arraybuffer-typed-arrays
- id: dataview-endianness
  front: "What byte order do typed arrays and `DataView` use by default?"
  back: "Typed arrays use the host's byte order (little-endian on most hardware). `DataView` defaults to big-endian unless `littleEndian` is `true`."
  question: javascript/json-and-binary-data/arraybuffer-typed-arrays
- id: typedarray-alignment
  front: "What alignment limits apply to a typed array on a buffer versus a `DataView`?"
  back: "A typed array's `byteOffset` must be a multiple of its element size, or `RangeError`. A `DataView` reads unaligned at any byte offset."
  question: javascript/json-and-binary-data/arraybuffer-typed-arrays
- id: typedarray-write-conversion
  front: "What happens on typed array writes that overflow or go out of range?"
  back: "Integers wrap modulo 2^n; `Uint8ClampedArray` saturates. Writes never throw: an out-of-range index is ignored and reads give `undefined`."
  question: javascript/json-and-binary-data/arraybuffer-typed-arrays
- id: dataview-range-error
  front: "What does a `DataView` getter do when the read would exceed the view?"
  back: "It throws `RangeError`, unlike a typed array, which silently returns `undefined` for an out-of-range index."
  question: javascript/json-and-binary-data/arraybuffer-typed-arrays
- id: typedarray-sort-default
  front: "How does default `sort()` differ between typed arrays and ordinary arrays?"
  back: "Typed array `sort()` is numeric by default. `Array.prototype.sort` compares as strings."
  question: javascript/json-and-binary-data/arraybuffer-typed-arrays
- id: resizable-arraybuffer-views
  front: "What happens to length-tracking and fixed-length views when a resizable `ArrayBuffer` shrinks?"
  back: "A length-tracking view follows the new length. A view with fixed length or offset goes out of bounds when the buffer shrinks below it: `length` reads `0` and methods throw `TypeError`. It recovers if the buffer grows back."
  question: javascript/json-and-binary-data/modern-binary-data
- id: arraybuffer-transfer-detach
  front: "What does `buffer.transfer(newLength)` do to the original buffer?"
  back: "It moves the bytes into a new buffer and detaches the original: `detached` is `true`, `byteLength` is `0` and views report length `0`. `transfer` keeps resizability; `transferToFixedLength` drops it."
  question: javascript/json-and-binary-data/modern-binary-data
- id: typedarray-copying-methods
  front: "Which non-mutating methods did typed arrays gain in ES2023?"
  back: "`toSorted`, `toReversed` and `with`, which return a new typed array instead of mutating."
  question: javascript/json-and-binary-data/modern-binary-data
- id: float16-range
  front: "What is `Float16Array`'s precision and range?"
  back: "Half precision: 1 sign, 5 exponent and 10 fraction bits, about 3 decimal digits. The largest finite value is 65504, and larger values round to `Infinity`. ES2025, Node 24+."
  question: javascript/json-and-binary-data/modern-binary-data
- id: base64-uint8array-guard
  front: "What is the status of `Uint8Array` base64 and hex methods, and how should you guard them?"
  back: "Stage 4 (July 2025, ES2026), but only in Node 26+ among the Node versions measured. Check `typeof Uint8Array.fromBase64 === 'function'` and keep a `btoa` or `Buffer` fallback."
  question: javascript/json-and-binary-data/modern-binary-data
- id: sab-purpose
  front: "How does `postMessage` of a `SharedArrayBuffer` differ from a normal `ArrayBuffer`?"
  back: "A normal one is copied or transferred so one side owns it. A `SharedArrayBuffer` sends a handle to the same memory that several agents see at once."
  question: javascript/json-and-binary-data/sharedarraybuffer-atomics
- id: sab-data-race
  front: "Why can `counter[0]++` on shared memory lose updates?"
  back: "It is a read, an add and a write. Two threads can both read 5 and both write 6. `Atomics.add` performs the update as one indivisible step."
  question: javascript/json-and-binary-data/sharedarraybuffer-atomics
- id: atomics-wait-requirements
  front: "What does `Atomics.wait` need, and where does it throw?"
  back: "An `Int32Array` or `BigInt64Array` on a `SharedArrayBuffer`. It throws `TypeError` where the agent may not block, such as a browser's main thread. `Atomics.waitAsync` avoids blocking."
  question: javascript/json-and-binary-data/sharedarraybuffer-atomics
- id: atomics-wait-results
  front: "What can `Atomics.wait` return, and when does it sleep?"
  back: "`\"ok\"`, `\"not-equal\"` or `\"timed-out\"`. It sleeps only if the slot still equals `expected`; otherwise it returns `\"not-equal\"` at once."
  question: javascript/json-and-binary-data/sharedarraybuffer-atomics
- id: atomics-return-old
  front: "What do `Atomics.add` and `Atomics.compareExchange` return?"
  back: "The old value at the slot. `compareExchange` stores the new value only if the old one matched the expected value."
  question: javascript/json-and-binary-data/sharedarraybuffer-atomics
- id: sab-cross-origin-isolation
  front: "What does a browser require to expose `SharedArrayBuffer`?"
  back: "A secure, cross-origin isolated page: `Cross-Origin-Opener-Policy: same-origin` and `Cross-Origin-Embedder-Policy: require-corp` (or `credentialless`). Check `crossOriginIsolated`. Node has no such restriction."
  question: javascript/json-and-binary-data/sharedarraybuffer-atomics
- id: sab-when-not-needed
  front: "When is `SharedArrayBuffer` unnecessary?"
  back: "When one thread owns the data at a time. A `postMessage` transfer list moves an `ArrayBuffer` without copying and is race-free."
  question: javascript/json-and-binary-data/sharedarraybuffer-atomics
# 25 Memory and garbage collection
- id: gc-reachability-not-refcount
  front: "When does a JavaScript engine free an object: when its reference count hits zero, or when it is unreachable?"
  back: "When it is unreachable from a root (live stack variables, the global object, engine handles). Reference counting fails on cycles; tracing handles them because reachability is measured from the roots."
  question: javascript/memory-and-gc/garbage-collection
- id: gc-mark-sweep-phases
  front: "What are the phases of mark-and-sweep, including V8's optional extra step?"
  back: "Mark everything reachable from the roots, sweep (reclaim unmarked objects), and optionally compact (move survivors together to reduce fragmentation, as V8 does)."
  question: javascript/memory-and-gc/garbage-collection
- id: gc-spec-no-guarantee
  front: "What does the ECMAScript spec guarantee about garbage collection?"
  back: "Nothing. It makes no guarantee that any object will be collected; objects may be released after long periods or never. There is no standard `gc()`; V8 exposes one only behind `--expose-gc`."
  question: javascript/memory-and-gc/garbage-collection
- id: gc-liveness-approximation
  front: "How does the spec define liveness, and what do engines use in practice?"
  back: "A value is live if the program can still observe its identity (or it is kept alive). The spec notes this is undecidable, so engines use conservative approximations such as reachability."
  question: javascript/memory-and-gc/garbage-collection
- id: gc-null-assignment
  front: "Does `x = null` free the object `x` referred to?"
  back: "No. It removes one reference. The object survives if anything else reaches it, and is reclaimed at the engine's convenience, not immediately."
  question: javascript/memory-and-gc/garbage-collection
- id: gc-weak-edges
  front: "Are `WeakMap` entries, `WeakRef`s and `FinalizationRegistry` registrations followed when deciding liveness?"
  back: "No. Weak edges are not paths to the target, which is what the weak collections are for."
  question: javascript/memory-and-gc/garbage-collection
- id: gc-tricolour-marking
  front: "What are V8's three marking colours?"
  back: "White (not yet discovered), grey (discovered, children not processed), black (fully processed). Marking ends when no grey objects remain; remaining white objects are unreachable."
  question: javascript/memory-and-gc/garbage-collection
- id: gc-live-variable-roots
  front: "Are all variables in scope GC roots?"
  back: "No. Roots are live variables. V8 can collect an object whose variable is in scope but never read again, though this is engine behaviour, not specified."
  question: javascript/memory-and-gc/garbage-collection
- id: leak-definition
  front: "What is a memory leak in a garbage-collected language like JavaScript?"
  back: "Data you will never use again that is still reachable, so the collector must keep it. Unreachable memory cannot leak."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-usual-retainers
  front: "Name the usual retainers behind JavaScript memory leaks."
  back: "Unbounded caches and collections, event listeners never removed, live timers, closures capturing too much, detached DOM nodes still referenced, and accidental globals or module-level state."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-confirm-after-gc
  front: "How do you confirm that rising memory is a real leak?"
  back: "Repeat identical work and compare the heap after a forced collection. A rising floor after GC is a leak; the normal sawtooth of allocation and collection is not."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-heap-snapshot-method
  front: "How do you locate a leak with Chrome DevTools heap snapshots?"
  back: "Take a snapshot, repeat the action, take another, and use the Comparison view. Read the Retainers pane for the path from a root back to the leaked object."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-node-snapshot
  front: "How can you capture a heap snapshot of a Node.js process?"
  back: "`v8.writeHeapSnapshot()`, `--heapsnapshot-signal=SIGUSR2`, or `--heapsnapshot-near-heap-limit=N`, then load the `.heapsnapshot` file in DevTools."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-detached-dom
  front: "What is a detached DOM node leak?"
  back: "An element removed from the page but still referenced from JavaScript, which keeps its whole subtree alive."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-anonymous-listener
  front: "Why can't an anonymous event handler be removed later, and what removes listeners in bulk?"
  back: "`removeEventListener` needs the same function reference. Pass `{ signal }` from an `AbortController` to `addEventListener` and abort it to remove listeners in bulk."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-max-old-space
  front: "Does raising `--max-old-space-size` fix a leak?"
  back: "No, it only delays the crash. Hitting the old-generation cap aborts with `FATAL ERROR: Reached heap limit … JavaScript heap out of memory`."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-shallow-vs-retained
  front: "What is the difference between shallow size and retained size in heap snapshots?"
  back: "Shallow size is the memory the object itself holds. Retained size is what would become unreachable if the object were deleted."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-non-heap-memory
  front: "What does rising `rss` with flat `heapUsed` suggest?"
  back: "Growth outside ordinary JS objects: `external` (native memory tied to JS objects) or `arrayBuffers`."
  question: javascript/memory-and-gc/memory-leaks
- id: leak-map-object-keys
  front: "Why is a `Map` keyed by objects a leaky cache?"
  back: "The `Map` holds its keys strongly forever. Use a `WeakMap` when data should live exactly as long as the key object."
  question: javascript/memory-and-gc/memory-leaks
- id: weakref-deref
  front: "What does `WeakRef.prototype.deref()` return?"
  back: "The target, or `undefined` if the engine has reclaimed it. The reference alone does not keep the target alive, and each use needs the `undefined` check."
  question: javascript/memory-and-gc/weakref-finalizationregistry
- id: weakref-keepduringjob
  front: "What does the spec's KeepDuringJob guarantee for `WeakRef`?"
  back: "`new WeakRef(target)` and `deref()` hold the target strongly until the end of the current synchronous job. It cannot vanish between two `deref()` calls in the same job, but can between jobs."
  question: javascript/memory-and-gc/weakref-finalizationregistry
- id: finalization-no-guarantee
  front: "Is a `FinalizationRegistry` callback guaranteed to run?"
  back: "No. Implementations may omit callbacks for any reason, such as shutdown. Callbacks run as a separate job after synchronous code ends, so never use them as the only cleanup."
  question: javascript/memory-and-gc/weakref-finalizationregistry
- id: finalization-held-value-cycle
  front: "Why must a registry's held value not reference the target?"
  back: "The registry holds the held value strongly, so that keeps the target alive and the callback never fires. `register(o, o)` throws `TypeError` for the direct case."
  question: javascript/memory-and-gc/weakref-finalizationregistry
- id: weakref-valid-targets
  front: "What can a `WeakRef` target or registry token be?"
  back: "An object or a non-registered symbol (`CanBeHeldWeakly`). Primitives and `Symbol.for` symbols throw `TypeError`."
  question: javascript/memory-and-gc/weakref-finalizationregistry
- id: finalization-unregister
  front: "How do you cancel a `FinalizationRegistry` registration?"
  back: "Pass an unregister token as the third argument to `register`, then call `unregister(token)`. It returns `true` if something was removed, `false` otherwise."
  question: javascript/memory-and-gc/weakref-finalizationregistry
- id: weakref-vs-weakmap
  front: "When prefer `WeakMap` over `WeakRef`?"
  back: "`WeakMap` attaches data to an object for as long as it lives, and its timing is unobservable. `WeakRef` lets you observe whether the object is still there, exposing GC timing."
  question: javascript/memory-and-gc/weakref-finalizationregistry
- id: v8-generational-hypothesis
  front: "What is the generational hypothesis behind V8's heap layout?"
  back: "Most objects die young. V8 splits the heap into a small young generation collected often and a large old generation collected less often."
  question: javascript/memory-and-gc/v8-generational-gc
- id: v8-scavenger
  front: "How does V8's scavenger collect the young generation?"
  back: "The young area is two semi-spaces, one in use. When the nursery fills, the scavenger copies live objects to the other half, so only survivors are touched. Surviving one scavenge makes an object intermediate; another promotes it to the old generation."
  question: javascript/memory-and-gc/v8-generational-gc
- id: v8-write-barrier-remembered
  front: "How can a V8 scavenge be correct without scanning the old generation?"
  back: "Write barriers keep a list of old-to-new references, and those slots act as extra roots for the scavenge."
  question: javascript/memory-and-gc/v8-generational-gc
- id: v8-major-gc-phases
  front: "What are the phases of V8's old-generation (major) GC?"
  back: "Marking (tri-colour traversal from the roots), sweeping (freed gaps go on free-lists) and compacting (some fragmented pages are evacuated)."
  question: javascript/memory-and-gc/v8-generational-gc
- id: v8-orinoco-techniques
  front: "What are the three pause-shortening techniques of V8's Orinoco project?"
  back: "Parallel (main thread and helpers split a pause), incremental (small slices on the main thread) and concurrent (helpers work while JavaScript runs). Marking is concurrent."
  question: javascript/memory-and-gc/v8-generational-gc
- id: v8-semispace-tradeoff
  front: "Why does V8 copy young objects instead of mark-sweeping them, and what is the cost?"
  back: "Work is proportional to the few live objects and copying compacts for free. The cost is that half the semi-space is always empty."
  question: javascript/memory-and-gc/v8-generational-gc
- id: v8-gc-engine-specific
  front: "Is the generational scheme with scavenge and mark-compact part of the ECMAScript spec?"
  back: "No. It is V8 behaviour (Chrome, Node, Deno) described in V8's blog posts. Other engines differ, so say \"in V8\"."
  question: javascript/memory-and-gc/v8-generational-gc
- id: v8-node-gc-flags
  front: "Which Node.js flags control the old-generation cap, the young generation and GC logging?"
  back: "`--max-old-space-size` (old-generation cap in MiB), `--max-semi-space-size` (young generation) and `--trace-gc` (log each collection)."
  question: javascript/memory-and-gc/v8-generational-gc
# 26 Inside the engine
- id: v8-lazy-compilation
  front: "How does V8 compile inner functions, and which ones are compiled eagerly?"
  back: "The preparser skips them and V8 compiles each to bytecode on first call. Parenthesised function expressions, likely invoked at once, are compiled eagerly. This is V8 behaviour (Node 24.19 observation)."
  question: javascript/inside-the-engine/v8-pipeline
- id: v8-ignition-bytecode
  front: "What is Ignition, and what shape does its bytecode have?"
  back: "V8's interpreter. Bytecode is for a register machine with an implicit accumulator, and it is an internal representation that may change with any V8 release."
  question: javascript/inside-the-engine/v8-pipeline
- id: v8-feedback-vector
  front: "What is V8's feedback vector, and who reads it?"
  back: "Ignition records what it sees at each operation (number kinds, object shapes, call targets) in the feedback vector. Every later tier compiles using it. A slot widens, for example SignedSmall to Number to Any, and never narrows."
  question: javascript/inside-the-engine/v8-pipeline
- id: v8-tiers
  front: "What are V8's compilation tiers above Ignition, and what does each trade?"
  back: "Sparkplug (baseline, single pass, no IR), Maglev (fast optimizing compiler) and TurboFan (top tier: slowest to compile, fastest code). Maglev is roughly 10x slower to compile than Sparkplug and 10x faster than TurboFan."
  question: javascript/inside-the-engine/v8-pipeline
- id: v8-turbofan-input
  front: "What does TurboFan compile from?"
  back: "Bytecode plus type feedback, not source. The parser's work is not repeated."
  question: javascript/inside-the-engine/v8-pipeline
- id: v8-bytecode-flushing
  front: "What happens to bytecode a function has not run recently?"
  back: "It is flushed by age during major GCs and recompiled on demand, so a cold call can pay compile time again. The age resets when the function runs."
  question: javascript/inside-the-engine/v8-pipeline
- id: v8-not-all-optimized
  front: "Is every function optimized by TurboFan or Maglev in V8?"
  back: "No. Most run only in Ignition. Tier-up needs the function to be hot, and V8's trace gives the reason as \"hot and stable\"."
  question: javascript/inside-the-engine/v8-pipeline
- id: hidden-class-map
  front: "What is a hidden class (Map) in V8?"
  back: "A descriptor of an object's property names and where each lives, so the object stores only values. Objects with the same properties in the same order share a Map. Other engines call this idea a shape."
  question: javascript/inside-the-engine/hidden-classes-inline-caches
- id: hidden-class-transition-tree
  front: "What happens to an object's Map when you add a property?"
  back: "The object moves to another Map, linked in a transition tree by a back pointer. Objects built through the same sequence of additions end up sharing a Map."
  question: javascript/inside-the-engine/hidden-classes-inline-caches
- id: hidden-class-property-order
  front: "Do `{ x: 1, y: 2 }` and `{ y: 2, x: 1 }` share a hidden class in V8?"
  back: "No. Property order matters, and the creation route does too: an object built incrementally can have a different Map than a literal with the same keys (Node 24.19 observation)."
  question: javascript/inside-the-engine/hidden-classes-inline-caches
- id: inline-cache-mechanism
  front: "What does an inline cache do at a property access like `o.x`?"
  back: "It sits in a feedback vector slot and remembers the Maps seen there and where `x` lives. The next access checks the Map and loads from a known offset, skipping a general lookup."
  question: javascript/inside-the-engine/hidden-classes-inline-caches
- id: ic-states
  front: "What are the inline cache states and the observed cut-off to megamorphic?"
  back: "Uninitialised, monomorphic (one Map), polymorphic (a few) and megamorphic (too many). For property loads, 2-4 shapes were polymorphic and 5 megamorphic on Node 24.19 / V8 13.6; this is an observation, not a spec."
  question: javascript/inside-the-engine/hidden-classes-inline-caches
- id: delete-dictionary-mode
  front: "What does `delete` on a property other than the last added do to a V8 object?"
  back: "It switched the object to slow dictionary mode in the Node 24.19 run, where inline caches do not work and the Map is no longer shared. Assign `undefined` or build a new object instead."
  question: javascript/inside-the-engine/hidden-classes-inline-caches
- id: conditional-field-two-maps
  front: "Why does conditionally adding a field in a constructor hurt V8 performance?"
  back: "It creates two Maps for what you think of as one type, making every access site polymorphic. Always initialise the property, for example `this.isNegative = x < 0`."
  question: javascript/inside-the-engine/hidden-classes-inline-caches
- id: deopt-definition
  front: "What is deoptimization in V8?"
  back: "Optimized code is compiled from feedback and guarded by checks. When a guard fails, V8 discards the machine code, resumes in bytecode and may recompile later with new feedback. It is a correctness mechanism, not an error."
  question: javascript/inside-the-engine/deoptimization
- id: deopt-common-reasons
  front: "What are common V8 deoptimization reason categories?"
  back: "Shape (`wrong map`), number representation (`not a Smi`, `overflow`), types (`not a Number`), array access (`out of bounds`, `hole`), `wrong call target`, and `Insufficient type feedback` for a path that never ran."
  question: javascript/inside-the-engine/deoptimization
- id: deopt-recompile
  front: "Does a deoptimized function stay unoptimized forever?"
  back: "No. After a `wrong map` bailout, `getX` was marked and recompiled again from the updated feedback (Node 24.19 observation). The cost is in repeated optimize/deopt cycles."
  question: javascript/inside-the-engine/deoptimization
- id: deopt-no-feedback
  front: "Why can a branch deopt the first time it is taken after optimization?"
  back: "The optimizer had no feedback for that path, so it compiled a guard that bails out when reached. These are the `Insufficient type feedback …` reasons."
  question: javascript/inside-the-engine/deoptimization
- id: deopt-trace-flags
  front: "How do you see optimization and deoptimization in Node?"
  back: "Run with `--trace-opt --trace-deopt`. Output wording is not a stable interface, and `%`-natives need `--allow-natives-syntax` and are not public API."
  question: javascript/inside-the-engine/deoptimization
- id: deopt-microbenchmark
  front: "Why can a micro-benchmark with one kind of input mislead?"
  back: "It measures whichever tier and feedback it reached, and one different input mid-run can deoptimize it. Warm up with realistic inputs and check the traces."
  question: javascript/inside-the-engine/deoptimization
- id: elements-kinds-categories
  front: "What two dimensions make up a V8 elements kind?"
  back: "Value kind (`SMI`, `DOUBLE`, generic `ELEMENTS`) crossed with packing (`PACKED` or `HOLEY`). Very sparse arrays move to `DICTIONARY_ELEMENTS`, a hash table."
  question: javascript/inside-the-engine/elements-kinds
- id: elements-kinds-one-way
  front: "In which direction do V8 elements kind transitions go?"
  back: "One way, from specific to general: Smi to double to generic, and packed to holey. Pushing `4.5` makes a Smi array double; a string makes it generic. Emptying the array does not reset the kind."
  question: javascript/inside-the-engine/elements-kinds
- id: elements-kinds-minus-zero-nan
  front: "Does `-0` or `NaN` keep an array as `PACKED_SMI_ELEMENTS`?"
  back: "No. `-0`, `NaN` and `Infinity` count as doubles, so `[1, 2, 3, -0]` is `PACKED_DOUBLE_ELEMENTS` (confirmed on Node 24.19)."
  question: javascript/inside-the-engine/elements-kinds
- id: elements-holey-lookup
  front: "Why is reading a hole in a holey array slower in V8?"
  back: "A missing index may find a value on `Array.prototype`, so it forces a prototype-chain lookup. Packed arrays avoid that check."
  question: javascript/inside-the-engine/elements-kinds
- id: elements-integer-in-double
  front: "Does pushing an integer into a double array change its kind?"
  back: "No. `[1.5, 2.5]` followed by `push(1)` stayed `PACKED_DOUBLE_ELEMENTS`; the value is stored as a double."
  question: javascript/inside-the-engine/elements-kinds
- id: smi-vs-heapnumber
  front: "What is the difference between a Smi and a HeapNumber in V8?"
  back: "A Smi is a small integer stored in the tagged word itself, with no allocation. Anything else (fractions, `-0`, `NaN`, large integers) is a heap object holding a boxed double. The language has only one Number type."
  question: javascript/inside-the-engine/smi-and-heap-numbers
- id: smi-range
  front: "What is the Smi range in V8?"
  back: "31 bits with pointer compression and 32 bits without. Node 24.19's build had compression off, so `2**31 - 1` was a Smi and `2**31` was not. Chrome ships with compression on."
  question: javascript/inside-the-engine/smi-and-heap-numbers
- id: smi-value-dependent
  front: "Is `10 / 2` a Smi in V8? What about `7 / 2` and `-0`?"
  back: "`10 / 2` is a Smi; whether a number is a Smi depends on its value, not how it was written. `7 / 2` and `-0` are not, since they need a double."
  question: javascript/inside-the-engine/smi-and-heap-numbers
- id: smi-overflow-not-error
  front: "Is a Smi overflow an error?"
  back: "No. The result simply becomes a HeapNumber. Optimized code that assumed Smis deoptimizes with `overflow` or `not a Smi`."
  question: javascript/inside-the-engine/smi-and-heap-numbers
- id: pointer-compression-node
  front: "What does V8 pointer compression do, and does Node 24.19 use it?"
  back: "Per V8's post it cut heap size by up to 43% and limits the heap to a 4 GB range. In the Node 24.19 build, `v8_enable_pointer_compression` was `0`."
  question: javascript/inside-the-engine/smi-and-heap-numbers
