# 01 How JavaScript runs
- id: ecmascript-vs-host-apis
  front: "Which layer defines `setTimeout`, `console` and `fetch`: the ECMAScript spec or the host?"
  back: "The host. ECMA-262 defines none of them. Hosts (browsers, Node.js, Deno, Bun) embed an engine and supply timers, `console`, the DOM, `fetch` and the event loop."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: bare-engine-test
  front: "What quick test tells you whether a feature is ECMAScript or a host API?"
  back: "Ask whether it would exist in a bare engine shell with no host. `Array.prototype.map` would; `setTimeout` would not."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: host-hook-definition
  front: "What is a host hook in the ECMAScript spec?"
  back: "An abstract operation whose behaviour the host supplies, marking where the spec is deliberately incomplete. Example: `HostEnqueuePromiseJob` decides how a promise reaction becomes a queued Job."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: event-loop-not-ecmascript
  front: "Is the event loop part of ECMAScript?"
  back: "No. The spec defines Jobs and the hooks that enqueue them. The event loop, task queues and timer-versus-I/O ordering are defined by the host (HTML Standard, or libuv-based code in Node.js)."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: node-is-not-v8
  front: "Why is 'Node.js' not a synonym for 'V8'?"
  back: "V8 is the engine. Node.js is a host built on V8 that adds libuv-backed I/O, `require` and its own module loader."
  question: javascript/how-javascript-runs/ecmascript-engine-host
- id: tc39-stage-3-meaning
  front: "What happens at TC39 Stage 3, and is the proposal final?"
  back: "Stage 3 is implementation and feedback: engines implement and may ship, sometimes behind a flag. It is not final; feedback can still change or stall the proposal."
  question: javascript/how-javascript-runs/tc39-process
- id: tc39-stage-4-bar
  front: "What does a proposal need to reach TC39 Stage 4?"
  back: "Two compatible implementations passing test262, real shipping experience, and editor approval. It is then merged into the spec draft."
  question: javascript/how-javascript-runs/tc39-process
- id: tc39-stage-2-7
  front: "What is TC39 Stage 2.7?"
  back: "Testing and validation. The spec text is complete and signed off by reviewers and editors, the design is frozen apart from changes found through testing, and tests are written."
  question: javascript/how-javascript-runs/tc39-process
- id: stage-4-not-available
  front: "Does a Stage 4 feature mean it works in your users' browsers?"
  back: "No. Stage 4 means the spec is settled. Each engine and host ships on its own schedule, so check real support (MDN compatibility data, `caniuse`) for your targets."
  question: javascript/how-javascript-runs/tc39-process
- id: v8-pipeline-stages
  front: "What is V8's execution pipeline for JavaScript, from source to optimized code?"
  back: "Parse to an AST, compile to bytecode run by the Ignition interpreter, then tier up hot functions through Sparkplug (baseline), Maglev (mid-tier) and TurboFan (top-tier optimizer)."
  question: javascript/how-javascript-runs/compiled-or-interpreted
- id: deoptimization-meaning
  front: "What is deoptimization in a JIT engine?"
  back: "Optimized machine code rests on assumptions from collected type feedback. When one breaks, for example a function receives a different type, the engine discards that code and falls back to a lower tier."
  question: javascript/how-javascript-runs/compiled-or-interpreted
- id: early-errors-at-parse
  front: "When are syntax errors and early errors, such as duplicate `let`, reported?"
  back: "At parse time, before any code runs, even inside a function that is never called."
  question: javascript/how-javascript-runs/compiled-or-interpreted
- id: why-not-optimize-everything
  front: "Why do engines start in an interpreter instead of optimizing everything up front?"
  back: "Optimizing is slow and costs memory, and most code runs once. Interpreting first keeps startup fast; only hot code earns the expensive tiers."
  question: javascript/how-javascript-runs/compiled-or-interpreted
- id: script-module-top-level-this
  front: "What is top-level `this` in a classic script versus an ES module?"
  back: "In a script it is the global object. In a module it is `undefined`."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: module-top-level-var-scope
  front: "Does a top-level `var` in a module become a property of `globalThis`?"
  back: "No. A module has its own scope. In a classic script, top-level `var` and function declarations become global object properties."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: module-evaluated-once
  front: "How many times is a module evaluated if it is imported from several places?"
  back: "Once per resolved URL. Later imports reuse the same module instance. A script is evaluated every time it is run or included."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: live-bindings-definition
  front: "What is a live binding in ES modules?"
  back: "An imported name is a read-only view of the exporting module's variable, not a copy. If the exporter reassigns an exported `let`, importers see the new value; they cannot assign to it."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: script-can-use-dynamic-import
  front: "Can a classic script load an ES module, and how?"
  back: "Yes, through dynamic `import()`, which returns a promise and is allowed in both goals. Static `import` declarations are a syntax error in a script."
  question: javascript/how-javascript-runs/scripts-vs-modules
- id: strict-undeclared-assignment
  front: "What does assigning to an undeclared name do in strict mode versus sloppy mode?"
  back: "Strict mode throws `ReferenceError`. Sloppy mode silently creates a global variable."
  question: javascript/how-javascript-runs/strict-mode
- id: strict-this-plain-call
  front: "What is `this` in a plain function call in strict mode?"
  back: "`undefined`, and a primitive `this` stays a primitive. Sloppy mode substitutes `globalThis` or a wrapper object."
  question: javascript/how-javascript-runs/strict-mode
- id: strict-automatic-contexts
  front: "Which code is strict automatically, without a `'use strict'` directive?"
  back: "Module code, class bodies (all methods, accessors, fields and static blocks), and code nested inside strict code."
  question: javascript/how-javascript-runs/strict-mode
- id: use-strict-directive-position
  front: "Where must `'use strict'` appear for it to take effect?"
  back: "As the first statement of a script or function body (comments are fine). After another statement it is just an expression statement and does nothing."
  question: javascript/how-javascript-runs/strict-mode
- id: strict-arguments-unmapped
  front: "What does it mean that `arguments` is unmapped in strict mode?"
  back: "It no longer aliases the named parameters, so writing one does not change the other. In sloppy functions with simple parameters they share storage. `arguments.callee` throws in strict mode."
  question: javascript/how-javascript-runs/strict-mode
- id: polyfill-vs-transpiler-split
  front: "What is the rule of thumb for polyfills versus transpilers?"
  back: "New syntax is transpiled at build time; new built-ins (APIs) are polyfilled at run time."
  question: javascript/how-javascript-runs/polyfill-vs-transpiler
- id: polyfill-cannot-fix-syntax
  front: "Why can a polyfill not fix a `SyntaxError` from new syntax like `??`?"
  back: "An engine that cannot parse the syntax throws for the whole file, so no run-time code gets to execute. A transpiler must rewrite the syntax before shipping."
  question: javascript/how-javascript-runs/polyfill-vs-transpiler
- id: ponyfill-definition
  front: "What is a ponyfill?"
  back: "A module that exports a feature as a function instead of modifying globals, so it never changes the environment. Callers must import and use it explicitly."
  question: javascript/how-javascript-runs/polyfill-vs-transpiler
- id: browserslist-targets-purpose
  front: "What do target environments (Browserslist, esbuild `target`) control?"
  back: "Which transforms and polyfills are applied: only those the listed engines lack. A wider target means larger, slower output."
  question: javascript/how-javascript-runs/polyfill-vs-transpiler

# 02 Values and types
- id: eight-language-types
  front: "Name the eight ECMAScript language types."
  back: "Undefined, Null, Boolean, String, Symbol, Number, BigInt and Object. The first seven are primitives. Functions, arrays and dates are all Object."
  question: javascript/values-and-types/language-types
- id: primitives-compare-by-value
  front: "How do primitives and objects differ in comparison and mutability?"
  back: "Primitives are immutable and compare by value. Objects compare by identity: `{} === {}` is `false`, because each literal creates a new object."
  question: javascript/values-and-types/language-types
- id: typeof-null-historical
  front: "Why is `typeof null` equal to `'object'`?"
  back: "A historical mistake. In the first implementation values had a type tag, the object tag was 0 and `null` was the NULL pointer. A fix was proposed and rejected, so the spec now states the result explicitly."
  question: javascript/values-and-types/typeof-null
- id: null-is-primitive
  front: "Is `null` an object despite `typeof null`?"
  back: "No. It is a primitive with exactly one value. Reading a property throws `TypeError`, `null instanceof Object` is `false`, and it has no wrapper."
  question: javascript/values-and-types/typeof-null
- id: non-null-object-check
  front: "How do you test for a non-null object-like value with `typeof`?"
  back: "`value !== null && typeof value === 'object'`. Functions report `'function'`, so add `|| typeof value === 'function'` if they should count."
  question: javascript/values-and-types/typeof-null
- id: document-all-typeof
  front: "What is the surprising `typeof` of `document.all`?"
  back: "`'undefined'`, although it is an object. The spec allows it through the `[[IsHTMLDDA]]` internal slot, a willful violation kept for web compatibility."
  question: javascript/values-and-types/typeof-null
- id: undefined-vs-null-origin
  front: "Who produces `undefined` and who produces `null`?"
  back: "The language produces `undefined` (unassigned variable, missing argument or property, no `return`). `null` is usually assigned by a programmer; the language yields it mainly as the end of the prototype chain."
  question: javascript/values-and-types/null-vs-undefined
- id: default-parameter-null
  front: "Does a default parameter value apply when the argument is `null`?"
  back: "No. Defaults apply only to `undefined`. `greet(null)` keeps `null`."
  question: javascript/values-and-types/null-vs-undefined
- id: null-undefined-number-conversion
  front: "What do `Number(null)` and `Number(undefined)` return?"
  back: "`Number(null)` is `0` and `Number(undefined)` is `NaN`."
  question: javascript/values-and-types/null-vs-undefined
- id: null-undefined-json
  front: "How does `JSON.stringify` treat `null` and `undefined`?"
  back: "It keeps `null`, drops an `undefined` object property, and turns an `undefined` array element into `null`."
  question: javascript/values-and-types/null-vs-undefined
- id: missing-vs-undefined-property
  front: "How do you tell a missing property from one explicitly set to `undefined`?"
  back: "Use `'key' in obj` or `Object.hasOwn(obj, 'key')`. `obj.key === undefined` cannot tell them apart."
  question: javascript/values-and-types/null-vs-undefined
- id: null-relational-inconsistency
  front: "Why are `null == 0` false but `null >= 0` true?"
  back: "`==` has a dedicated rule: `null` equals only `undefined`. Relational operators use `ToNumber`, which makes `null` into `0`, so `null >= 0` is `true` while `null > 0` is `false`."
  question: javascript/values-and-types/null-vs-undefined
- id: auto-boxing-mechanism
  front: "How does `'abc'.toUpperCase()` work if primitives have no properties?"
  back: "Property access calls `ToObject` on the primitive, creating a temporary String wrapper. The lookup finds the method on `String.prototype`, calls it with the primitive as `this`, and the wrapper is discarded."
  question: javascript/values-and-types/primitive-wrappers
- id: primitive-property-write-lost
  front: "What happens when you write `str.foo = 1` on a string primitive?"
  back: "The write lands on a throwaway wrapper and is lost. Strict mode throws `TypeError`; sloppy mode silently ignores it."
  question: javascript/values-and-types/primitive-wrappers
- id: null-undefined-no-wrapper
  front: "Why does `undefined.x` throw?"
  back: "`ToObject` throws `TypeError` for `null` and `undefined`; they have no wrapper type."
  question: javascript/values-and-types/primitive-wrappers
- id: new-boolean-false-truthy
  front: "Why is `new Boolean(false)` truthy, and what do `String(x)` and `new String(x)` return?"
  back: "`new Boolean(false)` is an object, and every object is truthy. Without `new`, `String(x)` is a plain conversion returning a primitive; `new String(x)` returns an object."
  question: javascript/values-and-types/primitive-wrappers
- id: sloppy-this-primitive-boxed
  front: "What does `this` hold when a function is called on a primitive in sloppy versus strict mode?"
  back: "A sloppy function receives a wrapper object (`typeof this` is `'object'`). A strict function receives the primitive unchanged."
  question: javascript/values-and-types/primitive-wrappers
- id: js-pass-by-value
  front: "Is JavaScript pass-by-reference for objects?"
  back: "No. Everything is passed by value. An object value is a reference, so the callee gets a copy of that reference (pass by sharing)."
  question: javascript/values-and-types/pass-by-sharing
- id: mutate-vs-reassign-parameter
  front: "Why does mutating an object parameter affect the caller but reassigning it does not?"
  back: "Mutation follows the shared reference to the same object. Reassigning only repoints the callee's local binding; the caller's variable is untouched."
  question: javascript/values-and-types/pass-by-sharing
- id: swap-impossible
  front: "Why can a `swap(a, b)` function not exchange the caller's variables in JavaScript?"
  back: "The callee never receives the caller's bindings, only the values they held. True pass-by-reference would be required."
  question: javascript/values-and-types/pass-by-sharing
- id: spread-shallow-copy
  front: "Is a spread or `Object.assign` copy independent of the original?"
  back: "Only at the top level. It copies the references held by the properties, so nested objects and arrays are shared. Use `structuredClone` for a deep copy."
  question: javascript/values-and-types/pass-by-sharing
- id: symbol-uniqueness
  front: "What is the purpose of a Symbol, and is `Symbol('id') === Symbol('id')`?"
  back: "A Symbol is a unique, immutable primitive used as a collision-free property key. The comparison is `false`; the description is only a label."
  question: javascript/values-and-types/symbols
- id: symbol-keys-not-private
  front: "Are symbol-keyed properties private?"
  back: "No. They are hidden from `Object.keys`, `for...in` and `JSON.stringify`, but `Object.getOwnPropertySymbols` and `Reflect.ownKeys` reveal them. Use `#private` fields for real encapsulation."
  question: javascript/values-and-types/symbols
- id: symbol-for-registry
  front: "How do `Symbol('x')`, `Symbol.for('x')` and `Symbol.keyFor` differ?"
  back: "`Symbol('x')` always makes a new symbol. `Symbol.for('x')` returns the shared registry symbol, creating it if needed. `Symbol.keyFor` returns `undefined` for an unregistered symbol."
  question: javascript/values-and-types/symbols
- id: symbol-string-conversion
  front: "What happens when a Symbol is implicitly converted to a string, as in a template literal?"
  back: "It throws `TypeError`. Use `String(sym)` or `sym.description` instead. `new Symbol()` also throws."
  question: javascript/values-and-types/symbols
- id: well-known-symbols
  front: "What are well-known symbols such as `Symbol.iterator` and `Symbol.toPrimitive` for?"
  back: "They are keys the engine looks up to customise language behaviour: `for...of`, `instanceof`, type conversion and `Object.prototype.toString`."
  question: javascript/values-and-types/symbols
- id: array-isarray-branded
  front: "Why prefer `Array.isArray` over `instanceof Array`?"
  back: "`Array.isArray` checks the internal array slot, so it works across realms (iframes, `vm`) and is not fooled by `{ __proto__: Array.prototype }`. `instanceof` checks the prototype chain and breaks across realms."
  question: javascript/values-and-types/type-checking
- id: instanceof-primitives-false
  front: "What does `'s' instanceof String` return, and what can customise `instanceof`?"
  back: "`false`, since primitives are never instances. A `Symbol.hasInstance` method on the right-hand side overrides the default prototype-chain check."
  question: javascript/values-and-types/type-checking
- id: tostring-tag-unreliable
  front: "Why is `Object.prototype.toString.call(v)` not a reliable type check for your own classes?"
  back: "For non-built-in objects it returns the value of `Symbol.toStringTag` if it is a string, and any class can set that to anything."
  question: javascript/values-and-types/type-checking
- id: global-isnan-coerces
  front: "Why prefer `Number.isNaN` over the global `isNaN`?"
  back: "Global `isNaN` coerces its argument first, so `isNaN('x')` is `true`. `Number.isNaN` does not coerce."
  question: javascript/values-and-types/type-checking

# 03 Numbers and BigInt
- id: number-is-binary64
  front: "What format is every JavaScript `Number`?"
  back: "An IEEE 754 binary64 double: 64 bits with a 52-bit fraction, giving 53 significant bits (about 15 to 17 decimal digits)."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: point-one-not-representable
  front: "Why is `0.1 + 0.2 !== 0.3`?"
  back: "`0.1` is a repeating fraction in binary, so each literal is rounded to the nearest double. The exact sum rounds to `0.30000000000000004`, one step above the double for `0.3`."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: epsilon-meaning
  front: "What is `Number.EPSILON`, and when is it a sensible tolerance?"
  back: "The gap between `1` and the next double (`2 ** -52`). It suits only values near `1`; for other magnitudes scale it by the operands."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: shortest-roundtrip-printing
  front: "Why does `console.log(0.1)` print `0.1` if the stored value is not exactly `0.1`?"
  back: "Number-to-string conversion prints the shortest decimal that round-trips to the same double, not the exact stored value."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: float-addition-not-associative
  front: "Is floating-point addition associative? Give an example."
  back: "No. It is commutative but not associative: `0.1 + 0.2 + 0.3` is `0.6000000000000001`, while `0.3 + 0.2 + 0.1` is `0.6`."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: tofixed-uses-stored-value
  front: "Why is `(1.005).toFixed(2)` equal to `'1.00'`?"
  back: "`toFixed` works on the stored value, and the closest double to `1.005` is slightly below it."
  question: javascript/numbers-and-bigint/floating-point-precision
- id: nan-self-inequality
  front: "Why can `x === NaN` never work, and what should you use?"
  back: "Every comparison with `NaN` is `false`; it is the only value where `x !== x`. Use `Number.isNaN(x)`."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: sources-of-nan
  front: "Which operations produce `NaN`?"
  back: "Invalid operations such as `0 / 0`, `Math.sqrt(-1)`, `Infinity - Infinity` and `Number('abc')`."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: negative-zero-detection
  front: "How can you detect `-0`, given that `0 === -0` is true?"
  back: "`Object.is(x, -0)`, or `x === 0 && 1 / x === -Infinity`. Dividing by `-0` gives `-Infinity`."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: negative-zero-serialization
  front: "What do `String(-0)` and `JSON.stringify(-0)` return?"
  back: "Both give `0`; the sign is lost on serialization. `console.log` and `Object.is` still show it."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: division-by-zero-results
  front: "What do `1 / 0` and `1 / -0` give?"
  back: "`Infinity` and `-Infinity`. Infinities also result from overflow. `Number.isFinite` is `false` for `NaN` and both infinities."
  question: javascript/numbers-and-bigint/nan-negative-zero-infinity
- id: max-safe-integer-range
  front: "What is the safe integer range, and why does it end there?"
  back: "`-(2 ** 53 - 1)` to `2 ** 53 - 1`. A Number has a 53-bit significand; `2 ** 53 + 1` rounds to `2 ** 53`, so the two are indistinguishable."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: bigint-number-mixing
  front: "What happens on `1n + 1`, and how do `==`, `===` and `<` treat BigInt and Number?"
  back: "Arithmetic throws `TypeError`; convert explicitly. Comparisons may mix: `1n == 1` and `1n < 1.5` are `true`, but `1n === 1` is `false` because the types differ."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: bigint-division-truncates
  front: "What does BigInt division do with remainders?"
  back: "It truncates toward zero: `5n / 2n` is `2n` and `-5n / 2n` is `-2n`."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: bigint-unsupported-operations
  front: "Which operations throw on a BigInt?"
  back: "`Math.*` methods, unary `+`, `>>>`, and `JSON.stringify`. `BigInt(1.5)` throws `RangeError`."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: json-parse-large-id
  front: "What happens to `JSON.parse('{\"id\":9007199254740993}').id`?"
  back: "It is read as a Number and silently rounds to `9007199254740992`. Have APIs send big IDs as strings and convert with `BigInt(string)`."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: bigint-asintn
  front: "What does `BigInt.asIntN(64, x)` do?"
  back: "Keeps the low 64 bits of `x` and reads them as a two's-complement signed integer, so `2n ** 63n` wraps to `-(2n ** 63n)`. `asUintN` reads them as unsigned."
  question: javascript/numbers-and-bigint/safe-integers-bigint
- id: number-empty-string-zero
  front: "What do `Number('')` and `Number('   ')` return?"
  back: "`0`, not `NaN`. This is the classic trap with empty form fields; check for empty input first."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: number-vs-parseint-trailing
  front: "How do `Number('42px')` and `parseInt('42px', 10)` differ?"
  back: "`Number` converts the whole string and returns `NaN` on trailing junk. `parseInt` reads the longest valid prefix and returns `42`."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: map-parseint-pitfall
  front: "Why does `['1', '2', '3'].map(parseInt)` return `[1, NaN, NaN]`?"
  back: "`map` passes the index as the second argument, which `parseInt` reads as the radix. `parseInt('2', 1)` is `NaN`. Use `map(Number)`."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: parseint-radix-default
  front: "What radix does `parseInt` use when you omit it?"
  back: "A `0x` prefix means hexadecimal; everything else is decimal. Always pass a radix: `parseInt(s, 10)`."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: parseint-stringifies-number
  front: "Why does `parseInt(0.0000005)` return `5`?"
  back: "The argument is converted to a string first, giving `'5e-7'`, and the parser reads the prefix `5`. Use `Math.trunc` for numbers."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: number-vs-unary-plus-bigint
  front: "How do `Number(1n)` and `+1n` differ?"
  back: "`Number(1n)` returns `1`; unary `+1n` throws `TypeError`."
  question: javascript/numbers-and-bigint/parsing-numbers
- id: naive-sum-absorption
  front: "Why does `[1e20, 0.1, -1e20]` sum to `0` with a plain loop?"
  back: "`1e20 + 0.1` rounds back to `1e20` because doubles near `1e20` are spaced far wider than `0.1`, so the small term is lost before the large ones cancel."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-single-rounding
  front: "How does `Math.sumPrecise` differ from a naive sum?"
  back: "It sums as if with exact mathematical values, then rounds once to the nearest double, instead of rounding after every addition."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-signature
  front: "What input does `Math.sumPrecise` accept, and what does an empty input return?"
  back: "One iterable of Numbers (not variadic arguments); other types throw `TypeError`. An empty iterable gives `-0`, the floating-point additive identity."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-availability
  front: "Can you call `Math.sumPrecise` unguarded in portable code?"
  back: "No. It is Stage 3 and not available in Node 24 (`typeof` is `'undefined'`). Feature-detect it and fall back, for example to Neumaier compensated summation."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-input-error
  front: "Does `Math.sumPrecise([0.1, 0.2])` return `0.3`?"
  back: "No, it returns `0.30000000000000004`. It removes accumulated rounding error, not the representation error already in the inputs."
  question: javascript/numbers-and-bigint/math-sumprecise
- id: sumprecise-empty-negative-zero
  front: "Why is `-0` the additive identity for floating-point addition?"
  back: "`-0 + x` is `x` for every `x`, including `-0`, whereas `0 + -0` is `0`."
  question: javascript/numbers-and-bigint/math-sumprecise

# 04 Strings and Unicode
- id: string-is-utf16-code-units
  front: "What does a JavaScript string's `length` count?"
  back: "UTF-16 code units (16-bit elements), not characters or code points. `'😀'.length` is `2`."
  question: javascript/strings-and-unicode/utf16-string-length
- id: surrogate-pair-ranges
  front: "What are the surrogate ranges that form a surrogate pair?"
  back: "A leading (high) surrogate `0xD800` to `0xDBFF` followed by a trailing (low) surrogate `0xDC00` to `0xDFFF`. Code points above U+FFFF are stored this way."
  question: javascript/strings-and-unicode/utf16-string-length
- id: units-vs-code-points-apis
  front: "Which string APIs work on code units and which on code points?"
  back: "Units: `length`, indexing, `at`, `charAt`, `charCodeAt`, `slice`, `split('')`. Code points: the string iterator (`for...of`, spread, `Array.from`) and `codePointAt`."
  question: javascript/strings-and-unicode/utf16-string-length
- id: codepointat-lone-trailing
  front: "What does `codePointAt(i)` return when `i` points at a trailing surrogate?"
  back: "The lone trailing surrogate unit itself, not the full code point. It reads from the index you give it."
  question: javascript/strings-and-unicode/utf16-string-length
- id: utf16-length-vs-utf8-bytes
  front: "Does `length` equal a string's byte size?"
  back: "No. UTF-8 size differs: `new TextEncoder().encode('😀').length` is `4` while `'😀'.length` is `2`."
  question: javascript/strings-and-unicode/utf16-string-length
- id: three-text-levels
  front: "Name the three levels of text in JavaScript and the tool for each."
  back: "UTF-16 code unit (index loop), code point (`for...of`, spread, `codePointAt`), grapheme cluster (`Intl.Segmenter`)."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: grapheme-cluster-definition
  front: "What is a grapheme cluster?"
  back: "A user-perceived character, defined by Unicode UAX #29. It can span several code points: `e` plus a combining accent, a flag (two regional indicators), or a family emoji joined by U+200D."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: spread-length-not-characters
  front: "Why is `[...s].length` not a count of user-visible characters?"
  back: "It counts code points. A family emoji is 5, a flag is 2 and a decomposed `é` is 2, each of which is one grapheme."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: segmenter-result-shape
  front: "What does `Intl.Segmenter.segment(text)` return, and what does each item contain?"
  back: "A lazy iterable `Segments` object, not an array. Each item is `{ segment, index, input }`, with `index` a UTF-16 offset. Construct the segmenter once and reuse it."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: segmenter-word-granularity
  front: "What does `Intl.Segmenter` with `granularity: 'word'` add?"
  back: "Each segment gets `isWordLike`, `true` for words and numbers and `false` for spaces and punctuation. It also handles languages written without spaces."
  question: javascript/strings-and-unicode/graphemes-and-code-points
- id: lone-surrogate-definition
  front: "What is a lone surrogate, and is such a string valid?"
  back: "A leading surrogate not followed by a trailing one, or a trailing surrogate not preceded by a leading one. The string is legal in JavaScript but ill-formed UTF-16."
  question: javascript/strings-and-unicode/well-formed-strings
- id: towellformed-replacement
  front: "What does `toWellFormed()` do to a lone surrogate?"
  back: "Replaces it with U+FFFD and returns a new string (a copy even when nothing needed fixing). The fix is lossy and does not rejoin broken pairs."
  question: javascript/strings-and-unicode/well-formed-strings
- id: encodeuri-lone-surrogate
  front: "What does `encodeURIComponent` do with a lone surrogate?"
  back: "It throws `URIError`. By contrast `TextEncoder` substitutes U+FFFD and `JSON.stringify` escapes it, so those can silently pass the data through."
  question: javascript/strings-and-unicode/well-formed-strings
- id: reversed-pair-ill-formed
  front: "Is a trailing surrogate followed by a leading surrogate a valid pair?"
  back: "No. The order is wrong, so they are two lone surrogates and `isWellFormed()` returns `false`."
  question: javascript/strings-and-unicode/well-formed-strings
- id: tagged-template-call-shape
  front: "What arguments does a tag function receive for tag`a${x}b${y}c`?"
  back: "A frozen `strings` array of literal pieces (one more element than substitutions, with a frozen `strings.raw`), then the substitution values, not converted to strings."
  question: javascript/strings-and-unicode/tagged-templates
- id: tagged-template-site-caching
  front: "How often is the `strings` array of a tagged template created?"
  back: "Once per source location per realm, then cached. The same call site always passes the identical array; two textually identical templates at different sites get different arrays."
  question: javascript/strings-and-unicode/tagged-templates
- id: tagged-template-invalid-escape
  front: "How are invalid escapes like `\\unicode` handled in tagged versus untagged templates?"
  back: "An untagged template is a syntax error. In a tagged template the cooked piece is `undefined` and the raw text stays available in `strings.raw`."
  question: javascript/strings-and-unicode/tagged-templates
- id: string-raw-purpose
  front: "What does `String.raw` do?"
  back: "It is a built-in tag that joins the raw pieces (backslash sequences left as typed) with the substitutions converted to strings. Handy for Windows paths and regex source."
  question: javascript/strings-and-unicode/tagged-templates
- id: tagged-template-safety-benefit
  front: "Why do tagged templates enable safe-by-construction APIs?"
  back: "The tag sees the fixed text and the dynamic values separately, so it can escape or parameterize the values (HTML escaping, SQL placeholders). A plain template hands over only the merged string."
  question: javascript/strings-and-unicode/tagged-templates
- id: default-sort-code-unit-order
  front: "How do `<`, `===` and `sort()` without a comparator order strings?"
  back: "By code unit values, so uppercase ASCII sorts before lowercase and accented letters land after `z`. Use `Intl.Collator` for language-aware order."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: collator-compare-bound
  front: "Why can you pass `collator.compare` directly to `sort`?"
  back: "ECMA-402 defines `compare` as a getter returning a function already bound to the collator. Create the collator once and reuse it instead of calling `localeCompare` repeatedly."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: collator-numeric-option
  front: "What does `numeric: true` do in `Intl.Collator` options?"
  back: "It compares digit runs as numbers, so `file2` sorts before `file10`."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: collator-sensitivity-base
  front: "What does `sensitivity: 'base'` ignore?"
  back: "Case and accents: `a`, `A` and `á` compare as equal, which suits search."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: composed-vs-decomposed
  front: "Why is `'é'` (U+00E9) not `===` to `'e'` plus U+0301, and how do you fix the comparison?"
  back: "They are different code point sequences that render the same. Call `normalize()` on both sides (NFC by default) before comparing. `Intl.Collator` also treats them as equal."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: nfkc-lossy
  front: "When should you use NFKC or NFKD instead of NFC?"
  back: "Compatibility forms are lossy (`①` becomes `1`, `ﬁ` becomes `fi`). Use NFC for storage and equality, and compatibility forms only for search keys."
  question: javascript/strings-and-unicode/locale-comparison-normalization
- id: compare-result-sign-only
  front: "What does `compare` guarantee about its return value?"
  back: "Only the sign. Do not assume exactly `-1`, `0` or `1`; engines may return other magnitudes."
  question: javascript/strings-and-unicode/locale-comparison-normalization

# 05 Coercion and equality
- id: loose-equality-null-undefined
  front: "What does `==` do with `null` and `undefined`?"
  back: "They are equal to each other and to nothing else, so `null == 0` is `false`. This rule applies before any numeric conversion."
  question: javascript/coercion-and-equality/loose-equality
- id: loose-equality-boolean-first
  front: "How does `==` handle a Boolean operand?"
  back: "It converts the Boolean to a Number (`true` to `1`, `false` to `0`) and compares again. This happens before object conversion, so `[] == false` becomes `[] == 0`, then `'' == 0`."
  question: javascript/coercion-and-equality/loose-equality
- id: loose-equality-truthiness-never
  front: "Why is `'true' == true` false?"
  back: "`true` becomes `1` and `'true'` becomes `NaN`, so the comparison is `NaN == 1`. Truthiness is never consulted."
  question: javascript/coercion-and-equality/loose-equality
- id: loose-equality-not-transitive
  front: "Is `==` transitive? Give an example."
  back: "No. `'0' == 0` and `0 == ''` are `true`, but `'0' == ''` is `false` because two strings compare strictly."
  question: javascript/coercion-and-equality/loose-equality
- id: eq-null-idiom
  front: "Why is `x == null` the accepted use of `==`?"
  back: "Only `null` and `undefined` satisfy it, so it reads as an 'is nullish' check with no coercion surprises."
  question: javascript/coercion-and-equality/loose-equality
- id: loose-equality-bigint-string
  front: "How does `==` compare a BigInt with a String?"
  back: "It parses the string as a BigInt; if it is not a valid BigInt literal the result is `false`. So `1n == '1'` is `true` and `2n == '2.5'` is `false`."
  question: javascript/coercion-and-equality/loose-equality
- id: falsy-values-list
  front: "List the exact falsy values in JavaScript."
  back: "`false`, `0`, `-0`, `0n`, `''`, `null`, `undefined` and `NaN`. Everything else is truthy. Browsers add one legacy falsy object, `document.all`."
  question: javascript/coercion-and-equality/truthy-falsy
- id: all-objects-truthy
  front: "Why are `[]`, `{}` and `new Boolean(false)` all truthy?"
  back: "`ToBoolean` is a pure lookup on the value's type. It never calls `valueOf` or `toString`, so every object is truthy."
  question: javascript/coercion-and-equality/truthy-falsy
- id: falsy-not-loosely-false
  front: "Is falsy the same as `== false`?"
  back: "No. `ToBoolean` is a lookup; `==` uses `IsLooselyEqual`. `null` is falsy but `null == false` is `false`; `'0'` is truthy but `'0' == false` is `true`."
  question: javascript/coercion-and-equality/truthy-falsy
- id: or-vs-nullish-default
  front: "How do `count || 10` and `count ?? 10` differ?"
  back: "`||` replaces any falsy value, including `0` and `''`. `??` replaces only `null` and `undefined`."
  question: javascript/coercion-and-equality/truthy-falsy
- id: logical-operators-return-operands
  front: "What do `&&` and `||` return?"
  back: "One of their operands, not a Boolean. `ToBoolean` only decides which operand to return, so `0 || null` is `null`."
  question: javascript/coercion-and-equality/truthy-falsy
- id: logical-assignment-short-circuits
  front: "Does `a ||= b` always invoke a setter on `a`?"
  back: "No. If the current value of `a` already decides the result, the spec returns early without assigning, so no setter runs."
  question: javascript/coercion-and-equality/truthy-falsy
- id: toprimitive-hints
  front: "Which hint does `ToPrimitive` get for template literals, unary `+` and binary `+`?"
  back: "Template literals and property keys use `'string'`. Unary `+`, `Number(x)` and relational operators use `'number'`. Binary `+` and `==` use `'default'`."
  question: javascript/coercion-and-equality/object-to-primitive
- id: ordinary-to-primitive-order
  front: "In what order does `OrdinaryToPrimitive` call methods?"
  back: "Hint `'string'`: `toString()` then `valueOf()`. Hints `'number'` and `'default'`: `valueOf()` then `toString()`. The first non-object result wins; if none, `TypeError`."
  question: javascript/coercion-and-equality/object-to-primitive
- id: date-default-hint-string
  front: "Why does `new Date() + 1` concatenate while `new Date() - 1` is numeric?"
  back: "`Date`'s built-in `Symbol.toPrimitive` treats the `'default'` hint as `'string'`. Subtraction uses the `'number'` hint."
  question: javascript/coercion-and-equality/object-to-primitive
- id: symbol-toprimitive-overrides
  front: "What happens if an object defines `Symbol.toPrimitive`?"
  back: "It is called with the hint and overrides `valueOf` and `toString` entirely. If it returns an object, `TypeError` is thrown at once."
  question: javascript/coercion-and-equality/object-to-primitive
- id: object-string-conversions
  front: "Why does `String({})` give `'[object Object]'` and `[] + []` give `''`?"
  back: "`valueOf` returns the object itself (not a primitive), so `toString` is used. `Object.prototype.toString` gives `'[object Object]'`; an empty array's `toString` joins nothing and gives `''`."
  question: javascript/coercion-and-equality/object-to-primitive
- id: plus-operator-rule
  front: "What is the rule for binary `+`?"
  back: "Convert both operands with `ToPrimitive`. If either is a String, convert the other with `ToString` and concatenate. Otherwise convert both with `ToNumeric` and add."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: plus-left-associative
  front: "Why is `1 + 2 + '3'` equal to `'33'` but `'3' + 1 + 2` equal to `'312'`?"
  back: "`+` is left associative. `1 + 2` adds to `3` first, then concatenates. In the other case the leading string makes every step a concatenation."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: minus-always-numeric
  front: "Why does `'5' - 2` give `3` while `'5' + 2` gives `'52'`?"
  back: "Only `+` has a string-concatenation branch. `-`, `*` and `/` always convert operands to numbers."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: empty-block-plus-array
  front: "Why does a console often show `0` for `{} + []` but `'[object Object]'` for `console.log({} + [])`?"
  back: "At the start of a statement, `{}` parses as an empty block, leaving the expression `+[]`, which is `0`. In expression position `{}` is an object."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: plus-bigint-number-throws
  front: "What does `1n + 1` do, and what does `1n + '1'` give?"
  back: "`1n + 1` throws `TypeError`. `1n + '1'` is `'11'`, because a String operand triggers concatenation."
  question: javascript/coercion-and-equality/addition-operator-coercion
- id: three-equality-differences
  front: "On which two inputs do IsStrictlyEqual, SameValue and SameValueZero differ?"
  back: "`NaN` vs `NaN` and `+0` vs `-0`. Strict: NaN not equal, zeros equal. SameValue: NaN equal, zeros not equal. SameValueZero: both equal."
  question: javascript/coercion-and-equality/equality-algorithms
- id: equality-algorithm-users
  front: "Which operations use IsStrictlyEqual, SameValue and SameValueZero?"
  back: "Strict: `===`, `switch`, `indexOf`. SameValue: `Object.is` and `Object.defineProperty` redefinition checks. SameValueZero: `includes`, `Map` keys, `Set` values."
  question: javascript/coercion-and-equality/equality-algorithms
- id: indexof-vs-includes-nan
  front: "What do `[NaN].indexOf(NaN)` and `[NaN].includes(NaN)` return?"
  back: "`-1` and `true`. `indexOf` uses strict equality; `includes` uses SameValueZero."
  question: javascript/coercion-and-equality/equality-algorithms
- id: map-negative-zero-key
  front: "How does a `Map` treat a `-0` key?"
  back: "It canonicalizes `-0` to `+0` before storing, so `0` and `-0` are the same key and `Object.is(k, -0)` is `false` for every stored key. `NaN` works as a single key."
  question: javascript/coercion-and-equality/equality-algorithms
- id: object-is-no-coercion
  front: "Does `Object.is` coerce its arguments?"
  back: "No. `Object.is('1', 1)` and `Object.is(1n, 1)` are both `false`. For non-Number types the three equality algorithms agree."
  question: javascript/coercion-and-equality/equality-algorithms
# 06 Operators and syntax
- id: destructuring-default-trigger
  front: "In destructuring, which values trigger a default: `undefined`, `null`, `0`, `''`?"
  back: "Only `undefined` (or a missing key). `null`, `0`, `''` and `false` are kept. The default expression is evaluated lazily, left to right, and may use earlier bindings."
  question: javascript/operators-and-syntax/destructuring
- id: destructuring-object-pattern-throws
  front: "When does an object destructuring pattern throw a `TypeError`?"
  back: "When the right-hand side is `null` or `undefined`, because `RequireObjectCoercible` fails. This includes the empty pattern `const {} = null`. Primitives are boxed instead, so `const { length } = 'abc'` works."
  question: javascript/operators-and-syntax/destructuring
- id: destructuring-array-pattern-iterator
  front: "Does an array destructuring pattern read by index or by iteration protocol?"
  back: "By the iteration protocol, so it works on any iterable (strings, `Set`, generators). It pulls only as many values as it has elements, then calls `return()` on the iterator if unfinished."
  question: javascript/operators-and-syntax/destructuring
- id: destructuring-nested-missing-parent
  front: "Why does `const { a: { b } } = {}` throw, and how do you prevent it?"
  back: "It reads `b` from `undefined`. Give the parent a default: `{ a: { b } = {} }`. That still throws if `a` is `null`, since defaults only fire for `undefined`."
  question: javascript/operators-and-syntax/destructuring
- id: spread-vs-rest-position
  front: "What decides whether `...` is spread or rest?"
  back: "Position. Spread is an expression that expands a value into items (calls, array and object literals). Rest is a binding that collects the remainder (parameters, patterns) and must be last."
  question: javascript/operators-and-syntax/spread-vs-rest
- id: spread-object-copy-semantics
  front: "Which properties does `{ ...src }` copy, and how does it read them?"
  back: "Own enumerable properties, string and symbol keys, via `Get`, so getters run and the copy gets plain data properties. Inherited and non-enumerable properties are skipped, and `null` or `undefined` are ignored."
  question: javascript/operators-and-syntax/spread-vs-rest
- id: spread-array-needs-iterable
  front: "Why does `[...{ a: 1 }]` throw while `({ ...{ a: 1 } })` works?"
  back: "Array and call spread use the iteration protocol, and plain objects are not iterable (`TypeError`). Object-literal spread uses `CopyDataProperties`, which accepts any object."
  question: javascript/operators-and-syntax/spread-vs-rest
- id: spread-assign-vs-spread-define
  front: "How does `{ ...a }` differ from `Object.assign({}, a)` when the target has setters?"
  back: "Spread defines new properties with `CreateDataPropertyOrThrow`, so setters cannot intercept. `Object.assign` uses `Set`, which calls setters, including inherited ones, on its target."
  question: javascript/operators-and-syntax/spread-vs-rest
- id: nullish-vs-or-fallback
  front: "Which left-hand values make `a ?? b` return `b`, versus `a || b`?"
  back: "`??` falls back only for `null` and `undefined`. `||` falls back for any falsy value: `0`, `''`, `false`, `NaN`. So `0 ?? 3` is `0` and `0 || 3` is `3`."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: nullish-mixing-syntax-error
  front: "Why is `a ?? b || c` a `SyntaxError`, and what fixes it?"
  back: "The grammar refuses to guess precedence: `CoalesceExpression` does not accept bare `||` or `&&` operands. Parenthesise explicitly: `(a ?? b) || c`."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: optional-chain-short-circuit-scope
  front: "How far does `a?.b.c.d()` short-circuit when `a` is nullish, and what ends the chain?"
  back: "The whole chain to the right yields `undefined` without touching `.c` or `.d`. Parentheses end the chain: `(a?.b).c` still reads `.c` from `undefined` and throws."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: optional-chain-guard-limits
  front: "What does `?.` guard against, and what does it not?"
  back: "Only a nullish base at the exact spot written. `a?.b.c` still throws if `a.b` is `undefined`. `a.fn?.()` throws if `fn` is a non-function like `5`. An undeclared variable still throws `ReferenceError`."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: logical-assignment-no-write
  front: "How does `a ||= b` differ from `a = a || b` when `a` is truthy?"
  back: "No assignment happens at all: `b` is not evaluated, no setter runs, and no write is attempted on a frozen property. `a = a || b` still performs the write."
  question: javascript/operators-and-syntax/nullish-and-optional-chaining
- id: for-in-keys-and-order
  front: "What does `for…in` enumerate, and in what order?"
  back: "Enumerable string keys, own and inherited through the prototype chain, as strings. Integer-like keys come first in ascending order, then other keys in insertion order. Symbols and non-enumerable keys are skipped."
  question: javascript/operators-and-syntax/loop-statements
- id: for-of-iterator-return
  front: "What does `break` inside `for…of` do to the iterable?"
  back: "It calls `iterator.return()` if the iterator has one, so a generator's `finally` block runs. An array iterator has no `return`, so nothing happens."
  question: javascript/operators-and-syntax/loop-statements
- id: foreach-async-callback
  front: "Why does `await` inside a `forEach` callback not pause the loop?"
  back: "`forEach` is synchronous and discards the callback's return value. An `async` callback returns a promise that nothing waits for, and its rejection goes unhandled. Use `for…of` with `await`, or `Promise.all(items.map(…))`."
  question: javascript/operators-and-syntax/loop-statements
- id: foreach-range-fixed
  front: "If you push to an array inside `forEach`, is the new element visited?"
  back: "No. `forEach` fixes its range to the original length before the first callback. A `for…of` loop over the same array would visit the pushed element."
  question: javascript/operators-and-syntax/loop-statements
- id: asi-three-cases
  front: "In which three cases does automatic semicolon insertion add a `;`?"
  back: "At an offending token that follows a line terminator or is `}`, at the end of input, and where a newline breaks a restricted production (`return`, `throw`, `break`, `continue`, `yield`, postfix `++`/`--`, arrow `=>`)."
  question: javascript/operators-and-syntax/automatic-semicolon-insertion
- id: asi-no-insertion-before-paren
  front: "Why does a line starting with `(` or `[` join the previous line, even after a newline?"
  back: "ASI inserts a `;` only when the next token is illegal. `(`, `[`, a template literal, `+`, `-` and `/` are legal continuations, so no `;` is added and the lines merge into a call or access."
  question: javascript/operators-and-syntax/automatic-semicolon-insertion
- id: asi-return-newline
  front: "What does `return` followed by a newline and `{ ok: true }` return, and why?"
  back: "`undefined`. `return` is a restricted production, so a newline after it makes the parser insert `;`. The value on the next line is dead code. A multi-line comment containing a newline counts too."
  question: javascript/operators-and-syntax/automatic-semicolon-insertion
- id: asi-override-limits
  front: "Which semicolon insertions does ASI refuse to make?"
  back: "One that would become an empty statement, and one that would become either semicolon in a `for(;;)` header. So `for (let i = 0⏎i < 3⏎i++)` is a `SyntaxError`; ASI cannot repair real syntax errors."
  question: javascript/operators-and-syntax/automatic-semicolon-insertion
# 07 Scope and execution contexts
- id: var-let-const-scope-redeclare
  front: "How do `var`, `let` and `const` differ in scope and redeclaration?"
  back: "`var` is function-scoped (or script/module) and may be redeclared. `let` and `const` are block-scoped, and redeclaring them in the same scope is an early `SyntaxError`."
  question: javascript/scope-and-execution-contexts/var-let-const
- id: const-binding-not-value
  front: "What does `const` make immutable: the binding or the value?"
  back: "The binding only. Reassigning throws `TypeError`, but a `const` object or array can still be mutated. `Object.freeze` gives shallow immutability of the value."
  question: javascript/scope-and-execution-contexts/var-let-const
- id: var-global-property-classic-script
  front: "Which top-level declarations become global object properties in a classic script?"
  back: "`var` and function declarations (non-configurable). `let`, `const` and `class` become global bindings but not properties. Module code has no such link."
  question: javascript/scope-and-execution-contexts/var-let-const
- id: const-for-loop-increment
  front: "What happens with `for (const i = 0; i < 2; i++) {}`, and why does `for (const x of list)` work?"
  back: "The first throws `TypeError` at the increment: `const` gets no per-iteration copy in a classic `for`. `for…of` creates a fresh binding each pass, so `const` is fine."
  question: javascript/scope-and-execution-contexts/var-let-const
- id: hoisting-spec-term
  front: "What does the spec say about 'hoisting'?"
  back: "Nothing; it moves no code. When a scope is entered, declaration instantiation creates all its bindings first, then the code runs top to bottom. 'Hoisting' names the visible effect."
  question: javascript/scope-and-execution-contexts/hoisting
- id: hoisting-initial-state-by-declaration
  front: "What is each declaration's state at scope entry: `var`, function declaration, `let`/`const`/`class`?"
  back: "`var`: initialized to `undefined`. Function declaration: initialized with the function object. `let`, `const`, `class`: created but uninitialized (temporal dead zone)."
  question: javascript/scope-and-execution-contexts/hoisting
- id: hoisting-function-beats-var
  front: "Given `var item = 1; function item() {}` in one scope, what is `typeof item` before the `var` line runs?"
  back: "`'function'`. The function declaration is initialized at instantiation, and `var item` without an initializer does not overwrite it. After `item = 1` runs it is `'number'`."
  question: javascript/scope-and-execution-contexts/hoisting
- id: hoisting-function-expression
  front: "Why can you call a function declaration early but not `var f = function () {}`?"
  back: "The declaration is created with its function object at scope entry. For `var f`, only the binding is hoisted, as `undefined`; the function is created when the assignment runs. With `let` or `const` it is a TDZ error."
  question: javascript/scope-and-execution-contexts/hoisting
- id: tdz-definition
  front: "What is the temporal dead zone?"
  back: "The time between entering a scope and evaluating a `let`, `const` or `class` declaration. The binding exists but is uninitialized, so reading or writing it throws `ReferenceError`. It is defined by execution time, not source position."
  question: javascript/scope-and-execution-contexts/temporal-dead-zone
- id: tdz-typeof-throws
  front: "Does `typeof` avoid the TDZ error, and how does it differ for undeclared names?"
  back: "No. `typeof undeclared` returns `'undefined'` because the name is unresolvable. `typeof tdzName` throws `ReferenceError`, because the name resolves to an uninitialized binding."
  question: javascript/scope-and-execution-contexts/temporal-dead-zone
- id: tdz-proves-hoisting
  front: "How does the TDZ show that `let` is hoisted?"
  back: "An inner `let x` makes an earlier read of `x` in the same block throw instead of falling through to an outer `x`. The inner binding already exists from block entry."
  question: javascript/scope-and-execution-contexts/temporal-dead-zone
- id: tdz-default-parameter-order
  front: "Why does `function f(a = b, b = 1) {}` throw when called as `f()`?"
  back: "Parameters are initialized left to right. Evaluating `a`'s default reads `b` before it is initialized, which is a TDZ `ReferenceError`."
  question: javascript/scope-and-execution-contexts/temporal-dead-zone
- id: lexical-scope-definition
  front: "What does 'lexical scope' mean, and what is the contrast case?"
  back: "Variable visibility is fixed by the nesting of the source text, not by the call stack. Dynamic scope, where a function sees its caller's variables, does not exist for identifiers; only `this` depends on the call site."
  question: javascript/scope-and-execution-contexts/lexical-scope-chain
- id: scope-chain-outerenv-lookup
  front: "How is a function's scope chain built and walked in spec terms?"
  back: "Creation stores the current environment in `[[Environment]]`. Each call makes a record whose `[[OuterEnv]]` is that stored environment, never the caller's. Lookup follows `[[OuterEnv]]` until a binding is found or `null` (`ReferenceError`)."
  question: javascript/scope-and-execution-contexts/lexical-scope-chain
- id: named-function-expression-scope
  front: "Where is the name of a named function expression visible?"
  back: "Only inside the function itself. The name lives in a private scope between the function and its surroundings, so `typeof inner` outside is `'undefined'`."
  question: javascript/scope-and-execution-contexts/lexical-scope-chain
- id: scope-chain-vs-call-stack
  front: "How does the scope chain differ from the call stack?"
  back: "The call stack records who called whom. The scope chain records where each function was written. They line up only for a function defined inside the function that calls it."
  question: javascript/scope-and-execution-contexts/lexical-scope-chain
- id: execution-context-contents
  front: "What does an execution context carry?"
  back: "The function being run, its realm, the script or module, a LexicalEnvironment, a VariableEnvironment, and enough state to suspend and resume. The running context is the top of the stack."
  question: javascript/scope-and-execution-contexts/execution-context-call-stack
- id: lexical-vs-variable-environment
  front: "What is the difference between LexicalEnvironment and VariableEnvironment?"
  back: "`var` bindings live in the VariableEnvironment, fixed for the context's lifetime. LexicalEnvironment is where lookups start and is swapped for a new record when execution enters a block."
  question: javascript/scope-and-execution-contexts/execution-context-call-stack
- id: execution-context-per-call
  front: "Does a function have one execution context, or one per call?"
  back: "One per call, so recursion creates many. Contexts pop on return, but Environment Records they referenced survive if a closure captured them."
  question: javascript/scope-and-execution-contexts/execution-context-call-stack
- id: await-suspends-context
  front: "What happens to an async function's execution context at `await`?"
  back: "It is suspended and removed from the stack, so other code runs. The continuation later resumes from the job queue on an almost empty stack, which is why async stack traces look shorter."
  question: javascript/scope-and-execution-contexts/execution-context-call-stack
- id: environment-record-kinds
  front: "What kinds of Environment Record does the spec define?"
  back: "Declarative, Function (adds `this`, function object, `new.target`), Module (adds indirect import bindings), Object (`with` and the global object), and Global (an Object record plus a Declarative record)."
  question: javascript/scope-and-execution-contexts/environment-records
- id: environment-record-spec-only
  front: "Can JavaScript code access an Environment Record?"
  back: "No. They are a specification device; engines may keep bindings in registers, stack slots or heap objects. `globalThis` is only one part of the global record."
  question: javascript/scope-and-execution-contexts/environment-records
- id: module-import-indirect-binding
  front: "What is an immutable indirect binding in a Module Environment Record?"
  back: "An import binding. It is read-only for the importer, and reads go to the exporting module's own binding, which is why imports are live and cannot be reassigned."
  question: javascript/scope-and-execution-contexts/environment-records
- id: global-record-composite
  front: "Why is the Global Environment Record a composite of two records?"
  back: "Historical `var` and function declarations must become global object properties (Object record), while later `let`, `const` and `class` must not (Declarative record). The Declarative part is searched first."
  question: javascript/scope-and-execution-contexts/environment-records
- id: globalthis-purpose
  front: "Why was `globalThis` added?"
  back: "There was no portable way to reach the global object: `window` fails in workers and Node, `global` fails in browsers. `globalThis` is the same everywhere."
  question: javascript/scope-and-execution-contexts/global-object-globalthis
- id: top-level-this-by-host
  front: "What is top-level `this` in a classic script, an ES module and a Node CommonJS file?"
  back: "Classic script: `globalThis`. ES module: `undefined`. CommonJS file: `module.exports`, because the file is wrapped in a function."
  question: javascript/scope-and-execution-contexts/global-object-globalthis
- id: global-let-redeclare-across-scripts
  front: "Why do two classic scripts both declaring a top-level `let x` collide?"
  back: "The global Declarative record is shared by all scripts in the realm, so the second declaration is a `SyntaxError`. Top-level `var` would not collide."
  question: javascript/scope-and-execution-contexts/global-object-globalthis
- id: global-var-delete
  front: "Can you `delete` a top-level `var` in a classic script, versus an implicit global?"
  back: "No for `var` and function declarations: they are non-configurable. Implicit globals created by sloppy assignment are configurable and can be deleted."
  question: javascript/scope-and-execution-contexts/global-object-globalthis
- id: stack-overflow-cause
  front: "What causes 'Maximum call stack size exceeded', and does the spec define the limit?"
  back: "Each call pushes an execution context onto a fixed-size host stack. Too-deep or endless recursion throws `RangeError` in V8 and JavaScriptCore. The spec defines neither the limit nor the error type."
  question: javascript/scope-and-execution-contexts/stack-overflow-tail-calls
- id: proper-tail-calls-support
  front: "Does the spec require proper tail calls, and which engines implement them?"
  back: "ES2015 requires them in strict code, but only JavaScriptCore (Safari) implements them. V8 does not, so a tail-recursive function still overflows in Node and Chrome."
  question: javascript/scope-and-execution-contexts/stack-overflow-tail-calls
- id: tail-position-definition
  front: "Which calls are in tail position?"
  back: "In strict code, a call that is the value of a `return`, a concise arrow body, a `?:` branch, or the right of `&&`, `||`, `??`, with nothing left to do. `return 1 + f(n)`, `return await f()` and calls inside `try` are not."
  question: javascript/scope-and-execution-contexts/stack-overflow-tail-calls
- id: realm-definition
  front: "What is a realm, and what creates a new one?"
  back: "A set of intrinsic objects plus a global environment. A same-origin iframe or popup and a Node `vm` context each get new intrinsics, so `iframe.contentWindow.Array` is a different function from `Array`."
  question: javascript/scope-and-execution-contexts/realms
- id: instanceof-fails-across-realms
  front: "Why does `foreignArray instanceof Array` return `false`?"
  back: "`instanceof` checks whether `Array.prototype` is in the prototype chain. A foreign array inherits from its own realm's `Array.prototype`, a different object. `Array.isArray` checks the internal exotic kind and works."
  question: javascript/scope-and-execution-contexts/realms
- id: realm-shared-values
  front: "Which values are the same across realms?"
  back: "Well-known symbols (`Symbol.iterator`) and registered symbols (`Symbol.for('k')`). Primitives have no realm at all."
  question: javascript/scope-and-execution-contexts/realms
- id: realm-not-security-boundary
  front: "Is a `node:vm` context a security boundary?"
  back: "No. It shares the process, and its objects can reach back into yours. Node's docs say not to use it as a sandbox for untrusted code."
  question: javascript/scope-and-execution-contexts/realms
# 08 Functions
- id: function-forms-creation-time
  front: "When does the function object exist for a declaration versus an expression?"
  back: "A declaration's function is created at scope entry, before any line runs. An expression's function is created when evaluation reaches it, so the binding follows `var`/`let`/`const` rules."
  question: javascript/functions/function-forms
- id: function-forms-constructors
  front: "Which function forms have `[[Construct]]` so that `new` works?"
  back: "Declarations and `function` expressions. Arrows, methods, getters/setters and async functions do not. Generators have a `prototype` property but no `[[Construct]]`."
  question: javascript/functions/function-forms
- id: arrow-no-own-bindings
  front: "Which bindings does an arrow function lack?"
  back: "`this`, `arguments`, `super` and `new.target`: it reads them from the enclosing environment. It also has no `prototype` and no `[[Construct]]`, so `new` throws `TypeError`."
  question: javascript/functions/function-forms
- id: function-name-inference
  front: "What determines the `name` of an anonymous function?"
  back: "The assignment syntax, not the function form: `const f = () => {}` gives `'f'`. The function takes its name from the binding or property it is assigned to."
  question: javascript/functions/function-forms
- id: default-param-evaluated-per-call
  front: "When is a default parameter expression evaluated?"
  back: "On each call where the argument is missing or `undefined`, not at definition time. So `list = []` gives every call a fresh array. `null` does not trigger it."
  question: javascript/functions/default-and-rest-parameters
- id: function-length-stops-at-default
  front: "What does `fn.length` count when a function has defaults or rest?"
  back: "Only the parameters before the first default or rest parameter. `function f(a, b = 1, c)` has `length` 1."
  question: javascript/functions/default-and-rest-parameters
- id: non-simple-params-use-strict
  front: "Why is `'use strict'` in the body a `SyntaxError` for `function f(a = 1)`?"
  back: "The parameter list is non-simple (defaults, rest or destructuring), and the spec makes the directive an early error there. Put it in an enclosing function or module instead."
  question: javascript/functions/default-and-rest-parameters
- id: param-scope-split
  front: "When parameters contain expressions, can a default see body-level `var` declarations?"
  back: "No. The parameters get their own Environment Record and the body's `var`s go in a separate one, so closures in the parameter list cannot see body declarations."
  question: javascript/functions/default-and-rest-parameters
- id: arguments-array-like
  front: "What is `arguments` and what does it lack?"
  back: "An array-like object with `length`, index keys and `Symbol.iterator`. It inherits from `Object.prototype`, so `map` and `slice` are missing and `Array.isArray` is `false`. Spread or `Array.from` converts it."
  question: javascript/functions/arguments-object
- id: arguments-mapped-sloppy
  front: "When is `arguments[i]` aliased to the named parameter?"
  back: "Only in sloppy functions with a simple parameter list, and only for indices below the number of arguments passed. Strict code, defaults, rest or destructuring give an unmapped copy."
  question: javascript/functions/arguments-object
- id: arguments-in-arrow
  front: "What does `arguments` refer to inside an arrow function?"
  back: "The enclosing function's `arguments`, since arrows have none of their own. Use rest parameters instead."
  question: javascript/functions/arguments-object
- id: arguments-callee-strict
  front: "What happens when you read `arguments.callee` in strict code?"
  back: "It throws `TypeError`. Unmapped `arguments` objects have a poison-pill accessor there; only sloppy mapped objects expose the running function."
  question: javascript/functions/arguments-object
- id: hof-definition
  front: "What makes a function higher-order, and why does JavaScript allow it?"
  back: "It accepts a function, returns a function, or both. Functions are first-class: objects with `[[Call]]` that can be assigned, passed and returned like any value."
  question: javascript/functions/higher-order-functions
- id: map-parseint-radix
  front: "Why does `['10','10','10'].map(parseInt)` misbehave?"
  back: "`map` calls the callback with `(element, index, array)`, so `index` is passed to `parseInt` as the radix. Wrap it or use a single-purpose function."
  question: javascript/functions/higher-order-functions
- id: callbacks-not-always-async
  front: "Are callbacks always asynchronous?"
  back: "No. Callbacks of `map`, `filter` and `sort` run synchronously before the method returns. Callbacks to `setTimeout` or `then` run later."
  question: javascript/functions/higher-order-functions
- id: wrapper-forwarding
  front: "What must a function wrapper forward to behave like the original?"
  back: "The arguments (`...args`), the return value, and `this` via `fn.apply(this, args)`. An arrow wrapper loses the receiver, and a `...args` wrapper has its own `name` and a `length` of 0."
  question: javascript/functions/higher-order-functions
- id: iife-why-parentheses
  front: "Why does `function () {}()` fail as a statement, and what fixes it?"
  back: "A statement cannot start with `function`; the grammar treats it as a declaration, which needs a name and cannot be called. Parentheses or an operator like `!` or `void` force expression context."
  question: javascript/functions/iife
- id: iife-modern-replacements
  front: "What replaced the IIFE module pattern for private scope?"
  back: "ES modules, which give each file its own scope with explicit exports, plus `{ let x }` blocks and per-iteration `let`. Private state uses module variables, factories or `#private` fields."
  question: javascript/functions/iife
- id: iife-async-use
  front: "When is an IIFE still useful?"
  back: "An `async` IIFE to use `await` where top-level `await` is unavailable (CommonJS, older scripts), and one-off initialisation that needs statements but yields a `const` value."
  question: javascript/functions/iife
- id: iife-this-value
  front: "What is `this` inside a non-arrow IIFE?"
  back: "A plain call passes `undefined`: that is `this` in strict code, and `globalThis` in sloppy code. It is not the outer `this`."
  question: javascript/functions/iife
- id: currying-vs-partial
  front: "How do currying and partial application differ?"
  back: "Partial application fixes some arguments of an existing function once (`fn.bind(null, a)`). Currying reshapes the function into a sequence of calls, so every partial application is available afterwards."
  question: javascript/functions/currying-partial-application
- id: curry-arity-from-length
  front: "How does a typical `curry` decide when to call the original, and when does it fail?"
  back: "It collects arguments in a closure and calls once `args.length >= fn.length`. Defaults and rest are not counted in `length`, so it fires too early or never waits; variadic functions have no fixed arity."
  question: javascript/functions/currying-partial-application
- id: bind-length-adjustment
  front: "What does `bind` do to the bound function's `length`?"
  back: "It is the target's `length` minus the number of preset arguments, floored at 0. So `add3.bind(null, 1).length` is 2."
  question: javascript/functions/currying-partial-application
- id: pipe-vs-compose-direction
  front: "In what order do `pipe(f, g, h)` and `compose(f, g, h)` run their functions?"
  back: "`pipe` runs left to right: `h(g(f(x)))`, using `reduce`. `compose` runs right to left: `f(g(h(x)))`, using `reduceRight`."
  question: javascript/functions/compose-and-pipe
- id: compose-empty-identity
  front: "Why does passing the input as the `reduce` initial value make an empty `pipe` the identity function?"
  back: "With no functions, `reduce` returns the initial value untouched, so the result is the input, with no special-case code."
  question: javascript/functions/compose-and-pipe
- id: compose-single-value
  front: "What happens to a second argument passed to a composed function?"
  back: "It is dropped. Only one value flows through the chain, so `pipe(parseInt)('10', 2)` uses the default radix. Adapt other shapes with currying or partial application."
  question: javascript/functions/compose-and-pipe
# 09 Closures
- id: closure-spec-mechanism
  front: "In spec terms, how does a function become a closure?"
  back: "At creation, `OrdinaryFunctionCreate` stores the current Environment Record in `[[Environment]]`. Each call makes a new record whose `[[OuterEnv]]` is that stored environment, and lookup walks outward."
  question: javascript/closures/what-is-a-closure
- id: closure-binding-not-value
  front: "Does a closure capture a value or a binding?"
  back: "The binding. It holds a reference to the environment, so it sees later assignments and can assign too. Nothing is copied."
  question: javascript/closures/what-is-a-closure
- id: closure-one-env-per-call
  front: "Do two calls of an outer function share the closure state they create?"
  back: "No. Each call creates its own record, so returned functions have independent state. Functions created during the same call share one record."
  question: javascript/closures/what-is-a-closure
- id: react-stale-closure
  front: "What is a React 'stale closure' in terms of bindings?"
  back: "Not a snapshot. Each render is a new call with its own `count`, and a callback registered once keeps pointing at the first render's environment."
  question: javascript/closures/what-is-a-closure
- id: new-function-global-env
  front: "Can `new Function('...')` see local variables of the surrounding function?"
  back: "No. `CreateDynamicFunction` uses the realm's global environment as `[[Environment]]`, so it cannot see function or module scope."
  question: javascript/closures/what-is-a-closure
- id: var-loop-shared-binding
  front: "Why does `for (var i = 0; i < 3; i++) setTimeout(() => console.log(i))` log `3` three times?"
  back: "`var` gives one binding for the whole loop, and the callbacks run after the loop exits. The loop stops when `i < 3` fails, so `i` is `3`, not `2`."
  question: javascript/closures/closures-in-loops
- id: let-loop-per-iteration
  front: "What makes `for (let i …)` give each closure its own `i`?"
  back: "`CreatePerIterationEnvironment` copies the bindings into a new Declarative record before the first test and after each body, before the increment. Plain block scoping alone would give one `i`."
  question: javascript/closures/closures-in-loops
- id: loop-increment-new-record
  front: "In a `let` loop, why does `i++` not change the previous iteration's closure?"
  back: "The increment runs in the new record created by the per-iteration copy. The previous record keeps the value it had at the end of its body."
  question: javascript/closures/closures-in-loops
- id: for-of-fresh-binding
  front: "Which loop heads create a fresh binding per iteration?"
  back: "`for…of` and `for…in` with `let` or `const`, and `for (let …)` via the per-iteration copy. A classic `for (const …)` makes no copy, and a `var` head is always one binding."
  question: javascript/closures/closures-in-loops
- id: v8-context-allocation
  front: "In V8, which variables does a closure keep alive?"
  back: "Only variables some inner function references; they are context-allocated on the heap. Unreferenced locals are not retained. This is an engine optimisation; the spec only defines reachability through Environment Records."
  question: javascript/closures/closure-memory
- id: closure-sibling-sharing
  front: "Why can a tiny callback keep a large object alive in V8?"
  back: "Closures created in one scope share a single `Context`. If any sibling closure references `big`, every closure from that call keeps it alive."
  question: javascript/closures/closure-memory
- id: closure-direct-eval-retention
  front: "How does a direct `eval` in a closure affect retention?"
  back: "It can name any binding at run time, so nothing in the enclosing scopes can be dropped. Indirect eval runs in global scope and does not have this effect."
  question: javascript/closures/closure-memory
- id: closure-leak-cause
  front: "What actually causes a closure-related memory leak?"
  back: "A long-lived reference to the closure: an unremoved listener, uncleared interval, subscription or cached callback. The closure is the retainer path; the missing cleanup is the bug."
  question: javascript/closures/closure-memory
- id: closure-private-state-why
  front: "Why can only code inside a factory touch a closure's private variable?"
  back: "Environment Records cannot be accessed or manipulated by programs, and there is no reflection API for them. Only code written lexically inside the function can reach the binding."
  question: javascript/closures/private-state
- id: closure-privacy-escape
  front: "How can a closure-private array still leak mutable access?"
  back: "The binding is private, but returning the array itself (`getItems: () => items`) hands out a mutable reference. Return copies or read-only views."
  question: javascript/closures/private-state
- id: closure-vs-private-fields
  front: "What is the main cost of closure privacy versus `#private` class fields?"
  back: "Each factory call creates new function objects per instance, while class methods are shared on the prototype. Both give hard privacy."
  question: javascript/closures/private-state
- id: debounce-vs-throttle
  front: "How do `debounce` and `throttle` differ in when `fn` runs?"
  back: "Debounce restarts a timer on each call and runs `fn` after calls stop for `wait` ms. Throttle runs `fn` at most once per `wait` window while calls continue."
  question: javascript/closures/debounce-throttle-once
- id: debounce-this-arrow-timer
  front: "How should a debounce wrapper preserve `this` and arguments?"
  back: "Make the wrapper a regular `function` taking `...args`, and call `fn.apply(this, args)` from an arrow inside `setTimeout`. The arrow has no `this`, so it uses the wrapper's."
  question: javascript/closures/debounce-throttle-once
- id: debounce-wrapper-created-once
  front: "Why must a debounced function be created once, not inside the handler or render?"
  back: "Each creation makes a new closure with its own timer, so nothing is ever debounced. Create it once and reuse it."
  question: javascript/closures/debounce-throttle-once
- id: once-mark-before-call
  front: "Why should `once` mark itself called before invoking `fn`?"
  back: "So a re-entrant call cannot run `fn` twice. Dropping the reference to `fn` also lets it and its captured closure be collected."
  question: javascript/closures/debounce-throttle-once
- id: debounce-not-out-of-order
  front: "Why does debouncing alone not prevent stale search results?"
  back: "It only limits when requests start. Two requests can still be in flight and resolve out of order. Abort the previous one with an `AbortController` as well."
  question: javascript/closures/debounce-throttle-once
# 10 this
- id: this-binding-order
  front: "In what order are the `this` binding rules checked for a non-arrow function?"
  back: "`new`, then bound function, then explicit `call`/`apply`, then implicit `obj.method()`, then default. The default passes `undefined`: that stays in strict code, and becomes `globalThis` in sloppy code."
  question: javascript/this/this-binding-rules
- id: this-strictness-of-callee
  front: "Whose strict mode decides whether `undefined` `this` becomes `globalThis`: the caller's or the callee's?"
  back: "The called function's own mode. A sloppy function called from a module still sees `globalThis`. Class bodies and modules are always strict."
  question: javascript/this/this-binding-rules
- id: comma-operator-loses-this
  front: "Why does `(0, obj.fn)()` lose `this` while `(obj.fn)()` keeps it?"
  back: "Parentheses return the Reference Record unchanged, so the call still sees the base object. The comma operator applies `GetValue`, producing a plain function value with no base."
  question: javascript/this/this-binding-rules
- id: this-before-super
  front: "Why does reading `this` before `super()` in a derived constructor throw?"
  back: "The derived constructor's `this` binding starts uninitialised; only `super()` creates the object and binds it. Reading `this` earlier throws `ReferenceError`."
  question: javascript/this/this-binding-rules
- id: arrow-this-thismode-lexical
  front: "How does the spec make an arrow function's `this` lexical?"
  back: "`[[ThisMode]]` is lexical, so `OrdinaryCallBindThis` binds nothing and the Function Environment Record is flagged lexical. The `this` lookup passes over it to the nearest scope that has a binding."
  question: javascript/this/arrow-functions-this
- id: arrow-ignores-call-apply-bind
  front: "What do `call`, `apply` and `bind` do to an arrow's `this`?"
  back: "The `thisArg` is silently ignored; the other arguments are still applied. `new` on an arrow throws `TypeError`."
  question: javascript/this/arrow-functions-this
- id: arrow-object-method-this
  front: "What is `this` in an arrow used as an object-literal property?"
  back: "The surrounding scope's `this`, not the object. At module level that is `undefined`."
  question: javascript/this/arrow-functions-this
- id: class-field-arrow-per-instance
  front: "What does a class-field arrow `handler = () => {}` do, and what is its cost?"
  back: "The initialiser runs with `this` set to the new instance, so each instance gets a function bound to itself. It is created per instance and is not on the prototype."
  question: javascript/this/arrow-functions-this
- id: call-apply-bind-differences
  front: "How do `call`, `apply` and `bind` differ?"
  back: "`call` invokes now with arguments listed. `apply` invokes now with one array or array-like. `bind` does not invoke; it returns a new function with `this` and leading arguments fixed."
  question: javascript/this/call-apply-bind
- id: bound-this-immutable
  front: "Can `call`, `apply` or a second `bind` change a bound function's `this`?"
  back: "No. Its `[[Call]]` uses the saved `[[BoundThis]]`. Extra `bind` arguments still accumulate in order, but only the first `thisArg` counts."
  question: javascript/this/call-apply-bind
- id: bound-function-new
  front: "What happens when you call `new` on a bound function?"
  back: "The bound `this` is ignored, but bound arguments are prepended and the target is constructed. If `new.target` is the bound function, it becomes the target, so `instanceof` works against either."
  question: javascript/this/call-apply-bind
- id: bound-function-name-length
  front: "What are a bound function's `name`, `length` and `prototype`?"
  back: "`name` is `'bound ' + target.name`, `length` is the target's minus bound arguments (never below 0), and it has no `prototype`."
  question: javascript/this/call-apply-bind
- id: call-null-this-sloppy
  front: "What does passing `null` as `thisArg` do for a sloppy versus a strict target?"
  back: "A sloppy target turns `null`/`undefined` into `globalThis` and boxes primitives, hiding bugs. A strict target receives `null` as given and throws on property access."
  question: javascript/this/call-apply-bind
- id: lost-this-reference-record
  front: "Why does `const f = counter.increment; f()` lose `this`?"
  back: "`counter.increment` evaluates to a Reference Record with base `counter`. `GetValue` discards the reference when the function is read into a value, so the call has no receiver."
  question: javascript/this/lost-this-callbacks
- id: lost-this-failure-mode
  front: "What does a method with a lost `this` do in strict versus sloppy code?"
  back: "Strict: `this` is `undefined`, so `this.count` throws. Sloppy: `this` is `globalThis`, so it silently reads or writes globals, which is worse."
  question: javascript/this/lost-this-callbacks
- id: lost-this-destructuring
  front: "Does `const { method } = obj` keep `obj` as `this`?"
  back: "No. Only a call made on the reference carries the receiver; destructuring reads the function into a plain value."
  question: javascript/this/lost-this-callbacks
- id: remove-listener-bound-identity
  front: "Why does `el.removeEventListener('click', fn.bind(x))` remove nothing?"
  back: "`bind` creates a new function each time, so identity does not match. Store the bound function once and pass the same reference to both calls."
  question: javascript/this/lost-this-callbacks
- id: dom-listener-this
  front: "What is `this` in a regular-function DOM event listener, and who decides?"
  back: "The element the listener was registered on (`currentTarget`). It is host-defined by the DOM spec, not language semantics. An arrow ignores it and keeps its lexical `this`."
  question: javascript/this/lost-this-callbacks
- id: bound-function-internal-methods
  front: "What do a bound function's `[[Call]]` and `[[Construct]]` do?"
  back: "`[[Call]]` calls the target with `[[BoundThis]]` and bound arguments first, ignoring the call's `this`. `[[Construct]]` constructs the target with bound arguments prepended, ignoring `[[BoundThis]]`."
  question: javascript/this/implement-bind
- id: implement-bind-new-target
  front: "How can a userland `bind` tell a plain call from a `new` call?"
  back: "Through `new.target`, which is `undefined` for a plain call. Use `Reflect.apply` for calls and `Reflect.construct` with an explicit `new.target` so the object gets the right prototype."
  question: javascript/this/implement-bind
- id: implement-bind-limits
  front: "What can a userland `bind` not replicate?"
  back: "It has an own non-configurable `prototype`, so `new bound() instanceof bound` is `false`. Its `[[Prototype]]` is `Function.prototype`, `toString` shows source, and `name` and `length` must be defined by hand."
  question: javascript/this/implement-bind
- id: implement-bind-arrow-pitfall
  front: "Why can a userland `bind` not be written as an arrow function?"
  back: "Arrows have no `new.target` and cannot be constructed, so the `new` path is unreachable. `new bound()` would throw `TypeError`, where a native bound function constructs the target."
  question: javascript/this/implement-bind
# 11 Objects and properties
- id: property-key-types
  front: "What can a property key be, and how are other values converted?"
  back: "A String or a Symbol. Other values go through `ToPropertyKey`: `ToPrimitive` with string preference, then `ToString`. So `obj[1]` and `obj['1']` are one property, and objects collide as `'[object Object]'`."
  question: javascript/objects-and-properties/property-keys-and-order
- id: own-property-key-order
  front: "In what order does an ordinary object list its own keys?"
  back: "Array indices (`'0'` to `'4294967294'`) in ascending order, then other strings in creation order, then symbols in creation order. `{ b: 1, 10: 1, 9: 1 }` lists `'9'`, `'10'`, `'b'`."
  question: javascript/objects-and-properties/property-keys-and-order
- id: symbol-keys-visibility
  front: "Which APIs skip symbol keys, and which show them?"
  back: "`for…in`, `Object.keys`, `Object.entries` and `JSON.stringify` skip them. `Object.getOwnPropertySymbols` and `Reflect.ownKeys` list them. Symbols are not private."
  question: javascript/objects-and-properties/property-keys-and-order
- id: proto-literal-key
  front: "How do `{ __proto__: x }`, `{ ['__proto__']: x }` and `JSON.parse('{\"__proto__\":1}')` differ?"
  back: "The plain literal sets the prototype. The computed key and the parsed JSON create an own property named `__proto__`."
  question: javascript/objects-and-properties/property-keys-and-order
- id: map-vs-object-keys
  front: "How does `Map` key handling differ from plain objects?"
  back: "A `Map` keeps pure insertion order and uses SameValueZero, so `1` and `'1'` are different keys and any value, including an object, can be a key."
  question: javascript/objects-and-properties/property-keys-and-order
- id: descriptor-kinds
  front: "Which fields make up a data descriptor versus an accessor descriptor?"
  back: "Data: `value`, `writable`. Accessor: `get`, `set`. Both have `enumerable` and `configurable`. Mixing `get`/`set` with `value`/`writable` throws `TypeError`."
  question: javascript/objects-and-properties/property-descriptors
- id: define-property-defaults
  front: "What attribute defaults does `Object.defineProperty` use for a new property?"
  back: "Every omitted flag is `false`, and `value` or `get`/`set` is `undefined`. Literals and assignment give all three flags `true`. For an existing property, omitted fields are left unchanged."
  question: javascript/objects-and-properties/property-descriptors
- id: non-writable-failure-mode
  front: "What happens when you assign to a `writable: false` property?"
  back: "A silent no-op in sloppy mode, a `TypeError` in strict and module code."
  question: javascript/objects-and-properties/property-descriptors
- id: inherited-readonly-blocks-set
  front: "Does a read-only property on the prototype stop assignment on the child?"
  back: "Yes. `[[Set]]` finds the inherited non-writable data property and fails instead of creating an own property. Use `defineProperty` on the child to shadow it."
  question: javascript/objects-and-properties/property-descriptors
- id: copy-with-descriptors
  front: "How do you copy an object keeping its getters and attributes?"
  back: "`Object.defineProperties({}, Object.getOwnPropertyDescriptors(src))`. Spread and `Object.assign` create plain data properties instead, running getters once and resetting flags."
  question: javascript/objects-and-properties/property-descriptors
- id: integrity-levels-table
  front: "How do `preventExtensions`, `seal` and `freeze` differ?"
  back: "`preventExtensions`: no adding. `seal`: also no deleting or reconfiguring (`configurable: false`). `freeze`: also `writable: false` on data properties. Each includes the previous level."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: freeze-shallow
  front: "Is `Object.freeze` deep?"
  back: "No. Only own properties change. Nested objects stay mutable, as do the internal slots of a `Map`, `Set` or `Date`. There is no unfreeze."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: freeze-accessors-still-run
  front: "Do accessors on a frozen object stop working?"
  back: "No. Getters and setters still run; freeze only locks the property's configuration. It sets `writable: false` on data properties alone."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: frozen-write-failure
  front: "How do rejected writes on a frozen object behave across modes?"
  back: "Strict code (modules, classes) throws `TypeError`; sloppy code silently ignores. Built-in methods like `push` throw even in sloppy code."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: freeze-vs-const
  front: "How do `Object.freeze` and `const` differ?"
  back: "`const` stops re-binding the variable. `freeze` stops changing the object's properties. Use both for a true constant object."
  question: javascript/objects-and-properties/freeze-seal-preventextensions
- id: accessor-property-definition
  front: "What is an accessor property, and where does its data live?"
  back: "A property with `get`, `set`, `enumerable` and `configurable` instead of `value` and `writable`. It holds functions, not data; the value lives in another property, a closure or a private field."
  question: javascript/objects-and-properties/getters-and-setters
- id: getter-receiver-this
  front: "What is `this` in an inherited getter or setter?"
  back: "The receiver: the object you read from or assigned to. So `child.balance = 10` runs the inherited setter with `this === child`, and the data lands on `child`."
  question: javascript/objects-and-properties/getters-and-setters
- id: getter-only-assignment
  front: "What happens when you assign to a getter-only property?"
  back: "The write fails: silently in sloppy code, with a `TypeError` in strict code. Modules and classes reveal the bug while scripts hide it."
  question: javascript/objects-and-properties/getters-and-setters
- id: class-accessor-enumerability
  front: "Do class accessors appear in `Object.keys` or `JSON.stringify` of an instance?"
  back: "No. They live on the prototype and are non-enumerable. Accessors in an object literal are own, enumerable and configurable, and `Object.entries` calls their getters."
  question: javascript/objects-and-properties/getters-and-setters
- id: accessor-self-recursion
  front: "Why does `set balance(v) { this.balance = v }` never finish?"
  back: "It calls the same setter forever, ending in `RangeError`. A getter that reads its own name recurses the same way. Use a differently named backing field."
  question: javascript/objects-and-properties/getters-and-setters
- id: enumeration-api-matrix
  front: "How do `Object.keys`, `getOwnPropertyNames` and `Reflect.ownKeys` differ?"
  back: "`Object.keys`: own enumerable string keys. `getOwnPropertyNames`: own strings including non-enumerable. `Reflect.ownKeys`: own strings and symbols, enumerable or not. None include inherited keys."
  question: javascript/objects-and-properties/enumerating-properties
- id: for-in-shadowing
  front: "Does `for…in` visit an inherited enumerable key when the object has a non-enumerable own key of the same name?"
  back: "No. The spec tracks visited names regardless of enumerability, so the own non-enumerable property shadows the inherited one."
  question: javascript/objects-and-properties/enumerating-properties
- id: object-hasown
  front: "Why prefer `Object.hasOwn(obj, key)` over `obj.hasOwnProperty(key)`?"
  back: "It works on `Object.create(null)` objects and on objects that define their own `hasOwnProperty`, where the method call fails with `TypeError`. `'k' in obj` also searches the prototype chain."
  question: javascript/objects-and-properties/enumerating-properties
- id: object-keys-primitive-null
  front: "What do `Object.keys('ab')` and `Object.keys(null)` do, versus `for…in` over `null`?"
  back: "`Object.keys('ab')` coerces with `ToObject` and returns `['0','1']`. `null` and `undefined` throw `TypeError`, while `for…in` over them does nothing."
  question: javascript/objects-and-properties/enumerating-properties
- id: shallow-copy-shares-nested
  front: "What does a shallow copy share with the original?"
  back: "Nested objects, by reference. Only the top level is new, so `{ ...state }` followed by `next.user.name = 'x'` also changes `state.user.name`."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: structured-clone-cycles
  front: "How does `structuredClone` handle cycles and shared references?"
  back: "It records each seen object in a memory map, so cycles and shared references are preserved: two properties pointing at one object still point at one object in the clone."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: structured-clone-throws
  front: "What does `structuredClone` throw `DataCloneError` for?"
  back: "Functions (including methods), symbol values, `Promise`, `WeakMap`/`WeakSet`, `Proxy`, and non-serializable platform objects such as DOM nodes."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: structured-clone-class-instance
  front: "What does `structuredClone` return for a class instance?"
  back: "A plain `Object` with its data and no methods or prototype chain. Symbol keys and non-enumerable properties are dropped, and a frozen object comes back unfrozen."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: json-clone-losses
  front: "What does `JSON.parse(JSON.stringify(x))` lose or break on?"
  back: "It drops `undefined` and functions, turns `Date` into a string, `Map` into `{}` and `NaN` into `null`, and throws on cycles and `BigInt`."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: assign-proto-pollution
  front: "Why is `Object.assign` riskier than spread for untrusted parsed JSON?"
  back: "A parsed own `__proto__` key reaches `[[Set]]` and changes the target's prototype. Spread defines it as an ordinary property."
  question: javascript/objects-and-properties/shallow-vs-deep-copy
- id: object-identity-equality
  front: "Are `{} === {}` and `Object.is({}, {})` true?"
  back: "Both are `false`. Objects compare by reference. Deep equality must compare structure, and each step is a policy decision such as whether `-0` equals `0`."
  question: javascript/objects-and-properties/deep-equality
- id: deep-equal-cycle-guard
  front: "How does a deep-equality function avoid infinite recursion on cycles?"
  back: "It remembers the `(a, b)` pairs currently being compared and assumes equal when a pair repeats. Without the guard, self-referencing data overflows the stack with `RangeError`."
  question: javascript/objects-and-properties/deep-equality
- id: json-stringify-equality-trap
  front: "Why is `JSON.stringify(a) === JSON.stringify(b)` unreliable for equality?"
  back: "It depends on key order, turns `NaN` into `null`, drops `undefined` and functions, and throws on cycles and `BigInt`. Unequal values can stringify identically."
  question: javascript/objects-and-properties/deep-equality
- id: deep-equal-prototype-check
  front: "Why should a deep-equality function compare prototypes?"
  back: "Otherwise instances of different classes with the same fields compare equal. It is a policy choice; `util.isDeepStrictEqual` treats them as different."
  question: javascript/objects-and-properties/deep-equality
